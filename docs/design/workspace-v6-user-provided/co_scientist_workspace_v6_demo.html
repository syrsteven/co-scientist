t subtype recovery rate through CaMKII/synapsin phosphorylation and synaptic maintenance, a retinal-level association in pubmed:42893477; (b) pressure-associated inner-retinal circuit hyperactivity from Vgat-positive interneurons is an early, modifiable, IOP-independent contributor to RGC vulnerability (pubmed:42839614) and could act either by changing subtype metabolic demand (modulator) or by initiating injury independently (core alternative); tests below discriminate these.","Strongest core alternative, to be excluded rather than assumed away: laminar geometry, axon caliber, local deformation, and perfusion set subtype vulnerability, with mitochondrial fragmentation, ATP depression, and complement deposition all downstream. Astrocyte mechanobiology in the glial lamina is directly reported (pubmed:42908589) and lamina cribrosa viscoelastic properties change under chronic high IOP (pubmed:42741401); these are measured as covariates and tested as an alternative ranking variable.","Conditional therapeutic implication: if the gate is real, restoring axonal ATP recovery should reduce phosphatidylserine exposure and later C1q deposition, whereas C1q blockade should spare the initial ATP deficit while reducing removal. Neither target is established clinically; IOP lowering remains the only validated disease-modifying strategy (pubmed:42911707) and its insufficiency in some patients is a stated premise, not a result."],"assumptions":["Model: adult mice with sustained, nonischemic microbead-induced ocular hypertension; several molecularly defined RGC subtypes chosen a priori from published subtype markers, permanently labeled before stress with a label verified to persist through the pre-degenerative window, and quantifiable per animal. Functional ON, ONOFF, and ipRGC categories would only be used as a pre-specified coarse classifier, never as if they were single molecular subtypes.","The subtype ranking is unknown at proposal time. A pilot discovery cohort locks the ranking, sampling windows, and subtype identity panel; a separate independent cohort tests it. No specific subtype is asserted to be most vulnerable.","The initiating variable is a per-subtype recovery time constant referenced to that subtype's own baseline mitochondrial morphology and to independent sham-operated animals. Absolute axonal ATP values are not the discriminand.","ATP, phosphatidylserine, and mitochondrial reporters are used only after validation that they do not themselves alter subtype survival, and with pH/pH-insensitive and membrane-integrity controls. Marker loss, reporter artifact, or failed transduction is handled by a pre-enumerated technical-failure rule rather than counted as falsification.","Comparable IOP does not mean comparable axonal stress. Cumulative IOP exposure, optic nerve head deformation, axon caliber, retinal position, perfusion, age, sex, and mitochondrial background are measured and modeled as covariates and as the pre-specified alternative explanation (pubmed:42838417, pubmed:42741401).","Evidence is bounded to the supplied abstracts and reviews; absence of subtype-resolved axonal phosphatidylserine data from this set does not establish novelty. Rodent lamina and RGC composition differ from humans, and human subtype-resolved pathology is a named open gap (pubmed:42214787).","No claim of verified originality is made; the candidate is a recombination of parent content with the critiques' requested tighter specification (named subtype commitment procedure, technical-failure adjudication, covariate alternative, and de-emphasis of unverifiable molecular anchors)."],"predictions":["Discovery-then-confirmation ordering test: in permanently labeled subtypes sampled at an early interval verified to precede axon loss, an intermediate interval, and later degeneration, the pre-specified vulnerable subtypes should show longer axonal mitochondrial fission recovery first, then longer ATP depression, then more sustained surface phosphatidylserine, then more C1q deposition and verified microglial engulfment of still-connected segments, then structural axon loss, then soma loss, relative to independent sham normotensive controls. Windows, ranking, and subtype panel are locked in the discovery cohort; the ordered ranking and each pairwise ordering must replicate in an independent cohort. Per-subtype recovery time constants, not raw ATP values, are the primary statistic.","Dissociation-by-modulation test using two manipulations with different specificity: (a) an RGC-restricted intervention intended to speed mitochondrial fission-fusion recovery; (b) whole-retina lowering of pressure-associated inhibitory-circuit hyperactivity without lowering IOP (the Vgat-targeted approach of pubmed:42839614, applied via appropriate Cre-dependent delivery). Under the core chain, (a) shortens the recovery time constant and reduces later phosphatidylserine and C1q regardless of circuit activity, whereas (b) reduces circuit-driven demand and may reduce later degeneration but need not shorten the intrinsic recovery time constant. If (b) alone shortens recovery and prevents phosphatidylserine exposure while (a) has no effect on recovery, the circuit-first alternative is favored. Include matched control-vector eyes with equivalent IOP and transduction coverage and verify firing in (b).","Requirement-removal test for the PKA/AKAP1 arm: co-perturb PKA anchoring in vulnerable subtypes while independently shortening or lengthening fission recovery, in a 2x2 design with vector and inactive-construct controls. If PKA anchoring is a modulator, recovery time can be moved in either direction while phosphatidylserine and later degeneration track recovery time, not anchoring status. If anchoring status predicts outcomes independently of recovery time, the proposed single-variable structure is false.","Phosphatidylserine-dependence test orthogonal to C1q: mask exposed neuronal phosphatidylserine with a validated neuron-surface-restricted binding reagent, compared with a binding-deficient reagent, both begun before predicted exposure. The gate predicts unchanged early ATP depression, reduced C1q deposition and engulfment, and preserved connected axon segments with measurable transport. Pre-specify axon-continuity and transport thresholds before unblinding; do not use soma counts as the primary endpoint. Confirm neuronal specificity, membrane integrity, and no direct microglial toxicity.","Amplification-versus-clearance test with a pre-specified late-arm threshold: delay C1q blockade until verified engulfment of connected segments has begun. Under the gate, late blockade should not restore axon continuity above the pre-specified threshold in the most vulnerable subtypes, whereas early blockade should. Any rescue that appears only in soma counts, or only beyond the pre-specified window, is scored against the clearance alternative, not as support.","Covariate-adjudication test: in every cohort, regress subtype outcome on recovery time constant and, in parallel models, on cumulative IOP exposure, laminar-region deformation, axon caliber, local perfusion, and inhibitory-circuit activity. The core chain predicts that recovery time constant retains a subtype-discriminating association after these covariates, whereas the geometry/perfusion alternative predicts the converse. If the recovery variable loses its association once covariates are included, the proposed molecular explanation for the ranking is rejected for this model; if assay controls indicate reporter or labeling failure, the cohort is declared uninterpretable rather than falsifying."],"falsifiers":["Pre-degenerative sampling shows no subtype difference in axonal mitochondrial fission recovery time, or rapid and slow recovery subtypes are equally represented among surviving subtypes later, while phosphatidylserine and C1q deposition still differ. The proposed subtype ranking variable is then not the discriminator.","Recovery time constant moves in the predicted direction with an RGC-restricted fission-fusion intervention, axonal ATP recovery is documented to normalize, yet surface phosphatidylserine exposure, C1q deposition, engulfment, and the subtype ranking among surviving axons are unchanged. The ATP-to-phosphatidylserine recognition bridge, the central claim, is then falsified (this is the bridge the critiques correctly identify as untested, so this arm is a primary, not secondary, falsifier).","Early C1q blockade or neuronal phosphatidylserine masking reduces enumeration of engulfed debris but fails, against prespecified blinded axon-continuity and transport thresholds, to preserve connected axons or transport beyond isotype/binding-deficient controls. This rejects the claim that complement-dependent recognition converts reversible stress into irreversible degeneration rather than merely clearing already-committed material.","Circuit-directed lowering of pressure-associated inner-retinal hyperactivity without IOP reduction demonstrably shortens axonal fission recovery and prevents early phosphatidylserine exposure in vulnerable subtypes, while RGC-intrinsic fission-fusion interventions with verified target engagement do not. A circuit-first ordering would then better explain the data, contrary to the core chain.","After adjusting for cumulative IOP exposure, laminar deformation, axon caliber, and perfusion, the subtype recovery time constant no longer discriminates subtype outcomes while a geometry/perfusion variable does. The proposed intrinsic explanation for the subtype ranking would be rejected for this model, even if mitochondrial correlates persist as epiphenomena.","PKA-anchoring perturbation changes subtype survival, phosphatidylserine exposure, or engulfment in a direction independent of the measured recovery time constant, contradicting the proposed modulator role and the single-variable structure of the hypothesis."],"parents":["proposal-rgc-subtype-mito-gate-v1","proposal-rgc-energy-complement-gate"],"operator":"crossover","createdSeq":348,"ethicsSeq":353,"reflection":[{"seq":358,"critiques":["The central bridge—sustained sublethal axonal ATP depression causing prolonged externalized phosphatidylserine on still-connected RGC axons—is explicitly acknowledged as untested and unsupported by any supplied source. The entire mechanistic chain rests on this unverified link, which is a substantial plausibility gap, not a minor detail.","The proposal conflates two distinct variables under a single 'subtype-ranking variable': the fission-recovery time constant and ATP-depression duration. The claim that these are 'the same' variable is asserted rather than derived; they could dissociate (e.g., rapid morphological recovery with persistent ATP deficit, or vice versa). No independent operational definition distinguishes them, making the core claim partly tautological.","Use of intravitreal microbead ocular hypertension as 'comparable chronic stress' across subtypes is problematic: microbead models produce variable, often transient IOP elevation with segmental axonal injury concentrated at the optic nerve head. Subtype differences in axon caliber, retinal position, and laminar trajectory will produce systematically different local stress even at matched IOP, and the proposal's covariate modeling may be underpowered to fully separate intrinsic from geometric effects.","Permanent subtype labeling before stress requires subtype-specific Cre lines or viral strategies whose coverage, specificity, and persistence through the pre-degenerative window are nontrivial. The assumption that a label 'verified to persist' is achievable across all chosen subtypes, without altering survival, is optimistic and unaddressed operationally.","The functional ON/ONOFF/ipRGC classifier is acknowledged as coarse but is then used to organize subtype comparisons in predictions. Molecular subtype identity and functional class are not isomorphic; the ranking variable may sort by functional class rather than molecular subtype, which the design would not distinguish.","The C1q/phosphatidylserine clearance arm extrapolates from blast injury (pubmed:42556773) and general glaucoma microglial remodeling (pubmed:42769369) to a chronic IOP, subtype-resolved, axonal-compartment context. Cross-model and cross-timescale extrapolation is a significant inferential leap presented as grounding.","The PKA/AKAP1 modulator arm is described as 'deliberately not in the core chain,' yet the 2x2 falsifier and prediction 3 make anchoring status a potential independent predictor whose dissociation would falsify the 'single-variable structure.' This is internally inconsistent: the hypothesis both excludes and tests PKA as an independent axis.","The claim that rapid-recovery subtypes 'escape' because ATP is restored before phosphatidylserine becomes sustained posits a threshold in ATP-depression duration that is never operationalized. Without a defined duration threshold, the escape mechanism is unfalsifiable in practice—any outcome can be accommodated by adjusting the implicit threshold.","The dissociation-by-modulation design (prediction 2) uses Vgat-targeted circuit manipulation via Cre-dependent delivery but does not specify how circuit hyperactivity is measured or how 'verified firing' is achieved in vivo without confounding the mitochondrial readouts. The manipulation and the measurement are not cleanly separable.","Phosphatidylserine masking reagents with neuron-surface restriction and binding-deficient controls are technically demanding; the proposal does not address whether such reagents exist with adequate specificity in vivo or how membrane integrity will be verified without itself perturbing the phosphatidylserine readout.","The covariate-adjudication test is framed as decisive between intrinsic and geometric/perfusion explanations, but recovery time constant and laminar deformation/perfusion are likely collinear (deformation affects local bioenergetics), so regression may not cleanly attribute variance. The falsifier overstates the discriminating power of the design.","The proposal asserts 'no claim of verified originality' but the recombination itself—linking fission-recovery kinetics to a phosphatidylserine-dependent complement threshold in a subtype-resolved axonal compartment—is presented as the 'proposed new claim.' The novelty rests almost entirely on the untested ATP-phosphatidylserine bridge, so originality is contingent on a link the authors concede is unsupported.","Therapeutic implications (ATP recovery restoration, C1q blockade) are stated conditionally but the proposal does not address delivery, dosing windows, or the risk that C1q blockade impairs beneficial clearance, which is a stated alternative. The therapeutic framing is premature relative to the evidence.","The falsifier list is strong in structure but some arms are not cleanly falsifying: e.g., falsifier 1 admits that phosphatidylserine and C1q differences could persist even if the ranking variable fails, which would leave a residual mechanism unaddressed rather than cleanly rejecting the hypothesis. The hypothesis's scope is not bounded enough to be decisively rejected by any single result."],"plausibility":"Moderate but conditional. The individual components are biologically plausible: mitochondrial dysfunction and impaired bioenergetics are established in glaucoma models (pubmed:42401758, pubmed:42883135); subtype-selective axonal vulnerability is reported after optic nerve crush (pubmed:42827923); complement and microglial involvement in glaucoma is documented (pubmed:42769369, pubmed:42556773). However, the specific causal chain—fission-recovery time constant as a subtype-ranking variable that indexes an ATP-dependent phosphatidylserine exposure threshold feeding C1q-dependent pruning—is a constructed synthesis with no direct grounding. The ATP-to-phosphatidylserine bridge is the weakest and most load-bearing link and is admitted to be untested. The claim that recovery time constant and ATP-depression duration are 'the same variable' is an assertion of identity without mechanistic justification; they are conceptually separable and could dissociate. Plausibility of the overall chain is therefore moderate at best, and the geometric/perfusion alternative is a serious competitor that the proposal acknowledges but may not adequately exclude given collinearity.","prior_research":"The proposal correctly grounds its components in supplied sources: mitochondrial insufficiency and bioenergetic failure in glaucoma (pubmed:42401758, pubmed:42883135, pubmed:42865964); subtype-selective axonal vulnerability after optic nerve crush with ONOFF more affected than ON (pubmed:42827923); human subtype-resolved pathology as a named gap (pubmed:42214787); retinal AKAP1 restoration preserving mitochondrial fusion and survival with associative C1q/glial markers (pubmed:42893477); microglial complement/phagocytosis remodeling (pubmed:42769369); C1qa deletion preserving somas and axons after blast injury (pubmed:42556773); Vgat interneuron circuit hyperactivity as an early IOP-independent contributor (pubmed:42839614); astrocyte mechanobiology in the glial lamina (pubmed:42908589); lamina cribrosa viscoelastic changes under high IOP (pubmed:42741401); and IOP lowering as the only validated disease-modifying strategy (pubmed:42911707). What is absent—and the proposal acknowledges this—is any direct evidence that ATP depression duration drives phosphatidylserine externalization in RGC axons, that such exposure is subtype-resolved, or that C1q-dependent removal of connected segments converts reversible to irreversible axonopathy under chronic IOP specifically. The AKAP1 data are retinal-level and associative, not subtype-resolved. The C1q blast data are cross-model. The proposal's novelty hinges on a bridge that prior research has not established. The acknowledgment that absence of subtype-resolved axonal phosphatidylserine data from the supplied set does not establish novelty is appropriate and should be taken seriously: the bridge may simply not have been tested, or may have been tested and not reported here.","testability":"The proposal is unusually well structured for testability, with pre-specified sampling windows, a discovery-then-confirmation cohort design, independent sham controls, per-subtype recovery time constants as the primary statistic rather than absolute ATP, and pre-enumerated technical-failure rules. The bridge falsifier (falsifier 2) is appropriately primary rather than secondary. The phosphatidylserine-dependence test with binding-deficient controls and pre-specified axon-continuity/transport thresholds is a genuine orthogonal test. The amplification-versus-clearance late-arm threshold test is a meaningful discrimination. However, testability is weakened by several factors: (a) the ATP-depression duration threshold for 'sustained' phosphatidylserine exposure is not operationalized, so the escape mechanism cannot be precisely falsified; (b) collinearity between recovery time constant and laminar deformation/perfusion may make the covariate adjudication underpowered or uninterpretable; (c) permanent subtype labeling with verified persistence across all chosen subtypes is operationally demanding and may fail for some subtypes, reducing power; (d) in vivo phosphatidylserine masking reagents with adequate specificity and neuron-surface restriction are not established to exist; (e) the Vgat circuit manipulation and the mitochondrial readouts may not be cleanly separable within the same animals. The falsifier set is strong in principle but several arms are 'soft' falsifiers that could leave residual mechanisms unaddressed (falsifier 1 explicitly allows phosphatidylserine/C1q differences to persist). Overall testability is good in design but conditional on technical feasibility that is asserted rather than demonstrated.","originality":"The proposal is a recombination of parent content (rgc-subtype-mito-gate-proposal-v1, rgc-energy-complement-threshold-v1) with tighter specification, and it explicitly disclaims verified originality. The genuinely novel element is the claim that a single subtype-ranking variable—fission-recovery time constant equated with ATP-depression duration—indexes a phosphatidylserine-dependent complement-recognition threshold in the axonal compartment under chronic IOP. This specific coupling is not directly reported in the supplied sources. However, originality is contingent on the ATP-phosphatidylserine bridge, which is conceded to be untested; if that bridge is already known or trivial, the recombination is incremental. The de-emphasis of unverifiable molecular anchors (PKA/AKAP1 as modulator rather than core) is a reasonable scope restriction but reduces the distinctive molecular content. The claim is original as a synthesis but its originality rests on an unsupported link, so it should be regarded as a plausible-but-unproven recombination rather than a demonstrated advance. No claim of verified originality is appropriate, and the proposal correctly makes none.","unjustified_complexity":"The proposal carries substantial complexity that is not fully justified. The core chain has six nodes with two proposed modulators and a named competing alternative, plus a discovery/confirmation cohort structure with locked rankings and a 2x2 PKA design. Some complexity is justified by the directive's demand for competing hypotheses and discriminating predictions, but several elements are over-specified relative to what the evidence supports: (a) the simultaneous commitment to permanent subtype labeling, three sampling windows, molecular plus functional subtype classification, and two independent cohorts multiplies technical failure points; a staged design (molecular subtypes first, functional classifier later) would be more tractable; (b) the PKA/AKAP1 2x2 arm is included as a falsifier of single-variable structure despite the proposal stating PKA is 'deliberately not in the core chain'—this is complexity that muddies rather than sharpens the hypothesis and should either be dropped or made an explicit secondary axis; (c) the covariate-adjudication model includes cumulative IOP, laminar deformation, axon caliber, position, perfusion, age, sex, and mitochondrial background simultaneously, which is unlikely to be identifiable with typical cohort sizes and creates false precision; (d) the phosphatidylserine masking and C1q late-blockade arms together with discovery/confirmation cohorts constitute a very large experimental program for a single proposal. The unjustified complexity is moderate: the core chain is appropriately mechanistic, but the operational scaffolding (multi-window labeling, dual classification, 2x2 modulator design, full covariate model) is heavier than needed to test the central claim and increases the risk that the study is uninterpretable rather than decisive. A leaner design focused on the bridge (fission-recovery vs. ATP-duration vs. phosphatidylserine exposure) with subtype labeling deferred could test the core claim more cleanly."}],"sourceIds":["pubmed:42911707","pubmed:42908589","pubmed:42883135","pubmed:42882003","pubmed:42878208","pubmed:42865964","pubmed:42851775","pubmed:42848206","pubmed:42839614","pubmed:42838417","pubmed:42802966","pubmed:42801048","pubmed:42799797","pubmed:42780315","pubmed:42769470","pubmed:42769369","pubmed:42757470","pubmed:42751619","pubmed:42741401","pubmed:42731713","pubmed:42827923","pubmed:42737879","pubmed:42722144","pubmed:42699770","pubmed:42619738","pubmed:42603628","pubmed:42556773","pubmed:42556772","pubmed:42442355","pubmed:42406594","pubmed:42893477","pubmed:42872912","pubmed:42857614","pubmed:42803824","pubmed:42774068","pubmed:42650212","pubmed:42510642","pubmed:42468646","pubmed:42401758","pubmed:42296909","pubmed:42255937","pubmed:42214787","pubmed:42007085","pubmed:41952895","pubmed:41929135"],"score":{"mu":23.851713955091668,"sigma":6.276747299259859},"matches":2,"contentHash":"sha256:00466db4ce4bf50d16466c212495fb793073f93cc2f89341978b3051073bfb37","order":5},{"id":"proposal-rgc-energy-complement-gate","title":"Axonal ATP recovery gates complement-dependent selective RGC degeneration","g":0,"summary":"Under comparable chronic intraocular pressure-related stress, adult mouse RGC subtypes with slower recovery of axonal ATP sustain…","claim":"Under comparable chronic intraocular pressure-related stress, adult mouse RGC subtypes with slower recovery of axonal ATP sustain longer, initially reversible phosphatidylserine exposure. This exposure promotes C1q-dependent microglial removal of stressed neuronal processes, converting a subtype-specific metabolic response into differential axonal degeneration and subsequent neuronal death. Subtypes that restore ATP rapidly escape this conversion. The proposed contribution beyond the supplied evidence is the ATP-recovery–phosphatidylserine link as a subtype-selective gate for complement-mediated injury, not the general involvement of metabolism or inflammation in glaucoma.","mechanism":["Direct grounding: mouse ocular hypertension produces early inner-retinal circuit abnormalities before substantial RGC loss, and circuit-directed interventions improve survival without lowering IOP (pubmed:42839614). This supports an upstream contribution of circuit dysfunction, but does not demonstrate subtype-specific RGC firing or ATP depletion.","Additional grounding with limits: mitochondrial background and age alter retinal bioenergetic composition and microglial STING phenotypes, including responses to acute IOP elevation (pubmed:42878208). C1qa deletion preserves RGC somas and axons after blast injury (pubmed:42556773). Extending either observation to subtype-selective chronic-pressure injury is a cross-model extrapolation.","Proposed initiating step: chronic pressure compromises axonal energy balance. Subtype-intrinsic differences in metabolic recovery, potentially compounded by circuit demand, determine how long axonal ATP remains depressed. The relevant variable is recovery duration rather than a single baseline ATP measurement.","Proposed recognition step: persistent but sublethal ATP depletion impairs maintenance of membrane phospholipid asymmetry, producing sustained external phosphatidylserine on affected processes. Complement recognition and microglial uptake then make otherwise recoverable axonal dysfunction irreversible, preceding soma loss. Neither this recognition sequence nor its subtype specificity is established by the supplied sources.","Strongest competing mechanism: pressure-activated glia initiate complement-mediated injury independently of neuronal ATP recovery, with metabolic failure occurring secondarily. A second alternative is autonomous metabolic axon degeneration, with complement serving only to clear dead material. The glaucoma review pubmed:42769369 describes complement and phagocytosis-related microglial remodeling but explicitly leaves causal neuronal–microglial links unresolved.","Conditional therapeutic implication: neuronal NAD/energy maintenance and C1q-dependent recognition are candidate intervention points at different stages. Their value would depend on preserving connected, functional axons rather than merely delaying clearance; none is established here as a clinically effective treatment."],"assumptions":["This proposal concerns adult mice with sustained, nonischemic ocular hypertension. Discrete RGC subtypes would be permanently labeled before injury and identified using molecular and morphological criteria; ON, ONOFF, and ipRGC categories would not be treated as single molecular subtypes.","The proposed subtype differences in axonal ATP recovery, phosphatidylserine exposure, and complement-dependent removal are untested. No supplied source establishes this chain under chronic IOP or identifies which molecular subtype should rank as most vulnerable.","Comparable IOP does not guarantee comparable axonal stress. Analyses must account for cumulative pressure exposure, optic nerve head deformation, axon caliber and location, retinal perfusion, age, sex, and mitochondrial background.","ATP and phosphatidylserine reporters must distinguish reversible metabolic stress from membrane rupture, and labeling must remain detectable despite injury-associated loss of subtype markers. Transport-dependent retrograde labeling alone cannot establish survival.","Evidence is limited to the supplied abstracts and reviews. Rodent optic nerve head anatomy and RGC composition limit extrapolation to human glaucoma, as discussed in pubmed:42838417. Absence of this mechanism from the supplied sources does not establish originality."],"predictions":["In a prospective discovery cohort, compare several permanently labeled RGC subtypes before pressure elevation, during the pre-loss phase, and during later axon and soma loss. Relative to sham-operated normotensive mice, subsequently vulnerable subtypes should show prolonged axonal ATP depression first, surface phosphatidylserine second, complement deposition and microglial uptake third, and structural degeneration last. Establish sampling windows in a pilot rather than importing optic-nerve-crush timing. Test the resulting subtype ranking in an independent cohort.","Before substantial structural loss, induce RGC-restricted NAMPT augmentation as a proposed NAD-salvage intervention, using matched inactive-construct and normotensive controls. Conditional on verified improvement of axonal ATP recovery, the hypothesis predicts less phosphatidylserine exposure and complement deposition early, followed by better transport, axonal continuity, and soma survival later, without reduced IOP. Measure NAD and firing as well as ATP because NAMPT may act through mechanisms other than energy restoration.","Apply adult-onset C1q blockade before the predicted recognition phase, with isotype-treated hypertensive and normotensive controls and verified suppression of complement deposition. Early ATP depression should remain, while microglial uptake and later axon and soma loss should decline preferentially in metabolically vulnerable subtypes. Prevention of the initial ATP deficit instead would favor glia-first injury; reduced uptake without functional preservation would favor clearance of already-dead processes.","As an orthogonal recognition test, mask exposed neuronal phosphatidylserine using a validated, neuron-surface-restricted binding reagent before complement deposition, compared with a binding-deficient reagent. The proposed mechanism predicts reduced complement deposition, uptake, and later degeneration despite an unchanged initial ATP deficit. Confirm neuronal specificity, membrane integrity, and lack of direct effects on microglial viability; this reagent is a proposed experimental tool, not a reported result.","To test reversibility, begin the energy-restoration intervention after ATP depression is detected but before complement deposition, and compare it with intervention after verified uptake begins. Earlier treatment should reverse surface phosphatidylserine and preserve more continuous axons; later treatment should not restore already-disconnected axons. In parallel, assay recovered transport and subtype-specific light responses rather than relying on soma counts alone.","Use blinded structural axon counts, subtype-linked axonal reconstructions, transport measurements, and electrophysiology as independent endpoints. Randomize animals, model cells as nested within animals, include independent sham animals rather than only fellow-eye controls, and match pressure exposure while monitoring perfusion and local deformation. If apparent rescue disappears after matching these variables, it would not support the proposed molecular mechanism."],"falsifiers":["With adequately resolved predegenerative sampling, vulnerable subtypes consistently acquire complement deposition and microglial uptake before any detectable ATP deficit or phosphatidylserine exposure. This would overturn the proposed temporal ordering.","An RGC-restricted intervention demonstrably normalizes axonal ATP and its recovery kinetics before degeneration, yet leaves phosphatidylserine exposure, complement deposition, and subtype-specific degeneration unchanged. This would reject ATP recovery as the proposed upstream determinant.","Effective C1q blockade reduces complement deposition and microglial uptake but fails to preserve axonal continuity, transport, or soma survival. This would reject the claim that complement-dependent removal converts reversible stress into irreversible degeneration, favoring debris clearance instead.","Selective masking of neuronal phosphatidylserine achieves verified surface occupancy without toxicity but does not reduce complement deposition or uptake. This would reject the proposed phosphatidylserine recognition link.","After accounting for local mechanical exposure and perfusion, prospectively measured ATP recovery does not predict subtype vulnerability, whereas local glial activation predicts it independently. This would undermine the proposed intrinsic explanation of the subtype ranking."],"parents":[],"operator":"root","createdSeq":71,"ethicsSeq":76,"reflection":[{"seq":81,"critiques":["The core ATP-recovery–phosphatidylserine gating step is asserted rather than derived; none of the cited sources establishes that sublethal axonal ATP depression causes sustained surface phosphatidylserine exposure in RGC axons, so the central novelty is an untested speculation that could be equally explained by the acknowledged glia-first alternative.","The subtype framework is underspecified: ON, ONOFF, and ipRGC categories are explicitly excluded from being treated as molecular subtypes, yet the proposal does not name which molecularly defined subtypes are predicted vulnerable or how many are tractable with permanent labeling and pre-injury identification. This weakens the required RGC subtype-specific response step and makes the prediction close to unfalsifiable until a specific ranking is committed.","The proposal depends on a difficult, mutually constraining measurement stack: subtype-stable permanent labeling that survives injury, in vivo axonal ATP reporters, phosphatidylserine reporters distinguishing reversible exposure from membrane rupture, complement deposition, microglial uptake, transport, and electrophysiology, all in predegenerative windows. Any one failure (e.g., marker loss or reporter toxicity) could produce an apparent falsification that is actually technical, and the proposal offers no explicit technical-failure adjudication.","Temporal ordering claims (ATP first, phosphatidylserine second, complement third, degeneration last) are vulnerable to sampling-window artifacts; the proposal acknowledges pilot window establishment but does not define a quantitative criterion for 'prolonged' ATP depression or for declaring ordering established versus confounded by detection latency differences among assays.","The NAMPT manipulation is treated as an ATP-restoration test, but NAMPT/NAD augmentation has pleiotropic effects (sirtuins, PARPs, redox, immune modulation) that could alter complement or microglial behavior independently of axonal ATP recovery. The falsifier requiring unchanged phosphatidylserine despite normalized ATP is therefore ambiguous: a positive result could reflect NAD effects downstream or parallel to energy recovery rather than the proposed gate.","C1q blockade and phosphatidylserine masking are both predicted to reduce microglial uptake and preserve axons; the design does not fully separate 'blocking injurious recognition' from 'delaying clearance of already-doomed processes,' which the proposal itself flags. The distinguishing readouts (axon continuity, transport) are proposed but would need prespecified thresholds to avoid post hoc interpretation.","The claim extrapolates from acute IOP elevation, blast injury, and mitochondrial-background studies to chronic nonischemic ocular hypertension with subtype selectivity. Cross-model and cross-timescale extrapolation is acknowledged but not bounded, so the plausibility of the chronic-pressure regime is weaker than the acute evidence implies.","Blood flow, local deformation, axon caliber, and mitochondrial background are named as confounders to match, but in a chronic model these are difficult to equalize across animals; residual confounding could produce subtype-correlated differences that mimic the proposed intrinsic ATP-recovery mechanism.","The therapeutic framing (NAD maintenance plus C1q blockade as staged targets) risks implying a translational path before the causal gate is established; the proposal concedes none is established, but the framing may overstate tractability."],"plausibility":"Moderate but unproven. The general ideas that metabolic stress, phosphatidylserine exposure, complement tagging, and microglial removal can contribute to neurodegeneration are biologically credible, and the cited complement (C1qa) and bioenergetic findings give partial credibility to the components. However, the specific causal ordering—slower axonal ATP recovery causing sustained reversible phosphatidylserine exposure that is then converted to irreversible degeneration by C1q-dependent microglial removal—is a speculative chain with no direct support in the supplied material. The proposal itself concedes the glia-first alternative is equally plausible, so the mechanism is a reasonable hypothesis, not a strongly supported one.","prior_research":"The candidate grounds itself in supplied abstracts/reviews: early inner-retinal circuit abnormalities before RGC loss and circuit-directed rescue (pubmed:42839614); mitochondrial/age effects on retinal bioenergetics and microglial STING with acute IOP elevation (pubmed:42878208); C1qa deletion preserving RGC soma and axons after blast injury (pubmed:42556773); and a glaucoma review noting complement/phagocytosis-related microglial remodeling while leaving causal neuronal–microglial links unresolved (pubmed:42769369); plus species-extrapolation caveats (pubmed:42838417). The proposal correctly notes that the ATP-recovery–phosphatidylserine link and subtype selectivity are not established by these sources, and that absence from supplied sources does not prove originality. It does not claim a literature survey beyond the supplied set.","testability":"Testable in principle, with high technical demand. Predictions are concrete: subtype-resolved temporal ordering of ATP depression, phosphatidylserine exposure, complement deposition, microglial uptake, then degeneration; RGC-restricted NAMPT rescue conditional on improved ATP recovery; adult-onset C1q blockade leaving early ATP deficits while reducing uptake and later loss; phosphatidylserine masking orthogonal test; early-versus-late intervention timing; blinded structural, transport, and electrophysiological endpoints with randomization and confounder matching. Each has stated falsifiers. The main testability risks are dependence on validated in vivo ATP and phosphatidylserine reporters in axons, persistent subtype labeling through injury, predegenerative sampling windows, and prespecified quantitative thresholds to avoid ambiguous interpretation.","originality":"Moderate. The individual components are established or under active study: metabolic dysfunction in glaucoma, phosphatidylserine as an eat-me signal, complement/C1q in neuronal injury, and microglial clearance. The claimed novel contribution is narrower and specific: subtype-selective ATP-recovery kinetics as a gate that determines whether initially reversible phosphatidylserine exposure becomes complement-dependent irreversible removal, with fast-recovering subtypes escaping. That specific gating link appears to go beyond the supplied evidence, but originality cannot be strongly asserted because the candidate did not perform a comprehensive prior-research check and concedes absence from supplied sources is not proof of novelty.","unjustified_complexity":"The proposal is complex but mostly in proportion to a hard multi-stage in vivo question; it includes controls (inactive construct, isotype, binding-deficient reagent, sham animals, confounder matching, orthogonal endpoints) that are justified rather than ornamental. Unjustified complexity arises in a few places: requiring simultaneous measurement of many modalities (ATP, NAD, firing, phosphatidylserine surface occupancy, complement, uptake, transport, axon continuity, soma survival, electrophysiology) without a staged go/no-go plan; proposing both NAMPT and C1q and phosphatidylserine-masking interventions without prioritizing which single decisive experiment would first establish or refute the gate; and invoking circuit-demand compounding without specifying how it is measured or separated from intrinsic ATP recovery. These add interpretive burden beyond what the central claim strictly requires."}],"sourceIds":["pubmed:42911707","pubmed:42908589","pubmed:42883135","pubmed:42882003","pubmed:42878208","pubmed:42865964","pubmed:42851775","pubmed:42848206","pubmed:42839614","pubmed:42838417","pubmed:42802966","pubmed:42801048","pubmed:42799797","pubmed:42780315","pubmed:42769470","pubmed:42769369","pubmed:42757470","pubmed:42751619","pubmed:42741401","pubmed:42731713","pubmed:42827923","pubmed:42737879","pubmed:42722144","pubmed:42699770","pubmed:42619738","pubmed:42603628","pubmed:42556773","pubmed:42556772","pubmed:42442355","pubmed:42406594"],"score":{"mu":22.41231673007284,"sigma":5.782121283259002},"matches":3,"contentHash":"sha256:b52d3aa75dd5b7a3de043585932b259b4166055531ef92c08399f3906f43bb59","order":6},{"id":"proposal-rgc-subtype-mito-gate-v1","title":"Subtype-resolved mitochondrial fission recovery gates complement-dependent RGC degeneration","g":1,"summary":"Under comparable chronic intraocular pressure-related stress, adult mouse RGC subtypes differ in how quickly axonal mitochondria r…","claim":"Under comparable chronic intraocular pressure-related stress, adult mouse RGC subtypes differ in how quickly axonal mitochondria recover from a stress-induced fragmentation state. Subtypes whose mitochondria remain fragmentary the longest show sustained axonal ATP depression and early transport failure, and this prolonged energetic deficit precedes complement-dependent microglial engulfment that converts reversible axonal stress into irreversible degeneration. Subtypes that restore mitochondrial fission/fusion balance quickly escape engulfment and survive. The specific new claim is a two-tier ordering in which a cell-intrinsic mitochondrial-fission-recovery variable sets the initial subtype vulnerability ranking, and complement-dependent recognition at the axonal membrane amplifies but does not create that ranking.","mechanism":["Grounding for the initiating node: chronic IOP-related stress is associated with mitochondrial insufficiency, impaired bioenergetics, and axonal transport failure in RGCs and their axons (pubmed:42401758, pubmed:42883135, pubmed:42865964). These reviews support testing mitochondrial bioenergetics as an upstream node but do not establish subtype-selective fission recovery.","Proposed subtype-intrinsic step: before structural axon loss, RGC subtypes diverge in mitochondrial morphology within axons, with vulnerable subtypes showing prolonged DRP1-mediated fragmentation relative to resilient subtypes. A proposed molecular anchor for this divergence is subtype-dependent AKAP1-dependent scaffolding of the fission/fusion machinery; AKAP1 loss associates with mitochondrial fusion, cristae, and bioenergetic impairments in glaucoma models (pubmed:42893477), but subtype-level AKAP1 retention has not been reported.","Proposed energetic consequence: prolonged fragmentation lowers local axonal ATP availability regardless of baseline ATP. ATP reporters must be pH-controlled, and the relevant variable is recovery time, not a single measurement.","Proposed transport consequence: axonal ATP depression impairs cargo movement in a fashion that can be measured by subtype-resolved cargo tracking and by anterograde tracing normalized to surviving axon number. This ordering (fragmentation, then ATP, then transport) is hypothetical; no supplied source demonstrates it in RGC subtypes.","Proposed amplification step: prolonged sublethal ATP depression at the axon produces complement-associated recognition of stressed processes. Subsequent microglial engulfment makes previously recoverable axonopathy irreversible and is followed by soma loss. Complement/phagocytosis-related glial remodeling in glaucoma is described but causally unresolved (pubmed:42769369), and C1qa deletion preserves RGC somas and axons after blast injury (pubmed:42556773), which is a cross-model extrapolation when applied to chronic IOP.","Strongest competing explanation: pressure-responsive glia and local complement signaling initiate subtype-selective injury independently of neuronal mitochondrial fragmentation; AKAP1 loss and ATP depression would then occur secondarily. Astrocyte mechanosensitive responses in the glial lamina are directly reported (pubmed:42908589), and early inner-retinal circuit dysfunction arising from presynaptic inhibitory neurons is another non-cell-autonomous alternative supported by protection without IOP lowering (pubmed:42839614).","Therapeutic implication that is conditional on the proposed ordering: preserving mitochondrial fission-fusion balance or AKAP1 scaffolding targets the intrinsic initiator, whereas complement inhibition targets amplification. Neither is a substitute for IOP control and neither is established clinically (pubmed:42911707)."],"assumptions":["No supplied abstract establishes subtype-resolved AKAP1 retention, mitochondrial fission recovery, or complement-dependent subtype vulnerability under matched chronic IOP stress. All links in the proposed sequence are untested, and their absence from this bounded evidence set does not establish originality.","Model assumptions: adult mice with sustained microbead-induced ocular hypertension, several independently identifiable RGC subtypes permanently labeled before stress, and subtype identities verified by morphology and molecular markers rather than inferred from injury-sensitive markers.","Comparable IOP exposure does not imply comparable local axon stress. Perfusion, optic nerve head trajectory, axon caliber, retinal position, age, sex, and mitochondrial background must be measured or balanced before attributing subtype differences to mitochondrial fission recovery.","RGC-restricted interventions must have verified subtype coverage and negligible glial or interneuron expression. The supplied AKAP1 study reports retinal-level protection, not RGC-autonomous or subtype-specific mediation.","ATP reporters, tissue preparation, and viral expression can alter physiology; pH controls, viability checks, and independent-animal-level statistics are required. Surviving-axon normalization does not fully address reporter artifacts.","Rodent lamina structure, RGC composition, and optic nerve head vasculature differ from humans (pubmed:42838417); complement blockade may impair beneficial clearance of dead material."],"predictions":["Temporal ordering in a discovery-then-confirmation design: in permanently labeled subtypes sampled at baseline, an early interval verified to precede axon loss, an intermediate interval, and later degeneration, ultimately vulnerable subtypes should show prolonged axonal mitochondrial fragmentation first, then ATP depression, then impaired cargo movement, then increased C1q deposition and verified microglial engulfment, and only afterward structural axon and soma loss, relative to sham normotensive controls. The subtype ranking and sampling windows would be locked in a discovery cohort and tested in an independent cohort rather than imported from optic nerve crush timing.","Mitochondrial-recovery gain-of-function test: restore subtype-level fission-fusion balance in adult RGCs of vulnerable subtypes, for example by RGC-restricted AKAP1 rescue or by validated fission inhibition, initiated before pressure elevation or after the first fragmentation increase but before ATP depression. Relative to matched control-vector eyes with equivalent IOP and transduction coverage, treated vulnerable subtypes should normalize axonal ATP recovery and early transport, with reduced engulfment and degeneration appearing later. If ATP normalizes without benefit, energy failure would not be the mediator; if AKAP1 changes but ATP does not, AKAP1 would not act through bioenergetics.","Loss-of-function test orthogonal to gain-of-function: inducibly fragment mitochondria in adult RGCs of otherwise resilient subtypes, verified by morphology and ATP, without baseline toxicity. Under matched chronic ocular hypertension, previously resilient subtypes should develop earlier transport deficits and greater degeneration than non-targeting controls. Re-expression of a perturbation-resistant construct should reverse these effects.","Factorial ordering test: compare RGC mitochondrial-fission restoration, validated local C1q inhibition, their combination, and matched vector/isotype controls, with each intervention active before the predicted deficit window. The proposed mechanism predicts that fission restoration prevents early ATP and transport defects while leaving initial engulfment lower only indirectly, whereas C1q inhibition reduces engulfment and later degeneration but does not prevent the initial fragmentation and ATP deficits. A glia-first mechanism predicts the reverse ordering, with C1q inhibition preventing or substantially delaying the fragmentation and ATP changes.","Discriminating amplification-versus-clearance test: delay C1q inhibition until verified engulfment has begun. Under the proposed mechanism, late blockade should not restore already-transected axons; measure prespecified axon-continuity and transport thresholds rather than relying on soma counts, and confirm target engagement and cellular source of C1q.","Confound and technical-failure adjudication: use subtype-resolved live cargo tracking plus anterograde tracing normalized to tracer uptake and intact axon number, structural axon counts, and permanent soma labels. Monitor perfusion, IOP history, local inhibitory-circuit activity, and mitochondrial background across groups. Declare results uninterpretable, rather than falsifying, if permanent subtype labels become undetectable or if ATP reporter controls indicate preparation artifact."],"falsifiers":["Vulnerable subtypes do not show prolonged axonal mitochondrial fragmentation before ATP depression, or fragile-X fragmentation is present equally in resilient subtypes until after transport failure and degeneration, contradicting the proposed initiating-variable claim.","Physiological equalization of subtype AKAP1 or fission-fusion balance demonstrably normalizes axonal ATP yet leaves the subtype differences in early transport failure and later degeneration unchanged, so mitochondrial recovery would not be the subtype discriminator.","Complement inhibition applied before the deficit window prevents the initial subtype-specific fragmentation, ATP depression, and transport deficits despite unchanged AKAP1 retention, while RGC mitochondrial restoration fails when glial signaling remains active; a glia-first mechanism would then better explain the data.","Late C1q inhibition begun after verified engulfment reverses or preserves axon continuity as well as early inhibition, indicating clearance of already-committed processes rather than an injurious recognition step; or, conversely, early blockade that preserves engulfment but fails to preserve connected axons would indicate amplification was not the conversion step.","Adequately powered, independently replicated cohorts show that local axon geometry, local mechanical deformation, or perfusion fully accounts for the subtype vulnerability ranking and mitochondrial manipulation does not alter that relationship, rejecting the proposed molecular explanation for this model."],"parents":["proposal-rgc-energy-complement-gate","proposal-rgc-akap1-first"],"operator":"crossover","createdSeq":224,"ethicsSeq":229,"reflection":[{"seq":234,"critiques":["The candidate's central novelty claim—subtype-resolved mitochondrial fission-recovery as an initiating variable—rests on extrapolating retinal-level AKAP1 protection (pubmed:42893477) to RGC-autonomous, subtype-selective fission dynamics; this is a substantial unverified leap presented as a mechanistic anchor.","The candidate conflates 'chronic IOP-related stress' models (microbead ocular hypertension) with injury models cited for complement (blast injury, pubmed:42556773); the cross-model extrapolation is acknowledged but the proposal's causal ordering depends on it, weakening plausibility.","The two-tier ordering (cell-intrinsic fission-recovery sets ranking; complement amplifies) is asserted as 'the specific new claim' but the candidate does not exclude the dominant competing possibility that subtype differences in axon caliber, laminar trajectory, or perfusion produce the ranking, and mitochondrial differences are downstream epiphenomena.","Testability of the initiating event is limited: live subtype-resolved axonal mitochondrial morphology and ATP measurement in the optic nerve head/laminar region in vivo is technically not established, and the proposal relies on reporters whose artifacts it only partially addresses.","The gain-of-function arm (AKAP1 rescue or fission inhibition) lacks a demonstrated subtype-specific targeting strategy; 'RGC-restricted' does not equal 'subtype-restricted,' so the design as written may not test the subtype selectivity it claims.","The claim that complement 'amplifies but does not create' the ranking is a strong architectural assertion, but the discriminating factorial test is under-specified with respect to timing windows needed to separate initiation from amplification, and the candidate acknowledges deficit-window timing must be locked in discovery—making the falsification conditional on an unvalidated staging scheme.","Falsifiers are reasonable but several (e.g., 'physiological equalization... demonstrably normalizes') invoke idealized perturbations that may be unachievable, risking unfalsifiability in practice.","Novelty relative to parent content (rgc-energy-complement-threshold-v1, rgc-akap1-transport-complement-proposal) is claimed but not sharply delineated; the two-tier ordering may be a recombination of parent elements rather than a new mechanism.","The proposal overstates the specificity of 'recovery time' as the relevant variable without operationalizing it against baseline fragmentation differences, which could confound ranking."],"plausibility":"Moderate-low. Each link has partial grounding: mitochondrial bioenergetics and transport failure in glaucoma (pubmed:42401758, 42883135, 42865964), AKAP1 effects on fusion/cristae (42893477), complement/glial remodeling (42769369, 42556773), and mechanosensitive glial lamina responses (42908589). However, the specific sequence—subtype-selective fission recovery → ATP depression → transport failure → complement recognition—is untested in any system cited, and the strongest competing explanations (glia-first, local mechanical/perfusion) are acknowledged but not empirically excluded. Treating retinal-level AKAP1 data as evidence for subtype-resolved neuronal initiation is a conceptual stretch that lowers prior plausibility.","prior_research":"The candidate's own grounding is thin on the critical node: no supplied source demonstrates subtype-resolved AKAP1 retention or fission/fusion recovery differences among RGC subtypes under matched chronic IOP. It correctly cites general mitochondrial/axonal transport literature and cross-model complement data but lacks subtype-resolved precedent; the candidate acknowledges this gap, which is appropriate, but originality then depends on absence-of-evidence rather than positive prior support.","testability":"Partially testable, with important gaps. The discovery-then-confirmation temporal design and the gain/loss/factorial perturbation logic are sound in principle and include controls. But subtype-resolved in vivo measurement of axonal mitochondrial morphology and ATP at the optic nerve head is technically demanding and not established; subtype-specific viral targeting is unvalidated; and the deficit-window staging that gates falsification is itself to be discovered. Several falsifiers require idealized equalization that may be infeasible, so realizable discriminative tests are fewer than listed.","originality":"Moderate. The two-tier architecture (intrinsic fission-recovery ranking amplified by complement recognition) is a plausible conceptual framing but appears to be a recombination of parent content (rgc-energy-complement-threshold-v1, rgc-akap1-transport-complement-proposal) rather than a clearly new mechanism. The differentiation from parents is asserted but not sharply demonstrated. The subtype-resolved AKAP1/fission-recovery axis, if established, would be novel, but as proposed it is speculative.","unjustified_complexity":"The proposal introduces a multi-stage causal chain (fragmentation → ATP → transport → C1q → engulfment → degeneration) with a two-tier ordering, discovery/confirmation cohorts, gain/loss/factorial/late-inhibition arms, and confound adjudication. Much of this is warranted by the causal question, but the two-tier 'specific new claim' and the glia-first versus cell-intrinsic factorial design add layers that may exceed what the evidence can resolve; simpler discriminating tests (e.g., isolated subtype mitochondrial recovery versus glial complement blockade) might more efficiently falsify the ordering without the full multi-arm architecture. The subtype-specific targeting requirement adds complexity that is not matched by demonstrated feasibility."}],"sourceIds":["pubmed:42911707","pubmed:42908589","pubmed:42883135","pubmed:42882003","pubmed:42878208","pubmed:42865964","pubmed:42851775","pubmed:42848206","pubmed:42839614","pubmed:42838417","pubmed:42802966","pubmed:42801048","pubmed:42799797","pubmed:42780315","pubmed:42769470","pubmed:42769369","pubmed:42757470","pubmed:42751619","pubmed:42741401","pubmed:42731713","pubmed:42827923","pubmed:42737879","pubmed:42722144","pubmed:42699770","pubmed:42619738","pubmed:42603628","pubmed:42556773","pubmed:42556772","pubmed:42442355","pubmed:42406594","pubmed:42893477","pubmed:42872912","pubmed:42857614","pubmed:42803824","pubmed:42774068","pubmed:42650212","pubmed:42510642","pubmed:42468646","pubmed:42401758","pubmed:42296909","pubmed:42255937","pubmed:42214787","pubmed:42007085","pubmed:41952895","pubmed:41929135"],"score":{"mu":22.216824826965116,"sigma":5.339257738144512},"matches":3,"contentHash":"sha256:958dbf62aad03a78f4499ba65e5fe0b099cc9081cabd08bbe50977a6400c9fc7","order":7},{"id":"offspring-g2-slot-0-hypothesis","title":"Subtype-resolved mitochondrial AKAP1 retention versus glial FGF1 withdrawal as competing determinants of RGC axonal vulnerability","g":2,"summary":"Under comparable chronic intraocular pressure-related stress, an RGC subtype's vulnerability is set by the balance between two opp…","claim":"Under comparable chronic intraocular pressure-related stress, an RGC subtype's vulnerability is set by the balance between two opposing, measurable regulators acting on the same axonal energetic checkpoint: (i) cell-intrinsic retention of mitochondrial AKAP1, which sustains axonal ATP availability, versus (ii) glia-mediated loss of Müller-cell FGF1, which withdraws trophic support for axonal ATP. Subtypes that combine low AKAP1 retention with high FGF1 dependence develop axonal ATP insufficiency and transport failure first and degenerate first. The two inputs converge on the same ATP/output variable, but they are separable: AKAP1 acts cell-intrinsically and FGF1 acts through the glial-to-neuronal trophic route, so subtype vulnerability ranking is predicted by the ratio of AKAP1 retention to FGF1 dependence rather than by either alone.","mechanism":["Direct supplied evidence for the AKAP1 arm: retinal AKAP1 is reduced in glaucomatous retinas and correlates with disrupted mitochondrial dynamics and synaptic impairment; AAV2-AKAP1 restoration preserves RGCs and vision in two experimental glaucoma models, and is accompanied by lower complement C1q and glial activation markers, without establishing causality (pubmed:42893477).","Direct supplied evidence for the FGF1 arm: sustained ocular hypertension induced glial activation and RGC degeneration; microglial conditioned medium reduced Müller-cell FGF1; Müller-cell FGF1 deficiency worsened inflammation-induced RGC apoptosis in vitro; and intravitreal recombinant FGF1 preserved RGCs without lowering IOP, with reduced FGF1 in Müller-cell regions of human glaucomatous retinas (pubmed:42425282). These are largely in vitro or indirect for the glial-to-neuronal step.","Proposed causal convergence: sustained IOP-related stress produces subtype-dependent loss of mitochondrial AKAP1 and, in parallel, microglia-associated suppression of Müller-cell FGF1. Each input independently lowers the same axonal ATP/output variable; when both fall in the same subtype, ATP falls below the threshold for fast axonal transport, transport fails, axons fragment, and somata die later. Subtypes retaining AKAP1 or retaining FGF1 responsiveness stay above threshold. No specific kinase or receptor identity is assumed.","Competing explanation that this design tests: pressure-responsive glia initiate subtype-selective injury through local inflammatory or complement signaling, with both AKAP1 loss and FGF1 loss as downstream consequences. Astrocyte mechanosensitive responses are directly reported (pubmed:42908589) but their causal effect on RGC subtypes is unknown; complement/tau-microglial links (pubmed:42769369) are plausible but largely untested in glaucoma.","Second competing explanation: subtype vulnerability reflects intrinsic electrical/energy demand differences (reported among mouse PV-positive RGC subtypes, pubmed:42631048) or early inhibitory-circuit dysfunction (pubmed:42839614), with both AKAP1 and FGF1 acting only as modifiers. A demand-supply axonal framework is explicitly a hypothesis in pubmed:42737575.","Conditional therapeutic implication, not established: preserving AKAP1 and preserving Müller-cell FGF1 would target two separable inputs to the same checkpoint; a glia-first mechanism would instead favor upstream inflammatory or complement targets. This is a target hypothesis, not clinical efficacy."],"assumptions":["No supplied abstract establishes subtype-resolved AKAP1 retention, subtype-resolved FGF1 dependence, or their convergence on axonal ATP under matched chronic IOP stress. These are proposed relationships; absence from this bounded source set does not establish novelty.","Adult mice with sustained microbead-induced ocular hypertension would be used, comparing several independently and permanently labeled RGC subtypes within the same eyes before stress, so injury-induced marker loss is not mistaken for death.","Comparable IOP exposure does not guarantee comparable local axonal stress; retinal position, axon caliber, optic nerve head trajectory, perfusion, age, sex, mitochondrial background, and baseline activity must be measured or balanced.","RGC- and Müller-cell-restricted interventions must have verified cell-type coverage and negligible off-target expression. The AKAP1 study reports retinal protection and presynaptic mitochondrial changes, not definite RGC-autonomous or subtype-specific mediation.","ATP reporters, tissue preparation, and viral expression can alter physiology; ATP measurements require pH and viability controls, and transport assays require normalization for tracer uptake and surviving axon number.","Rodent lamina structure, RGC composition, and optic nerve head vasculature differ from humans (pubmed:42838417), and FGF1's non-classical secretion and receptor promiscuity plus complement blockade's possible interference with beneficial clearance limit translation."],"predictions":["Subtype-ranking discovery then independent test: in permanently labeled subtypes, measure baseline mitochondrial AKAP1, Müller-cell FGF1 protein, neuronal FGF-receptor signaling, calibrated axonal ATP, live cargo transport, axon integrity, and soma survival across baseline, a verified pre-loss interval, a transport-deficit interval, and later degeneration, with sham controls, matched cumulative IOP, and blinded analysis. A discovery cohort defines the subtype ranking and sampling windows; the locked prediction is that vulnerability ranking is predicted better by the composite ratio of AKAP1 retention to FGF1 dependence than by either single variable, and that ATP decline precedes transport failure, which precedes structural loss.","Separable-input factorial test: in the same subtype panel, combine physiological-range RGC AKAP1 restoration, physiological-range Müller-cell FGF1 restoration, both, and matched vector controls, all active before the early deficit window. The proposed mechanism predicts additive or supra-additive preservation of axonal ATP and transport in the most vulnerable subtypes when both inputs are restored, and partial preservation when either alone is restored, with the composite ratio remaining predictive. A single dominant input would instead show no added benefit from the second restoration.","Cell-restricted causal loss-of-function: induce adult RGC-restricted AKAP1 reduction and, separately, adult Müller-cell-restricted Fgf1 deletion, each with verified protein depletion and no baseline toxicity. Under matched ocular hypertension, AKAP1 reduction should worsen previously resilient subtypes, and Müller-cell Fgf1 deletion should worsen subtypes with high FGF1 dependence; each perturbation should produce the predicted early ATP change before structural loss, with sham-pressure and non-targeting-vector controls.","Discriminating glia-first factorial test: compare combined neuronal restoration (AKAP1 plus FGF1) against validated local complement or inflammatory inhibition, their combination, and matched controls. The proposed mechanism predicts that neuronal restoration prevents the early ATP and transport deficits whereas complement inhibition mainly reduces later engulfment and degeneration without preventing the initial metabolic deficit; a glia-first mechanism instead predicts that glial inhibition prevents or substantially delays the initial AKAP1, FGF1, ATP, and transport changes. Target engagement and the cellular source of the glial signal must be verified.","Confound and orthogonal tests: confirm transport with both subtype-resolved live cargo tracking and anterograde tracing normalized to uptake and intact axon number; confirm degeneration with structural axon counts and permanent soma labels; validate ATP with an orthogonal metabolic readout and pH controls; monitor perfusion, IOP history, and early inhibitory-circuit activity across groups. Analyze animals, not individual cells, as independent replicates. Persistent subtype ranking after verified restoration of both inputs, or preferential rescue by activity suppression, would favor the intrinsic-demand alternative."],"falsifiers":["If, in independently validated cohorts, vulnerability ranking is not better predicted by the composite AKAP1-retention/FGF1-dependence ratio than by either variable alone, the proposed two-input convergence would be rejected even if each input shows some association.","If restoring both AKAP1 and FGF1 to physiological range gives no greater preservation of axonal ATP, transport, or survival than restoring either alone in the most vulnerable subtypes, the proposed additive convergence on a shared checkpoint would be contradicted.","If, with verified protein depletion and no baseline toxicity, adult RGC-restricted AKAP1 reduction or Müller-cell Fgf1 deletion fails to produce the predicted early axonal ATP change or to shift subtype vulnerability, the corresponding causal arm would be undermined.","If glial complement or inflammatory inhibition prevents the initial AKAP1, FGF1, ATP, and transport changes while neuronal restoration fails when glial signaling remains active, a glia-first mechanism would better explain the findings.","If adequately powered, independently replicated cohorts show that local axon geometry, perfusion, or intrinsic activity demand fully accounts for subtype vulnerability and neither AKAP1 nor FGF1 manipulation changes that relationship, the proposed molecular explanation would be rejected for this model."],"parents":["proposal-rgc-fgf1-energy-dependence","proposal-rgc-akap1-first"],"operator":"crossover","createdSeq":278,"ethicsSeq":283,"reflection":[{"seq":288,"critiques":["The candidate's core claim asserts convergence of AKAP1 retention and FGF1 dependence on 'the same axonal ATP/output variable', but the supplied evidence for both arms does not measure axonal ATP; AKAP1 evidence is retinal/synaptic and FGF1 evidence is largely in vitro or indirect, so the convergence is assumed rather than grounded.","The composite ratio prediction ('AKAP1 retention to FGF1 dependence') is undefined operationally: no scaling, measurement units, or normalization strategy is specified, making the central discriminator potentially unfalsifiable or post hoc adjustable unless a pre-specified composite is locked.","FGF1 'dependence' is not an established measurable quantity for RGC subtypes; the proposal treats FGF1 responsiveness as a subtype trait without evidence that FGF-receptor signaling is subtype-differential or that the glial-to-neuronal trophic step is causal in vivo.","The mechanism chain claims AKAP1 acts cell-intrinsically while FGF1 acts glia-to-neuronal, but the cited AKAP1 paper reports retinal protection with reduced complement/glial markers, which is compatible with a glia-first mechanism; the proposal acknowledges this but then depends on cell-restricted tools whose specificity is unvalidated.","The 'counterfactual' use of complement blockade as a discriminator conflates anti-inflammatory actions with clearance; a single factorial test cannot cleanly separate 'glia-first initiation' from 'glia-mediated downstream amplification', so the discriminating logic is weaker than stated.","Adult inducible, subtype-resolved labeling of multiple RGC subtypes combined with live axonal ATP imaging, live cargo tracking, permanent soma labels, and cell-type-restricted AAV interventions in the same eyes is an extremely demanding technical package; feasibility and power are not addressed, and the candidate does not indicate a staged plan to establish each assay independently.","Physiological-range restoration of AKAP1 and Müller-cell FGF1 is asserted but not operationalized; 'physiological range' requires subtype- and cell-specific calibration that the proposal does not define, risking rescue effects from supraphysiological expression.","The candidate lists subtype diversity but does not commit to which subtypes are compared or how many; without a subtype panel with validated permanent labels, the 'subtype ranking' prediction cannot be evaluated.","Potential therapeutic implication (dual AKAP1/FGF1 preservation) is stated conditionally, which is appropriate, but the proposal should note that FGF1's pleiotropic and potentially pro-inflammatory/pro-angiogenic actions could make trophic restoration unsafe, a concern not addressed.","The falsifiers are reasonable but some are framed at a cohort level ('independently validated cohorts') without specifying statistical criteria, equivalence margins, or decision thresholds for 'better predicted', which weakens their testability."],"plausibility":"Moderate. The individual arms have some empirical footing in the supplied sources (AKAP1 restoration protective; Müller-cell FGF1 loss in glaucoma models), and an ATP/transport bottleneck as a shared endpoint is a plausible framing. However, the claim that these two particular inputs are the dominant, separable determinants of subtype vulnerability under matched chronic IOP stress is a substantial inferential leap: neither the AKAP1 paper nor the FGF1 paper establishes subtype resolution, axonal ATP as the mediating variable, or in vivo glial-to-neuronal FGF1 causality. Plausible as a hypothesis worth testing; not yet well supported as a leading explanation.","prior_research":"The candidate largely relies on a bounded supplied set: AKAP1 in glaucomatous retina and AAV2-AKAP1 rescue (pubmed:42893477); Müller-cell FGF1 and microglial conditioned medium effects plus human tissue (pubmed:42425282); astrocyte mechanosensitive responses (pubmed:42908589); complement/tau-microglial links (pubmed:42769369); subtype energy demand (pubmed:42631048); inhibitory-circuit dysfunction (pubmed:42839614); and an explicit demand-supply axonal hypothesis (pubmed:42737575). This is a fair but thin basis for the convergence claim. The candidate honestly flags absence from the bounded set as not establishing novelty, which is correct; prior work on RGC subtype vulnerability, mitochondrial transport, and trophic dependence is much broader than cited, so originality relative to the wider literature is not demonstrated and should not be inferred from this set.","testability":"Partially testable and ambitious. The subtype-ranking and factorial predictions are in principle measurable with live ATP reporters, transport assays, and cell-restricted interventions, and the candidate includes several good controls (pH/viability, uptake normalization, permanent labels, sham pressure, blinding). Weaknesses: (1) the composite ratio lacks a pre-specified operational definition, so the primary prediction could be fit post hoc; (2) 'physiological-range' restoration is not defined; (3) the subtype panel and sample sizes are unspecified, raising power and replicate (animal-level) concerns; (4) live axonal ATP imaging in multiple labeled subtypes in vivo is technically unproven here. With a locked analysis plan and staged assay validation, the core predictions could be made genuinely falsifiable.","originality":"Moderate. Proposing AKAP1 and FGF1 as separable inputs converging on axonal ATP with a ratio-based subtype prediction is a coherent synthesis, and the explicit competing explanations (glia-first, intrinsic demand) are a strength. But each component is drawn from existing reports, and the novelty rests mainly on the specific convergence-plus-ratio framing rather than on new mechanism. Relative to the broader glaucoma/RGC literature—which the bounded set does not cover—the degree of originality cannot be confirmed and may be lower than the framing implies.","unjustified_complexity":"The proposal accumulates many simultaneous demands—multiple permanently labeled subtypes, chronic microbead IOP, live axonal ATP imaging, live cargo tracking, anterograde tracing, permanent soma labels, two cell-restricted AAV interventions in factorial combinations, complement/inflammatory arms, and orthogonal metabolic readouts—without a staged feasibility argument or prioritized minimal decisive experiment. The composite-ratio prediction adds a derived variable whose construction is unspecified, and the 'same checkpoint' framing invites over-interpretation. A leaner design (e.g., ranking discovery with one orthogonal ATP readout, then a single factorial rescue) would test the core claim with less confound risk; the current scope risks being underpowered and technically overcommitted rather than decisively informative."}],"sourceIds":["pubmed:42911707","pubmed:42908589","pubmed:42883135","pubmed:42882003","pubmed:42878208","pubmed:42865964","pubmed:42851775","pubmed:42848206","pubmed:42839614","pubmed:42838417","pubmed:42802966","pubmed:42801048","pubmed:42799797","pubmed:42780315","pubmed:42769470","pubmed:42769369","pubmed:42757470","pubmed:42751619","pubmed:42741401","pubmed:42731713","pubmed:42737575","pubmed:42722228","pubmed:42722144","pubmed:42650212","pubmed:42632302","pubmed:42631048","pubmed:42556772","pubmed:42496936","pubmed:42427758","pubmed:42425282","pubmed:42893477","pubmed:42872912","pubmed:42857614","pubmed:42803824","pubmed:42774068","pubmed:42510642","pubmed:42468646","pubmed:42401758","pubmed:42296909","pubmed:42255937","pubmed:42214787","pubmed:42007085","pubmed:41952895","pubmed:41929135"],"score":{"mu":20.367955633706128,"sigma":5.454009245390428},"matches":3,"contentHash":"sha256:b2f906233291cf7bef5744e35861b175866a0b112b826a1dc29a1034215c7eca","order":8},{"id":"proposal-rgc-intracellular-cfh","title":"Intracellular CFH induction as a subtype-specific redox gate for glaucomatous axon failure","g":0,"summary":"In adult mice exposed to comparable chronic intraocular pressure-related stress, RGC subtype-specific induction of endoplasmic-ret…","claim":"In adult mice exposed to comparable chronic intraocular pressure-related stress, RGC subtype-specific induction of endoplasmic-reticulum-localized intracellular complement factor H (CFH) determines a substantial component of selective vulnerability: weak induction permits early lipid peroxidation, followed by axonal energy and transport failure, axonal degeneration, and neuronal death. Strong induction preserves these functions even when extracellular C3-dependent inflammatory injury is reduced. The proposed subtype-determining role and redox-to-transport sequence are untested, not established glaucoma findings.","mechanism":["Direct evidence outside glaucoma: pubmed:42686909 reports that CFH expression correlated with RGC resilience in multiple sclerosis donor tissue and that intracellular CFH limited neuronal ROS and lipid peroxidation. Protection depended on SCR20, was independent of secretion, and persisted without C3. Extending this mechanism to chronic ocular hypertension is a cross-disease extrapolation.","Direct glaucoma-relevant background: AKAP1 restoration preserved RGC survival and visual function in experimental glaucoma, accompanied by mitochondrial and inflammatory changes; those associations do not establish their causal ordering or subtype specificity (pubmed:42893477). Thus metabolic protection is plausible but does not itself support a CFH-dependent subtype mechanism.","Proposed minimal causal sequence: chronic IOP-related stress elicits unequal CFH induction across RGC subtypes; insufficient intracellular CFH permits ER-associated lipid peroxidation, which compromises axonal energy homeostasis and ATP-dependent transport before structural axon loss and subsequent soma death. The connection between ER lipid damage and axonal transport is the principal new hypothetical link.","Strongest competing explanation: IOP-induced glial responses initiate extracellular complement-dependent injury, and subtype differences reflect unequal exposure or susceptibility to that attack; intracellular CFH expression is merely a stress marker. Glial mechanobiological changes are supported by pubmed:42908589 and pubmed:42817911, but those studies do not establish subtype-selective complement injury. C3-independent astrocytic mechanical or metabolic injury remains a separate alternative.","What is new relative to the supplied evidence is the claim that early intracellular CFH induction sets chronic-IOP subtype vulnerability through a redox-to-transport sequence, rather than through extracellular complement regulation. Intracellular CFH neuroprotection itself is established background in the supplied non-glaucoma source. A conditional therapeutic target would be neuronal intracellular CFH activity, not indiscriminate systemic CFH elevation."],"assumptions":["Adult mouse RGC subtypes differ in early intracellular CFH induction under chronic ocular hypertens
