,"proposal-rgc-axonal-atp-complement-gate-v1"],"reviewed":true},{"id":"pubmed:42893477","title":"AKAP1 Protects Retinal Ganglion Cells and Preserves Vision by Improving Mitochondrial and Synaptic Health in Glaucomatous Neurodegeneration.","text":"Glaucoma, a leading cause of irreversible blindness, is characterized by progressive loss of retinal ganglion cells (RGCs) and lacks effective neuroprotective therapies. Despite evidence implicating mitochondrial dysfunction in glaucoma, the mechanisms linking elevated intraocular pressure, synaptic dysfunction, mitochondrial failure, and RGC death remain incompletely understood. Here we identify the mitochondrial scaffold protein A-kinase anchoring protein 1 (AKAP1) as a critical regulator of RGC resilience in glaucoma. AKAP1 expression is reduced in glaucomatous retinas and correlates with disrupted mitochondrial dynamics, oxidative stress, synaptic impairment, and visual decline. AAV2-mediated restoration of AKAP1 preserves RGC survival and visual function in two independent experimental glaucoma models. These data suggest that retinal AKAP1 promotes mitochondrial fusion, cristae integrity, and bioenergetic capacity in the inner retina and in stressed cultured RGCs, and is accompanied by increased mitochondrial content in presynaptic terminals of the inner plexiform layer. Retinal AKAP1 is further associated with higher PKA abundance, normalized CaMKII and synapsin phosphorylation, preserved synaptophysin, and lower complement C1q and glial activation markers; these associations do not, by themselves, establish causality. These findings identify AKAP1 as a candidate regulator of mitochondrial and synaptic homeostasis and highlight AAV2-AKAP1 gene therapy as a promising neuroprotective strategy for vision preservation in glaucoma.","level":"ABSTRACT","snapshot":"sha256:e6d1b35133b4779ca0af6abe8914ad70a48a6c32c8483179415e34ab75b12321","retrievedSeq":91,"root":"root-slot-2","notes":[{"text":"AKAP1 reduced in glaucomatous retinas; AAV2-AKAP1 restored RGC survival and visual function in two glaucoma models, linked to mitochondrial fusion, cristae, bioenergetics, synaptic markers and lowered C1q/glial activation; the authors note associations do not establish causality; no subtype resolution.","seq":96},{"text":"reports reduced retinal AKAP1 in glaucomatous retinas correlating with mitochondrial dynamics, oxidative stress, synaptic impairment and visual decline, and AAV2-AKAP1 rescue in two models; the paper itself notes associations do not establish causality; supports a cell-intrinsic mitochondrial-resilience axis but not subtype selectivity.","seq":128}],"candidates":["proposal-rgc-akap1-first","offspring-g3-slot-1-hypothesis","proposal-rgc-subtype-axon-compartment-gate-v1","proposal-rgc-subtype-mito-gate-v1","offspring-g2-slot-0-hypothesis","proposal-rgc-intracellular-cfh","proposal-rgc-axonal-atp-complement-gate-v1"],"reviewed":true},{"id":"pubmed:42872912","title":"Therapeutic Window of AAV-SIRT1 Gene Therapy in Mouse Models of Optic Nerve Degeneration.","text":"PURPOSE: Optic neuropathies involve progressive loss of retinal ganglion cells (RGCs) and their axons, leading to irreversible vision deficits. While pretreatment with drugs or gene therapy that upregulate sirtuin 1 (SIRT1), an NAD⁺-dependent deacetylase, has shown neuroprotective effects, its effectiveness when administered after disease onset remains uncertain. We investigated whether adeno-associated virus (AAV)-mediated SIRT1 overexpression in RGCs can provide post-onset neuroprotection in preclinical models of optic neuropathy.\nMETHODS: RGC degeneration was induced in C57BL/6 mice (8-10/group) using two models: elevated intraocular pressure via intracameral magnetic microbeads (glaucoma model), and myelin oligodendrocyte glycoprotein immunization to induce optic neuritis in an experimental autoimmune encephalomyelitis (EAE model). Mice received intravitreal injections of either control AAV2 or AAV2-SIRT1, which drives SIRT1 expression under the γ-synuclein promoter. Treatment was delivered either 2 weeks before, at, or 1 week after disease onset. We assessed RGC survival and function by immunolabeled RGC counting and optokinetic response, respectively.\nRESULTS: Intraocular pressure elevation and EAE induction reduced RGC counts and optokinetic response. In the glaucoma model, AAV2-SIRT1 administered before or after onset preserved visual function and increased RGC survival. In the EAE model, SIRT1 therapy significantly increased RGC survival at all time points, although visual function was not significantly improved.\nCONCLUSIONS: SIRT1 gene therapy confers robust RGC neuroprotection and potentially preserves visual function when delivered before or after disease onset in the models of ocular hypertension and optic neuritis.\nTRANSLATIONAL RELEVANCE: Our study underscores the translational relevance of SIRT1-based interventions and suggests their potential to avert vision loss in optic neuropathies.","level":"ABSTRACT","snapshot":"sha256:b2f322501e70ecc5a639fc20bce457b03f35f4f9ffb24d852fc558ca25185b82","retrievedSeq":91,"root":"root-slot-2","notes":[{"text":"AAV2-SIRT1 (gamma-synuclein promoter) in mouse microbead ocular hypertension and EAE optic neuritis; pre- or post-onset treatment increased RGC survival, visual function preserved in glaucoma but not EAE; non-subtype-specific, single mechanism, mouse only.","seq":96},{"text":"mouse study showing AAV2-SIRT1 (γ-synuclein promoter) preserves RGC survival and function when given before or after onset in microbead ocular hypertension and EAE optic neuritis; supports post-onset cell-intrinsic NAD+-dependent protection, with visual function benefit in glaucoma but not EAE; no subtype analysis.","seq":128}],"candidates":["proposal-rgc-akap1-first","offspring-g3-slot-1-hypothesis","proposal-rgc-subtype-axon-compartment-gate-v1","proposal-rgc-subtype-mito-gate-v1","offspring-g2-slot-0-hypothesis","proposal-rgc-intracellular-cfh","proposal-rgc-axonal-atp-complement-gate-v1"],"reviewed":true},{"id":"pubmed:42857614","title":"Associations between Retinal Nerve Fiber Layer Thickness, Axial Length, and Generation in the 2-Continent Eye Study.","text":"PURPOSE: To assess the associations between peripapillary retinal nerve fiber layer thickness (RNFLT) and ocular and systemic parameters, in particular axial length (A).\nDESIGN: Population based studies.\nMETHODS: Ocular and systemic examinations including OCT RNFLT measurement.\nPARTICIPANTS: Participants of 4 population-based studies (Beijing Eye Study [n = 3246; age: 40+ years], Ural Eye and Medical Study [n = 5023; age: 40+ years], Ural Very Old Study [n = 407; age: 85+ years], Ural Children Eye Study [UCES, n = 3109; age: 6+ years]).\nOUTCOME MEASURES: RNFLT.\nRESULTS: The study cohort consisted of 23 384 eyes (11 785 individuals). In multivariable analysis with exclusion of eyes with an IOP of \u003e21 mmHg, thicker RNFLT was associated (all P \u003c 0.001) with the systemic parameters of younger age, female sex, urban region of habitation, taller body height, higher educational level, lower systolic blood pressure, and higher estimated cerebrospinal fluid pressure; and with lower intraocular pressure. In all studies on adults (Beijing Eye Study, Ural Eye and Medical Study, and Ural Very Old Study), total RNFLT increased with AL up to an AL of 24.0 mm, plateaued, and decreased for an AL \u003e26.5 mm. In the UCES, RNFLT linearly increased with longer AL, also in the highly myopic range. Differentiated sectorially, temporal RNFLT in the UCES linearly increased with AL (including the highly myopic range), while in the adult studies it plateaued beyond an AL of 26.0 mm. In all other sectors in all cohorts, the sectorial RNFLT decreased with longer AL in the highly myopic range.\nCONCLUSIONS: The AL-related increase in RNFLT up to an AL of 24 mm, found in all ages, may correspond to an AL-related larger retinal surface area with a higher number of retinal ganglion cells per eye. The RNFLT decrease beyond an AL of 26.5 mm in adults corresponds to an increased prevalence of optic neuropathies in highly myopic eyes. The sectorial differences in the RNFLT/AL relationship corresponds to the axial elongation-related RNFL shift to the macula, with a secondary RNFL crowding temporally and a geometrically explained RNFLT decrease nasally. Sectorial normative RNFLT data depend on AL.\nFINANCIAL DISCLOSURES: Proprietary or commercial disclosure may be found in the Footnotes and Disclosures at the end of this article.","level":"ABSTRACT","snapshot":"sha256:e714820914844456b2c281d5ed99a5727438e059973918170a5c4d3111ed9d13","retrievedSeq":91,"root":"root-slot-2","notes":[{"text":"Population-based 2-Continent Eye Study; RNFLT associated with age, sex, blood pressure, IOP and non-linear axial length; anatomic/epidemiologic, not mechanism or subtype vulnerability; low relevance to causal chain.","seq":96},{"text":"population-based OCT study of RNFL thickness versus axial length and systemic parameters across four cohorts; geometry/development associations with nerve fibre layer thickness, no IOP-stress experiments and no RGC subtype vulnerability data; low relevance.","seq":128}],"candidates":["proposal-rgc-akap1-first","offspring-g3-slot-1-hypothesis","proposal-rgc-subtype-axon-compartment-gate-v1","proposal-rgc-subtype-mito-gate-v1","offspring-g2-slot-0-hypothesis","proposal-rgc-intracellular-cfh","proposal-rgc-axonal-atp-complement-gate-v1"],"reviewed":true},{"id":"pubmed:42817911","title":"The Heterogeneity of the Neurovascular Unit in the Optic Nerve Head During Glaucomatous Neurodegeneration Based on Single-Cell RNA Sequencing.","text":"Glaucoma is a multifactorial neurodegenerative disease, and the dysfunction of the neurovascular unit (NVU) in optic nerve head (ONH) has been gradually recognized to contribute to the neurodegeneration progression, yet its heterogeneity features remain poorly understood. Here, we established rat models of high intraocular pressure (HIOP) and lipopolysaccharide-induced ocular inflammation (LPS), and performed single-cell RNA sequencing (scRNA-seq) of ONH-centered tissues to characterize the cellular and molecular characteristics of NVU and its main cell components. Distinct alterations in the cellular composition and intercellular communication of the ONH-NVU were observed among Ctrl, HIOP and LPS conditions. Astrocytes showed a prominent increase of relative proportion in the HIOP group, whereas microglia were preferentially expanded under LPS stimulation. Astrocytes, microglia and endothelial cells showed a firm interaction via cell-cell communication analysis, in which the interactions within astrocytes and endothelial cells were the highest. Reclustering of main NVU cell types were further identified distinct subpopulations, including Dcn+Myoc+ astrocytes, S100a8+S100a9+ microglia and Nebl+Cytl1+ endothelial cells with prominent heterogeneity features, and their cellular interactions exhibited a prominent integrin-collagen network in orchestrating ECM restructuring under HIOP conditions. Additional histomorphological analysis further verified the early collapse of ONH astrocytic network and RGC degeneration. Therefore, these findings reveal the distinct ONH-NVU heterogeneity under HIOP condition, the astrocyte-mediated ECM remodeling may serve as a key early mechanobiological event for subsequent ONH cupping and glaucomatous neurodegeneration.","level":"ABSTRACT","snapshot":"sha256:d0d3d520b28d2633b072c69c3f1e40f972c03a93f8668af22fac2069ad2cdd16","retrievedSeq":91,"root":"root-slot-2","notes":[{"text":"Rat HIOP and LPS scRNA-seq of ONH neurovascular unit; astrocytes expand under HIOP, microglia under LPS; Dcn+Myoc+ astrocytes, S100a8/9+ microglia, Nebl+Cytl1+ endothelium; integrin-collagen ECM remodeling; early astrocytic network collapse and RGC degeneration; strong glia arm, but no RGC subtype-level readout.","seq":96}],"candidates":["proposal-rgc-intracellular-cfh"],"reviewed":true},{"id":"pubmed:42803824","title":"CTCF-FXN regulatory axis plays critical roles in clinical assessments and disease progression of primary open-angle glaucoma.","text":"Primary open-angle glaucoma (POAG) is an irreversible ophthalmic disease that is the leading cause of blindness. Oxidative stress (OS) is considered an important contributor to POAG pathogenesis. However, its mechanism of action in POAG remains vague. FXN was identified as a candidate OS-related gene associated with POAG through WGCNA and two machine learning methods (LASSO regression and SVM-RFE). Through multiple bioinformatic analyses, FXN exhibited potential diagnostic value and was associated with immune-related signatures in POAG samples. GSEA revealed that high FXN expression was associated with enrichment of glycolysis- and pyruvate metabolism-related gene sets. FXN expression was significantly decreased in an H2O2 in vitro model (R28 cells). CCK8, EdU, TUNEL, ROS detection and flow cytometry assays indicated that FXN overexpression improved retinal ganglion cells (RGCs) viability and inhibited cell apoptosis and ROS accumulation. Mechanistically, CTCF was demonstrated to transcriptionally regulate FXN by binding to its promoter region, as confirmed by ChIP assay. FXN deletion partially abolished the protective effects of CTCF overexpression on RGC viability, apoptosis, and oxidative stress responses. In conclusions, FXN may represent a potential biomarker associated with POAG. The identification of the CTCF-FXN regulatory axis provides new insights into the molecular mechanisms underlying POAG.","level":"ABSTRACT","snapshot":"sha256:3001dea984518818cff7fe63da35f3e8bdf137b798f3274238bf4e01ee52cf3d","retrievedSeq":91,"root":"root-slot-2","notes":[{"text":"Bioinformatic plus R28 cell work; CTCF transcriptionally regulates FXN, FXN overexpression improved RGC viability and reduced ROS/apoptosis under H2O2; candidate oxidative-stress axis in POAG; cell-line model, no subtype or IOP-stress causality.","seq":96},{"text":"bioinformatic plus R28/H2O2 cell work identifying FXN as an oxidative-stress candidate gene in POAG and a CTCF-FXN axis affecting RGC-lineage viability, apoptosis and ROS; cell-line evidence with no subtype or axon-degeneration readouts; modest relevance.","seq":128}],"candidates":["proposal-rgc-akap1-first","offspring-g3-slot-1-hypothesis","proposal-rgc-subtype-axon-compartment-gate-v1","proposal-rgc-subtype-mito-gate-v1","offspring-g2-slot-0-hypothesis","proposal-rgc-intracellular-cfh","proposal-rgc-axonal-atp-complement-gate-v1"],"reviewed":true},{"id":"pubmed:42786501","title":"Resveratrol attenuates diabetic RGC degeneration through TRIM23-dependent VDAC1 ubiquitination and mitophagy.","text":"BACKGROUND: Retinal ganglion cells (RGCs) degeneration is an early event in diabetic retinopathy (DR), tightly coupled to mitochondrial dysfunction. While the mitochondrial gatekeeper voltage-dependent anion channel 1(VDAC1) is a known mediator of apoptosis, its regulation and therapeutic targeting in diabetic RGCs remain unclear.\nMETHODS: We examined VDAC1 expression in human donor retinas, streptozotocin-induced diabetic mice, and high glucose-treated SH-SY5Y cells. VDAC1-knockdown SH-SY5Y cells were established to explore its functional role in the context. Using virtual screening and molecular docking, we identified resveratrol (RSV) as a potential VDAC1 inhibitor, which was further validated by surface plasmon resonance binding assays and RSV-based pull-down experiments. The effects of RSV were assessed by RGCs survival, retinal electrophysiological function, and mitochondrial quality control. Tripartite motif-containing 23 (TRIM23)-VDAC1 interaction along with ubiquitination modifications were confirmed by co-immunoprecipitation. Finally, combination therapy involving RSV and adeno-associated virus serotype 2 (AAV2) carrying the γ-synuclein (SNCG) promoter mediated Trim23 overexpression was applied in both DR and acute ocular hypertension (AOH) animal models.\nRESULTS: VDAC1 was upregulated in diabetic RGCs, and its knockdown was protective. We further discovered that RSV recruits the E3 ligase TRIM23 to VDAC1, inducing a K27-linked ubiquitination switch that promotes mitophagy instead of apoptosis. We propose that RSV binding acts as an allosteric switch, reconfiguring VDAC1 to favor this protective ubiquitination pathway. Consequently, RSV restored mitochondrial health and RGCs viability. Therapeutically, enhancing this axis via RSV and RGCs-targeted Trim23 overexpression synergistically protected against RGCs loss in both DR and AOH models.\nCONCLUSION: Our study unveils a pharmacologically inducible switch wherein RSV, via direct VDAC1 binding, redirects its function toward TRIM23-mediated K27-linked ubiquitination and mitophagy. The TRIM23-VDAC1 allosteric axis represents a novel therapeutic paradigm for neuroprotective intervention in DR and beyond.","level":"ABSTRACT","snapshot":"sha256:535d2236e7d5b4e3bd748e62f72f1d1b0f457f36f5f1701114f1c90fa514bd24","retrievedSeq":91,"root":"root-slot-2","notes":[{"text":"Diabetic retinopathy and acute ocular hypertension models; VDAC1 upregulation; resveratrol redirects VDAC1 via TRIM23 K27 ubiquitination toward mitophagy; RSV plus AAV2-SNCG-Trim23 protected RGCs; mitochondrial quality-control mechanism shared with AOH, but no subtype resolution and diabetic focus.","seq":96}],"candidates":["proposal-rgc-intracellular-cfh"],"reviewed":true},{"id":"pubmed:42686909","title":"Intracellular complement factor H protects neurons during CNS inflammation.","text":"Neurodegeneration is a major driver of disability in multiple sclerosis (MS), the most common chronic inflammatory disease of the central nervous system (CNS)1. Retinal ganglion cells (RGCs), a heterogeneous neuronal population in the eye, undergo degeneration in MS and provide a model to study neuronal subtype-specific resilience to inflammatory injury2. However, the neuron-intrinsic mechanisms underlying differential vulnerability remain unclear. Here we identify a neuroprotective role for intracellular complement factor H (CFH) in neurons. Using single-nucleus RNA-sequencing analysis of RGCs from donors with MS and control individuals, we found that CFH expression was strongly correlated with intrinsic resilience to RGC degeneration. Mechanistically, CFH was induced in retinal and other CNS neurons in response to inflammatory and oxidative stress, where it limited reactive oxygen species accumulation and lipid peroxidation. CFH localized to the endoplasmic reticulum, a major site of lipid peroxidation during neuronal ferroptosis. Its protective activity was dependent on its C-terminal SCR20 domain, was independent of CFH secretion and was preserved in the absence of complement component C3. These findings reveal a non-canonical intracellular function of CFH in neurons. Together, our results identify CFH as a key mediator of neuronal resilience across the CNS in mice and humans and provide mechanistic insight into inflammatory neurodegeneration with implications for MS therapy and neuroprotection more broadly.","level":"ABSTRACT","snapshot":"sha256:e1ea85ae88ea015ac45dd055f8ab22c76dfe30cb05a328347ead462906704c7c","retrievedSeq":91,"root":"root-slot-2","notes":[{"text":"Single-nucleus RNA-seq of MS and control donor RGCs; intracellular complement factor H correlates with intrinsic resilience, induced by inflammatory/oxidative stress, limits ROS and lipid peroxidation via ER-localized SCR20 domain, C3-independent; strong neuron-intrinsic resilience mechanism and subtype-relevant method, but MS not glaucoma.","seq":96}],"candidates":["proposal-rgc-intracellular-cfh"],"reviewed":true},{"id":"pubmed:42521027","title":"The human retina in Alzheimer's disease: Pathology, mechanisms, and biomarkers.","text":"Alzheimer's disease (AD) is characterized by progressive neurodegeneration and synaptic dysfunction that begins decades before clinical symptoms emerge. While AD research has traditionally focused on the brain, increasing evidence suggests that the retina undergoes pathological remodeling that shares features with cerebral changes. Advances in retinal imaging, including optical coherence tomography (OCT), OCT angiography, and hyperspectral approaches, have identified structural, vascular, and functional abnormalities in individuals with mild cognitive impairment (MCI) and early-stage AD. This supports the potential utility of the retina as a non-invasive biomarker for detecting neurodegenerative processes. Furthermore, postmortem studies have demonstrated accumulation of amyloid-β and phosphorylated tau, increased vulnerability of retinal ganglion cells (RGC), synaptic alterations in the inner plexiform layer (IPL), and significant activation of glial cells and complement-mediated inflammatory pathways. Melanopsin RGCs appear to be selectively affected, suggesting a mechanistic link between retinal pathology and the circadian or sleep disturbances commonly observed in AD. This review synthesizes human clinical data from imaging, histopathological, and proteomic studies supporting retinal involvement in AD, with emphasis on convergent mechanisms, including mitochondrial dysfunction, oxidative stress, microglial activation, and synaptic degeneration. Key limitations and sources of variation in current retinal biomarker studies, including cohort heterogeneity, comorbid ocular disease, and methodological variability, are discussed, and future directions are outlined to strengthen retinal diagnostics and therapeutic monitoring of visual system dysfunction in AD.","level":"ABSTRACT","snapshot":"sha256:9e69f661b79751181696b8fa32b405c5dc2ab1ac0928cb886aee5f933f546794","retrievedSeq":91,"root":"root-slot-2","notes":[{"text":"Review of retinal pathology in Alzheimer's disease; RGC vulnerability, IPL synaptic changes, glial/complement activation, selective melanopsin RGC involvement, mitochondrial/oxidative mechanisms; cross-disease analog for selective RGC vulnerability but not glaucoma or IOP; hypothesis-level.","seq":96}],"candidates":["proposal-rgc-intracellular-cfh"],"reviewed":true},{"id":"pubmed:42351640","title":"Glaucoma and Autoimmunity: Immunopathogenic Mechanisms and Emerging Immunomodulatory Therapies.","text":"Glaucoma is a chronic progressive optic neuropathy and one of the leading causes of irreversible blindness worldwide. Although elevated intraocular pressure remains the most important modifiable risk factor, increasing evidence suggests that immune dysregulation and autoimmune responses also contribute substantially to disease onset and progression. Clinical studies across different glaucoma subtypes have identified subtype-dependent immune abnormalities, including altered serum autoantibody profiles, dysregulated cytokine and chemokine expression, and changes in peripheral immune cell subsets. Experimental and translational studies further indicate that multiple immunopathogenic mechanisms are involved in glaucomatous neurodegeneration, including glial cell-mediated immune responses, activation of pattern recognition receptor signalling pathways, adaptive immune responses, and complement cascade dysregulation. These processes may interact to sustain chronic neuroinflammation, promote retinal ganglion cell injury, and accelerate optic nerve degeneration. Importantly, a better understanding of immune involvement in glaucoma has generated growing interest in immunomodulatory therapy as a potential strategy beyond intraocular pressure lowering. Targeting microglial activation, inflammatory signalling pathways, adaptive immune imbalance, and complement-mediated injury has shown neuroprotective potential in animal or in vitro models, whereas clinical evidence in glaucoma patients remains limited. These findings may provide preliminary directions for future therapeutic development. In this review, we summarise the current clinical evidence linking glaucoma with autoimmunity, discuss the major immune mechanisms implicated in disease pathogenesis, and highlight recent advances in immunomodulatory therapeutic strategies. Elucidating the immune basis of glaucoma may help pave the way for more precise and effective treatments for this complex optic neuropathy. We believe that immune dysregulation in glaucoma functions as a context-dependent amplifier of retinal ganglion cell injury rather than a uniform primary driver, with innate (microglia/astrocytes), adaptive (T/B cells, HSP-specific immunity), and complement pathways interacting to sustain neuroinflammation and neurodegeneration. This integrated immune response contributes to subtype- and stage-specific vulnerability, and targeting these maladaptive immune mechanisms represents a promising, precision-guided strategy for neuroprotection beyond intraocular pressure lowering.","level":"ABSTRACT","snapshot":"sha256:f6bec870ebc5d59ad388740fe1bc4bca5ab5606987594433e641a23eb5f1bd19","retrievedSeq":91,"root":"root-slot-2","notes":[{"text":"Review of glaucoma autoimmunity; subtype-dependent serum autoantibody, cytokine and immune-cell changes; glial, PRR, adaptive and complement mechanisms; positions immune dysregulation as context-dependent amplifier with subtype- and stage-specific vulnerability; narrative synthesis, clinical evidence limited.","seq":96}],"candidates":["proposal-rgc-intracellular-cfh"],"reviewed":true},{"id":"pubmed:42265670","title":"Dysregulation of neurovascular unit in the retina after optic nerve injury.","text":"PURPOSE: To investigate the changes in the neurovascular unit (NVU) of the retina in rats following optic nerve (ON) injury, and to explore the translational implications for traumatic optic neuropathy (TON).\nMETHODS: The ON transverse quantitative traction (ONTQT) was performed to establish the model of ON and retinal injury. The rats were divided into the sham operation group (SG) and the model group (MG). At 14th day post-modeling, flash visual evoked potential (FVEP) test was performed to evaluate the visual function. Transmission electron microscopy (TEM) was used to observe the microstructure of retinal NVU. RNA binding protein with multiple splicing (RBPMS) immunofluorescence was applied to detect the survival retinal ganglion cell (RGC). The activity of astrocytes and Müller cells in retina was detected by glial fibrillary acidic protein (GFAP) immunofluorescence. The expression of tight junction proteins (Claudin-1, Claudin-5) and glial end feet markers aquaporin-4 (AQP4) and inwardly rectifying potassium channel subtype 4.1 (Kir4.1) in retinal tissue were test by western blot and Quantitative Real-Time Polymerase Chain Reaction (qRT-PCR).\nRESULTS: At 14th day following ONTQT, the FVEP results exhibited the prolonged peak latency of P2 and the reduced amplitudes of N1-P1 and N2-P2. TEM showed structural changes of the basement membranes in NVU and ultrastructural abnormalities of tight junctions (TJs) after ONTQT. Besides, the expression of RBPMS in ganglion cell layer (GCL) was down-regulated and GFAP was over-expression in the injured retinal sections. The relative expressions of claudin-1and claudin-5 declined and the mRNA levels of AQP4 increased in the retina at 14 days following ONTQT. The mRNA levels of Kir4.1 was downregulated in the retina of MG.\nCONCLUSIONS: ONTQT can be applied in the model of ON and retina injury. The dysfunction of retinal NVU may promotes the optic degeneration in rats following ONTQT, contributing to the RGC loss and impaired visual function. These findings provide a mechanistic basis for NVU-targeted neuroprotection and identify potential clinical biomarkers for the diagnosis and treatment of TON.","level":"ABSTRACT","snapshot":"sha256:9ef351353c62bce23514d5307c6592177f8f72ea15202444f0cf345f3211e5eb","retrievedSeq":91,"root":"root-slot-2","notes":[{"text":"Rat optic nerve traction injury; FVEP latency/amplitude deficits, NVU basement membrane and tight-junction ultrastructure changes, RGC loss, GFAP upregulation, claudin-1/5 decreases, AQP4 up, Kir4.1 down; supports NVU/glia-barrier dysfunction in RGC loss but traumatic model, no subtype resolution.\n\nSynthesis: Across these abstracts, convergent themes are mitochondrial/bioenergetic failure (AKAP1, VDAC1-TRIM23, mtDNA haplotype, one-carbon metabolism, metabolic review), neuroinflammation and immune regulation (Treg tolerance, complement CFH, microglial STING, autoimmunity review), glial/ECM mechanobiology at the ONH (Caveolin-1, astrocyte subpopulations, integrin-collagen remodeling), and circuit-level excitability (inner retinal hyperactivity). Direct evidence for RGC subtype-selective vulnerability under chronic IOP stress is thin: the clearest subtype findings come from optic nerve crush (ONOFF \u003e ON vulnerability) and from non-glaucoma…","seq":96}],"candidates":["proposal-rgc-intracellular-cfh"],"reviewed":true},{"id":"pubmed:42774068","title":"SS31 protects damaged retinal cells through the AMPK/DRP1 signaling pathway.","text":"PURPOSE: Glaucoma is a group of neurodegenerative diseases characterized by progressive loss of retinal ganglion cells (RGCs) and optic nerve fibers. Mitochondrial dynamics contribute to the maintenance of neuronal homeostasis, and abnormalities can lead to the development of glaucoma. SS31 is a mitochondria-targeting short peptide that has been found to protect mitochondrial function and thereby protect damaged retina-associated cells. The aim of this study is to investigate whether SS31 protects damaged retinal cells by activating the AMPK/DRP1 pathway.\nMETHODS: The relationship between SS31 and oxidative stress was determined by live-cell imaging. The cells were inoculated in the well plate and treated with H2O2 (150 μM) for 24 h and pretreated with or without SS31 (100 nM), AICAR (17.5 μM), or dorsomorphin (7 μM) for 2 h. 3-(4,5-dimethylthiazol-2-yl)-2,5-diphenyltetrazolium bromide (MTT) and lactate dehydrogenase (LDH) were used to evaluate cell viability. Mitochondrial genetic stability was detected by droplet digital PCR. The expression of AMPK and DRP1 was detected by western blot. In addition, intraocular pressure and retinal thickness were evaluated in mice with acute ocular hypertension.\nRESULTS: SS31 inhibited H2O2-induced cell death of 661W through the AMPK signaling pathway and maintained mitochondrial genetic stability. SS31 regulates AMPK/Drp1 signaling in 661W cells after oxidative stress. SS31 reduced intraocular pressure and maintained normal retinal thickness in mice with acute ocular hypertension.\nCONCLUSIONS: SS31 regulates mitochondrial dynamic network remodeling by activating AMPK/DRP1 signaling pathway and protects retinal-related cells.","level":"ABSTRACT","snapshot":"sha256:59fe36f2964877da4b04aa600a49aa27c6720e8c9c3fa50a676950b61ad9d634","retrievedSeq":123,"root":"root-slot-3","notes":[{"text":"661W cell and acute ocular hypertension mouse study showing SS31 mitochondrial peptide acts via AMPK/DRP1, preserves mitochondrial genetic stability and retinal thickness and lowers IOP; photoreceptor-lineage cells and acute model limit RGC-specific and chronic-stress inference.","seq":128}],"candidates":["proposal-rgc-akap1-first","offspring-g3-slot-1-hypothesis","proposal-rgc-subtype-axon-compartment-gate-v1","proposal-rgc-subtype-mito-gate-v1","offspring-g2-slot-0-hypothesis","proposal-rgc-axonal-atp-complement-gate-v1"],"reviewed":true},{"id":"pubmed:42510642","title":"Biopolymer-Conjugated Human C-Peptide Provides Sustained Neuroprotection and Preserves Axonal Transport in a Mouse Model of NMDA-Induced Retinal Degeneration via Antioxidative Mechanisms.","text":"Glutamate excitotoxicity is a key contributor to the pathogenesis of glaucoma, a leading cause of irreversible blindness worldwide; however, the molecular events driving progressive retinal ganglion cell (RGC) loss and axonal degeneration remain incompletely understood, and effective neuroprotective therapies are lacking. Here, we evaluated the preventive potential of K9-C-peptide, a biopolymer-conjugated human C-peptide, in a mouse model of N-methyl-D-aspartate (NMDA)-induced retinal neurodegeneration and optic nerve axonal transport impairment, and examined potential mechanisms underlying its protective effects. In NMDA-induced excitotoxic mouse retinas, intracellular Ca2+ elevation mediated NMDA-induced oxidative stress, including both intracellular and mitochondrial reactive oxygen species (ROS) generation and lipid peroxidation. NMDA exposure induced activation of Müller glia and microglia and upregulation of inflammatory cytokines, ultimately leading to RGC death; these effects were attenuated by prolonged intraocular delivery of ROS scavengers. K9-C-peptide significantly reduced NMDA-induced retinal degeneration, including RGC loss and retinal thinning, and preserved optic nerve axonal transport function in both whole-mount retinas and optic nerve longitudinal sections. These protective effects were associated with suppression of NMDA-induced oxidative stress, mitochondrial dysfunction, and inflammation and reactive gliosis, without altering intracellular Ca2+ levels. Notably, sustained intraocular delivery of human C-peptide conferred robust neuroprotection for at least 3 weeks against NMDA-induced retinal degeneration and optic nerve axonal transport impairment. These findings suggest that K9-C-peptide acts as a long-acting neuroprotective agent that mitigates oxidative stress-driven retinal damage and axonal dysfunction, highlighting its translational potential as a C-peptide-based neuroprotective strategy for retinal glutamate excitotoxicity.","level":"ABSTRACT","snapshot":"sha256:cc1900873f1ae0e02f11bcdd1cf1f44d0982c8f2869cc5f67a4058ceaa388f69","retrievedSeq":123,"root":"root-slot-3","notes":[{"text":"mouse NMDA study showing K9-C-peptide reduces RGC loss and retinal thinning, preserves optic nerve axonal transport, and suppresses oxidative stress, mitochondrial dysfunction, gliosis and inflammation without altering Ca2+; supports axonal-transport readouts as a protective endpoint, but excitotoxic rather than chronic IOP stress and no subtype comparison.","seq":128}],"candidates":["proposal-rgc-akap1-first","offspring-g3-slot-1-hypothesis","proposal-rgc-subtype-axon-compartment-gate-v1","proposal-rgc-subtype-mito-gate-v1","offspring-g2-slot-0-hypothesis","proposal-rgc-axonal-atp-complement-gate-v1"],"reviewed":true},{"id":"pubmed:42468646","title":"Transient ocular hypertension drives delayed and IOP-independent retinal neurodegeneration.","text":"Glaucoma is a leading global cause of irreversible blindness, traditionally managed by controlling intraocular pressure (IOP). However, some patients continue to exhibit progressive visual decline despite successful IOP reduction, and the underlying pathological mechanisms remain elusive. To investigate this, we utilized a reversible ocular hypertension (OHT) rat model via anterior chamber silicone oil (SO) injection and subsequent aspiration. After one month of induced hypertension, IOP was fully normalized following SO aspiration. Visual function was longitudinally monitored for up to 6 months post-normalization using electrophysiological and behavioral assays. Corresponding pathological changes were assessed via immunofluorescence, H\u0026E staining, transmission electron microscopy, and anterograde tracing. Additionally, Thy1-GFP transgenic mice were used to visualize the integrity of retinal ganglion cells (RGCs). Our findings reveal a biphasic progression of glaucomatous damage, transitioning from an early IOP-dependent phase to a late IOP-independent phase. Although IOP normalization partially rescues early visual function, a delayed deterioration emerges in the later stages. This late-stage decline is accompanied by persistent, non-IOP-dependent secondary factors following the relief of primary mechanical stress, including progressive RGCs loss, impaired axonal transport, persistent glial scarring, synaptic pruning, and dendritic atrophy. These results indicate that transient early IOP elevation induces long-term, delayed neurodegenerative changes, which ultimately compromise sustained functional recovery. Collectively, this study provides novel experimental evidence and identifies potential therapeutic targets, offering new insights into addressing glaucoma as a chronic, IOP-independent neurodegenerative disease and a universal clinical challenge.","level":"ABSTRACT","snapshot":"sha256:c2152e91f90b44011bfc50776dcec0c8c0aff408bb933965369774645cb05ab1","retrievedSeq":123,"root":"root-slot-3","notes":[{"text":"rat silicone-oil ocular hypertension with subsequent normalization plus Thy1-GFP mice, reporting biphasic damage with a late IOP-independent phase featuring progressive RGC loss, impaired axonal transport, persistent glial scarring, synaptic pruning and dendritic atrophy; directly supports delayed non-pressure mechanisms after transient stress, though not subtype-specific.","seq":128}],"candidates":["proposal-rgc-akap1-first","offspring-g3-slot-1-hypothesis","proposal-rgc-subtype-axon-compartment-gate-v1","proposal-rgc-subtype-mito-gate-v1","offspring-g2-slot-0-hypothesis","proposal-rgc-axonal-atp-complement-gate-v1"],"reviewed":true},{"id":"pubmed:42401758","title":"Mitochondrial insufficiencies and neuroprotection in glaucoma.","text":"PURPOSE: Antihypertensive management has long been the mainstay of treatment for glaucoma. Despite contemporary treatments, many patients still experience disease progression, with some ultimately losing vision. The purpose of this review is to demonstrate how derangements in mitochondrial biology underpin the pathophysiology of glaucoma, and to explore emerging therapeutic options.\nMETHODS: Literature searches were performed using multiple databases, aiming to identify recent developments in the scientific knowledge surrounding mitochondrial biology and glaucoma. Key words used in the primary literature search included combinations of \"glaucoma\", \"mitochondria\", \"oxidative stress\", \"metabolism\", \"inflammation\", \"transport\" and \"genetics\". Additional database searches were performed to further explore specific details identified in the primary search.\nRESULTS: Recent research points to mitochondrial insufficiencies as a primary culprit in the pathophysiology of glaucoma. Dysfunction of mitochondria occurs in a multitude of ways, and is an integral component of neuroinflammation, metabolic compromise, and disruption of axonal transport. This in part results from accumulated genetic factors, leading to generation of superoxides that damage retinal ganglion cells resulting in neurodegeneration of the optic nerve. Defects in mitochondrial biology among a range of ocular cell types contribute to the progression of glaucoma. With this understanding, emerging treatments targeting mitochondria, including gene therapies, tunneling nanotubules, and pharmacotherapeutics which enhance mitochondrial function and reduce oxidative stress, are likely the future of glaucoma management.\nCONCLUSION: By targeting mitochondrial insufficiencies as a root cause of glaucoma in addition to managing intraocular pressure, this new approach offers hope for preventing vision loss and potentially curing glaucoma.","level":"ABSTRACT","snapshot":"sha256:85bba512bcb36c950fc20a95a6952343134b473c14cec4cce2da4c3a0ef505c9","retrievedSeq":123,"root":"root-slot-3","notes":[{"text":"review asserting mitochondrial insufficiency as a primary node linking neuroinflammation, metabolic compromise and axonal transport disruption across ocular cell types, with gene therapy and pharmacotherapy proposals; syntheses only, no subtype data, and causal primacy is asserted rather than demonstrated.","seq":128}],"candidates":["proposal-rgc-akap1-first","offspring-g3-slot-1-hypothesis","proposal-rgc-subtype-axon-compartment-gate-v1","proposal-rgc-subtype-mito-gate-v1","offspring-g2-slot-0-hypothesis","proposal-rgc-axonal-atp-complement-gate-v1"],"reviewed":true},{"id":"pubmed:42296909","title":"Neuroinflammation and mononuclear phagocytes in glaucoma: From ocular pathogenesis to central visual pathway involvement - A comprehensive review.","text":"Glaucoma is a chronic and progressive optic neuropathy representing one of the leading causes of irreversible blindness worldwide. While intraocular pressure reduction remains the only validated treatment, it is insufficient to halt disease progression in all cases. Neuroinflammation has emerged as a pivotal mediator underlying the onset and progression of retinal ganglion cell and axonal degeneration in glaucomatous disease. This review synthesizes current data on the role of resident immune cells in the retina and optic nerve head, describing their activation mechanisms and functional phenotypes. It also addresses the contribution of infiltrating circulating monocytes to the amplification of the local inflammatory response. These findings open novel therapeutic perspectives based on immunomodulation, including targeting of the NLRP3 inflammasome, TNF-α, TLRs, P2X7 receptor, APOE/TREM2 axis, and modulation of the microglial M1/M2 phenotypic balance. Taken together, this body of work argues for a broader, integrated view of glaucoma as a neuroinflammatory disease of the visual pathways, justifying the development of neuroprotective strategies targeting innate immunity. Beyond ocular structures, experimental data from rodent and non-human primate models, as well as clinical brain imaging data, demonstrate that neuroinflammation extends throughout the central visual pathways (retrobulbar optic nerve, lateral geniculate nucleus, superior colliculus, and visual cortex). This retinotopically organized central glial activation may drive neuronal degeneration and foster its contralateral propagation, though whether peripheral macrophage infiltration into the central visual pathways plays any role remains to be investigated.","level":"ABSTRACT","snapshot":"sha256:48ec596a1aed1e13d280cce549dd1932e651d4af9ccc52cec07ea7a05bbdee31","retrievedSeq":123,"root":"root-slot-3","notes":[{"text":"review of innate immune cells, infiltrating monocytes and central visual pathway glial activation in glaucoma, naming NLRP3, TNF-α, TLRs, P2X7 and APOE/TREM2 as modifiable nodes and flagging peripheral infiltration into central pathways as untested; supports neuroimmune competition but not subtype selectivity.","seq":128}],"candidates":["proposal-rgc-akap1-first","offspring-g3-slot-1-hypothesis","proposal-rgc-subtype-axon-compartment-gate-v1","proposal-rgc-subtype-mito-gate-v1","offspring-g2-slot-0-hypothesis","proposal-rgc-axonal-atp-complement-gate-v1"],"reviewed":true},{"id":"pubmed:42255937","title":"Synaptic alterations are preceding the axonal loss in optic atrophy of Wolfram syndrome mouse model.","text":"BACKGROUND: Wolfram syndrome is a rare autosomal recessive disorder characterized by antibody-negative early-onset diabetes mellitus, optic atrophy, sensorineural hearing loss, arginine-vasopressin deficiency, and progressive neurodegeneration of the brainstem and cerebellum. It is caused primarily by pathogenic variants in the WFS1 gene, which encodes a transmembrane endoplasmic reticulum-resident protein involved in the unfolded protein response and cellular calcium homeostasis. Although multiple rodent models of Wolfram syndrome have been developed and shown to exhibit visual defects, some studies have reported significant vision loss prior to any detectable axonal degeneration or myelin abnormalities, and the mechanisms underlying these early visual deficits remain poorly understood.\nOBJECTIVE: Recent in vitro studies have demonstrated altered synaptic contacts and aberrant neurite morphology in WFS1-deficient cerebral organoids and human iPSC-derived neurons, respectively. These findings prompted us to investigate, for the first time in vivo, whether synaptic and dendritic abnormalities occur in the retina of Wfs1 knockout mice.\nMETHODS: Using confocal microscopy, we examined retinal and optic nerve histology in Wfs1 knockout mice at 4 and 7 months of age.\nRESULTS: Our analysis reveals progressive synaptic alterations in the inner plexiform layer, driven by early presynaptic compartment failure. These changes represent the earliest detectable phenotype associated with vision loss in this model and precede overt axonal degeneration.\nCONCLUSION: These findings identify early synaptic preservation as a promising therapeutic target for vision loss in Wolfram syndrome.","level":"ABSTRACT","snapshot":"sha256:92ac5ba044b18c89482c6d15502eefa208443b522bf52f988d4b4f3b487ad2de","retrievedSeq":123,"root":"root-slot-3","notes":[{"text":"Wfs1 knockout mouse study reporting progressive inner plexiform layer synaptic alterations from early presynaptic failure preceding overt axonal degeneration; relevant as a synapse-first degeneration precedent, but a rare monogenic optic atrophy model rather than glaucoma or IOP stress.","seq":128}],"candidates":["proposal-rgc-akap1-first","offspring-g3-slot-1-hypothesis","proposal-rgc-subtype-axon-compartment-gate-v1","proposal-rgc-subtype-mito-gate-v1","offspring-g2-slot-0-hypothesis","proposal-rgc-axonal-atp-complement-gate-v1"],"reviewed":true},{"id":"pubmed:42214787","title":"Histopathologic Findings and Knowledge Gaps in Glaucomatous Neurodegeneration.","text":"Glaucoma is the leading cause of irreversible blindness globally, characterized by progressive retinal ganglion cell (RGC) dysfunction and death, resulting in optic nerve head remodeling and optic nerve degeneration. Although substantial progress has been made in understanding basic mechanisms of glaucomatous neurodegeneration in animal models, significant knowledge gaps remain regarding the histopathologic substrate of this disease in human tissue. This review synthesizes current understanding of established histopathologic findings in glaucomatous eyes, including RGC degeneration, synaptic pathology, axonal transport dysfunction, lamina cribrosa remodeling, glial cell responses, extracellular matrix changes, and structure-function relationships. It ends by identifying major gaps in knowledge regarding cellular heterogeneity in RGC vulnerability, circuit-level retinal remodeling, temporal sequence of pathologic events, functional consequences of astrocyte and microglial activation, and mechanisms linking structural pathology to functional vision loss. Addressing these gaps requires integrated approaches combining classical histology with modern molecular profiling, greater access to human postmortem tissue with rigorous disease staging, and systematic investigation of RGC subtype-specific pathology in the human retina and optic nerve.","level":"ABSTRACT","snapshot":"sha256:dd0a33ea9e4895f87dbae4a4aed693a726939790a76ec91dfc4b6b5588b88153","retrievedSeq":123,"root":"root-slot-3","notes":[{"text":"review of human glaucomatous histopathology covering RGC degeneration, synaptic pathology, axonal transport dysfunction, lamina cribrosa remodeling and glial/ECM changes, and explicitly names cellular heterogeneity in RGC vulnerability and subtype-specific pathology as major knowledge gaps requiring human tissue and molecular profiling; strongest direct statement that subtype-resolved causal data are missing.","seq":128}],"candidates":["proposal-rgc-akap1-first","offspring-g3-slot-1-hypothesis","proposal-rgc-subtype-axon-compartment-gate-v1","proposal-rgc-subtype-mito-gate-v1","offspring-g2-slot-0-hypothesis","proposal-rgc-axonal-atp-complement-gate-v1"],"reviewed":true},{"id":"pubmed:42007085","title":"Lipidomic dataset of optic nerves from the silicone oil-induced ocular hypertension mouse model.","text":"Glaucoma is characterized by progressive degeneration of retinal ganglion cells and their optic-nerve axons, with elevated intraocular pressure (IOP) as a major risk factor for retinal ganglion cell death. Lipids are essential to axonal structure and signalling, yet optic nerve lipidomic datasets under high IOP are limited. We present a stage-specific lipidomic dataset from a mouse model of silicone oil (SO)-induced ocular hypertension (high IOP) with contralateral balanced salt solution (BSS)-injected controls. Optic nerves from high-IOP eyes and matched contralateral controls were harvested at 2 weeks and 8 weeks post-injection to represent early and established optic nerve degeneration, with n = 6 per time point (3 males, 3 females). Lipids were extracted by a modified Bligh Dyer protocol and profiled by untargeted LC-MS/MS on a Vanquish Horizon ultrahigh performance liquid chromatography (UHPLC) coupled to a Thermo Q Exactive Orbitrap. Raw files were processed in LipidSearch 5.1, and statistical analysis was conducted through MetaboAnalyst 6.0. This data is available through Metabolomics Workbench, Study ID: ST004446.","level":"ABSTRACT","snapshot":"sha256:c818768e757620857f3551e3b9b47213fafa49fb5339f0f34ca722dc117a717f","retrievedSeq":123,"root":"root-slot-3","notes":[{"text":"dataset descriptor for stage-specific optic nerve lipidomics (2 and 8 weeks) in silicone-oil ocular hypertension mice with contralateral BSS controls, n=6 per time point; enables lipid-metabolism hypotheses but contains no findings or subtype analysis in the abstract.","seq":128}],"candidates":["proposal-rgc-akap1-first","offspring-g3-slot-1-hypothesis","proposal-rgc-subtype-axon-compartment-gate-v1","proposal-rgc-subtype-mito-gate-v1","offspring-g2-slot-0-hypothesis","proposal-rgc-axonal-atp-complement-gate-v1"],"reviewed":true},{"id":"pubmed:41952895","title":"Pulsed synchrony regulation of intraocular and cerebrospinal fluid pressure: a novel paradigm for glaucoma pathogenesis and treatment.","text":"Glaucoma, the leading cause of irreversible blindness worldwide, is characterized by the progressive loss of retinal ganglion cells (RGCs) and their axons. While elevated intraocular pressure (IOP) is a core risk factor, the pathogenesis of normal-tension glaucoma (NTG) remains unclear, as static IOP is within the normal range. Based on circadian fluctuations of IOP and cerebrospinal fluid pressure (CSFP), and the pressure-dependent function of the ocular glymphatic system, we propose the \"dynamic trans-lamina cribrosa pressure difference (TLCPD) imbalance\" hypothesis. This hypothesis posits that optic nerve damage may stem from abnormal pulse synchrony between IOP and CSFP (phase mismatch, amplitude mismatch, or abnormal frequency) rather than static TLCPD elevation alone, pending further validation. Dynamic imbalance induces RGC injury through dual mechanisms: mechanical stress on the lamina cribrosa (collagen fiber rupture, astrocyte activation) and metabolic dysfunction (ocular glymphatic clearance impairment, toxic waste accumulation), which ultimately converge on the activation of the programmed axonal degeneration (PAD) pathway-a conserved final common effector of RGC axon loss. Phase mismatch is the core pathological pattern in NTG. In contrast, high-tension primary open-angle glaucoma (POAG) is characterized mainly by amplitude mismatch and abnormal frequency, with potential coexistence and mutual influence of these mechanisms. Verifiable clinical (24-h IOP-CSFP synchronous monitoring) and animal experiments are proposed. This hypothesis may help explain unresolved clinical phenomena, provides novel diagnostic markers (a transient peak in TLCPD) and therapeutic strategies (CSFP regulation, glymphatic function enhancement, modulation of the PAD pathway), and opens new avenues for personalized glaucoma management.","level":"ABSTRACT","snapshot":"sha256:cbfcbb8cd5c54541dbc1e02bae173b057e2e26e537609fef5fe2e84e3eee68c1","retrievedSeq":123,"root":"root-slot-3","notes":[{"text":"proposes a dynamic trans-lamina cribrosa pressure difference hypothesis attributing normal-tension glaucoma to IOP-CSFP pulse phase mismatch versus amplitude mismatch in high-tension POAG, converging on lamina cribrosa stress, glymphatic clearance failure and programmed axonal degeneration; explicitly pending validation and untested.","seq":128}],"candidates":["proposal-rgc-akap1-first","offspring-g3-slot-1-hypothesis","proposal-rgc-subtype-axon-compartment-gate-v1","proposal-rgc-subtype-mito-gate-v1","offspring-g2-slot-0-hypothesis","proposal-rgc-axonal-atp-complement-gate-v1"],"reviewed":true},{"id":"pubmed:41929135","title":"Synaptic Alterations Are Preceding the Axonal Loss in Optic Atrophy of Wolfram Syndrome Mouse Model.","text":"Wolfram syndrome is a rare autosomal recessive disorder characterized by antibody-negative early-onset diabetes mellitus, optic atrophy, sensorineural hearing loss, arginine-vasopressin deficiency, and progressive neurodegeneration of the brainstem and cerebellum. It is caused primarily by pathogenic variants in the WFS1 gene, which encodes a transmembrane endoplasmic reticulum-resident protein involved in the unfolded protein response and cellular calcium homeostasis. Although multiple rodent models of Wolfram syndrome have been developed and shown to exhibit visual defects, some studies have reported significant vision loss prior to any detectable axonal degeneration or myelin abnormalities, and the mechanisms underlying these early visual deficits remain poorly understood. Recent in vitro studies have demonstrated altered synaptic contacts and aberrant neurite morphology in WFS1-deficient cerebral organoids and human iPSC-derived neurons, respectively. These findings prompted us to investigate, for the first time in vivo, whether synaptic and dendritic abnormalities occur in the retina of Wfs1 knockout mice. Using confocal microscopy, we examined retinal and optic nerve histology in Wfs1 knockout mice at 4 and 7 months of age. Our analysis reveals progressive synaptic alterations in the inner plexiform layer, driven by early presynaptic compartment failure. These changes represent the earliest detectable phenotype associated with vision loss in this model and precede overt axonal degeneration.","level":"ABSTRACT","snapshot":"sha256:0ccdfcf8351ff7eceb7233d57dfb6c4ea660ee997eab74fb62ab95d2777f3079","retrievedSeq":123,"root":"root-slot-3","notes":[{"text":"duplicate abstract of the Wfs1 knockout synaptic-before-axonal study (same content as pubmed:42255937 under a different ID); same limits: monogenic optic atrophy model, no IOP stress, no subtype comparison.\nSynthesis: convergent across independent designs is that RGC/axonal loss is not explained by IOP alone: pressure-independent adaptive immune intolerance (42780315), late IOP-independent degeneration after transient ocular hypertension (42468646), and mitochondrial/synaptic resilience nodes (42893477, 42872912, 42774068, 42401758) all point to cell-intrinsic metabolic state plus glial/immune amplification. Competing emphases are cell-intrinsic mitochondrial bioenergetics (AKAP1, SIRT1, SS31/AMPK-DRP1), astrocyte mechanobiology and lamina cribrosa remodeling (42908589, 41952895, 42214787), inhibitory-circuit hyperactivity (42839614), innate/adaptive neuroinflammation (42296909, 42780315, 42801048) and tau-microglial phagocytic injury (…","seq":128}],"candidates":["proposal-rgc-akap1-first","offspring-g3-slot-1-hypothesis","proposal-rgc-subtype-axon-compartment-gate-v1","proposal-rgc-subtype-mito-gate-v1","offspring-g2-slot-0-hypothesis","proposal-rgc-axonal-atp-complement-gate-v1"],"reviewed":true}],"events":[{"seq":18,"kind":"plan","title":"制定文献检索计划","detail":"","root":"root-slot-0","candidate":""},{"seq":23,"kind":"search","title":"文献检索完成","detail":"30 条来源快照","root":"root-slot-0","candidate":""},{"seq":28,"kind":"source","title":"文献解读完成","detail":"","root":"root-slot-0","candidate":""},{"seq":29,"kind":"source","title":"生成资料已准备","detail":"","root":"root-slot-0","candidate":""},{"seq":34,"kind":"candidate","title":"初始假说已生成","detail":"","root":"root-slot-0","candidate":""},{"seq":35,"kind":"candidate","title":"新假说已发布","detail": function liveEventMeta(ev){

 if(ev.kind==='search')return ['文献检索','新一批来源快照已保存，可以打开文献查看'];

 if(ev.kind==='plan')return ['检索计划','研究检索方向已记录'];
 if(ev.kind==='reflection')return ['科学假说评议','已完成对候选主张和实验可检验性的模型评议'];
 if(ev.kind==='review')return ['候选审查','已提交候选的前置审查记录'];
 if(ev.kind==='candidate')return ['假说生成','新候选已经发布，可以立即查看机制与实验预测'];
 if(ev.kind==='final')return ['完成研究','本次正式选择已保存，其他候选也可以继续阅读'];
 return ['研究进展',ev.title||'新的科学事件已保存'];
}

 return `<div class="workspaceGrid"><section class="panel listPanel"><div class="panelHeading"><div class="row spread"><h3>候选假说</h3><span class="smallPill">${f.cs.length} 条</span></div><p>${final?'按本次模型排序排列':'按实际生成顺序排列'}</p></div><div class="panelControl"><input class="searchInput" data-control="hyp-search" value="${E(state.hSearch)}" placeholder="搜索机制、标题或关键词…" aria-label="搜索候选假说"><div class="filterPills">${[['all','全部'],['initial','初始假说'],['descendants','演化候选'],['reviewed','评议完成']].map(([k,l])=>`<button class="filterBtn ${state.hFilter===k?'active':''}" data-action="filter-h" data-id="${k}">${l}</button>`).join('')}</div></div><div class="listScroll" id="hyp-list">${cs.length?cs.map(x=>`<div class="candidateItem ${x.id===state.selected?'selected':''}" data-action="select-candidate" data-id="${E(x.id)}" role="button" tabindex="0"><div class="itemTop"><span class="numMark">${final?`#${x.order} · `:''}G${x.g}</span><span class="smallPill ${x.id===d.final.winnerId&&final?'green':'outline'}">${x.id===d.final.winnerId&&final?'本次推荐':reviewsReady(d,x).length?'已评议':'评议待完成'}</span></div><h4 class="english">${E(x.title)}</h4><p class="english">${E(x.summary||x.claim)}</p><div class="itemBottom"><span>${final?`${x.matches} 次比较 · μ ${x.score?.mu?.toFixed(1)??'—'}`:`已提交 · 事件 ${x.createdSeq}`}</span><label class="checkCompare" data-navigate="stop"><input type="checkbox" data-control="compare" value="${E(x.id)}" ${state.compare.includes(x.id)?'checked':''} aria-label="比较 ${E(x.title)}"> 比较</label></div></div>`).join(''):`<div class="emptyState">没有符合条件的假说。<button class="linkBtn" data-action="reset-h">清除筛选</button></div>`}</div><div class="compareStrip"><span>已选择 <b>${state.compare.length}/2</b> 条假说</span><button class="button narrow ${state.compare.length===2?'primary':''}" data-action="show-compare" ${state.compare.length===2?'':'disabled'}>${I('compare','sm')} 并排比较</button></div></section><section class="panel reading">${c?candidateDetailHTML(d,c,final):`<div class="emptyState"><h3>当前还没有已发布的假说</h3><p>文献检索与来源解读完成后，新假说将逐条出现。</p><button class="button" data-action="tab" data-id="sources">先查看文献</button></div>`}</section></div>`;}
function listHTML(items,limit=3){if(!items?.length)return `<p class="muted">未记录</p>`;let arr=items.slice(0,limit);return `<ol class="scienceList english">${arr.map(x=>`<li>${E(x)}</li>`).join('')}</ol>`+(items.length>limit?`<details class="detailDisclosure"><summary>查看其余 ${items.length-limit} 条原文</summary><div class="disclosureBody"><ol class="scienceList english" start="${limit+1}">${items.slice(limit).map(x=>`<li>${E(x)}</li>`).join('')}</ol></div></details>`:'')}
function candidateDetailHTML(d,c,final){const ready=reviewsReady(d,c),ref=ready.at(-1),sources=c.sourceIds.filter(id=>visibleSources(d).some(s=>s.id===id)),parentMap=candidateMap(d),noteKey=`${d.runId}:${c.id}:${c.contentHash||'unknown'}`;const note=savedNotes[noteKey]||{status:'undecided',text:''};let sourceRows=d.sources.filter(x=>sources.includes(x.id)).slice(0,4);const actualWinner=final&&c.id===d.final.winnerId;
 return `<div class="readingHeader"><div class="tinyMeta"><span class="smallPill green">G${c.g} · ${c.g===0?'初始假说':'演化候选'}</span>${actualWinner?'<span class="smallPill warm">本次推荐候选</span>':''}<span class="smallPill outline">${ready.length?'评议已完成':'等待模型评议'}</span></div><h2 class="english">${E(c.title)}</h2><div class="tinyMeta"><span class="caption">候选 ${E(c.id)}</span><span class="caption">·</span><span class="caption">${final?`模型排序 #${c.order}`:`发布于事件 ${c.createdSeq}`}</span></div></div><div class="readingBody"><section class="readingSection"><h3>核心科学主张</h3><p class="leadBox english">${E(c.claim)}</p></section><section class="readingSection"><h3>机制链</h3>${listHTML(c.mechanism,3)}<details class="detailDisclosure"><summary>前提假设 · ${c.assumptions.length} 条</summary><div class="disclosureBody">${listHTML(c.assumptions,c.assumptions.length)}</div></details></section><section class="readingSection"><h3>可检验预测</h3>${listHTML(c.predictions,2)}</section><section class="readingSection"><h3>证伪条件</h3>${listHTML(c.falsifiers,2)}</section><section class="readingSection"><div class="row spread" style="margin-bottom:11px"><h3 style="margin:0">模型评议</h3>${ref?`<span class="caption">${ref.critiques.length} 条评议意见</span>`:''}</div>${ref?`<div class="topicNote">展示原始模型评价，不代表实验验证。</div>${listHTML(ref.critiques,3)}<details class="detailDisclosure"><summary>查看完整评议维度</summary><div class="disclosureBody">${[['plausibility','机制合理性'],['prior_research','已有研究'],['testability','可检验性'],['originality','创新性'],['unjustified_complexity','机制复杂性']].map(([k,l])=>`<div style="margin-bottom:16px"><b style="font-size:12px">${l}</b><p class="english" style="margin-top:7px">${E(ref[k]||'未记录')}</p></div>`).join('')}</div></details>`:`<p class="muted">当前历史边界尚未提交该候选的评议记录。</p>`}</section><section class="readingSection"><div class="row spread" style="margin-bottom:10px"><h3 style="margin:0">生成参考文献</h3><button class="linkBtn" data-action="sources-for" data-id="${E(c.id)}">查看全部 ${sources.length} 篇 ${I('arrow','sm')}</button></div><p class="topicNote">以下是生成时使用或从父代继承的资料背景，并非逐项主张的证实依据。</p>${sourceRows.map(s=>`<button class="referenceRow" data-action="open-source" data-id="${E(s.id)}"><span class="smallPill">${E(s.id.replace('pubmed:','PMID '))}</span><strong class="english">${E(s.title)}</strong>${I('arrow','sm')}</button>`).join('')||'<p class="muted">此边界尚无可读取来源。</p>'}</section><section class="readingSection"><h3>比较与模型排序</h3>${final?`<div class="inlineCards"><div class="miniBox"><small>本次模型排序位置</small><strong>#${c.order}</strong></div><div class="miniBox"><small>决定性比较</small><strong>${c.matches} 次</strong></div><div class="miniBox"><small>评分位置估计 μ</small><strong>${c.score?c.score.mu.toFixed(2):'—'}</strong></div><div class="miniBox"><small>评分不确定参数 σ</small><strong>${c.score?c.score.sigma.toFixed(2):'—'}</strong></div></div><p class="topicNote" style="margin-top:13px">当前阅读快照未包含逐次比较的裁决理由。查看完整 Native Trace 后方可展开每次比较。</p>`:`<p class="muted">该历史边界的逐次评分不在当前阅读快照中。</p>`}</section><section class="readingSection"><h3>演化关系</h3>${c.parents.length?`<p class="topicNote">由以下科学父代产生，点击可查看其原始假说。</p>${c.parents.map(id=>parentMap.get(id)?`<button class="parentPill english" data-action="candidate" data-id="${E(id)}">G${parentMap.get(id).g} · ${E(parentMap.get(id).title)} ${I('arrow','sm')}</button>`:'').join('')}`:`<p class="muted">G0 初始假说，没有科学父代。</p>`}</section><section class="readingSection"><h3>我的审阅</h3><div class="notesCard"><label>这条假说值得继续研究吗？</label><div class="choicebar">${Object.entries(choiceLabels).map(([k,v])=>`<button class="choiceBtn ${note.status===k?'active':''}" data-action="note-status" data-id="${k}">${v}</button>`).join('')}</div><label for="candidateNote">记录下一步想确认的问题</label><textarea id="candidateNote" data-note-key="${E(noteKey)}" placeholder="例如：优先检验哪个因果环节？">${E(note.text||'')}</textarea><div class="row spread" style="margin-top:9px"><span class="caption">仅属于个人阅读记录</span><button class="button narrow primary" data-action="save-note" data-id="${E(noteKey)}">保存审阅</button></div></div></section></div>`;}
function sourcesHTML(d,f){let ss=f.ss;const candidate=visibleCandidates(d).find(x=>x.id===state.selected);if(state.sFilter==='candidate'&&candidate)ss=ss.filter(x=>candidate.sourceIds.includes(x.id));if(state.sSearch.trim()){const q=state.sSearch.trim().toLowerCase();ss=ss.filter(x=>(x.title+' '+x.id+' '+x.text).toLowerCase().includes(q));}if(!ss.some(x=>x.id===state.selectedSource))state.selectedSource=ss[0]?.id||null;let s=ss.find(x=>x.id===state.selectedSource);
 return `<div class="sourceSummary"><span><b>${f.returnedUnique}</b> 返回独立文献</span><span><b>${f.ss.length}</b> 已保存摘要</span><span><b>${f.reviewedUnique}</b> 已完成模型解读</span></div><div class="workspaceGrid"><section class="panel listPanel"><div class="panelHeading"><div class="row spread"><h3>已保存来源</h3><span class="smallPill">${f.ss.length} 篇</span></div><p>按文献身份去重 · 保存的摘要快照</p></div><div class="panelControl"><input class="searchInput" value="${E(state.sSearch)}" data-control="source-search" aria-label="搜索文献" placeholder="搜索标题、PMID、摘要…"><div class="filterPills"><button class="filterBtn ${state.sFilter==='all'?'active':''}" data-action="filter-s" data-id="all">全部来源</button><button class="filterBtn ${state.sFilter==='candidate'?'active':''}" data-action="filter-s" data-id="candidate" ${candidate?'':'disabled'}>当前假说参考</button></div></div><div class="listScroll">${ss.length?ss.map(x=>`<button class="sourceRow ${s?.id===x.id?'selected':''}" data-action="select-source" data-id="${E(x.id)}"><h4 class="english">${E(x.title)}</h4><span class="srcSub"><span>${E(x.id.replace('pubmed:','PMID '))}</span><span>${x.level==='ABSTRACT'?'摘要':'题录'}</span><span>${x.candidates.filter(id=>f.cs.some(c=>c.id===id)).length} 个候选关联</span></span></button>`).join(''):`<div class="emptyState">没有符合条件的文献。<button class="linkBtn" data-action="reset-s">清除筛选</button></div>`}</div></section><section class="panel reading sourceDetail">${s?sourceDetailHTML(d,s):`<div class="emptyState">当前没有可显示的文献。</div>`}</section></div>`;}
function sourceDetailHTML(d,s){const notes=(s.notes||[]).filter(n=>n.seq<=seq(d));const cmap=candidateMap(d);const related=s.candidates.filter(id=>visibleCandidates(d).some(c=>c.id===id));return `<div class="readingHeader"><div class="sourceMeta"><span class="smallPill green">${s.level==='ABSTRACT'?'已保存摘要':'已保存题录'}</span><span class="smallPill">${E(s.id.replace('pubmed:','PMID '))}</span></div><h2 class="english">${E(s.title)}</h2><div class="row spread" style="margin-top:13px;gap:12px"><span class="caption">本次保存的文献快照 · 事件 ${s.retrievedSeq}</span><a class="button narrow" href="https://pubmed.ncbi.nlm.nih.gov/${E(s.id.replace('pubmed:',''))}/" target="_blank" rel="noopener noreferrer">查看 PubMed ${I('external','sm')}</a></div></div><div class="readingBody"><section class="readingSection"><h3>当时保存的摘要</h3><p class="english">${E(s.text||'此快照只含题录，未保存摘要。')}</p></section><section class="readingSection"><h3>模型的文献解读</h3>${notes.length?notes.slice(0,3).map(x=>`<div class="sourceNote english">${E(x.text)}</div>`).join(''):`<p class="muted">当前历史边界未记录这篇文献的模型解读。</p>`}${notes.length>3?`<details class="detailDisclosure"><summary>还有 ${notes.length-3} 段解读记录</summary><div class="disclosureBody">${notes.slice(3).map(x=>`<p class="english">${E(x.text)}</p>`).join('')}</div></details>`:''}<p class="topicNote">模型解读来自原有来源审阅文本，不代表文献直接证实某条假说。</p></section><section class="readingSection"><h3>哪些假说使用过这份资料</h3>${related.length?related.slice(0,8).map(id=>{const c=cmap.get(id);return `<button class="sourceRelated english" data-action="candidate" data-id="${E(id)}">${E(c.title)}<small>G${c.g} · ${c.g?'来自父代的资料背景':'初始生成资料'}</small></button>`}).join(''):'<p class="muted">暂未关联已发布候选。</p>'}${related.length>8?`<p class="caption">以及另外 ${related.length-8} 条候选</p>`:''}</section></div>`;}
function processHTML(d,f){const q=seq(d), phases=[['准备文献',0],['G0 初始假说',135],['G1 改进假说',224],['G2 改进假说',294],['G3 改进假说',364],['完成执行',d.final.boundary]];let events=d.events.filter(x=>x.seq<=q);if(state.processFilter!=='all')events=events.filter(x=>x.kind===state.processFilter||(state.processFilter==='candidate'&&x.kind==='final'));events=[...events].reverse();const show=events.slice(0,state.activityLimit);
 return `<div class="processLayout"><section class="panel processSide"><div class="eyebrow">RESEARCH JOURNEY</div><h3 style="margin-top:9px">研究里程碑</h3>${phases.map(([k,s],i)=>`<div class="processGroup"><b style="${q<s?'color:#a5afb8':''}">${E(k)}</b><p>${q>=s?'已有记录':'尚未到达'}</p></div>`).join('')}<div class="processDetail">${d.stats.roots} 组初始检索任务 · 12 次查询（完整记录）<br>来源、假说和评议按真实提交顺序显示。</div></section><section class="panel processMain"><div class="panelHeading"><div><h3>研究活动</h3><p>发生了什么，以及哪些内容已经可以阅读。</p></div><select data-control="process-filter" style="border:1px solid var(--lineStrong);background:#fff;border-radius:7px;padding:7px;color:var(--muted);font-size:11px"><option value="all" ${state.processFilter==='all'?'selected':''}>全部活动</option><option value="search" ${state.processFilter==='search'?'selected':''}>文献检索</option><option value="candidate" ${state.processFilter==='candidate'?'selected':''}>假说生成</option><option value="reflection" ${state.processFilter==='reflection'?'selected':''}>模型评议</option></select></div><div>${show.map(x=>`<div class="eventRow"><span class="eventNum">#${x.seq}</span><div class="eventBody"><b>${E(x.title)}</b><p class="english">${E(x.detail||'已保存对应的执行记录')}</p></div>${x.candidate?`<button class="eventAction" data-action="candidate" data-id="${E(x.candidate)}">查看假说</button>`:x.kind==='search'?`<button class="eventAction" data-action="tab" data-id="sources">查看文献</button>`:''}</div>`).join('')||'<div class="emptyState">还没有此类已提交事件。</div>'}</div>${events.length>state.activityLimit?`<div style="padding:16px;text-align:center"><button class="button" data-action="more-events">显示更早的 ${events.length-state.activityLimit} 条记录</button></div>`:''}<div style="border-top:1px solid var(--line);padding:18px 23px"><details class="detailDisclosure"><summary>执行记录详情</summary><div class="disclosureBody"><span class="caption">Run ID</span><div class="english" style="word-break:break-all;font-size:11px">${E(d.runId)}</div><span class="caption">数据来源</span><div>${E(d.derivedFrom.filename)} · ${E(d.derivedFrom.version)}</div><p class="caption">当前阅读快照没有完整的逐次模型裁决与账本事件；它们应由正式 Native Trace 的查询接口补齐。</p></div></details></div></section></div>`;}
function createHTML(){return `<div class="createLayout"><div class="row" style="margin-bottom:15px"><button class="subtleLink" data-action="home">${I('back','sm')} 我的研究</button></div><div class="eyebrow">NEW RESEARCH</div><h1 class="pageTitle" style="margin-top:8px">开始新研究</h1><p class="pageSub">先讲清楚想研究什么，其他步骤交给研究工作台。</p><div class="stepper">${[['研究问题','01'],['研究要求','02'],['确认简报','03']].map(([l,n],i)=>`<div class="stepItem ${i===state.createStep?'active':i<state.createStep?'done':''}"><span class="stepNumber">${i<state.createStep?'✓':n}</span>${l}</div>`).join('')}</div><section class="panel formPanel">${state.createStep===0?`<h2>你想研究什么问题？</h2><p class="description">使用平常描述科研问题的方式填写，无需知道 Agent 或配置文件。</p><label class="field"><span>研究标题</span><input data-field="title" maxlength="150" placeholder="例如：青光眼 RGC 亚型的选择性易损机制" value="${E(state.form.title)}"></label><label class="field"><span>核心科学问题</span><textarea data-field="question" rows="6" placeholder="你希望解释什么现象？哪些机制尚不清楚？">${E(state.form.question)}</textarea><small>可以先从一个明确的问题开始，之后再补充范围和研究要求。</small></label>`:state.createStep===1?`<h2>明确研究范围</h2><p class="description">补充研究背景、重点关注的过程和期望得到的成果。</p><label class="field"><span>背景与研究范围</span><textarea data-field="background" rows="4" placeholder="例如：关注慢性眼压相关应激，比较细胞内在机制与胶质细胞机制">${E(state.form.background)}</textarea></label><label class="field"><span>希望解释的过程</span><textarea data-field="process" rows="5" placeholder="每行一项，例如：\n不同细胞亚型的初始损伤\n线粒体供能与轴突运输的先后关系">${E(state.form.process)}</textarea><small>用于明确你希望研究覆盖的关键过程。</small></label><label class="field"><span>希望得到的研究成果</span><textarea data-field="outputs" rows="4" placeholder="每行一项，例如：\n相互竞争的机制假说\n能够区分这些假说的实验预测\n明确的证伪条件">${E(state.form.outputs)}</textarea></label>`:`<h2>确认研究简报</h2><p class="description">确认问题与范围清晰。正式应用将以此进行预检、费用确认和执行授权。</p><div class="briefBox"><dl><dt>研究标题</dt><dd>${E(state.form.title)}</dd><dt>核心科学问题</dt><dd>${E(state.form.question)}</dd><dt>背景与研究范围</dt><dd>${E(state.form.background||'未指定')}</dd><dt>希望解释的过程</dt><dd>${E(state.form.process||'未指定')}</dd><dt>期望输出</dt><dd>${E(state.form.outputs||'未指定')}</dd></dl></div><div class="row" style="gap:10px;color:#58756f">${I('info','sm')}<span style="font-size:12px">原型仅保存研究简报，不会启动模型任务。</span></div>`}<div class="formActions"><button class="button" data-action="create-back">${I('back','sm')} ${state.createStep===0?'取消':'上一步'}</button><button class="button primary" data-action="create-next">${state.createStep===2?'保存研究简报':'下一步'} ${I('arrow','sm')}</button></div></section></div>`}

function exportReading(){if(state.study==='als')return alsExport();const d=activeData();if(!d){toast('当前研究尚无执行记录');return}const selected=d.candidates.find(x=>x.id===d.final.winnerId);const fmt=(x)=>String(x||'').replace(/\r?\n/g,' ');const text=[`# ${projectTitle()}`,'',`研究问题：${d.researchQuestion}`,`数据来源：${d.derivedFrom.filename} (${d.derivedFrom.version})`,`Run：${d.runId}`,`事件边界：${seq(d)}`,`候选数量：${visibleCandidates(d).length}`,`已保存来源：${visibleSources(d).length}`,'',`## ${finalAvailable(d)?'本次推荐候选':'历史边界：已发布假说'}`,'',...(finalAvailable(d)&&selected?[selected.title,selected.claim,'']:[]),...visibleCandidates(d).map(c=>`### G${c.g} ${c.title}\n\n${fmt(c.claim)}\n\n预测：\n${c.predictions.map(x=>'- '+fmt(x)).join('\n')}\n\n证伪：\n${c.falsifiers.map(x=>'- '+fmt(x)).join('\n')}\n`),'','说明：本文件为已有阅读视图的确定性排版，不是新增模型科学结论。'].join('\n');downloadText('co-scientist-reading-summary.md',text,'text/markdown;charset=utf-8');toast('阅读摘要已导出')}

function onAction(node,e){const a=node.dataset.action,id=node.dataset.id;if(a.startsWith('als-'))return alsAction(a,id);
 if(a==='menu'){state.sidebar=!state.sidebar;render();return}
 if(a==='home')return navigate('home');
 if(a==='settings')return navigate('settings');
 if(a==='create')return createNew();
 if(a==='new-from')return createNew(true);
 if(a==='import'){state.dialog='import';render();return}
 if(a==='open-study'){navigateStudy(id);return}
 if(a==='open-run'){openRun(id||'seed');return}
 if(a==='monitor-toggle'){const d=activeData();if(!d)return;if(replayActive(d)&&replay.playing){replayStop();render()}else replayPlay(d,!replayActive(d)||replay.seq>=d.final.boundary);return}

 if(a==='monitor-insights'){state.monitorSelected=null;state.monitorMode='insights';state.monitorReviewOpen=false;render();return}

 if(a==='monitor-jump'){const d=activeData();if(!d)return;replayStop();replay.runId=d.runId;const steps=replaySteps(d);const target=Number(id)||0;replay.seq=steps.filter(x=>x<=target).at(-1)||0;state.monitorMode='insights';state.monitorSelected=null;state.monitorReviewOpen=false;render();return}

 if(a==='monitor-read'){if(id){state.selected=id;navTab('hypotheses')}return}
 if(a==='monitor-final'){const d=activeData();if(replayActive(d))replayClear();state.boundary='latest';state.tab='overview';render();return}
 if(a==='monitor-event'){const d=activeData();replayStop();replay.runId=d.runId;replay.seq=Number(id)||0;if(node.dataset.candidate&&visibleCandidates(d).some(c=>c.id===node.dataset.candidate)){state.monitorSelected=node.dataset.candidate;state.selected=node.dataset.candidate;state.monitorMode='candidate';state.monitorFocusSeq=seq(d)}else{state.monitorSelected=null;state.monitorMode='insights'}render();return}

 if(a==='note-status'){const d=activeData();let c=d?.candidates.find(x=>x.id===state.selected);if(!c)return;const key=`${d.runId}:${c.id}:${c.contentHash||'unknown'}`;const area=el('candidateNote'),text=area?.value||'';savedNotes[key]={status:id,text};putLocal('co-scientist-demo-v3-notes',savedNotes);render();return}
 if(a==='save-note'){const area=el('candidateNote');savedNotes[id]={status:savedNotes[id]?.status||'undecided',text:area?.value||''};const ok=putLocal('co-scientist-demo-v3-notes',savedNotes);toast(ok?'个人审阅已保存':'已保存在本次预览中，刷新后不会保留');return}
 if(a==='edit-draft'){const p=currentProject();if(!p)return;state.form={title:p.title,question:p.question,background:p.background,process:p.process,outputs:p.outputs};state.createStep=0;navigate('create');return}

function convertImportedView(j,filename){const cList=[...(j.ranked||[]),...(j.pending||[])];if(!cList.length)throw Error('文件中没有可阅读的候选假说');let eventMap=new Map();let sourceMap=new Map(),sourceOrder=[],sourceNotes={};let returned=[];
 for(const c of cList)for(const r of c.raw?.source_and_generation_records||[]){if(!r||typeof r.sequence!=='number')continue;eventMap.set(r.sequence,r)}
 for(const r of [...eventMap.values()].sort((a,b)=>a.sequence-b.sequence)){
 if(r.event_type==='RootRetrievalOutcomeRecordedV2'){const x=r.payload?.result||{};returned.push(...(x.returned_source_ids||[]));for(const s of x.sources||[]){if(!sourceMap.has(s.source_id)){sourceOrder.push(s.source_id);sourceMap.set(s.source_id,{id:s.source_id,title:s.title||s.source_id,text:s.exact_text||'',level:s.content_level||'UNKNOWN',snapshot:s.snapshot_id||'',retrievedSeq:r.sequence,notes:[],candidates:[]})}}}
 if(r.event_type==='RootSourceReviewRecordedV1'){const review=r.payload?.result?.review||'';const matches=[...review.matchAll(/\b(pubmed:\d+):\s*/g)];for(let k=0;k<matches.length;k++){const m=matches[k];const end=k+1<matches.length?matches[k+1].index:review.length;const excerpt=review.slice(m.index+m[0].length,end).trim();(sourceNotes[m[1]]??=[]).push({text:excerpt.slice(0,950),seq:r.sequence})}}}
