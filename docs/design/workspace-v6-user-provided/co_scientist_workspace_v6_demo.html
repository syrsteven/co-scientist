ion. Neither this difference nor its relationship to glaucoma susceptibility is established by the supplied sources.","The intracellular CFH protection reported in inflammatory CNS models can operate in pressure-stressed RGCs. Its proposed preservation of axonal energy homeostasis and transport is an additional, untested extrapolation.","Comparable IOP exposure does not ensure comparable local axonal strain, perfusion, or inflammatory exposure. Retinal position, optic nerve head anatomy, perfusion, age, sex, and mitochondrial background must therefore be measured or balanced.","Subtype identity must be established independently of injury-sensitive marker expression and light responses. Absolute survival counts and permanently labeled axons are needed because functional silencing, marker loss, and transport-dependent labeling failure can mimic selective degeneration.","Evidence is primarily abstract-level, and rodent–human differences in RGC composition and optic nerve head anatomy limit translation, as discussed in pubmed:42838417. This proposal does not establish originality, clinical efficacy, or a universal mechanism across glaucoma."],"predictions":["In a prospective adult mouse microbead ocular-hypertension study, collect baseline, early first-week, and subsequent multiweek measurements, adjusting sampling to capture a verified pre-loss interval. Use an initial cohort to identify candidate subtypes and an independent cohort for confirmation. Relative to sham eyes and resilient subtypes at matched retinal locations, vulnerable subtypes should show weaker early ER-localized CFH induction, greater lipid peroxidation, then lower axonal ATP and reduced cargo movement before greater axon and soma loss. Measure cumulative IOP exposure and perfusion; quantify absolute subtype counts rather than survivor proportions.","Induce RGC-restricted CFH depletion in adulthood before pressure elevation, with non-targeting and normotensive controls. In the independently identified resilient subtype, depletion should increase early lipid peroxidation, subsequently reduce axonal ATP and transport, and increase later degeneration. Confirm depletion within each subtype and exclude glial transduction. Rescue with depletion-resistant, nonsecreted ER-localized CFH should reverse these changes; a similarly expressed and localized SCR20-deleted construct should not. Validate secretion, localization, stability, and lack of baseline toxicity before interpreting rescue differences.","Restore intracellular CFH in the independently identified vulnerable subtype after IOP elevation but before measurable transport failure. Compared with matched control-vector eyes, this should reduce lipid peroxidation first, preserve transport next, and improve later axonal and soma survival without lowering IOP. Sparse RGC targeting should allow comparison with neighboring untreated RGCs sharing the same glial environment; early protection should occur without requiring an initial reduction in surrounding glial activation.","Use a factorial experiment combining adult RGC CFH depletion with extracellular C3 blockade, with isotype controls and verified local complement target engagement. The proposed mechanism predicts that CFH depletion will still worsen early lipid peroxidation and transport when C3 activity is blocked, and nonsecreted CFH will still rescue. The extracellular-complement alternative predicts that C3 blockade will eliminate most of the subtype difference and CFH-depletion phenotype. Persistence under C3 blockade would distinguish these mechanisms but would not exclude C3-independent glial injury.","As an orthogonal mediation test, apply a separately validated lipid-peroxidation-suppressing intervention after CFH depletion but before transport failure. With vehicle and normotensive controls, it should preserve early ATP and cargo movement and later axon integrity despite continued CFH depletion. Measure transported cargo directly in labeled axons, and assess structural survival independently of retrograde tracer uptake. Because antioxidant interventions can affect glia and other injury processes, this test would support the redox intermediate only in conjunction with the RGC-restricted genetic rescue."],"falsifiers":["If independently validated vulnerable and resilient subtypes show indistinguishable early intracellular CFH abundance, localization, and induction before degeneration, the proposed CFH-based explanation of their differential vulnerability would be undermined.","If adult RGC-restricted CFH loss and intracellular rescue produce verified, opposite changes in CFH activity but do not alter early lipid peroxidation, transport failure, or later subtype survival under matched ocular hypertension, CFH would not be a causal subtype vulnerability determinant in this model.","If transport failure consistently precedes lipid peroxidation, and intracellular CFH rescue suppresses lipid peroxidation without preserving transport or axons, the proposed redox-to-transport causal link would be rejected.","If extracellular C3 blockade eliminates the subtype survival difference and the consequences of RGC CFH loss, while validated nonsecreted CFH fails to rescue, an extracellular complement-dependent explanation would be favored over the proposed intracellular mechanism."],"parents":[],"operator":"root","createdSeq":103,"ethicsSeq":108,"reflection":[{"seq":113,"critiques":["The central mechanism is a cross-disease extrapolation: intracellular CFH limitation of ROS/lipid peroxidation is established in inflammatory CNS demyelination, but the candidate explicitly concedes it is untested in pressure-stressed RGCs; the entire causal chain therefore rests on an unverified premise rather than glaucoma-grounded evidence.","The claim of a 'substantial component' of subtype vulnerability is quantitative but no effect size, variance, or power target is given, so the proposal cannot be assessed for whether it could detect such a component even if it exists.","The proposed causal ordering (CFH induction → ER lipid peroxidation → axonal ATP and transport failure → axonal degeneration → soma death) is asserted as a minimal sequence but is not the only ordering consistent with the literature; IOP-related stress likely produces concurrent, not strictly sequential, insults, and the stated ordering is a convenience for design rather than a demonstrated fact.","The mechanism chain does not specify how subtype-specific ER-localized CFH induction would be patterned—i.e., which developmental or transcriptional subtype identity feature controls it—so the proposal is descriptive of an association rather than explanatory of subtype differences.","Subtype labeling is a serious practical vulnerability: intrinsic RGC subtypes are defined by light-response and morphological/transcriptional criteria that can themselves be altered by injury, and the candidate does not specify how subtype identity will be verified before injury and maintained longitudinally, risking circular definition of 'vulnerable' by survival.","The candidate does not address whether CFH induction differences could be a consequence of differential injury rather than its cause; the depletion/rescue experiments attempt to address direction, but the design relies on pre-identifying 'resilient' and 'vulnerable' subtypes in a cohort whose identification may already be confounded by early injury.","The alternative of C3-independent astrocytic mechanical or metabolic injury is acknowledged but weakly operationalized; the factorial C3 blockade test only partially partitions glia versus neuronal mechanisms, and the proposal lacks a design to test glial-origin complement or mechanotransduction directly.","The sparse-targeting rescue design assumes neighboring untreated RGCs share a comparable glial environment and perfusion, which is plausible but untested; local mosaicism in injury could confound the comparison.","Translation caveats (rodent–human RGC composition, optic nerve head anatomy) are named but not addressed empirically; if rodent subtype conservation is not verified, the subtype-specific claim may not generalize and the therapeutic framing may be premature.","The candidate does not establish that the ER is the relevant intracellular compartment for CFH in RGCs; the subcellular localization is carried over from the cited non-glaucoma model and is not independently justified for pressure-stressed neurons.","Pharmacological/antioxidant mediation tests (prediction 5) risk nonspecific effects on glia and mitochondria; the candidate notes this but offers no specificity control beyond relying on the genetic rescue, which may not be sufficient to establish redox as a mediator rather than a parallel consequence."],"plausibility":"Moderate at the level of the general claim that oxidative lipid damage and transport failure can contribute to RGC degeneration, since those processes are broadly plausible in glaucoma biology. The specific claim that subtype-specific intracellular ER-localized CFH induction is a substantial determinant of differential vulnerability is currently speculative: it is directly extrapolated from non-glaucoma inflammatory CNS findings, and the cited glaucoma-relevant source (AKAP1) supports metabolic/mitochondrial involvement without subtype specificity or CFH. The proposal is therefore biologically coherent as a hypothesis but its core premise should be treated as a conjecture to be tested, not as a plausible default.","prior_research":"The candidate accurately frames its two grounding sources: intracellular CFH/SCR20 neuroprotection with C3 independence is from non-glaucoma MS-donor tissue and neuronal ROS/lipid peroxidation (pubmed:42686909); AKAP1 restoration in experimental glaucoma is used as glaucoma-relevant background but does not establish CFH or subtype specificity (pubmed:42893477); glial mechanobiological changes are cited (pubmed:42908589, pubmed:42817911) but explicitly noted not to show subtype-selective complement injury. The novelty claim is therefore narrow and honestly stated: it is the combination of early intracellular CFH induction as a subtype-setpoint with a redox-to-transport sequence, which the candidate acknowledges is untested. The proposal does not demonstrate that this family of hypotheses has not already been proposed elsewhere, and the abstract-level evidence base limits confidence that the prior-research landscape has been fully surveyed.","testability":"Well-structured and falsifiable in principle. The predictions specify measurable variables (early ER-localized CFH induction, lipid peroxidation, axonal ATP, cargo movement, axonal and soma loss), controls (sham eyes, normotensive eyes, matched retinal locations, independent identification/confirmation cohorts, non-targeting and isotype controls), and perturbation/rescue designs (RGC-restricted CFH depletion with nonsecreted depletion-resistant CFH rescue versus SCR20-deleted construct; C3 blockade factorial; antioxidant mediation test). Several operational gaps reduce testability: no explicit effect sizes or power analysis, no concrete plan for stable longitudinal subtype identity, no defined thresholds for 'independent' identification versus confirmation, and no precise operationalization of 'verified pre-loss interval.' The subtype-identity confound is the most serious threat to interpretability; the design mitigates but does not eliminate it via independent cohorts and absolute counts. Overall testable, conditional on resolving subtype identification and effect-size issues.","originality":"Moderate. The individual components are not new: intracellular CFH neuroprotection, redox stress in glaucoma, axonal transport failure, and RGC subtype vulnerability are each established or actively studied. The proposed combination—that subtype-specific early intracellular CFH induction acts as a redox gate coupling to axonal energy/transport failure—is a specific and non-obvious extension, and the candidate transparently labels it as untested rather than claiming established novelty. However, the proposal does not establish novelty relative to the broader literature, and the abstract-level grounding leaves open that a similar coupling hypothesis may already exist; originality is therefore best judged as plausible but unverified.","unjustified_complexity":"The design is elaborate—longitudinal multiweek cohorts, independent identification and confirmation cohorts, RGC-restricted depletion plus nonsecreted rescue with SCR20-deleted control, factorial C3 blockade, and a separate antioxidant mediation test—and this complexity is partly justified by the need to distinguish CFH from extracellular complement, redox from transport, and cell-autonomous from glial contributions. Nevertheless, some elements go beyond what is needed to test the core claim: the sparse-targeting neighbor comparison in prediction 3 assumes comparable local glial environment and adds interpretive burden without an explicit validation of that assumption, and the orthogonal mediation test (prediction 5) partially duplicates the genetic rescue logic. A minimal test of the central claim could be a two-cohort design (subtype characterization + subtype-specific CFH manipulation with lipid/transport/axonal readouts), which would be more tractable; the added factorial and pharmacological arms are defensible as discriminating alternatives but increase complexity that is not fully justified by a power or feasibility argument."}],"sourceIds":["pubmed:42911707","pubmed:42908589","pubmed:42893477","pubmed:42883135","pubmed:42882003","pubmed:42878208","pubmed:42872912","pubmed:42865964","pubmed:42857614","pubmed:42851775","pubmed:42848206","pubmed:42839614","pubmed:42838417","pubmed:42817911","pubmed:42803824","pubmed:42802966","pubmed:42801048","pubmed:42799797","pubmed:42786501","pubmed:42780315","pubmed:42827923","pubmed:42751619","pubmed:42737879","pubmed:42722144","pubmed:42686909","pubmed:42619738","pubmed:42521027","pubmed:42442355","pubmed:42351640","pubmed:42265670"],"score":{"mu":19.01156343753249,"sigma":6.555772290574629},"matches":2,"contentHash":"sha256:b509ed511ce460f1e035256b4b51fda6cab517e24bbccb9652493dcc14ab465a","order":9},{"id":"proposal-rgc-axonal-atp-complement-gate-v1","title":"Subtype-specific axonal ATP recovery sets the complement-dependent threshold for glaucomatous RGC degeneration","g":2,"summary":"Under comparable chronic intraocular pressure-related stress, adult mouse retinal ganglion cell subtypes differ in how quickly the…","claim":"Under comparable chronic intraocular pressure-related stress, adult mouse retinal ganglion cell subtypes differ in how quickly they restore axonal ATP after pressure-related metabolic challenge. Subtypes whose axonal ATP remains depressed longest expose surface phosphatidylserine on stressed axonal membrane, which licenses C1q-dependent microglial recognition and removal; this converts reversible metabolic stress into irreversible axonal degeneration and later somatic death. Subtypes that restore axonal ATP promptly remain below the complement-recognition threshold and survive. The subtype-discriminating variable is therefore the duration of axonal ATP depression, not a single baseline ATP level, and the coupling to complement is the switch that converts a graded metabolic difference into a discrete survival difference.","mechanism":["Chronic IOP-related stress imposes a metabolic load on RGC axons that is not uniform across subtypes. Subtype-intrinsic differences in mitochondrial bioenergetic capacity, axonal ATP demand, and recovery kinetics (rather than a single static ATP value) determine how long axonal ATP stays depressed after each stress episode; repeated episodes could summate into a prolonged depressed window. Direct evidence for subtype-resolved axonal ATP kinetics under chronic pressure is absent from the supplied literature; this step is the novel core of the proposal.","Prolonged sublethal axonal ATP depression impairs maintenance of plasma-membrane phospholipid asymmetry in the affected axon segment, producing sustained external phosphatidylserine exposure on a still-continuous, still-transporting process. The ATP-to-phosphatidylserine link in RGC axons is proposed, not established by the supplied sources; it is the mechanistic step that converts a graded metabolic variable into a discrete recognition signal.","Sustained surface phosphatidylserine, together with pressure-associated glial remodeling, licenses C1q-dependent microglial recognition and engulfment of stressed but not-yet-dead axonal processes. This makes previously recoverable dysfunction irreversible and precedes somatic loss. C1qa deletion preserving RGC somas and axons after blast injury (pubmed:42556773) and complement/phagocytosis-related microglial remodeling described but causally unresolved in glaucoma (pubmed:42769369) support plausibility without demonstrating this sequence under chronic pressure.","Competing mechanism A (glia-first): pressure-activated astrocytes and microglia initiate complement- and cytokine-mediated injury independently of axonal ATP recovery, with metabolic failure occurring secondarily. Astrocyte mechanosensitive Caveolin-1 responses at the glial lamina (pubmed:42908589) support a pressure-responsive glial initiation, but their causal effect on RGC subtypes is unknown. This alternative predicts complement deposition and uptake before detectable ATP deficit.","Competing mechanism B (circuit-demand): early inner-retinal inhibitory-circuit dysfunction and hyperactivity impose subtype-specific firing and metabolic demand that drives ATP depletion, with complement acting downstream. pubmed:42839614 reports early circuit abnormalities and protection via inhibitory-circuit interventions without lowering IOP, but no subtype-resolved metabolic analysis; this alternative predicts that normalizing circuit activity, not restoring axonal ATP directly, would remove the subtype difference.","Competing mechanism C (autonomous degeneration with clearance-only complement): axonal ATP failure triggers an intrinsic degeneration program (e.g., SARM1/DLK-associated, discussed as candidate shared pathways in pubmed:42865964), and complement serves only to clear already-committed debris. This predicts that complement blockade preserves neither transport nor axonal continuity.","Conditional therapeutic implication: if the proposed ordering holds, preserving axonal ATP recovery (e.g., via NAD/energy support) would act upstream of the complement switch, and C1q-dependent recognition would act at the conversion step; each would be predicted to preserve continuous, transporting axons only if applied before its respective node. Neither is established as clinically effective, and both are framed as adjuncts to IOP control (pubmed:42911707)."],"assumptions":["The model is adult mice with sustained, nonischemic ocular hypertension; subtypes are permanently labeled before injury and identified by molecular plus morphological criteria, with a prespecified ranking of at least three molecularly defined subtypes committed in advance of outcome measurement so that the central prediction is falsifiable rather than post hoc.","Comparable IOP does not guarantee comparable local axonal stress; cumulative pressure exposure, optic nerve head deformation, axon caliber and laminar position, retinal perfusion, age, sex, and mitochondrial background must be measured and modeled as covariates rather than assumed balanced.","Axonal ATP reporters require pH and viability controls; phosphatidylserine reporters must distinguish reversible surface exposure from membrane rupture; subtype labels must remain detectable despite injury-associated marker loss; ATP-kinetics measurements must be repeated within the same axon over time rather than inferred from separate cross-sectional animals.","The proposed ATP-recovery-to-phosphatidylserine-to-complement chain, and its subtype selectivity under chronic pressure, are untested extrapolations from acute IOP, blast-injury, and mitochondrial-background studies; their absence from the bounded supplied set does not establish originality.","A prespecified technical-failure adjudication is required: an apparent falsification is attributed to the hypothesis only if labeling persistence, reporter function, and target engagement are independently verified in the same cohort."],"predictions":["Prospective ordering test: in a discovery cohort, sample permanently labeled subtypes before pressure elevation, during a pre-loss window, at an intermediate transport-deficit window, and at later degeneration. Relative to sham normotensive mice, subsequently vulnerable subtypes should show prolonged axonal ATP depression first, sustained surface phosphatidylserine second, C1q deposition and microglial uptake third, and structural degeneration last. Prespecify a quantitative definition of 'prolonged' (e.g., a minimum duration above a locked threshold in pilot data) and a detection-latency correction, then test the locked subtype ranking and ordering in an independent cohort.","ATP-recovery causal test: use an RGC-restricted intervention that demonstrably accelerates axonal ATP recovery (with NAD and firing measured because such interventions are pleiotropic), applied before pressure elevation and separately after the first detected ATP deficit but before phosphatidylserine exposure. Conditional on verified ATP recovery, vulnerable subtypes should show less surface phosphatidylserine and complement deposition early and better transport, axonal continuity, and soma survival later, without reduced IOP. To separate ATP-specific from parallel NAD effects, include a control that raises NAD without measurably accelerating axonal ATP recovery; if that control also protects, the ATP-recovery step is not the operative mediator.","Complement-switch test: apply adult-onset C1q blockade before the predicted recognition phase, with isotype, hypertensive, and normotensive controls and verified suppression of complement deposition. The initial axonal ATP deficit should persist, while microglial uptake and later axon and soma loss decline preferentially in vulnerable subtypes. If C1q blockade instead prevents the initial ATP deficit, a glia-first mechanism is favored; if it reduces uptake without preserving transport or axonal continuity, clearance-of-doomed-debris is favored.","Orthogonal recognition test: mask neuronal surface phosphatidylserine with a validated neuron-restricted binding reagent before complement deposition, compared with a binding-deficient reagent. The proposed mechanism predicts reduced complement deposition, uptake, and later degeneration despite an unchanged initial ATP deficit. Confirm neuronal specificity, membrane integrity, and no direct microglial effect; if masking reduces complement deposition but not uptake or degeneration, the phosphatidylserine-recognition link is rejected while other complement triggers remain possible.","Reversibility test: begin the ATP-recovery intervention after ATP depression is detected but before phosphatidylserine exposure, versus after verified uptake begins. Earlier treatment should reverse surface phosphatidylserine and preserve continuous, transporting axons; later treatment should not restore already-disconnected axons. Measure recovered transport and subtype-specific light responses, not soma counts alone.","Circuit-versus-intrinsic discrimination: cross ATP-recovery acceleration with an inhibitory-circuit intervention previously reported to improve RGC survival without lowering IOP (pubmed:42839614). If circuit normalization alone equalizes ATP recovery and removes the subtype survival gap, the intrinsic ATP-recovery premise is demoted; if ATP acceleration protects even when circuit hyperactivity persists, the intrinsic mechanism is supported.","Orthogonal and confound controls: blinded structural axon counts, subtype-linked axonal reconstructions, live cargo tracking plus anterograde tracing normalized to uptake and surviving axon number, and electrophysiology. Randomize animals, model cells as nested within animals, include independent sham animals rather than only fellow-eye controls, and match cumulative pressure exposure and perfusion; if rescue disappears after covariate matching, the molecular mechanism is not supported."],"falsifiers":["With adequately resolved predegenerative sampling, vulnerable subtypes consistently show complement deposition and microglial uptake before any detectable axonal ATP deficit or surface phosphatidylserine exposure; this would overturn the proposed ordering and favor a glia-first mechanism.","An RGC-restricted intervention that verifiably accelerates axonal ATP recovery before degeneration still leaves surface phosphatidylserine, complement deposition, and subtype-specific degeneration unchanged; or a NAD-raising control that does not accelerate ATP recovery protects as much as the ATP-accelerating intervention, indicating that the ATP-recovery step is not the operative mediator.","Effective C1q blockade reduces complement deposition and microglial uptake but preserves neither axonal continuity nor transport; this would reject the claim that complement recognition converts reversible stress into irreversible degeneration, favoring clearance of already-doomed processes.","Selective neuronal phosphatidylserine masking achieves verified surface occupancy without toxicity but does not reduce complement deposition or uptake, rejecting the proposed phosphatidylserine recognition link.","After accounting for cumulative pressure exposure, local deformation, perfusion, and inhibitory-circuit activity, prospectively measured axonal ATP recovery does not predict subtype vulnerability, whereas local glial activation does — this would undermine the intrinsic explanation of the subtype ranking.","The prespecified subtype ranking fails to replicate in an independent cohort, or the ordering is observed only under sampling windows that differ by more than the prespecified detection-latency allowance, indicating an artifact of measurement timing rather than a causal sequence."],"parents":["proposal-rgc-akap1-first","proposal-rgc-energy-complement-gate"],"operator":"crossover","createdSeq":294,"ethicsSeq":299,"reflection":[{"seq":304,"critiques":["The central novel step—subtype-resolved, repeated-measures axonal ATP recovery kinetics under chronic IOP—is asserted as the discriminating variable but supported in the supplied set only by absence; no data establish that ATP recovery half-life is a heritable, subtype-intrinsic property of adult mouse RGCs, so the mechanism rests on an untested premise.","The claim conflates duration and magnitude of ATP depression: a long, shallow depression and a short, deep depression could produce identical area-under-threshold exposures, and the proposal does not specify which feature (peak depth, time below threshold, integral) is causally operative, leaving the 'duration not baseline level' distinction underdefined and potentially unfalsifiable.","The ATP-to-phosphatidylserine causal link is asserted as a general membrane-asymmetry maintenance cost of ATP depletion, but phospholipid flippase/scramblase regulation is not obviously rate-limited by axonal ATP on the timescale proposed, and other ATP-independent injury signals (calcium influx, calpain, SARM1) could dominate; the proposal treats this link as a mechanistic given rather than a hypothesis requiring its own falsification.","Surface phosphatidylserine as a selective 'eat-me' signal on still-continuous axons is a strong claim: phosphatidylserine exposure is also a classical apoptosis/axon-shrinkage marker, and distinguishing reversible exposure from membrane rupture is acknowledged as a technical requirement but not solved by the design, so a positive result may be uninterpretable.","C1q-dependence is invoked from blast-injury evidence (pubmed:42556773) and correlative glaucoma microglial remodeling (pubmed:42769369); extrapolating a C1q 'switch' to chronic ocular hypertension is a substantial, explicitly unestablished leap, and the proposal does not address that complement may be required for normal synaptic pruning and baseline homeostasis, confounding interpretation of blockade.","The subtype-labeling scheme assumes permanent pre-injury labels survive injury-associated marker loss and that at least three molecularly defined subtypes can be ranked a priori; in practice RGC subtype taxonomy and marker stability under stress are contested, so the 'prespecified ranking' could encode an arbitrary ordering and the central prediction may fail for taxonomic rather than mechanistic reasons.","The competing-mechanism set (glia-first, circuit-demand, autonomous-degeneration) is presented as discriminating, but the proposed experiments may not cleanly separate them: ATP-recovery acceleration is pleiotropic (NAD, firing), circuit intervention affects metabolism, and C1q blockade may act on both initiation and clearance; the design acknowledges pleiotropy but the discriminative predictions overlap.","Cumulative pressure exposure, optic nerve head deformation, axon caliber, laminar position, perfusion, age, sex, and mitochondrial background are listed as covariates, but with subtype as the unit of inference and finite animal numbers, matching all of these simultaneously is likely infeasible; residual confounding by laminar position (which correlates with subtype and stress) could generate the entire observed ordering.","Within-axon repeated ATP measurement is technically demanding and itself potentially injurious; the proposal does not address whether serial imaging perturbs the very ATP recovery kinetics being measured, nor how many axons per subtype yield adequate power for a survival-difference claim.","The therapeutic framing (ATP/NAD support upstream, C1q blockade at the conversion step) is conditional and appropriately hedged, but NAD-raising interventions have broad effects on axonal survival independent of the proposed switch, so even a positive rescue experiment would not establish the specific ATP-recovery-to-complement causal chain without the proposed NAD-without-ATP-recovery control, which is itself hard to construct.","The falsifiers are well specified but several are logically weak: 'complement deposition before ATP deficit' could occur transiently and be missed, and 'ATP recovery does not predict vulnerability' after covariate adjustment could reflect measurement noise rather than mechanism, so falsification may be underpowered or timing-dependent."],"plausibility":"Moderately plausible but multi-step and speculative. Component claims have graded support: subtype-specific vulnerability in glaucoma is well accepted; mitochondrial/energetic contributions to RGC degeneration are plausible; complement and microglial involvement in glaucoma is documented but causally unresolved; C1q-dependence is established mainly in blast injury. The distinctive proposal—that the duration of axonal ATP depression, not baseline ATP, is the subtype-discriminating variable, and that sustained phosphatidylserine exposure converts this into C1q-dependent irreversible removal—is a coherent and mechanistically explicit chain, but each link (subtype-resolved ATP-recovery kinetics as intrinsic and stable; ATP-dependent phosphatidylserine asymmetry maintenance on axons; phosphatidylserine as the licensing signal for C1q on viable axons; C1q as the switch rather than clearance) is an extrapolation. The overall claim is falsifiable in principle and internally consistent, but the probability that the full chain holds as stated is low-to-moderate; partial validation of individual links is more likely than confirmation of the complete ordering.","prior_research":"The candidate explicitly grounds itself in a bounded set: C1qa deletion preserving RGC somas/axons after blast injury (pubmed:42556773) supports complement involvement but in acute trauma, not chronic pressure; complement/phagocytosis-related microglial remodeling in glaucoma (pubmed:42769369) is correlative and causally unresolved; astrocyte Caveolin-1 mechanoresponses at the glial lamina (pubmed:42908589) support glial initiation; early inhibitory-circuit dysfunction and IOP-independent protection (pubmed:42839614) support circuit-demand competition; SARM1/DLK-associated pathways (pubmed:42865964) support autonomous degeneration; IOP-control adjunct framing cites pubmed:42911707. The candidate honestly states that subtype-resolved axonal ATP kinetics under chronic pressure and the ATP-to-phosphatidylserine-to-complement chain are absent from the supplied set, and that absence of prior literature in the bounded set does not establish originality. Prior research on RGC subtype vulnerability, mitochondrial dysfunction in glaucoma, phosphatidylserine exposure as an injury signal, and complement in neurodegeneration is broader than the supplied set and is not surveyed here; the proposal does not claim a comprehensive literature review. The parent content ids (rgc-akap1-transport-complement-proposal, rgc-energy-complement-threshold-v1) indicate lineage from prior energy/complement threshold and transport proposals, so the novelty is incremental recombination rather than a wholly new mechanism.","testability":"High in principle, with substantial practical friction. The proposal specifies prospective ordering with pre-injury subtype labeling, repeated within-axon ATP measurement, orthogonal phosphatidylserine masking, C1q blockade with isotype and normotensive/hypertensive controls, an ATP-recovery intervention with an NAD-without-ATP-recovery control, circuit-versus-intrinsic crossing, independent sham animals, nested modeling, and blinded structural/functional readouts—these are concrete, measurable, and include prespecified falsifiers and a technical-failure adjudication. Challenges: within-axon serial ATP imaging perturbs the system; detection-latency corrections require pilot data whose values may drive results; phosphatidylserine-membrane-integrity discrimination is technically unresolved; subtype marker persistence under injury is assumed; power for subtype-resolved survival differences with full covariate matching is uncertain; and the NAD-without-ATP-recovery control may be biologically unattainable. The falsifiers are mostly operationalizable, though some (transient complement-before-ATP) are timing-sensitive and could yield false negatives.","originality":"Moderate. The individual ingredients—subtype vulnerability, mitochondrial/ATP contributions, phosphatidylserine exposure, complement and microglial pruning—are each established or proposed in glaucoma and neurodegeneration literature, and the parent content ids indicate this builds on prior energy-threshold and transport-complement proposals. The specific combination—framing the discriminating variable as the duration of axonal ATP depression rather than baseline ATP, and casting sustained phosphatidylserine-to-C1q recognition as the discrete switch converting graded metabolic stress into subtype-specific survival—is a distinctive and mechanistically explicit synthesis not obviously present in the supplied set. However, the candidate correctly notes that absence from a bounded set does not establish originality, and the core novelty (subtype-resolved ATP-recovery kinetics under chronic pressure) is an untested extrapolation rather than a demonstrated gap; originality is therefore plausible but unverified and incremental.","unjustified_complexity":"The proposal is elaborate: four-plus mechanistic nodes, three competing mechanisms, six falsifiers, seven predictions, a prespecified subtype ranking, detection-latency corrections, multiple orthogonal controls (isotype, normotensive, hypertensive, binding-deficient reagent, NAD-without-ATP control, circuit crossing, independent sham), repeated within-axon imaging, and simultaneous covariate matching for pressure, deformation, caliber, position, perfusion, age, sex, and mitochondrial background. Some complexity is justified by the need to distinguish competing mechanisms and avoid confounds, but several layers are arguably excessive for a first test: the a priori ranking of at least three molecularly defined subtypes before outcome measurement, combined with full covariate matching and repeated-measures ATP imaging, imposes feasibility burdens that may prevent execution rather than sharpen inference. The NAD-without-ATP-recovery control, while logically motivated, may be unconstructable and could be replaced by a simpler dissociation design. The ATP-duration-versus-magnitude distinction is central but not operationally defined (integral, time-below-threshold, peak depth), adding definitional complexity without resolving the causal variable. The proposal could be staged: first establish subtype-resolved ATP-recovery kinetics and ordering in a discovery cohort, then test the phosphatidylserine and complement links, rather than committing to the full orthogonal suite in one design. As written, the complexity is partly justified by the breadth of competing hypotheses but exceeds what is needed to test the central claim and risks unfeasibility."}],"sourceIds":["pubmed:42911707","pubmed:42908589","pubmed:42883135","pubmed:42882003","pubmed:42878208","pubmed:42865964","pubmed:42851775","pubmed:42848206","pubmed:42839614","pubmed:42838417","pubmed:42802966","pubmed:42801048","pubmed:42799797","pubmed:42780315","pubmed:42769470","pubmed:42769369","pubmed:42757470","pubmed:42751619","pubmed:42741401","pubmed:42731713","pubmed:42827923","pubmed:42737879","pubmed:42722144","pubmed:42699770","pubmed:42619738","pubmed:42603628","pubmed:42556773","pubmed:42556772","pubmed:42442355","pubmed:42406594","pubmed:42893477","pubmed:42872912","pubmed:42857614","pubmed:42803824","pubmed:42774068","pubmed:42650212","pubmed:42510642","pubmed:42468646","pubmed:42401758","pubmed:42296909","pubmed:42255937","pubmed:42214787","pubmed:42007085","pubmed:41952895","pubmed:41929135"],"score":{"mu":15.96249406998899,"sigma":5.745650871641644},"matches":3,"contentHash":"sha256:d7dd4a506c4008278b41d90b6e720e91ad448cc82ee06740f2a066132f790a97","order":10}],"sources":[{"id":"pubmed:42911707","title":"Research Progress on Intraocular Pressure-lowering Drugs, Commonly Used Clinical Adjuvants, and Emerging Neuroprotective Agents for Glaucomatous Optic Neuropathy.","text":"Glaucomatous optic neuropathy (GON) is the leading cause of irreversible blindness worldwide, characterized by progressive retinal ganglion cell (RGC) loss. Current clinical treatment relies primarily on IOP-lowering drugs, but a subset of patients continues to experience progressive optic nerve damage. Adjuvant therapies such as antioxidants and calcium channel blockers have limited efficacy. Emerging neuroprotective strategies including NMDA receptor antagonists, neurotrophic factors, and gene therapy remain in preclinical or early-stage trials. This review systematically summarizes the mechanisms, clinical applications, and limitations of these three drug categories, with emphasis on emerging neuroprotective agents, aiming to guide future research directions.","level":"ABSTRACT","snapshot":"sha256:d11533c6de75717cf0263ae6dca57108789fe0f272bbbbe940824c292e30aa6c","retrievedSeq":23,"root":"root-slot-0","notes":[{"text":"narrative review of IOP-lowering drugs, adjuvants, and emerging neuroprotectants (NMDA antagonists, neurotrophic factors, gene therapy); broad therapeutic context only, no subtype-specific vulnerability data.","seq":28},{"text":"narrative review of IOP-lowering drugs, clinical adjuvants (antioxidants, calcium channel blockers), and preclinical neuroprotectants (NMDA antagonists, neurotrophic factors, gene therapy); frames glaucoma neuroprotection but gives no RGC-subtype vulnerability data; abstract only, no primary data.","seq":64},{"text":"Review of IOP-lowering drugs, adjuvants and emerging neuroprotectants (NMDA antagonists, neurotrophic factors, gene therapy); framework-relevant for glaucoma neuroprotection but no RGC subtype-specific vulnerability data; abstract only.","seq":96},{"text":"narrative review of IOP-lowering, adjuvant and emerging neuroprotective agents for glaucomatous optic neuropathy; frames neuroprotection as adjunctive to IOP control but gives no RGC-subtype comparison, so it constrains therapeutic context only.","seq":128}],"candidates":["proposal-rgc-akap1-first","offspring-g3-slot-1-hypothesis","proposal-rgc-fgf1-energy-dependence","proposal-rgc-fgf1-subtype-energy-gate-v2","proposal-rgc-subtype-axon-compartment-gate-v1","proposal-rgc-energy-complement-gate","proposal-rgc-subtype-mito-gate-v1","offspring-g2-slot-0-hypothesis","proposal-rgc-intracellular-cfh","proposal-rgc-axonal-atp-complement-gate-v1"],"reviewed":true},{"id":"pubmed:42908589","title":"Caveolin-1 defines astrocyte mechanobiology in the glial lamina of the optic nerve head.","text":"The optic nerve head is the principal site of retinal ganglion cell axonal injury in primary open angle glaucoma, where astrocyte mechanobiology and extracellular matrix remodeling are thought to play critical roles in disease progression. Caveolae, which are mechanosensitive plasma membrane invaginations formed by Caveolin and Cavin proteins, are key regulators of cellular responses to mechanical stress, yet their involvement in optic nerve head pathophysiology has not been defined. Here, we characterize the presence, regulation, and mechanobiological relevance of Caveolin and Cavin proteins in murine optic nerve astrocytes in vitro and in vivo. Primary optic nerve astrocytes exhibited classical caveolar structures and expressed Caveolin-1, Caveolin-2 and multiple Cavins. In vivo, Caveolin-1 is highly enriched in astrocytes of the glial lamina. Glaucoma-associated factors CCN2/CTGF and TGF-β2 significantly increased Caveolin-1 and Cavin-1 expression in optic nerve astrocytes, while CCN2/CTGF knockdown reduced Caveolin-1 expression. Increasing substratum stiffness enhanced Caveolin-1 expression and altered the subcellular localization of Caveolin-1. Furthermore, Caveolin-1 mRNA expression was increased in the optic nerve head of a glaucoma mouse model, while its protein levels were elevated in the entire optic nerve of the transgenic mice. Together, these findings identify caveolae and Caveolin-1 as mechanosensitive components of optic nerve astrocytes and suggest their involvement in biomechanical and molecular alterations of the glaucomatous optic nerve head. This work provides the first evidence linking astrocyte mechanobiology in the glial lamina to Caveolin-1, highlighting a potential novel contributor to glaucoma pathogenesis.","level":"ABSTRACT","snapshot":"sha256:0a7bdd2f9e5f0c8cf1bacfc913440402c19f2d7f8aca1076d3d01c9cbe18e2b6","retrievedSeq":23,"root":"root-slot-0","notes":[{"text":"primary study in murine optic nerve astrocytes showing Caveolin-1/Cavin-1 mechanosensitivity, upregulation by CCN2/CTGF and TGF-beta2, and stiffness-dependent localization; supports glial mechanobiology at the glial lamina but not RGC subtype differences.","seq":28},{"text":"murine optic nerve astrocyte study showing Caveolin-1/Cavin-1 induction by CCN2/CTGF, TGF-β2 and substratum stiffness, and elevated Caveolin-1 in glaucoma model optic nerve; supports glial mechanobiology at the glial lamina as a pressure-transduction candidate, but no subtype comparison or RGC survival readout.","seq":64},{"text":"Murine optic nerve astrocyte mechanobiology; CCN2/CTGF and TGF-beta2 increase Caveolin-1/Cavin-1, substratum stiffness alters Caveolin-1, elevated in glaucoma model; supports glia mechanotransduction arm but no subtype-specific RGC outcomes and correlational.","seq":96},{"text":"murine in vitro/in vivo study reporting Caveolin-1/Cavin mechanosensitive expression in optic nerve astrocytes, enriched in glial lamina, regulated by CCN2/CTGF, TGF-β2 and substratum stiffness, increased in a glaucoma model; relevant to glia-mediated mechanotransduction at the optic nerve head, but astrocyte-level only and not subtype-specific.","seq":128}],"candidates":["proposal-rgc-akap1-first","offspring-g3-slot-1-hypothesis","proposal-rgc-fgf1-energy-dependence","proposal-rgc-fgf1-subtype-energy-gate-v2","proposal-rgc-subtype-axon-compartment-gate-v1","proposal-rgc-energy-complement-gate","proposal-rgc-subtype-mito-gate-v1","offspring-g2-slot-0-hypothesis","proposal-rgc-intracellular-cfh","proposal-rgc-axonal-atp-complement-gate-v1"],"reviewed":true},{"id":"pubmed:42883135","title":"Metabolic and Immunometabolic Neuroprotection in Glaucoma: Mitochondrial Dysfunction, Neuroinflammation, and Emerging Therapeutic Strategies.","text":"Glaucoma is increasingly recognized as a multifactorial neurodegenerative optic neuropathy in which intraocular pressure (IOP) is one of several stress amplifiers rather than a sufficient etiological explanation. Vascular dysregulation, mitochondrial and metabolic vulnerability, oxidative stress, excitotoxicity, glial dysregulation, and persistent neuroimmune activation can converge on retinal ganglion cell (RGC) and optic nerve injury. This broader framework is particularly relevant to normal-tension glaucoma (NTG), which represents a large proportion of primary open-angle glaucoma in Asian populations, and to patients who continue to progress despite IOP being maintained within the target range. Consequently, mitochondrial dysfunction, metabolic impairment, oxidative stress, and the associated neuroinflammatory response are not merely downstream adjunctive targets: they are core disease mechanisms and potential treatment targets in pressure-independent and pressure-resistant glaucoma. Coenzyme Q10 (CoQ10), nicotinamide, pyruvate, and citicoline are emerging metabolic and neuroprotective agents whose primary actions involve mitochondrial bioenergetics, redox homeostasis, membrane integrity, and cellular stress responses, with potential secondary effects on neuroinflammatory pathways. Chronic activation of microglia and astrocytes promotes the release of pro-inflammatory cytokines, reactive oxygen species, and apoptotic mediators, leading to RGC degeneration. CoQ10 may counteract these mechanisms through antioxidant activity and stabilization of mitochondrial function; nicotinamide, a precursor of NAD+, may enhance mitochondrial resilience and suppress inflammatory cascades associated with energy failure; pyruvate supports aerobic metabolism and may limit oxidative, inflammatory, and excitotoxic injury; and citicoline supports membrane homeostasis, phospholipid synthesis, neuronal repair, and visual-pathway function. Combined targeting of these interconnected pathways may enhance RGC resilience independently of, and in addition to, IOP reduction. However, current clinical evidence remains insufficient to establish sustained neuroprotection or disease-modifying efficacy. This review examines the interplay among these mechanisms in glaucomatous neurodegeneration and critically discusses the experimental and clinical evidence supporting metabolic and immunometabolic neuroprotective strategies as potential adjuncts to conventional intraocular pressure-lowering therapy.","level":"ABSTRACT","snapshot":"sha256:2c62ab7a8220a51dd84cfcbf8b48cc9cd9532c90f759d5af0426f8f347d9b519","retrievedSeq":23,"root":"root-slot-0","notes":[{"text":"review arguing mitochondrial dysfunction, metabolic impairment, oxidative stress and neuroinflammation are core pressure-independent mechanisms in glaucoma, with CoQ10/nicotinamide/pyruvate/citicoline discussion; synthesizes mechanisms, not subtype-resolved cause.","seq":28},{"text":"review arguing IOP is one stress amplifier among vascular, mitochondrial, metabolic, oxidative, excitotoxic, glial and neuroimmune mechanisms, with CoQ10/nicotinamide/pyruvate/citicoline as candidate adjuncts; convergent multi-mechanism framing, but explicitly notes insufficient clinical evidence and no subtype-resolved data.","seq":64},{"text":"Review arguing IOP is a stress amplifier, not sufficient cause; converging vascular, mitochondrial, metabolic, oxidative, excitotoxic, glial and neuroimmune mechanisms; CoQ10/nicotinamide/pyruvate/citicoline proposed; clinical efficacy unestablished; hypothesis-generating only.","seq":96},{"text":"review arguing vascular, mitochondrial, metabolic, oxidative and neuroimmune mechanisms converge on RGC/optic nerve injury and are core in pressure-independent glaucoma; notes clinical evidence insufficient for sustained neuroprotection; competes with purely pressure-mechanical accounts but offers no subtype stratification data.","seq":128}],"candidates":["proposal-rgc-akap1-first","offspring-g3-slot-1-hypothesis","proposal-rgc-fgf1-energy-dependence","proposal-rgc-fgf1-subtype-energy-gate-v2","proposal-rgc-subtype-axon-compartment-gate-v1","proposal-rgc-energy-complement-gate","proposal-rgc-subtype-mito-gate-v1","offspring-g2-slot-0-hypothesis","proposal-rgc-intracellular-cfh","proposal-rgc-axonal-atp-complement-gate-v1"],"reviewed":true},{"id":"pubmed:42882003","title":"Impact of Insulin Resistance on Retinal Ganglion Cell Layer Structures: Findings from the Korea National Health and Nutrition Examination Survey.","text":"Background/Objectives: Hyperinsulinaemia reflects compensatory systemic insulin resistance and may indicate early metabolic-vascular dysregulation. We investigated associations between insulin dysregulation and the retinal neuronal structure, particularly ganglion cell layer (GCL) thickness, using Korea National Health and Nutrition Examination Survey (KNHANES) data. Methods: We analysed KNHANES's 2019-2020 participants who underwent spectral-domain optical coherence tomography (SD-OCT) and fasting serum insulin assessment. SD-OCT-derived GCL and retinal nerve fibre layer (RNFL) thickness were compared with fasting insulin levels and insulin resistance, which was assessed using the homeostatic model assessment of insulin resistance. Multivariable linear regression models were adjusted for age, sex, body mass index, hypertension, diabetes, and intraocular pressure. To account for multiple comparisons across retinal thickness parameters, a false discovery rate (FDR) correction was applied separately to GCL and RNFL analyses for each exposure and model. Results: Among 6941 participants, hyperinsulinaemia was significantly associated with a reduced average GCL thickness after full adjustment (β = -0.106, 95% confidence interval [CI]: -0.179 to -0.032; FDR-adjusted p = 0.013). Significant inverse associations remained for seven of the eight GCL parameters after FDR correction, with the superior sector being the only exception. Insulin resistance was associated with a reduced average GCL thickness in the unadjusted model (β = -0.107, 95% CI: -0.169 to -0.045; FDR-adjusted p = 0.002), but the association was attenuated after multivariable adjustment and was no longer significant in the fully adjusted model (β = -0.062, 95% CI: -0.125 to 0.001; FDR-adjusted p = 0.096). No significant associations with RNFL thickness remained after multivariable adjustment and FDR correction. Conclusions: Hyperinsulinaemia was consistently associated with a reduced GCL thickness across most retinal regions, whereas associations between HOMA-IR-defined insulin resistance and GCL thickness were attenuated after multivariable adjustment and FDR correction. No significant associations with RNFL thickness remained after adjustment and multiple-comparison correction. These findings suggest a potential association between hyperinsulinaemia and early GCL thinning, warranting further investigation into its relationship with retinal neurodegeneration and glaucoma risk.","level":"ABSTRACT","snapshot":"sha256:c5f9656c5f14759ff6abfff95192b9cc2b677db4678a4eb9722f7145b26b326b","retrievedSeq":23,"root":"root-slot-0","notes":[{"text":"KNHANES cross-sectional analysis (n=6941) linking hyperinsulinaemia to thinner ganglion cell layer, attenuated associations for HOMA-IR and none for RNFL; human association only, no glaucoma subtype or causal mechanism.","seq":28},{"text":"KNHANES cross-sectional analysis finding hyperinsulinaemia associated with reduced average GCL thickness but not RNFL after adjustment; supports systemic metabolic modulation of ganglion-cell-layer structure, yet observational, human population-level, not subtype-specific and cannot address axon-vs-soma causality.","seq":64},{"text":"KNHANES cross-sectional study; hyperinsulinaemia associated with reduced GCL thickness (beta -0.106) but not RNFL after adjustment; low direct relevance to IOP-stress subtype vulnerability; systemic metabolic confounders, observational only.","seq":96},{"text":"KNHANES cross-sectional analysis associating hyperinsulinaemia, not adjusted HOMA-IR, with thinner ganglion cell layer; systemic metabolic correlation in humans, does not measure IOP stress, axonal degeneration or RGC subtypes; low direct relevance.","seq":128}],"candidates":["proposal-rgc-akap1-first","offspring-g3-slot-1-hypothesis","proposal-rgc-fgf1-energy-dependence","proposal-rgc-fgf1-subtype-energy-gate-v2","proposal-rgc-subtype-axon-compartment-gate-v1","proposal-rgc-energy-complement-gate","proposal-rgc-subtype-mito-gate-v1","offspring-g2-slot-0-hypothesis","proposal-rgc-intracellular-cfh","proposal-rgc-axonal-atp-complement-gate-v1"],"reviewed":true},{"id":"pubmed:42878208","title":"Mitochondrial Genetic Background Shapes Baseline Retinal Function, Age-Related Bioenergetic Remodeling, and Microglial STING Phenotypes.","text":"Mitochondria are central regulators of retinal bioenergetics and innate immune signaling, yet how mitochondrial genetic background and aging jointly influence immunometabolic responses in the retina remains poorly defined. Here, we investigated the effects of mitochondrial DNA (mtDNA) variation on retinal function and the combined effects of mtDNA variation and age on bioenergetic composition, mtDNA damage, and the microglial expression and intracellular localization of stimulator of interferon genes (STING) protein. Using mitochondrial-nuclear eXchange (MNX) mice harboring identical C57BL/6J nuclear genomes but distinct C57 or C3H mtDNA haplotypes, we assessed oxidative phosphorylation complex composition, electrophysiological function, mtDNA damage, and microglial STING dynamics across the lifespan and following acute intraocular pressure (IOP) elevation. Aging was associated with increased mtDNA damage and remodeling of oxidative phosphorylation complex composition, characterized by reduced Complex III and V abundance and increased Complex IV. Despite these age-associated changes, photoreceptor- and retinal ganglion cell-associated retinal responses were preserved at early ages, whereas bipolar cell-associated responses differed by mtDNA background. Microglial STING expression increased with age. Acute IOP elevation was associated with differential microglial STING dynamics and STING association with lysosomal compartments decreased with age. Together, these findings demonstrate that mitochondrial genetic background and aging influence retinal bioenergetics and neuroimmune protein expression and identify mtDNA variation as a modifier of age-associated microglial STING expression in the retina.","level":"ABSTRACT","snapshot":"sha256:3fbe33782ed6ee90baa7887713ffe3e79c65b85d822e1d75b51a83c9377ce88a","retrievedSeq":23,"root":"root-slot-0","notes":[{"text":"MNX mouse study showing mtDNA haplotype and aging shape retinal bioenergetics, mtDNA damage, and microglial STING dynamics, including after acute IOP elevation; identifies mitochondrial genetic background as modifier, relevant to intrinsic vulnerability, but not RGC subtype-specific.","seq":28},{"text":"MNX mouse study showing mtDNA haplotype and age alter oxidative phosphorylation complex composition, mtDNA damage and microglial STING dynamics, with acute IOP elevation producing differential STING changes; directly relevant to cell-intrinsic mitochondrial genetic modifiers of stress response, but subtype-agnostic and acute IOP only.","seq":64},{"text":"MNX mice with C57 vs C3H mtDNA haplotypes; aging increased mtDNA damage and OXPHOS remodeling, bipolar responses differed by haplotype, microglial STING dynamics changed with acute IOP elevation; supports mitochondrial genetic modifiers of stress response but not RGC subtype vulnerability.","seq":96}],"candidates":["offspring-g3-slot-1-hypothesis","proposal-rgc-fgf1-energy-dependence","proposal-rgc-fgf1-subtype-energy-gate-v2","proposal-rgc-subtype-axon-compartment-gate-v1","proposal-rgc-energy-complement-gate","proposal-rgc-subtype-mito-gate-v1","offspring-g2-slot-0-hypothesis","proposal-rgc-intracellular-cfh","proposal-rgc-axonal-atp-complement-gate-v1"],"reviewed":true},{"id":"pubmed:42865964","title":"Genetic susceptibility and neuroprotective gene therapy of normal tension glaucoma: a review.","text":"Normal-tension glaucoma (NTG) is a distinct form of glaucomatous optic neuropathy characterized by progressive retinal ganglion cell (RGC) degeneration and visual field loss despite intraocular pressure (IOP) remaining within the statistically normal range. Although IOP reduction remains the only established disease-modifying strategy, continued disease progression despite adequate IOP control highlights the importance of IOP-independent mechanisms. Increasing evidence implicates vascular dysregulation, mitochondrial dysfunction, oxidative stress, impaired autophagy, neuroinflammation, axonal transport abnormalities, and circadian dysregulation in increased RGC vulnerability. Genetic studies have identified OPTN and TBK1 as the most strongly supported NTG-associated susceptibility genes, whereas many other candidate genes, including MYOC, SARM1, DLK, BDNF, NOS3, KLF2 and PTGDS, are shared with other glaucoma subtypes or remain supported primarily by experimental or mechanistic evidence. These interconnected processes converge on mitochondrial impairment, axonal degeneration, and RGC death, providing potential therapeutic targets beyond conventional IOP lowering. This review integrates the vascular, mitochondrial, and neuronal mechanisms underlying NTG, distinguishes NTG-associated molecular factors from pathways shared across glaucoma subtypes, and summarizes emerging gene- and nucleic-acid-based therapeutic strategies. By linking evidence-based mechanisms with emerging molecular technologies, this review provides a framework for mechanism-based and precision-oriented therapies that may complement established IOP-lowering treatment for NTG.","level":"ABSTRACT","snapshot":"sha256:40dec9d8705d20521d1935746328edd33945d6b9954b71fd0e0a803091499223","retrievedSeq":23,"root":"root-slot-0","notes":[{"text":"review of normal-tension glaucoma implicating vascular dysregulation, mitochondrial dysfunction, oxidative stress, impaired autophagy, neuroinflammation and axonal transport, with OPTN/TBK1 as strongest genetic support; frames competing pathways but treats them largely as convergent.","seq":28},{"text":"review of normal-tension glaucoma implicating vascular dysregulation, mitochondrial dysfunction, oxidative stress, impaired autophagy, neuroinflammation, axonal transport and circadian dysregulation, with OPTN/TBK1 as strongest genes; useful for pressure-independent intrinsic mechanisms, but review-level and not subtype-specific.","seq":64},{"text":"NTG review; IOP-independent mechanisms (vascular, mitochondrial, oxidative, autophagy, neuroinflammation, axonal transport, circadian); OPTN/TBK1 strongest genetic support, SARM1/DLK/BDNF etc. weaker; useful competing-mechanism map but narrative, not primary data.","seq":96},{"text":"review of normal-tension glaucoma implicating vascular dysregulation, mitochondrial dysfunction, oxidative stress, impaired autophagy, neuroinflammation, axonal transport and circadian dysregulation, with OPTN/TBK1 the best-supported susceptibility genes and SARM1/DLK/BDNF/NOS3/KLF2/PTGDS weaker or shared; a hypothesis-generating map, not primary data.","seq":128}],"candidates":["proposal-rgc-akap1-first","offspring-g3-slot-1-hypothesis","proposal-rgc-fgf1-energy-dependence","proposal-rgc-fgf1-subtype-energy-gate-v2","proposal-rgc-subtype-axon-compartment-gate-v1","proposal-rgc-energy-complement-gate","proposal-rgc-subtype-mito-gate-v1","offspring-g2-slot-0-hypothesis","proposal-rgc-intracellular-cfh","proposal-rgc-axonal-atp-complement-gate-v1"],"reviewed":true},{"id":"pubmed:42851775","title":"Applications of single-cell transcriptomics in glaucoma research: from the aqueous humor outflow pathway to retinal ganglion cell neurodegeneration.","text":"Glaucoma is the leading cause of irreversible blindness worldwide, driven by progressive retinal ganglion cell (RGC) degeneration. While genetic and environmental risk factors have been identified, the cell-type-specific mechanisms underlying pathogenesis remain incompletely understood. Single-cell RNA sequencing (scRNA-seq) enables high-resolution analysis of cellular heterogeneity, developmental trajectories and intercellular communication networks. This review synthesizes recent scRNA-seq advances across two critical domains in glaucoma research: (1) aqueous humor outflow pathway (AHOP) physiology and pathology; (2) primary open-angle glaucoma (POAG) pathogenesis. We identify convergent themes, including mitochondrial dysfunction as a shared mechanism across subtypes, the central role of neuroinflammation in RGC degeneration, and the therapeutic potential of metabolic interventions. We further discuss challenges in translating animal models to human disease, integrating multi-species datasets, and resolving cell-type-specific susceptibility. Finally, we highlight emerging directions in spatial transcriptomics, multi-omics integration, and precision medicine.","level":"ABSTRACT","snapshot":"sha256:fa5eea42f1e211201a2e5824d9f379ef858737ab3abab542e0cc950121a9c34c","retrievedSeq":23,"root":"root-slot-0","notes":[{"text":"review of scRNA-seq in glaucoma highlighting mitochondrial dysfunction as shared mechanism, neuroinflammation, metabolic intervention, and the challenge of resolving cell-type-specific susceptibility; explicitly notes the subtype-resolution gap.","seq":28},{"text":"review of scRNA-seq applications identifying mitochondrial dysfunction, neuroinflammation and metabolic intervention as convergent themes and explicitly flagging unresolved cell-type-specific susceptibility; strongest conceptual support for subtype-resolved hypotheses, yet no new data and no causal tests.","seq":64},{"text":"Review of scRNA-seq in glaucoma covering outflow pathway and POAG; notes mitochondrial dysfunction as convergent theme, neuroinflammation, and unresolved cell-type-specific susceptibility; directly frames the subtype-vulnerability gap but no new primary results.","seq":96},{"text":"review of single-cell RNA-seq in glaucoma covering outflow pathway and POAG, noting mitochondrial dysfunction and neuroinflammation as convergent themes and cell-type-specific susceptibility as unresolved; directly motivates subtype-resolved designs but reports no new subtype-specific mechanism.","seq":128}],"candidates":["proposal-rgc-akap1-first","offspring-g3-slot-1-hypothesis","proposal-rgc-fgf1-energy-dependence","proposal-rgc-fgf1-subtype-energy-gate-v2","proposal-rgc-subtype-axon-compartment-gate-v1","proposal-rgc-energy-complement-gate","proposal-rgc-subtype-mito-gate-v1","offspring-g2-slot-0-hypothesis","proposal-rgc-intracellular-cfh","proposal-rgc-axonal-atp-complement-gate-v1"],"reviewed":true},{"id":"pubmed:42848206","title":"Optical coherence tomography angiography of the macular retina and choroid in glaucoma: a narrative review.","text":"Glaucoma is a progressive optic neuropathy characterized by retinal ganglion cell degeneration, structural remodeling of the retina and choroid, and irreversible visual field loss. Increasing evidence indicates that microvascular dysfunction plays a crucial role in its onset and progression. Optical coherence tomography angiography (OCTA), as a noninvasive, high-resolution imaging technique, enables quantitative visualization of retinal and choroidal microcirculation, providing new insights into the structural-vascular-functional relationships in glaucoma. This narrative review summarizes recent advances in the use of OCTA for evaluating macular retinal and choroidal changes in glaucoma, emphasizing its potential in early diagnosis, disease monitoring, and postoperative assessment. Moreover, retinal OCTA vessel-density parameters are closely associated with visual field impairment, whereas the prognostic value of many choroidal metrics remains less well established. With continuous technological innovation and deeper understanding of ocular hemodynamics, OCTA is expected to play an increasingly important role in the early detection and comprehensive management of glaucoma.","level":"ABSTRACT","snapshot":"sha256:329bea17480118aa079227d2834876f5d3f6b246835014131095579bc8c04ed5","retrievedSeq":23,"root":"root-slot-0","notes":[{"text":"narrative review of OCTA macular/choroidal microvasculature in glaucoma for diagnosis and monitoring; vascular readout relevance only, no cellular mechanism or subtype vulnerability.","seq":28},{"text":"narrative review of OCTA macular retinal/choroidal microvasculature in glaucoma; vascular imaging correlates with visual field, but no RGC subtype or mechanistic evidence; low relevance to the subtype-vulnerability causal chain.","seq":64},{"text":"Narrative review of OCTA macular retinal/choroidal imaging in glaucoma; vascular-structural-functional correlations; diagnostic/monitoring scope only, no RGC subtype or causal mechanism; low relevance.","seq":96},{"text":"narrative review of OCT angiography of macular retina and choroid in glaucoma; vascular imaging correlations with visual field, no cellular or subtype mechanisms; low-moderate relevance as a microvascular-dysfunction angle only.","seq":128}],"candidates":["proposal-rgc-akap1-first","offspring-g3-slot-1-hypothesis","proposal-rgc-fgf1-energy-dependence","proposal-rgc-fgf1-subtype-energy-gate-v2","proposal-rgc-subtype-axon-compartment-gate-v1","proposal-rgc-energy-complement-gate","proposal-rgc-subtype-mito-gate-v1","offspring-g2-slot-0-hypothesis","proposal-rgc-intracellular-cfh","proposal-rgc-axonal-atp-complement-gate-v1"],"reviewed":true},{"id":"pubmed:42839614","title":"Modulation of Presynaptic Inhibitory Retinal Circuits for Retinal Ganglion Cell Neuroprotection in Glaucoma.","text":"Glaucoma is a leading cause of irreversible blindness, yet the circuit-level mechanisms contributing to retinal ganglion cell (RGC) degeneration remain incompletely defined. Although multiple neuroprotective strategies have been explored, clinical translation remains limited. Here, we identify early dysfunction of inner retinal inhibitory circuitry as a modifiable contributor to RGC vulnerability during ocular hypertensive stress. In mouse ocular hypertension models, inner nuclear layer neurons exhibited increased c-fos expression and enhanced oscillatory potential-associated differential electroretinography signals before substantial RGC loss was detected, suggesting early retinal circuit hyperactivity. Broad pharmacological attenuation of GABAergic and glycinergic inhibitory signaling improved RGC survival without reducing intraocular pressure, supporting a functional contribution of inhibitory neurotransmission to RGC vulnerability. Moreover, Cre-dependent AAV delivery of Lin28, an RNA-binding regulator of post-transcriptional gene expression, to Vgat-positive inhibitory interneurons increased RGC survival compared with Vgat-EGFP controls and Vglut2-lineage Lin28 expression. Vgat-targeted Lin28 also reduced c-fos expression and oscillatory potential-associated differential electroretinogram abnormalities, indicating suppression of ocular hypertension-associated inner retinal hyperactivity. In addition, ocular hypertension was associated with altered sleep architecture, and Vgat-targeted Lin28 expression was associated with mitigation of these alterations. These findings position presynaptic inhibitory retinal circuitry as an early and modifiable contributor to glaucomatous RGC vulnerability.","level":"ABSTRACT","snapshot":"sha256:1d10df208be510f0d041ee899638470bcf16006f1afe0d8ee294b1926ae042f8","retrievedSeq":23,"root":"root-slot-0","notes":[{"text":"mouse ocular hypertension study reporting early inner retinal circuit hyperactivity (c-fos, oscillatory potentials) before RGC loss, and that GABA/glycinergic attenuation or Vgat-targeted Lin28 improves RGC survival independent of IOP; proposes presynaptic inhibitory circuitry as early modifiable contributor, circuit-level rather than subtype-specific.","seq":28},{"text":"mouse ocular hypertension study showing early inner retinal hyperactivity (c-fos, oscillatory potentials) before RGC loss, and that GABAergic/glycinergic attenuation or Vgat-targeted Lin28 improves RGC survival without IOP reduction; provides circuit-level, activity-dependent mechanism of vulnerability, but not subtype-resolved except by interneuron lineage.","seq":64},{"text":"Mouse ocular hypertension; early inner retinal inhibitory circuit hyperactivity (c-fos, oscillatory potentials) precedes RGC loss; broad GABA/glycinergic attenuation and Vgat-targeted Lin28 improved RGC survival independent of IOP; circuit-level mechanism, not subtype-resolved, pharmacologic breadth limits specificity.","seq":96},{"text":"mouse ocular hypertension study reporting early inner retinal inhibitory-circuit hyperactivity (c-fos, oscillatory-potential ERG) before RGC loss, RGC survival benefit from broad GABA/glycinergic attenuation without IOP change, and Vgat-targeted Lin28 increasing survival versus Vgat-EGFP and Vglut2-lineage controls; strong evidence for circuit/glia-adjacent presynaptic mechanisms, but not subtype-resolved.","seq":128}],"candidates":["proposal-rgc-akap1-first","offspring-g3-slot-1-hypothesis","proposal-rgc-fgf1-energy-dependence","proposal-rgc-fgf1-subtype-energy-gate-v2","proposal-rgc-subtype-axon-compartment-gate-v1","proposal-rgc-energy-complement-gate","proposal-rgc-subtype-mito-gate-v1","offspring-g2-slot-0-hypothesis","proposal-rgc-intracellular-cfh","proposal-rgc-axonal-atp-complement-gate-v1"],"reviewed":true},{"id":"pubmed:42838417","title":"Rodent models of glaucoma: Pathogenic mechanisms, phenotyping strategies, and translational relevance.","text":"Glaucoma comprises a heterogeneous group of optic neuropathies characterized by progressive degeneration of retinal ganglion cells (RGCs) and their axons. Rodent models have been widely used to investigate disease mechanisms, identify neuroprotective targets and evaluate emerging therapeutic strategies because they are cost-effective, genetically tractable and experimentally controllable. However, mice and rats differ substantially from humans in anterior-segment anatomy, trabecular meshwork architecture, Schlemm's canal development, lamina cribrosa structure, RGC composition and optic nerve head vascular supply. These interspecies differences influence model construction, phenotypic interpretation and the translational value of preclinical findings. This narrative review summarizes key anatomical differences between rodent and human eyes and discusses major categories of rodent glaucoma models, including intraocular pressure (IOP)-dependent models, IOP-independent models, immune-mediated and multifactorial models, and spontaneous or genetically engineered models. We emphasize that no single rodent model can fully reproduce the chronic, multifactorial, and regionally selective nature of human glaucoma. Instead, model selection should be driven by the specific scientific question, disease subtype, observation window, and translational goal. IOP-dependent models are particularly useful for investigating pressure-induced RGC degeneration and optic nerve injury, while selected models also reproduce aspects of aqueous outflow dysfunction, linking anterior-segment abnormalities with posterior-segment neurodegeneration. IOP-independent and genetic models, by contrast, are ideal for studying normal-tension glaucoma, neurodegeneration, neuroinflammation, metabolic stress, and gene-specific mechanisms. Future efforts should prioritize standardized phenotypic evaluation, multimodal imaging and multi-omics integration to improve the reliability and translational relevance of findings from rigorously validated rodent models.","level":"ABSTRACT","snapshot":"sha256:d3227b6d64d1cefa70ac85bef98c8e1de5b946f8e6d9b07988e4df7c3d3e215c","retrievedSeq":23,"root":"root-slot-0","notes":[{"text":"review of rodent glaucoma models and rodent-human differences (trabecular meshwork, Schlemm's canal, lamina cribrosa, RGC composition, ONH vasculature); key translational and model-selection constraint for any subtype hypothesis.","seq":28},{"text":"review of rodent glaucoma models cataloguing anatomical species differences (lamina cribrosa, RGC composition, optic nerve head vasculature) and model classes; essential translational caveat for any subtype-vulnerability claim, but does not itself report subtype data.","seq":64},{"text":"Narrative review of rodent glaucoma models; details mouse/rat vs human differences in anterior segment, trabecular meshwork, Schlemm's canal, lamina cribrosa, RGC composition and ONH vasculature; key species-translation constraint for any subtype hypothesis; no primary data.","seq":96},{"text":"review of rodent glaucoma models detailing mouse/rat versus human differences in anterior segment, trabecular meshwork, Schlemm's canal, lamina cribrosa, RGC composition and optic nerve head vasculature, and arguing no single model reproduces human regionally selective disease; essential for interpreting species and model limits of all subtype claims.","seq":128}],"candidates":["proposal-rgc-akap1-first","offspring-g3-slot-1-hypothesis","proposal-rgc-fgf1-energy-dependence","proposal-rgc-fgf1-subtype-energy-gate-v2","proposal-rgc-subtype-axon-compartment-gate-v1","proposal-rgc-energy-complement-gate","proposal-rgc-subtype-mito-gate-v1","offspring-g2-slot-0-hypothesis","proposal-rgc-intracellular-cfh","proposal-rgc-axonal-atp-complement-gate-v1"],"reviewed":true},{"id":"pubmed:42802966","title":"Expression of miR-802 in glaucoma and its diagnostic significance.","text":"INTRODUCTION AND OBJECTIVE: Glaucoma ranks as the second leading cause of blindness globally. The key factors leading to glaucoma are increased intraocular pressure and retinal ganglion cell apoptosis. Glaucoma is an irreversible disease that causes blindness in the eye, characterized by progressive optic nerve damage and visual field defects. The expression of miR-802 is abnormal in the plasma of glaucoma patients, but its function and mechanism remain unclear. The aim of the study is to investigate the expression of miR-802 in glaucoma and retinal ganglion cells, and the effect of miR-802 on 661W cells under oxidative stress.\nMATERIAL AND METHODS: The study used RT-qPCR to detect the expression level of miR-802 in 661W cells and glaucoma patients. Receiver operating characteristic curve (ROC) was used to assess the diagnostic value of miR-802 in glaucoma. Cell viability was assessed using the Cell Counting Kit-8 (CCK-8) assay, while cell apoptosis was detected via flow cytometry.\nRESULTS: In glaucoma patients, miR-802 expression was significantly downregulated and correlated with elevated IOP, reduced RNFL, and increased eGFR. MiR-802 demonstrated exceptional diagnostic value for the onset of glaucoma. In addition, decreased miR-802 expression was a risk factor associated with glaucoma. MiR-802 accelerated the proliferation of 661W cells and slowed down the apoptosis rate. Moreover, miR-802 mimic inhibited H2O2-induced 661W cell apoptosis.\nCONCLUSIONS: Upregulation of miR-802 alleviated oxidative stress-induced damage in 661W cells. miR-802 might be used as a marker for detecting glaucoma.","level":"ABSTRACT","snapshot":"sha256:5824763d9390700df61af25591f240656ac86d53da220985225a1c85a2e0b953","retrievedSeq":23,"root":"root-slot-0","notes":[{"text":"clinical/cell-culture study of miR-802 in glaucoma plasma showing downregulation and diagnostic value, and reduced H2O2-induced apoptosis in 661W cells; biomarker-level and a photoreceptor-line cell line, so RGC subtype relevance is limited and indirect.","seq":28},{"text":"human plasma and 661W cell study reporting miR-802 downregulation in glaucoma correlating with IOP, RNFL and eGFR, with miR-802 mimic protecting against H2O2-induced apoptosis; 661W is a cone-like line, not RGCs, and no subtype analysis; low direct relevance.","seq":64},{"text":"miR-802 downregulated in glaucoma patient plasma, correlated with IOP, RNFL and eGFR; miR-802 mimic reduced H2O2-induced apoptosis in 661W cells; biomarker-oriented, 661W is a cone-like line not RGC, low mechanistic relevance.","seq":96},{"text":"clinical RT-qPCR plus 661W cell study reporting reduced plasma miR-802 in glaucoma, diagnostic value and protection against H2O2-induced apoptosis; 661W is a cone-derived line, limiting RGC inference; low direct relevance to subtype vulnerability.","seq":128}],"candidates":["proposal-rgc-akap1-first","offspring-g3-slot-1-hypothesis","proposal-rgc-fgf1-energy-dependence","proposal-rgc-fgf1-subtype-energy-gate-v2","proposal-rgc-subtype-axon-compartment-gate-v1","proposal-rgc-energy-complement-gate","proposal-rgc-subtype-mito-gate-v1","offspring-g2-slot-0-hypothesis","proposal-rgc-intracellular-cfh","proposal-rgc-axonal-atp-complement-gate-v1"],"reviewed":true},{"id":"pubmed:42801048","title":"Hyaluronic Acid-PEG-PLGA Nanoparticles Encapsulating Myricetin Attenuate NMDA-Induced Retinal Ganglion Cell Injury Associated with Microglia-Related Neuroinflammatory Responses.","text":"BACKGROUND: Retinal ganglion cell (RGC) injury caused by excitotoxic stress is an important component of retinal neurodegeneration. Microglia-mediated inflammatory responses can amplify neuronal damage following injury. Myricetin (MY), a natural flavonoid with anti-inflammatory properties, has potential neuroprotective activity but is limited by poor aqueous delivery characteristics. This study aimed to develop a nanoparticle-based delivery system for MY and evaluate its protective effects against NMDA-induced retinal injury.\nMETHODS: MY was encapsulated into hyaluronic acid-polyethylene glycol-poly (lactic-co-glycolic acid) nanoparticles (MY-NPs). Nanoparticle characteristics, including particle size, drug loading, encapsulation efficiency, morphology, and in vitro release profile, were evaluated. An NMDA-induced retinal injury model was established in mice, followed by intravitreal administration of MY-NPs. Retinal function, RGC survival, apoptosis, inflammatory responses, and microglial activation were assessed using electroretinography, optomotor testing, immunofluorescence, histological analysis, TUNEL staining, RNA sequencing, and quantitative PCR. The anti-inflammatory effects of MY-NPs were further evaluated in activated BV2 microglia and microglia-conditioned medium-treated R28 cells.\nRESULTS: MY-NPs showed favorable physicochemical properties, with an average diameter of 67.1 nm, drug loading of approximately 7.4%, and encapsulation efficiency above 80%. The nanoparticles exhibited a biphasic release profile with prolonged myricetin release over 96 h. In NMDA-treated mice, MY-NPs improved retinal function, preserved RGC density, reduced retinal apoptosis, and decreased TNF-α expression. Transcriptomic analysis indicated that NMDA-induced injury was associated with inflammatory pathways, including cytokine-cytokine receptor interaction, JAK-STAT signaling, and TNF sig
