function alsSources(){const s=ALS_RECORD.evidence.find(x=>x.key===ALS_UI.source)||ALS_RECORD.evidence[0];return `<div class="als-source-intro panel"><div><span class="als-upper">SOURCE VIEWS / FIXED INPUT</span><h2>已保存的文献与背景</h2><p>此候选实际使用五份固定来源视图：四份摘要类表示和一份 TDP-43 局部 Results。不能将视图数量当成独立复现次数、系统检索覆盖或全文阅读数。</p></div><div class="als-meta">${alsPill('5 份实际输入视图')}${alsPill('无图像／补充材料访问','neutral')}</div></div><div class="als-hyp-grid"><aside class="panel als-source-list"><div class="als-list-head"><h3>来源材料</h3><p>点击查看报告要点及范围</p></div>${ALS_RECORD.evidence.map(x=>`<button class="als-source-item ${ALS_UI.source===x.key?'selected':''}" data-action="als-source" data-id="${x.key}"><small>${E(x.category)} · ${E(x.id)}</small><b>${E(x.title)}</b><span>${E(x.range)}</span></button>`).join('')}</aside><section class="panel als-source-detail"><div class="als-upper">${E(s.category)} · ${E(s.kind)}</div><h2>${E(s.title)}</h2><div class="als-meta">${alsPill(s.id)}${alsPill(s.range)}</div>${alsSectionHeader('WHAT THE SAVED VIEW REPORTS','实际读取材料的要点')}<p class="als-source-paragraph">${E(s.point)}</p>${alsSectionHeader('EPISTEMIC BOUNDARY','不能从中直接推断什么')}<div class="als-warning-inline"><span>${E(s.limit)}</span></div>${alsSectionHeader('ACCESS & TRACE','来源与追溯')}<dl class="als-source-dl"><dt>来源身份</dt><dd>${E(s.id)}</dd><dt>读取范围</dt><dd>${E(s.range)}</dd><dt>冻结材料引用</dt><dd><code>${E(s.ref)}</code></dd><dt>文献实际原文</dt><dd>请查阅已保存的原始 source-views.json；本 Demo 展示阅读要点而非伪造逐字引文。</dd></dl><div class="als-actions">${alsLink(ALS_RECORD.links.sources,'打开真实固定来源 JSON')}${alsLink(ALS_RECORD.links.candidate,'查看候选中的 evidence_anchors')}<button class="button" data-action="tab" data-id="hypotheses">返回假说</button></div></section></div><section class="panel als-bg-reserve"><span class="als-upper">BACKGROUND RESEARCH</span><h3>背景调研和 Seed</h3><p>Europe PMC 检索、背景 P03–P07、Seed readiness 均已有实现。当前页面保留背景访问与准备的产品位置；更多结果应从新系统的实际背景包接入，不将旧 G3 文献和新 ALS 来源混用。</p><div class="als-bg-tags"><span>文献获取 ✓</span><span>背景整理 ✓</span><span>Seed 固定背景包 ✓</span><span>readiness ✓</span></div><button data-action="tab" data-id="process" class="linkBtn">查看执行轨迹 ${I('arrow','sm')}</button></section>`}
function alsRunning(){const item=ALS_RECORD.events[ALS_UI.stage];return `<div class="als-running"><section class="panel als-status-panel"><div class="als-flex"><div><span class="als-upper">RUN STATUS · READ ONLY</span><h2>当前阶段：等待 M03／R1</h2><p>截至本次真实试跑，P08、P09、P10 的持久化结果已保存。R1 尚未执行。</p></div><div class="als-meta">${alsPill('当前不执行模型','neutral')}${alsPill('awaiting_r1','positive')}</div></div><div class="als-stage-scrub"><div class="als-flex"><b>浏览已保存历史节点</b><small>历史浏览，不是远端执行控制</small></div><div class="als-scrub-actions"><button class="button narrow" data-action="als-stage" data-id="prev">${I('back','sm')} 上一个</button><input id="als-stage-range" data-control="als-stage-range" type="range" min="0" max="6" value="${ALS_UI.stage}" aria-label="查看历史节点"/><button class="button narrow" data-action="als-stage" data-id="next">下一个 ${I('arrow','sm')}</button><button class="button narrow" data-action="als-stage" data-id="latest">最新</button></div><div class="als-stage-detail"><div class="als-stage-dot">${ALS_UI.stage+1}/7</div><div><small>${E(item.phase)} · ${E(item.state)}</small><h3>${E(item.label)}</h3><b>${E(item.sub)}</b><p>${E(item.detail)}</p></div></div></div></section><div class="als-metric-row"><div class="als-metric"><strong>1</strong><span>已保存真实候选</span></div><div class="als-metric"><strong>2</strong><span>已完成真实审查操作</span></div><div class="als-metric"><strong>5</strong><span>候选固定来源视图</span></div><div class="als-metric"><strong>0</strong><span>已完成 R1 检查</span></div></div><div class="als-running-grid"><section class="panel als-status-details"><span class="als-upper">PERSISTED RESULTS</span><h3>真实执行与审查</h3>${ALS_RECORD.events.slice(2,7).map((x,i)=>`<button class="als-run-event" data-action="als-stage" data-id="${i+2}"><span class="als-run-marker ${i===4?'pending':''}"></span><div><b>${E(x.label)}</b><small>${E(x.sub)}</small></div><span>${E(x.state)}</span></button>`).join('')}</section><section class="panel als-status-details"><span class="als-upper">OPERATIONS & RELIABILITY</span><h3>执行控制与历史调用</h3><p>刷新、阅读和再次打开本文件不会发送模型请求。正式系统的“同 ID 查询”“明确恢复”“重新生成”是不同操作；当前离线 Demo 不会模拟真实发送。</p><div class="als-ops"><div><b>远端任务</b><span>P09 / P10 完成，均有已保存 response ID</span></div><div><b>历史不确定调用</b><span>原 P08 两次及原 P09 Attempt 的执行／收费未知记录保留，不自动重试</span></div><div><b>费用</b><span>未知（不能展示为 0）</span></div><div><b>研发控制</b><span>查看只读资料；没有暂停、恢复或重新生成的真实授权</span></div></div><details class="als-detail"><summary>模型调用与用量（技术详情） <span>完整记录可追溯</span></summary><div class="als-tech"><div><b>P09</b><span>8611 输入 / 1541 输出（含 511 reasoning）/ 10152 total</span></div><div><b>P10</b><span>15668 输入 / 2018 输出（含 776 reasoning）/ 17686 total</span></div><div><b>统计规则</b><span>对每个 response ID 仅计一次最终累计 usage，不重复累加 GET。</span></div></div><div class="als-original-links">${alsLink(ALS_RECORD.links.p09,'P09 原始记录')}${alsLink(ALS_RECORD.links.p10,'P10 原始记录')}</div></details></section></div><div class="als-v5-bridge">${I('clock','sm')} <div><b>需要体验 V5 的播放、暂停、进度拖动和 G0–G3 候选实时阅读原型？</b><p>这些交互全部保留在独立的历史 G3 演示中；不会拿来冒充本次 ALS 真实运行。</p></div><button class="button" data-action="open-run" data-id="seed">打开 V5 运行回放</button></div></div>`}
function alsProcess(){return `<div class="als-process-grid"><section class="panel als-process-side"><span class="als-upper">RESEARCH JOURNEY</span><h3>科研过程</h3>${ALS_RECORD.events.map((x,i)=>`<button class="als-process-milestone ${i===ALS_UI.stage?'active':''}" data-action="als-stage" data-id="${i}"><span>${i+1}</span><div><b>${E(x.phase)}</b><small>${E(x.state)}</small></div></button>`).join('')}</section><section class="panel als-process-main"><div class="als-flex"><div><span class="als-upper">EVENT LOG / SCIENTIFIC TIMELINE</span><h3>已保存的里程碑</h3><p>以科学事件而非底层 Attempt 为默认阅读顺序。</p></div><button class="button" data-action="tab" data-id="running">查看运行实况</button></div>${ALS_RECORD.events.map((x,i)=>`<div class="als-timeline-entry ${i===ALS_UI.stage?'active':''}"><span class="als-timeline-index">${String(i+1).padStart(2,'0')}</span><div><div class="als-meta">${alsPill(x.phase)}${alsPill(x.state,i===6?'neutral':'positive')}</div><h4>${E(x.label)}</h4><p>${E(x.detail)}</p><small>${E(x.sub)}</small></div><button class="linkBtn" data-action="als-stage" data-id="${i}">定位</button></div>`).join('')}<div class="als-process-footer"><b>后续设计预留（沿用 V5）</b><p>M03 主张组织 → R1 / R2 / R3 科学核验 → Pairwise Ranking → Evolution → 候选选择 → 后续实验规划。当前 ALS 研究均不展示这些未产生的结果。</p><button class="button" data-action="open-study" data-id="seed">查看 V5 的完整 G3 排序与演化历史演示</button></div></section></div>`}
function alsExport(){const lines=[`# ${ALS_RECORD.title}`,'','来源：2026-11-05 / PR #19 隔离非生产试跑记录','',`## 科学问题\n${ALS_RECORD.question}`,`## 候选主张\n${ALS_RECORD.claim}`,`## 重要未知\n${ALS_RECORD.unknowns.map((x,i)=>(i+1)+'. '+x).join('\n')}`,`## R1 待核查\n${ALS_RECORD.r1Checks.map((x,i)=>(i+1)+'. '+x).join('\n')}`,`## 审查结论\nP09: pass（限定 development 非生产用途）；P10: proceed_to_R1；science_validated=false`, `## 记录链接\n${ALS_RECORD.links.pr}`];downloadText('co_scientist_ALS_research_reading_demo.md',lines.join('\n\n'),'text/markdown;charset=utf-8');toast('已导出 ALS 阅读摘要（不包含内部技术记录）')}
function alsAction(action,id){
 if(action==='als-source'){ALS_UI.source=id;state.tab='sources';render();window.scrollTo({top:0,behavior:'instant'});return}
 if(action==='als-stage'){const n=Number(id);ALS_UI.stage=id==='prev'?Math.max(0,ALS_UI.stage-1):id==='next'?Math.min(6,ALS_UI.stage+1):id==='latest'?6:Number.isFinite(n)?Math.max(0,Math.min(6,n)):6;render();return}
 if(action==='als-scroll'){const n=document.getElementById('als-'+id);if(n)n.scrollIntoView({behavior:'smooth',block:'start'});return}
 if(action==='als-jump'){state.tab='hypotheses';render();setTimeout(()=>document.getElementById('als-'+id)?.scrollIntoView({behavior:'smooth',block:'start'}),30);return}
 if(action==='als-note-choice'){ALS_UI.note=el('als-note-text')?.value||ALS_UI.note;ALS_UI.noteStatus=id;try{localStorage.setItem('co-scientist-v6-als-note-status',id)}catch{}render();return}
 if(action==='als-save-note'){ALS_UI.note=el('als-note-text')?.value||'';try{localStorage.setItem('co-scientist-v6-als-note',ALS_UI.note);toast('个人笔记已保存到本机浏览器')}catch{toast('已记录在本次预览中，浏览器禁止持久保存')}return}
 if(action==='als-export')return alsExport();
 if(action==='als-new'){state.linkParent='als';state.form={title:'ALS 核孔蛋白磷酸化机制后续研究',question:ALS_RECORD.question,background:'',process:'',outputs:''};state.createStep=0;navigate('create');return}
 if(action==='als-focus'){state.tab='hypotheses';render();return}
}

render();
})();
</script>
