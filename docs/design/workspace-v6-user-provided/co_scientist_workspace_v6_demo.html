naling, whereas MY-NPs attenuated the expression of inflammatory-related genes. MY-NPs also reduced pro-inflammatory activation markers and inflammatory mediator production in activated BV2 microglia and alleviated apoptosis of R28 cells induced by activated microglial conditioned medium.\nCONCLUSION: HA-PEG-PLGA nanoparticles provide an effective delivery platform for myricetin and MY-NPs are associated with protection against NMDA-induced excitotoxic retinal injury. The observed neuroprotective effects were accompanied by reduced microglial activation and inflammatory responses, suggesting that attenuation of microglia-associated inflammation may contribute to RGC preservation. Further validation in chronic glaucoma-relevant models is required to determine the translational potential of this strategy.","level":"ABSTRACT","snapshot":"sha256:a9b2caa260ed836aca1fbc5ef6bfb12ff1365c3b229118aad151a8abe0a34260","retrievedSeq":23,"root":"root-slot-0","notes":[{"text":"mouse NMDA excitotoxicity study showing myricetin nanoparticles preserve RGCs and reduce microglial inflammation (JAK-STAT, TNF, cytokine pathways); supports glia-amplified excitotoxic injury but uses acute NMDA, not chronic IOP, and no subtype comparison.","seq":28},{"text":"NMDA excitotoxicity mouse study with myricetin nanoparticles showing preserved RGC density, reduced apoptosis and microglial inflammatory markers plus BV2/R28 in vitro support; relevant to glia-amplified excitotoxic death, but acute NMDA model, not chronic IOP, and no subtype comparison.","seq":64},{"text":"NMDA excitotoxicity mouse model; myricetin nanoparticles improved ERG, RGC density, reduced TNF-alpha and microglial activation; microglia-conditioned medium protection in R28; excitotoxic rather than chronic IOP model; authors note chronic glaucoma validation needed; no subtype specificity.","seq":96},{"text":"mouse NMDA excitotoxicity study showing HA-PEG-PLGA myricetin nanoparticles improve ERG, RGC density and apoptosis with reduced microglial activation and inflammatory transcripts; authors note chronic glaucoma models still required; supports glia-amplified excitotoxic injury but not IOP-stress or subtype specificity.","seq":128}],"candidates":["proposal-rgc-akap1-first","offspring-g3-slot-1-hypothesis","proposal-rgc-fgf1-energy-dependence","proposal-rgc-fgf1-subtype-energy-gate-v2","proposal-rgc-subtype-axon-compartment-gate-v1","proposal-rgc-energy-complement-gate","proposal-rgc-subtype-mito-gate-v1","offspring-g2-slot-0-hypothesis","proposal-rgc-intracellular-cfh","proposal-rgc-axonal-atp-complement-gate-v1"],"reviewed":true},{"id":"pubmed:42799797","title":"Evaluation of serum myelin basic protein in POAG patients at a tertiary institution in Lagos, Nigeria.","text":"PURPOSE: Glaucoma, a neurodegenerative disorder, causes retinal ganglion cell damage and loss of neurons in the visual system up to the visual cortex. The loss of myelin sheath leads to the release of myelin sheath components, including the myelin basic protein (MBP), into the bloodstream. While MBP has shown promise as a biomarker for glaucoma in some Asian populations, data among individuals of African descent remain limited. This study evaluated the serum levels of MBP in primary open-angle glaucoma (POAG) patients compared to non-glaucoma controls, with the aim of reporting its usefulness as a biomarker for glaucoma detection in an African population.\nMETHODS: This cross-sectional study compared serum MBP levels in treatment-naive primary open-angle glaucoma (POAG) patients and non-glaucoma controls. Blood samples were collected from 83 treatment-naive POAG participants and 83 age and sex matched non-glaucoma participants and analyzed using enzyme-linked immunosorbent assay (ELISA).\nRESULTS: The mean age of POAG participants was 50.78 ± 17.3 years, with a male predilection. The mean intraocular pressure (IOP) was significantly higher in POAG patients (18.22 ± 6.8 mmHg) than in controls (13.89 ± 2.5 mmHg). Serum MBP levels were significantly elevated in POAG patients (1128.75 ng/L) compared to controls (963.75 ng/L; p \u003c 0.001). There was no significant correlation between MBP levels and disease severity. MBP levels were higher in high-tension glaucoma and females; however, the difference was not statistically significant.\nCONCLUSION: Findings supported the neurodegenerative state of POAG and the use of serum MBP levels as a potential biomarker for early POAG detection.","level":"ABSTRACT","snapshot":"sha256:7eefd7fb7ea734c0cc017b0eb3e0cbae3af430e817fb378581700ccf1739f1c8","retrievedSeq":23,"root":"root-slot-0","notes":[{"text":"cross-sectional Nigerian case-control (83 vs 83) showing elevated serum myelin basic protein in treatment-naive POAG; biomarker evidence of axonal/myelin breakdown, no mechanism or subtype resolution.","seq":28},{"text":"cross-sectional Nigerian POAG study reporting elevated serum myelin basic protein with no correlation to disease severity; biomarker-level evidence of myelin/axonal breakdown, but no subtype or mechanistic content; marginal relevance.","seq":64},{"text":"Cross-sectional Nigerian POAG study; serum MBP elevated vs controls but not correlated with severity; biomarker only; no mechanism, no subtype vulnerability; low relevance.","seq":96},{"text":"cross-sectional Nigerian study reporting higher serum myelin basic protein in treatment-naive POAG with no correlation to severity; biomarker association only, cannot inform axonal degeneration mechanism or subtype vulnerability; low relevance.","seq":128}],"candidates":["proposal-rgc-akap1-first","offspring-g3-slot-1-hypothesis","proposal-rgc-fgf1-energy-dependence","proposal-rgc-fgf1-subtype-energy-gate-v2","proposal-rgc-subtype-axon-compartment-gate-v1","proposal-rgc-energy-complement-gate","proposal-rgc-subtype-mito-gate-v1","offspring-g2-slot-0-hypothesis","proposal-rgc-intracellular-cfh","proposal-rgc-axonal-atp-complement-gate-v1"],"reviewed":true},{"id":"pubmed:42780315","title":"Impaired regulatory T-cell-mediated immune tolerance promotes neurodegeneration in glaucoma.","text":"Neurodegenerative diseases are increasingly recognized to involve detrimental interactions between the immune and nervous systems, yet whether failure of peripheral immune tolerance actively drives neuronal loss frequently remains unclear. Here, using primary open-angle glaucoma as a model of chronic neurodegeneration, we demonstrate that dysregulated adaptive immunity is sufficient to promote retinal ganglion cell degeneration. Peripheral blood mononuclear cells from glaucoma patients, but not healthy donors, induced retinal ganglion cell loss following transfer into humanized immunodeficient mice without changes to the intraocular pressure, demonstrating a causal role for immune responses in the patient derived material. Comprehensive immune profiling further revealed selective changes in the regulatory T-cell compartment, indicating reduced activation, an impaired suppressive phenotype, and altered differentiation and trafficking states despite preserved overall regulatory T-cell abundance. We further demonstrate that transient expansion of regulatory T cells preserves visual function, reduced optic nerve axonal degeneration, and limited retinal ganglion cell loss in an experimental glaucoma model. Together, these findings identify failure of regulatory T-cell-mediated immune tolerance as a mechanism that permits neurodegeneration in glaucoma and demonstrate that restoring immune regulation can ameliorate neuronal injury. Our data indicate that immune tolerance is a modifiable determinant of chronic neurodegeneration and suggest that immunoregulatory therapies may complement conventional pressure-lowering treatments to preserve vision in glaucoma.","level":"ABSTRACT","snapshot":"sha256:7e9415d42ec9fec9a16393447ff410b60146d2e87abeb13c4b3133e8b23ed607","retrievedSeq":23,"root":"root-slot-0","notes":[{"text":"humanized mouse transfer and Treg expansion experiments showing glaucoma-patient PBMCs cause IOP-independent RGC loss and Treg expansion preserves axons and visual function; strong causal adaptive-immune evidence but not subtype-specific.","seq":28},{"text":"demonstrates that glaucoma-patient PBMCs cause RGC loss in humanized immunodeficient mice without IOP change, identifies impaired regulatory T-cell suppression, and shows Treg expansion preserves axons and RGCs; strong causal glia/immune-extrinsic mechanism independent of pressure, but subtype-agnostic.","seq":64},{"text":"Transfer of POAG patient PBMCs into humanized immunodeficient mice caused RGC loss without IOP change; regulatory T-cell suppressive phenotype impaired; transient Treg expansion preserved vision and reduced axon degeneration in experimental glaucoma; causal adaptive-immune arm, but not subtype-specific and humanized mouse limits.","seq":96},{"text":"reports that glaucoma-patient PBMCs, but not healthy-donor PBMCs, cause RGC loss after transfer into humanized immunodeficient mice without IOP change, that regulatory T cells show impaired suppressive phenotype, and that transient Treg expansion preserves visual function and limits axonal degeneration in experimental glaucoma; strong causal evidence for adaptive immune tolerance as a pressure-independent determinant, but not subtype-resolved.","seq":128}],"candidates":["proposal-rgc-akap1-first","offspring-g3-slot-1-hypothesis","proposal-rgc-fgf1-energy-dependence","proposal-rgc-fgf1-subtype-energy-gate-v2","proposal-rgc-subtype-axon-compartment-gate-v1","proposal-rgc-energy-complement-gate","proposal-rgc-subtype-mito-gate-v1","offspring-g2-slot-0-hypothesis","proposal-rgc-intracellular-cfh","proposal-rgc-axonal-atp-complement-gate-v1"],"reviewed":true},{"id":"pubmed:42769470","title":"Association of serum TIM-3 and Galectin-9 levels with glaucoma progression: implications for clinical monitoring.","text":"BACKGROUND: Primary open-angle glaucoma (POAG) causes irreversible blindness via retinal ganglion cell loss. Neuroinflammation and immune dysfunction drive its progression, yet the role of the TIM-3/Galectin-9 axis remains unclear.\nOBJECTIVE: To investigate the association of serum soluble TIM-3 (sTIM-3) and Galectin-9 levels with the progression of primary open-angle glaucoma (POAG).\nMETHODS: This retrospective analysis enrolled POAG patients from our ophthalmology department (January 2022-December 2024). After a minimum 12-month follow-up, participants were categorized as progression or stable based on visual field and optical coherence tomography (OCT) assessments. Healthy controls were age/sex-matched. Recorded clinical variables included IOP, CCT, visual fields, and OCT measures. Baseline concentrations of sTIM-3 and Galectin-9 in serum were determined by ELISA. Multivariate logistic regression assessed independent links between these markers and disease progression, supplemented by trend tests, E-value calculations, and subgroup analyses.\nRESULTS: The study included 120 POAG patients (52 progression, 68 stable) and 60 healthy controls. Baseline measures were balanced across groups. Both sTIM-3 and Galectin-9 were significantly elevated in progression relative to stable patients and controls (all P \u003c 0.001). Multivariate logistic regression identified sTIM-3 (OR = 2.14, P = 0.004) and Galectin-9 (OR = 3.39, P \u003c 0.001) as independent factors linked to disease progression. Trend analyses revealed dose-response patterns (P for trend = 0.015 and 0.004, respectively). These findings were further corroborated by E-value and subgroup analyses, supporting their robustness.\nCONCLUSIONS: Higher baseline sTIM-3 and Galectin-9 levels correlate independently with POAG progression risk, showing a dose-response pattern. These biomarkers may serve as adjunctive references for risk stratification, although their utility warrants prospective validation with longitudinal sampling.","level":"ABSTRACT","snapshot":"sha256:3c589c933c96e8d1bac0b385701ecb1daa6936058cfcdffe056ffac8df0d1597","retrievedSeq":23,"root":"root-slot-0","notes":[{"text":"retrospective clinical study (120 POAG, 60 controls) associating elevated serum sTIM-3 and Galectin-9 with progression in dose-response fashion; prognostic biomarker correlation, explicitly not causal.","seq":28},{"text":"retrospective POAG cohort associating elevated serum sTIM-3 and Galectin-9 with progression and dose-response; supports neuroimmune biomarkers of progression, but correlational, no subtype or cell-intrinsic mechanism.","seq":64},{"text":"retrospective POAG cohort associating higher baseline serum sTIM-3 and Galectin-9 with progression in dose-response fashion; immune-axis biomarker association, no mechanistic or subtype data; low-moderate relevance.","seq":128}],"candidates":["proposal-rgc-akap1-first","offspring-g3-slot-1-hypothesis","proposal-rgc-fgf1-energy-dependence","proposal-rgc-fgf1-subtype-energy-gate-v2","proposal-rgc-subtype-axon-compartment-gate-v1","proposal-rgc-energy-complement-gate","proposal-rgc-subtype-mito-gate-v1","offspring-g2-slot-0-hypothesis","proposal-rgc-axonal-atp-complement-gate-v1"],"reviewed":true},{"id":"pubmed:42769369","title":"Tau abnormalities and microglial remodeling in glaucoma: potential links to phagocytosis-related injury.","text":"BACKGROUND: Glaucoma is a progressive optic neuropathy characterized by retinal ganglion cell degeneration and optic nerve damage. Increasing evidence indicates that glaucomatous injury is not limited to the retina, but may also involve downstream visual structures and neuroimmune responses. Tau abnormalities and microglial remodeling have each been reported in glaucoma models and human glaucomatous tissues, yet they are usually discussed as separate pathological findings. Whether these processes are connected, and how they might contribute to synaptic, dendritic, and axonal injury, remains insufficiently defined.\nREVIEW FOCUS: This review examines current evidence for tau dysregulation and glaucoma-associated microglial remodeling in glaucoma. Experimental studies support retinal tau accumulation, altered phosphorylation, and redistribution from axonal to somatodendritic compartments after intraocular pressure elevation, whereas evidence for oligomeric tau remains limited to a single rat ocular-hypertension study. In parallel, glaucoma-associated microglia show loss of homeostatic signatures and acquisition of neurodegeneration-associated features, including APOE/Galectin-3-related remodeling, complement activation, inflammatory signaling, and phagocytosis-related changes. Evidence from tauopathy research provides several plausible links between tau-related neuronal stress and microglial responses, including NF-κB signaling, TLR4-NLRP3 inflammasome activation, complement-mediated recognition, and glial clearance of tau-altered synaptic or neuronal substrates. However, most of these links have not been directly tested in glaucoma. Aqueous humor biomarkers, including total tau, phosphorylated tau, neurofilament light chain, glial fibrillary acidic protein, APOE, and Galectin-3, may offer clinically accessible readouts of neuronal and glial injury, but they cannot establish temporal order or causality.\nCONCLUSION: Available evidence supports tau dysregulation and glaucoma-associated microglial remodeling as relevant but not yet causally linked components of glaucomatous neurodegeneration. A cautious working model is that tau-related neuronal stress may alter dendritic, synaptic, or axonal substrates, while remodeled microglia and complement pathways may influence recognition and clearance of vulnerable structures. Future studies should test these interactions directly by combining tau species-specific analysis, microglial state profiling, engulfment assays, and visual pathway outcomes within the same experimental framework.","level":"ABSTRACT","snapshot":"sha256:7f1e1f9c2bbee70a64474354d7daf241d1bda28409cf6a2ce6b5437fd8957f58","retrievedSeq":23,"root":"root-slot-0","notes":[{"text":"review of tau dysregulation and microglial remodeling in glaucoma, noting retinal tau accumulation/redistribution after IOP elevation and APOE/Galectin-3/complement microglial states, but stating these links are largely untested in glaucoma and causality unresolved.","seq":28},{"text":"review linking retinal tau dysregulation (phosphorylation, somatodendritic redistribution after IOP elevation) with microglial remodeling (APOE/Galectin-3, complement, phagocytosis); explicitly states links are untested in glaucoma and proposes engulfment assays; useful hypothesis-generating framework for subtype-differential phagocytic attack.","seq":64},{"text":"review proposing that tau dysregulation (retinal tau accumulation, altered phosphorylation, axonal-to-somatodendritic redistribution after IOP elevation) and microglial remodeling (APOE/Galectin-3, complement, phagocytosis) are relevant but not causally linked, with most links untested in glaucoma; explicitly hypothesis-level.","seq":128}],"candidates":["proposal-rgc-akap1-first","offspring-g3-slot-1-hypothesis","proposal-rgc-fgf1-energy-dependence","proposal-rgc-fgf1-subtype-energy-gate-v2","proposal-rgc-subtype-axon-compartment-gate-v1","proposal-rgc-energy-complement-gate","proposal-rgc-subtype-mito-gate-v1","offspring-g2-slot-0-hypothesis","proposal-rgc-axonal-atp-complement-gate-v1"],"reviewed":true},{"id":"pubmed:42757470","title":"Ketogenic diet attenuates Müller cell activation and retinal neuroinflammation in autoimmune glaucoma through acetylation‑mediated FOXO signalling.","text":"Glaucoma consists of a group of neurodegenerative diseases characterized by retinal ganglion cell degeneration, in which Müller cells are increasingly recognised as drivers of neuroinflammation. A ketogenic diet (KD) elevates circulating β‑hydroxybutyrate (BHB) and exhibits benefits in other neurodegenerative disorders; however, its role in glaucoma remains poorly understood. In the present study, an experimental autoimmune glaucoma (EAG) mouse model was established and primary Müller cells were cultured. Using spectrophotometry, optical coherence tomography and immunofluorescence, serum ketone body levels were found to be significantly lower in both patients with primary open‑angle glaucoma and EAG mice, independent of intraocular pressure. In vitro and in vivo experiments showed that KD increased BHB levels and ketone body metabolism, suppressed Müller cell activation and reduced retinal neuroinflammation. In addition, 4D data‑independent acquisition proteomic analysis and subsequent validation revealed that FOXO3A acetylation and FOXO3A and metallothionein 2A upregulation were regulated in the retina and Müller cells. These findings suggest that impaired ketone body metabolism occurs in glaucoma and that KD‑mediated neuroprotection is associated with altered FOXO3A acetylation. The present study highlighted an association between ketone metabolism and immune regulation in glaucoma, providing evidence for Müller cell phenotypic modulation and supported further investigation of KD as a potential neuroprotective adjunct therapy for glaucoma.","level":"ABSTRACT","snapshot":"sha256:a9c3c918f745ce0933ec4fbf6f06f529f6f8f046f0e7c8d7c18515ae18fc6684","retrievedSeq":23,"root":"root-slot-0","notes":[{"text":"EAG mouse and primary Müller cell study showing low ketone bodies independent of IOP, ketogenic diet raising BHB, suppressing Müller activation and neuroinflammation via FOXO3A acetylation; glia-mediated mechanism in an autoimmune model, not pressure-driven subtype vulnerability.","seq":28},{"text":"EAG mouse and primary Müller cell study showing low ketone bodies in POAG and EAG independent of IOP, and that ketogenic diet/BHB suppresses Müller activation and neuroinflammation via FOXO3A acetylation and MT2A; supports glial metabolic modulation, but autoimmune model and no subtype resolution.","seq":64}],"candidates":["offspring-g3-slot-1-hypothesis","proposal-rgc-fgf1-energy-dependence","proposal-rgc-fgf1-subtype-energy-gate-v2","proposal-rgc-subtype-axon-compartment-gate-v1","proposal-rgc-energy-complement-gate","proposal-rgc-subtype-mito-gate-v1","offspring-g2-slot-0-hypothesis","proposal-rgc-axonal-atp-complement-gate-v1"],"reviewed":true},{"id":"pubmed:42751619","title":"Genetic Architecture and Clinical Phenotypes of Primary Open-Angle Glaucoma: An Updated Review of Mendelian Genes, GWAS Loci, and Polygenic Risk.","text":"PURPOSE: To synthesize the genetic architecture of primary open-angle glaucoma (POAG) across the full variant spectrum and map each genetic subtype to its clinical phenotype, IOP profile, optic nerve morphology, systemic associations, and treatment response.\nMETHODS: PubMed/MEDLINE was searched from inception through April 2025 for POAG genetics, susceptibility genes, GWAS loci, polygenic risk scores, and gene-specific clinical correlations. Eligible designs included peer-reviewed original research, GWAS meta-analyses, candidate-gene studies, family-based linkage analyses, cohort and case-control studies, and PRS development in human subjects. Genetic association studies were appraised using Q-Genie; observational clinical studies were appraised using the Newcastle-Ottawa Scale.\nRESULTS: Seven high-penetrance Mendelian genes (MYOC, OPTN, TBK1, WDR36, NTF4, FOXC1, CYP1B1) account for fewer than 10% of cases, each defining a clinically distinct subtype: juvenile high-tension glaucoma (MYOC), normal-tension neurodegeneration (OPTN, TBK1), and syndromic developmental glaucoma (FOXC1, CYP1B1). GWAS meta-analyses have identified 100 to 127 susceptibility loci converging on five biological axes: trabecular meshwork dysfunction, retinal ganglion cell survival, autophagy and protein homeostasis, neuroinflammation, and extracellular matrix integrity. Polygenic risk scores combined with clinical variables achieve an AUC of 0.89.\nCONCLUSION: POAG comprises genetically and clinically distinct subtypes defined by dominant molecular axes. Gene-specific data reveal actionable pharmacogenomic signals: ROCK inhibitors for ARHGEF12 and AFAP1 carriers, nicotinamide for OPTN and TXNRD2 subtypes, and goniotomy for CYP1B1-associated congenital glaucoma. IOP-centric management is insufficient for normal-tension subtypes driven by autophagy failure and neuroinflammation. The framework supports genotype-guided decisions on screening intensity, IOP targets, and neuroprotective adjuncts.","level":"ABSTRACT","snapshot":"sha256:48fe42fc94fd222f46bd2054c1b4f0121ffa3c9ff4e55a8c6ca919479dae6633","retrievedSeq":23,"root":"root-slot-0","notes":[{"text":"review of POAG genetic architecture (seven Mendelian genes, 100-127 GWAS loci) converging on trabecular meshwork, RGC survival, autophagy, neuroinflammation and ECM, with genotype-guided therapeutic claims; genetic subtype framing of disease rather than RGC subtype vulnerability.","seq":28},{"text":"review mapping POAG genetics (MYOC, OPTN, TBK1, WDR36, NTF4, FOXC1, CYP1B1; 100-127 GWAS loci) onto five axes including RGC survival, autophagy and neuroinflammation, with pharmacogenomic signals; supports genotype-driven intrinsic vulnerability, but gene-level not RGC-subtype-level and review-level.","seq":64},{"text":"Review of POAG genetics; seven Mendelian genes \u003c10% of cases; 100-127 GWAS loci across TM dysfunction, RGC survival, autophagy/proteostasis, neuroinflammation, ECM; PRS AUC 0.89; genotype-subtype mapping useful, but clinical/pathway inference, not RGC subtype vulnerability evidence.","seq":96}],"candidates":["offspring-g3-slot-1-hypothesis","proposal-rgc-fgf1-energy-dependence","proposal-rgc-fgf1-subtype-energy-gate-v2","proposal-rgc-subtype-axon-compartment-gate-v1","proposal-rgc-energy-complement-gate","proposal-rgc-subtype-mito-gate-v1","offspring-g2-slot-0-hypothesis","proposal-rgc-intracellular-cfh","proposal-rgc-axonal-atp-complement-gate-v1"],"reviewed":true},{"id":"pubmed:42741401","title":"Changes in the nonlinear and viscoelastic mechanical properties of the rat lamina cribrosa under chronic high intraocular pressure.","text":"INTRODUCTION: The lamina cribrosa (LC) in the optic nerve head is the initial site of glaucomatous optic nerve injury. Under high intraocular pressure (IOP), the deformation of the LC compresses the retinal ganglion cell (RGC) axons passing through it. The influence of changes in the nonlinear and viscoelastic properties of the LC on its deformation cannot be neglected under high IOP. Therefore, investigating the changes in the nonlinear and viscoelastic mechanical properties of the LC under different durations of high IOP is of great significance.\nMETHODS: A rat model with chronic high IOP was established by cauterizing the superior scleral vein and injecting 5-fluorouracil (5-FU) under the conjunctiva, producing sustained IOP elevation for 4, 8, and 12 weeks. Indentation tests were conducted on the rat LC. Then the loading segment and stress relaxation segment of the indentation curve were fitted separately.\nRESULTS: Compared with the control group, both the nonlinear parameters and viscoelastic parameters of the LC in experimental eyes decreased significantly. In contralateral control eyes, modest changes were also observed in some mechanical parameters, including the nonlinear parameters, relaxation modulus, and instantaneous modulus.\nDISCUSSION: The results indicated that long-term elevated IOP may contribute to the progression of glaucomatous optic nerve injury by altering the strain-dependent and time-dependent mechanical responses of the LC.","level":"ABSTRACT","snapshot":"sha256:c3dd41a393afe8ff3563850a67e9bf1e56c9a7562af01e5f6bb8f079635f49c3","retrievedSeq":23,"root":"root-slot-0","notes":[{"text":"rat chronic high-IOP study showing reduced nonlinear and viscoelastic parameters of the lamina cribrosa at 4/8/12 weeks; biomechanical axonal-compression mechanism, no RGC subtype or glial readout.","seq":28},{"text":"rat chronic ocular hypertension indentation study showing reduced nonlinear and viscoelastic lamina cribrosa parameters over 4-12 weeks with contralateral-eye changes; relevant to mechanical axonal compression as a subtype-differential stress source, but biomechanical only, no RGC subtype or survival data.","seq":64}],"candidates":["offspring-g3-slot-1-hypothesis","proposal-rgc-fgf1-energy-dependence","proposal-rgc-fgf1-subtype-energy-gate-v2","proposal-rgc-subtype-axon-compartment-gate-v1","proposal-rgc-energy-complement-gate","proposal-rgc-subtype-mito-gate-v1","offspring-g2-slot-0-hypothesis","proposal-rgc-axonal-atp-complement-gate-v1"],"reviewed":true},{"id":"pubmed:42731713","title":"Andrographolide-loaded PLGA nanoparticles protect retinal ganglion cells against experimental acute glaucomatous injury and attenuate mitochondrial dysfunction and retinal PANoptosis-related changes.","text":"Acute glaucomatous injury is characterized by abrupt intraocular pressure elevation, retinal ischemia/reperfusion-like stress, and rapid retinal ganglion cell (RGC) degeneration, in which oxidative stress, mitochondrial dysfunction, and regulated cell death play important roles. Emerging evidence further implicates PANoptosis in glaucomatous retinal injury. Andrographolide (ADR) possesses antioxidant and neuroprotective activities, but its poor aqueous solubility and low bioavailability limit its therapeutic application. Here, we developed ADR-loaded poly(lactic-co-glycolic acid) nanoparticles (ADR-NPs) and evaluated their protective effects in oxygen-glucose deprivation/recovery (OGD/R)-injured R28 cells and a rat retinal ischemia/reperfusion (RIR) model. Network pharmacology implicated oxidative stress and programmed cell death pathways in the potential anti-glaucoma effects of ADR. ADR-NPs exhibited favorable physicochemical properties, sustained release, acceptable short-term stability, cytocompatibility. In OGD/R-injured R28 cells, both free ADR and ADR-NPs attenuated oxidative stress, mitochondrial membrane potential loss, and apoptosis-, pyroptosis-, and necroptosis-related alterations, with ADR-NPs providing greater overall protection at matched doses. In the RIR model, ADR-NP pretreatment preserved retinal structure, electrophysiological function, and RGC survival while reducing oxidative stress and retinal PANoptosis-related alterations. ADR-NPs also exhibited acceptable preliminary ocular and systemic tolerability. Collectively, ADR-NPs protect against experimental acute glaucomatous injury by attenuating oxidative stress, mitochondrial dysfunction, and PANoptosis-related alterations, while enhancing the cellular protective effects of ADR.","level":"ABSTRACT","snapshot":"sha256:a2dbcd1ef5b233fa9ecfc72ab8f18f5e19a48f9e014003dc66d091e440a23ab1","retrievedSeq":23,"root":"root-slot-0","notes":[{"text":"rat ischemia/reperfusion and R28 OGD/R study showing andrographolide nanoparticles reduce oxidative stress, mitochondrial dysfunction and PANoptosis-related changes; acute injury model and immortalized cell line, so chronic IOP subtype relevance is indirect.","seq":28},{"text":"rat ischemia/reperfusion plus OGD/R R28 study showing andrographolide PLGA nanoparticles reduce oxidative stress, mitochondrial membrane potential loss and PANoptosis markers with RGC preservation; relevant to acute stress death-pathway convergence, but acute model, no subtype analysis, and network-pharmacology inference.","seq":64}],"candidates":["offspring-g3-slot-1-hypothesis","proposal-rgc-fgf1-energy-dependence","proposal-rgc-fgf1-subtype-energy-gate-v2","proposal-rgc-subtype-axon-compartment-gate-v1","proposal-rgc-energy-complement-gate","proposal-rgc-subtype-mito-gate-v1","offspring-g2-slot-0-hypothesis","proposal-rgc-axonal-atp-complement-gate-v1"],"reviewed":true},{"id":"pubmed:42737575","title":"Mitochondrial Control of Myelination, Bioenergetics, Oxidative Stress, and the Pathogenesis of Optic Neuropathies.","text":"Myelination, mitochondrial bioenergetics, and oxidative stress are usually discussed as separate problems in optic nerve disease. This review draws them together and reads the published evidence through a single variable, the balance between the energy a retinal ganglion cell (RGC) axon spends and the energy its mitochondria can supply. We review the role of myelin in conduction and axonal support, the mitochondrial cost of building and maintaining it, the vulnerability of oligodendrocytes and myelin to oxidative injury, and the nuclear control of mitochondrial output. We summarize the inherited optic atrophies linked to OPA1, OPA3, AFG3L2, SPG7, and TMEM126A, and set these primary mitochondrial disorders against the immune-mediated demyelinating optic neuropathies. Published studies already support several parts of this picture, including the energetic cost of demyelination, the mitochondrial dependence of RGC axons, and oxidative injury in inflammatory lesions. Drawing on that evidence, we propose, as a testable hypothesis rather than a settled mechanism, that optic nerve degeneration is favored when axonal ATP demand outruns mitochondrial supply, most sharply where the axon crosses from its unmyelinated to its myelinated segment near the lamina cribrosa. We use this framework to separate initiating lesions from disease modifiers and downstream consequences, and to set out therapeutic predictions open to experimental and clinical tests.","level":"ABSTRACT","snapshot":"sha256:f031bb2d0c869e5166f5b7f2d74de74b1081ac31b144291e01f176ea9c92f416","retrievedSeq":23,"root":"root-slot-0","notes":[{"text":"review/hypothesis paper proposing axonal ATP demand exceeding mitochondrial supply near the unmyelinated-to-myelinated transition at the lamina cribrosa as a testable driver of optic neuropathy; explicitly framed as hypothesis, provides an energetic framework relevant to differential vulnerability.","seq":28}],"candidates":["offspring-g3-slot-1-hypothesis","proposal-rgc-fgf1-energy-dependence","proposal-rgc-fgf1-subtype-energy-gate-v2","offspring-g2-slot-0-hypothesis"],"reviewed":true},{"id":"pubmed:42722228","title":"Omics in optic neuropathies: From molecular landscapes to personalized therapeutics.","text":"Optic neuropathies comprise a heterogeneous group of disorders involving transient or permanent injury to retinal ganglion cells (RGCs) and their axons. Clinically, these neurodegenerative conditions manifest as dyschromatopsia, decreased visual acuity, and visual field defects, and in severe cases may ultimately lead to blindness and disability. The marked heterogeneity across disease subtypes, incompletely understood etiologies, and complex pathogenic mechanisms pose substantial challenges to precise diagnosis and effective treatment. Recent advances in omics technologies - including genomics, transcriptomics, proteomics, metabolomics, lipidomics, single-cell and spatial sequencing, and integrative multi-omics approaches - have ushered optic nerve degenerative disease research into an era of high-resolution comprehensive investigation. In this review, we summarize representative applications of omics approaches to elucidate genetic alterations, signaling dysregulation, metabolic reprogramming, and immune responses in optic neuropathies. We further discuss the emerging potential of multi-omics in identifying early diagnostic biomarkers and informing individualized therapeutic strategies. Finally, we provide a forward-looking perspective on the future trajectory of omics technologies and their prospects in both fundamental research and clinical translation, with the overarching aim of accelerating the bench-to-bedside transition in this critical eye disease field.","level":"ABSTRACT","snapshot":"sha256:505c023e7a460de797323251a9e0e8d58c6de2b12066c57f62a80ac96a280d40","retrievedSeq":23,"root":"root-slot-0","notes":[{"text":"review of omics (genomics, transcriptomics, proteomics, metabolomics, single-cell/spatial) in optic neuropathies for biomarkers and personalized therapy; methodological roadmap, no primary subtype findings.","seq":28}],"candidates":["offspring-g3-slot-1-hypothesis","proposal-rgc-fgf1-energy-dependence","proposal-rgc-fgf1-subtype-energy-gate-v2","offspring-g2-slot-0-hypothesis"],"reviewed":true},{"id":"pubmed:42722144","title":"One-carbon metabolism and retinal ganglion cell vulnerability in glaucoma: metabolic pathway dysregulation, ocular evidence, and translational neuroprotection.","text":"PURPOSE: To synthesize evidence linking one-carbon metabolism to retinal ganglion cell (RGC) vulnerability and pressure-independent neurodegeneration in glaucoma, while distinguishing direct glaucoma-relevant evidence, indirect biological support, and mechanistic hypotheses.\nMETHODS: We conducted a critical narrative review of human ocular and systemic metabolomics, conventional biomarkers, nutritional epidemiology, experimental retinal injury and glaucoma models, and early translational studies. The metabolomics evidence base comprised 26 reports (17 ocular and 9 systemic), evaluated by glaucoma subtype, specimen, analytical platform, analyte direction, effect-size availability, and cohort independence.\nRESULTS: Under the operational cross-study criteria used in this review, five aqueous-humor analytes recurred across independent primary open-angle glaucoma (POAG) cohort families, all with compatible increases: threonine, lysine, histidine, arginine, and creatinine. Broader cross-study convergence was strongest at the amino-acid, membrane-lipid, energy/purine/tricarboxylic acid (TCA), and redox pathway levels. Exfoliation-related ocular studies showed no exact recurrent analyte, whereas systemic evidence was most consistent for diglyceride/triglyceride class-level associations. Direct evidence includes human glaucoma cohorts and protection with combined vitamins B6, B9, and B12 plus choline in experimental glaucoma. Non-glaucoma retinal, RGC, and glial models provide indirect support, whereas compartment-specific ocular flux, a transsulfuration-to-axon causal chain, and axis-specific choline/betaine effects remain hypotheses. Human interventional evidence is limited to an early-phase protocol.\nCONCLUSION: One-carbon metabolism is a candidate biological framework for mechanistic and target-engagement studies, not a validated biomarker panel or established supplementation strategy. Clinical efficacy of one-carbon pathway modulation or related supplementation in glaucoma has not been established.","level":"ABSTRACT","snapshot":"sha256:0a37b65a24671b906bbd75fd1d7e250f86bb252fee35e799bd15553d302eace3","retrievedSeq":23,"root":"root-slot-0","notes":[{"text":"critical narrative review of one-carbon metabolism and RGC vulnerability, distinguishing direct human glaucoma cohort evidence, indirect models and remaining hypotheses (compartment-specific flux, transsulfuration-to-axon chain), and stressing unproven clinical efficacy.","seq":28},{"text":"critical narrative review of one-carbon metabolism in glaucoma distinguishing recurring ocular analytes, indirect support and untested hypotheses (compartment-specific flux, transsulfuration-to-axon chain, choline/betaine axis), with limited human interventional evidence; useful as a model of disciplined evidence grading, but no subtype data.","seq":64},{"text":"Critical narrative review of one-carbon metabolism and RGC vulnerability; five recurrent aqueous analytes (threonine, lysine, histidine, arginine, creatinine); convergent amino-acid/lipid/energy/redox pathways; B6/B9/B12+choline protection in experimental glaucoma; compartment-specific flux and transsulfuration-to-axon causal chain remain hypotheses; no subtype data.","seq":96}],"candidates":["offspring-g3-slot-1-hypothesis","proposal-rgc-fgf1-energy-dependence","proposal-rgc-fgf1-subtype-energy-gate-v2","proposal-rgc-subtype-axon-compartment-gate-v1","proposal-rgc-energy-complement-gate","proposal-rgc-subtype-mito-gate-v1","offspring-g2-slot-0-hypothesis","proposal-rgc-intracellular-cfh","proposal-rgc-axonal-atp-complement-gate-v1"],"reviewed":true},{"id":"pubmed:42650212","title":"The Eye as a Window to Neurodegeneration: Oxidative Stress, Optic Nerve Vulnerability, and Retinal Biomarkers-A Scoping Review.","text":"Neurodegenerative diseases represent a major and growing global health burden characterized by progressive neuronal dysfunction, axonal degeneration, and irreversible neural tissue loss. Increasing evidence identifies oxidative stress as one of several interacting pathogenic mechanisms in Alzheimer's disease, Parkinson's disease, amyotrophic lateral sclerosis, and several optic neuropathies. Interest has increasingly focused on the brain-retina axis, as the retina and optic nerve share structural, metabolic, and molecular features with the central nervous system and may provide accessible insights into neurodegeneration. This scoping review mapped current evidence on oxidative stress in neurodegeneration, emphasizing cranial nerve involvement, optic nerve vulnerability, retinal ganglion cell degeneration, visual dysfunction, oxidative biomarkers, and emerging therapeutic strategies. The review followed established methodological frameworks and PRISMA-ScR recommendations; no formal risk-of-bias appraisal was undertaken, consistent with scoping-review methodology. The literature shows that oxidative stress interacts with mitochondrial dysfunction, neuroinflammation, impaired mitophagy, ferroptosis, and altered bioenergetics, contributing to neuronal injury in cerebral and retinal disorders. Retinal ganglion cells appear particularly vulnerable because of their high metabolic demands and reliance on oxidative phosphorylation. Glaucoma and other optic neuropathies share molecular signatures with central neurodegenerative diseases. Retinal imaging and oxidative biomarkers show promise for diagnosis, monitoring, and stratification. The evidence base is nonetheless dominated by preclinical work; biomarker performance is inconsistent across matrices and assay platforms and most antioxidant clinical trials have been negative. Oxidative stress is therefore best regarded as one interacting node of a broader pathogenic network rather than a universal or predominant driver and the brain-retina continuum as a mechanistically plausible but not yet clinically validated framework for biomarker-guided neuroprotection.","level":"ABSTRACT","snapshot":"sha256:7aae199f6890ad28cdb4b0e91688e5f73e0491331f77a34618737a42981b7cae","retrievedSeq":23,"root":"root-slot-0","notes":[{"text":"PRISMA-ScR scoping review of oxidative stress across neurodegeneration and optic neuropathies; notes RGC high metabolic demand, inconsistent biomarkers, mostly preclinical evidence and negative antioxidant trials, cautioning against single-driver claims.","seq":28},{"text":"scoping review of oxidative stress across neurodegenerative disease and optic neuropathies, noting RGC high metabolic demand and reliance on oxidative phosphorylation, but preclinical dominance, inconsistent biomarkers and largely negative antioxidant trials; cautions against oxidative stress as a single driver.","seq":128}],"candidates":["proposal-rgc-akap1-first","offspring-g3-slot-1-hypothesis","proposal-rgc-fgf1-energy-dependence","proposal-rgc-fgf1-subtype-energy-gate-v2","proposal-rgc-subtype-axon-compartment-gate-v1","proposal-rgc-subtype-mito-gate-v1","offspring-g2-slot-0-hypothesis","proposal-rgc-axonal-atp-complement-gate-v1"],"reviewed":true},{"id":"pubmed:42632302","title":"The peptide Ac2-26 preserves mitochondrial function and neuronal survival in human retinal cells and organoids under hyperglycemic and inflammatory stress.","text":"Diabetic retinopathy (DR) is a neurodegenerative disease characterized by hyperglycemia-induced inflammation, mitochondrial dysfunction, and progressive neuronal cell death, leading to irreversible vision loss. Retinal ganglion cells (RGCs) are particularly vulnerable to this hostile microenvironment, undergoing apoptosis before microvascular pathology becomes clinically evident. However, therapeutic strategies targeting these early neurodegenerative events remain limited. Here, we investigated the protective effects of the Annexin A1 mimetic peptide Ac2-26 using complementary human retinal organoid (RO) and organoid-derived retinal ganglion cell (RGC) models of diabetes-like stress. In retinal organoids, Ac2-26 significantly attenuated high glucose-induced retinal degeneration by coordinately suppressing intrinsic and extrinsic apoptotic pathways, reducing Müller cell gliosis, and selectively modulating inflammatory mediators associated with DR progression. In organoid-derived RGCs, Ac2-26 reduced mitochondrial oxidative stress, restored mitochondrial bioenergetics, and prevented neuronal apoptosis under both hyperglycemic and inflammatory conditions. Mechanistically, these protective effects were associated with FPR2-dependent suppression of the p38/NOX4 signaling axis, identifying oxidative stress regulation as a central mechanism underlying mitochondrial preservation. Collectively, our findings demonstrate that Ac2-26 acts as a pro-resolving neuroprotective agent that targets convergent inflammatory and mitochondrial pathways involved in early diabetic retinal degeneration, highlighting the FPR2-p38-NOX4 axis as a promising therapeutic target for early intervention in diabetic retinopathy.","level":"ABSTRACT","snapshot":"sha256:03a0628f52a95123d811a2605081d847431b8d7a3a43229923bee09f5bae412b","retrievedSeq":23,"root":"root-slot-0","notes":[{"text":"human retinal organoid and organoid-derived RGC study in diabetes-like stress showing Ac2-26 preserves mitochondria and survival via FPR2-p38-NOX4; supports metabolic-inflammatory convergence in human RGCs but in hyperglycemic, not IOP, context.","seq":28}],"candidates":["offspring-g3-slot-1-hypothesis","proposal-rgc-fgf1-energy-dependence","proposal-rgc-fgf1-subtype-energy-gate-v2","offspring-g2-slot-0-hypothesis"],"reviewed":true},{"id":"pubmed:42631048","title":"Intrinsic electrical diversity of PV+ retinal ganglion cells.","text":"Mouse retinal ganglion cells (RGCs) transform visual signals into spiking outputs and are known as a heterogeneous cell population. We combined electrophysiological recordings and anatomical analyses to characterize parvalbumin-positive (PV+) RGC subtypes, including ON-OFF direction selective (OODS), ON transient small receptive field (ON tr SmRF), OFF transient medium receptive field (OFF tr MeRF), and the OFF transient small receptive field (OFF tr SmRF) RGC. Intrinsic properties such as input resistance, maximum depolarization rate, and maximum rebound firing rate distinguished five functional subtypes, including one previously unmatched population. Analysis of axonal morphology revealed subtype-specific differences in axon initial segment (AIS) length and diameter. OFF tr MeRF RGCs display shortest AISs and smallest proximal axon diameter, correlating with unique near-threshold spikelets. Following axotomy, loss of the AIS reduced maximum firing rates and altered spike properties. Our results demonstrate substantial biophysical diversity among a subset of PV+ RGCs, complementing previously described differences.","level":"ABSTRACT","snapshot":"sha256:4211616894f4c7e293bbc75e2fd02980f231d1dcc4e2493026f1cd576f2a8929","retrievedSeq":23,"root":"root-slot-0","notes":[{"text":"mouse electrophysiology/anatomy study showing PV+ RGC subtypes differ in intrinsic properties and axon initial segment geometry, and axotomy alters firing; direct evidence of subtype-intrinsic biophysical diversity relevant to differential vulnerability, though not under IOP stress.","seq":28}],"candidates":["offspring-g3-slot-1-hypothesis","proposal-rgc-fgf1-energy-dependence","proposal-rgc-fgf1-subtype-energy-gate-v2","offspring-g2-slot-0-hypothesis"],"reviewed":true},{"id":"pubmed:42556772","title":"Crosstalk between estrogen signaling and Fas-mediated apoptosis determines neuronal resilience after menopause.","text":"Age-associated estrogens decline is increasingly recognized as a systemic driver of neurodegeneration, yet the mechanisms by which estrogen deficiency alters neuronal resilience remain incompletely understood. Here, we investigated how mimicking age-related endocrine decline influences the susceptibility of retinal neurons to ischemic stress and whether simultaneous targeting of survival and apoptotic pathways restores neuronal resilience. Using a mouse model of surgical menopause (total N = 62 divided into groups containing 4-6 specimen), we demonstrate that estrogen deficiency markedly exacerbates retinal ganglion cell (RGC) loss by approximately 60% and severely impairs functional recovery following ischemia-reperfusion injury. Pharmacological modulation revealed that selective estrogen receptor signaling or Fas pathway inhibition alone provided partial neuroprotection. However, combined treatment with the selective estrogen receptor modulator Raloxifene and the Fas receptor antagonist KP7-6 produced a powerful synergistic effect, limiting RGC somatic loss to a mere 18% and restoring stratified retinal function to near-physiological levels in both ovariectomized and non-ovariectomized animals. Ex vivo retinal explants (N = 15) confirmed that dual pathway modulation drives a 2-fold increase in neuronal survival and significantly limits cytotoxicity, supporting a direct cellular mechanism. These findings identify endocrine aging as a modifiable driver of neuronal vulnerability and demonstrate that simultaneous targeting of estrogen-dependent survival signaling, and Fas-mediated apoptosis can restore a youthful neuroprotective phenotype. Our results establish convergent hormonal and apoptotic pathways as one of regulators of neuronal resilience during aging and suggest a combinatorial therapeutic strategy for age-related neurodegenerative disorders.","level":"ABSTRACT","snapshot":"sha256:7190d012af3d07974822290f996933d605aac65a02d742a88dfe88ff2b4638fe","retrievedSeq":23,"root":"root-slot-0","notes":[{"text":"mouse surgical menopause study showing estrogen deficiency worsens RGC loss and impairs recovery after ischemia-reperfusion, with synergistic raloxifene plus Fas antagonist protection; identifies hormonal/apoptotic modifiers of resilience, not IOP-subtype specificity.","seq":28},{"text":"mouse surgical menopause plus ischemia-reperfusion study showing estrogen deficiency exacerbates RGC loss ~60%, and combined raloxifene plus Fas antagonist KP7-6 limits loss to ~18% with functional restoration, confirmed ex vivo; supports hormonal plus apoptotic pathway convergence on resilience, but acute ischemia and no subtype data.","seq":64}],"candidates":["offspring-g3-slot-1-hypothesis","proposal-rgc-fgf1-energy-dependence","proposal-rgc-fgf1-subtype-energy-gate-v2","proposal-rgc-subtype-axon-compartment-gate-v1","proposal-rgc-energy-complement-gate","proposal-rgc-subtype-mito-gate-v1","offspring-g2-slot-0-hypothesis","proposal-rgc-axonal-atp-complement-gate-v1"],"reviewed":true},{"id":"pubmed:42496936","title":"Neurotoxic effects of dietary glutamate in glaucoma and potential nutritional and pharmacological therapies: a scoping review.","text":"PURPOSE: To synthesize the available evidence on the relationship between dietary glutamate or glutamatergic metabolism and glaucomatous neurodegeneration, with emphasis on biomarkers, retinal injury mechanisms, and nutritional, antioxidant, or pharmacological strategies with neuroprotective potential.\nMETHODS: This study was conducted as a systematic and bibliometric literature review following the PRISMA 2020 logic of identification, screening, eligibility, and inclusion. Searches were performed in Web of Science, Scopus, and PubMed for studies published in English between 2020 and 2025. The search strategy combined terms related to glaucoma or ocular neurodegeneration, the glutamatergic axis, and biomarkers, mechanisms, or interventions. After screening and full-text assessment, 39 studies were included in the systematic synthesis. Due to methodological heterogeneity, the evidence was synthesized narratively and comparatively, without meta-analysis.\nRESULTS: The included studies were organized into six thematic clusters: metabolomic, transcriptomic, and diagnostic biomarkers; pharmacological and neuroprotective interventions; nutritional, antioxidant, and natural-compound neuroprotection; oxidative stress, mitochondrial dysfunction, and regulated cell death; neuroinflammation and glia-mediated retinal injury; and glutamatergic excitotoxicity and neurotransmitter imbalance. The evidence indicates that glutamate-related mechanisms in glaucoma are mainly associated with endogenous glutamatergic metabolism, excitotoxicity, impaired glutamate clearance, glutamate-glutamine homeostasis, oxidative and nitrosative stress, mitochondrial dysfunction, ferroptosis, neuroinflammation, and retinal ganglion cell vulnerability. None of the 39 included studies directly evaluated dietary glutamate or monosodium glutamate as the main exposure.\nCONCLUSION: The available evidence does not support a direct conclusion that dietary glutamate or MSG intake contributes to glaucoma onset or progression. Instead, current findings mainly support an indirect mechanistic relationship between endogenous glutamatergic dysregulation and glaucomatous neurodegeneration. Pharmacological, antioxidant, metabolic, and natural-compound strategies show neuroprotective potential, particularly in experimental models, but clinical and translational studies are still needed to clarify the role of dietary exposure, glutamate-glutamine metabolism, and targeted neuroprotective interventions in glaucoma.","level":"ABSTRACT","snapshot":"sha256:a59c3cd0f967bf34376e411e536bdd8ec876d0f2e0ef6ab20b6c365fb3abffc5","retrievedSeq":23,"root":"root-slot-0","notes":[{"text":"PRISMA-based scoping review of glutamatergic mechanisms in glaucoma concluding support for endogenous excitotoxicity/glutamate-glutamine dysregulation but no direct evidence for dietary glutamate, and clinical translation lacking; mechanistic, not subtype-resolved.","seq":28}],"candidates":["offspring-g3-slot-1-hypothesis","proposal-rgc-fgf1-energy-dependence","proposal-rgc-fgf1-subtype-energy-gate-v2","offspring-g2-slot-0-hypothesis"],"reviewed":true},{"id":"pubmed:42427758","title":"Exosomal Profiling Reveals Mechanisms of Hibernation-Associated Neuroprotection.","text":"Glaucoma is a group of eye diseases that affects 4 million people in the US and is one of the leading causes of vision loss due to damage to the eye's optic nerve (ON) which is composed of axons from retinal ganglion cells (RGCs) that transmit visual information to the brain. Injury to the ON often triggers RGC death and subsequent loss of visual function. Despite its increasing prevalence worldwide, effective therapies for glaucoma remain elusive. Notably, the thirteen-lined ground squirrel (TLGS) exhibits intrinsic neuroprotection during hibernation; however, reproducing this protective state pharmacologically has proven challenging. To elucidate the metabolic mechanisms underlying this resilience, we conducted untargeted metabolomic analyses on TLGS retinas at 6 hours, 3 days, and 7 days following ON crush. Retinas from awake and hibernating animals were compared to identify temporal and state-dependent metabolic signatures. Distinct metabolomic profiles were observed in hibernating animals relative to their awake counterparts. Pathway analyses revealed coordinated regulation of amino acid, lipid, and purine metabolism that likely contributes to hibernation-induced resilience. Furthermore, our findings indicate that hibernating TLGS retinas increase exosome biogenesis, prompting in vitro validation using TLGS-derived exosomes, which demonstrated robust neuroprotective and anti-inflammatory effects. Proteomic and transcriptomic characterization of exosomal cargo identified conserved miRNAs, mRNAs, and proteins implicated in redox balance, cytoskeletal stabilization, and stress-response regulation. Collectively, these data support the hypothesis that metabolic reprogramming and exosome-mediated intercellular signaling underlie hibernation-associated neuroprotection. Modulating these pathways may provide a blueprint for novel therapeutic strategies to mitigate neurodegeneration and promote recovery following optic nerve injury.","level":"ABSTRACT","snapshot":"sha256:7e1344e421db524274b684d1c1c977f8b5d95570b8ace86c3c6deaadc429e967","retrievedSeq":23,"root":"root-slot-0","notes":[{"text":"thirteen-lined ground squirrel optic nerve crush metabolomics showing hibernation-associated metabolic reprogramming and exosome-mediated neuroprotection/anti-inflammation; a resilience model in a non-glaucoma species, hypothesis-generating for intrinsic protective states.","seq":28}],"candidates":["offspring-g3-slot-1-hypothesis","proposal-rgc-fgf1-energy-dependence","proposal-rgc-fgf1-subtype-energy-gate-v2","offspring-g2-slot-0-hypothesis"],"reviewed":true},{"id":"pubmed:42425282","title":"Microglia suppress Müller cell FGF1 and contribute to retinal ganglion cell degeneration in glaucoma.","text":"Glaucoma is a progressive neurodegenerative disease characterized by retinal ganglion cell (RGC) loss, in which glial activation and neuroinflammation contribute importantly to disease progression. However, the mechanisms by which microglia-Müller cell interactions influence retinal neuroinflammation and neurotrophic support during glaucoma remain unclear. Here, we aimed to identify glia-associated regulatory factors involved in microglia-Müller cell communication during glaucoma and to determine their contribution to retinal neurodegeneration. A chronic ocular hypertension (COH) mouse model and a conditioned medium (CM)-based inflammatory system were used to investigate microglia-Müller cell interactions and the role of fibroblast growth factor 1 (FGF1) in retinal neuroinflammation. Sustained intraocular pressure (IOP) elevation induced glial activation and progressive RGC degeneration in COH retinas. Transcriptomic profiling of Müller cells exposed to microglia-CM identified FGF1 as a significantly downregulated candidate neurotrophic factor, accompanied by enrichment of immune and inflammatory pathways. Functionally, Müller cell FGF1 deficiency exacerbated, whereas exogenous FGF1 attenuated, inflammation-induced RGC apoptosis in vitro. In vivo, intravitreal rFGF1 reduced RGC apoptosis, preserved RGC survival, and maintained retinal structure without affecting IOP. Consistently, reduced FGF1 expression was observed in Müller cell-enriched regions of human glaucomatous retinas. Together, these findings suggest that microglia-driven inflammation suppresses Müller cell FGF1 expression, thereby impairing neurotrophic support and increasing retinal vulnerability during COH. Restoration of FGF1 signaling confers neuroprotection independently of IOP reduction and may represent a promising glia-targeted therapeutic strategy for glaucoma.","level":"ABSTRACT","snapshot":"sha256:8b5673ce86278c355e6d8e98f14e5c016baf23613314de09da16d78e655e4989","retrievedSeq":23,"root":"root-slot-0","notes":[{"text":"chronic ocular hypertension mouse and Müller cell study showing microglia-driven suppression of Müller FGF1 impairs trophic support and that rFGF1 protects RGCs independent of IOP, with reduced FGF1 in human glaucomatous retina; direct glia-mediated vulnerability mechanism, though not subtype-specific. Synthesis: convergent themes across these abstracts are mitochondrial/metabolic vulnerability (42878208, 42883135, 42722144, 42737575, 42650212), neuroinflammation and glial remodeling (42780315, 42769369, 42757470, 42425282, 42801048, 42839614), and axonal/transport or biomechanical injury at the optic nerve head (42908589, 42741401, 42737575, 42799797). A genuine conflict is whether pathology is primarily pressure-driven versus pressure-independent/immune or circuit-driven; several reviews (42865964, 42883135, 42650212, 42496936) explicitly caution that these are interacting nodes rather than proven single drivers, and human antioxidant…","seq":28}],"candidates":["offspring-g3-slot-1-hypothesis","proposal-rgc-fgf1-energy-dependence","proposal-rgc-fgf1-subtype-energy-gate-v2","offspring-g2-slot-0-hypothesis"],"reviewed":true},{"id":"pubmed:42827923","title":"Transient functional preservation precedes retinal ganglion cell degeneration following optic nerve crush.","text":"AIMS: Optic nerve crush (ONC) induces progressive retinal ganglion cell (RGC) degeneration; however, the temporal relationship between functional impairment and structural loss remains incompletely understood. This study investigated early changes in retinal function and subtype-specific RGC responses following ONC to determine whether retinal activity is preserved before substantial RGC degeneration.\nMETHODS: Adult Sprague-Dawley rats underwent ONC and were examined at 1, 3, 7, and 14 days after injury. Retinal function was assessed using electroretinography (ERG), photopic negative response (PhNR), and multi-electrode array (MEA) recordings. RGC survival was quantified by Fluoro-Gold labeling, while microglial activation and oxidative stress-related markers were evaluated by immunofluorescence.\nRESULTS: RGC survival remained largely preserved during the first 3 days following ONC but declined markedly at days 7 and 14. MEA recordings showed relative preservation of light-evoked responses at day 3, followed by progressive reductions in responsiveness and spontaneous firing at later stages. PhNR amplitudes showed a similar trend, although the changes did not reach statistical significance. Subtype analysis revealed differential vulnerability, with ONOFF-RGCs exhibiting greater reductions in proportion and functional responses, whereas ON-RGCs accounted for an increasing proportion of surviving cells over time. Microglial activation increased during the degenerative phase, while the oxidative damage marker 8-OHG immunoreactivity appeared elevated early after injury. No obvious changes were detected in NQO-1 or SOD-2 expression.\nCONCLUSIONS: Retinal function remained relatively preserved during the first 3 days following ONC despite ongoing injury and before substantial RGC loss occurred. ONOFF-RGCs exhibited greater vulnerability than other functional subtypes. These findings identify an early post-injury period preceding substantial RGC degeneration and provide insight into the temporal dynamics of RGC dysfunction following optic nerve injury.","level":"ABSTRACT","snapshot":"sha256:7c0355dafb94ebf14f11125abee4745eb1a2a67deb5a80495caedaf67e25ff7a","retrievedSeq":59,"root":"root-slot-1","notes":[{"text":"rat optic nerve crush study showing preserved function for ~3 days before RGC loss, greater ONOFF-RGC than ON-RGC vulnerability, early 8-OHG elevation without NQO-1/SOD-2 change, and later microglial activation; the clearest direct evidence of subtype-differential vulnerability, but crush injury rather than chronic IOP, and subtype defined functionally.","seq":64},{"text":"Rat optic nerve crush; RGC survival preserved through day 3, then declined; ONOFF-RGCs more vulnerable than ON-RGCs, microglial activation in degenerative phase, early 8-OHG; directly addresses subtype differential vulnerability but in crush, not chronic IOP; abstract level.","seq":96}],"candidates":["proposal-rgc-subtype-axon-compartment-gate-v1","proposal-rgc-energy-complement-gate","proposal-rgc-subtype-mito-gate-v1","proposal-rgc-intracellular-cfh","proposal-rgc-axonal-atp-complement-gate-v1"],"reviewed":true},{"id":"pubmed:42737879","title":"Chronic Stress Induces Retinal Ganglion Cell Degeneration Featuring Reduced Density, Altered Intrinsic Electrophysiology, and Light Responses.","text":"Depression is often associated with functional disturbances in the visual system. However, the fundamental features underlying these visual system aberrations in depression remain to be fully elucidated. In particular, in the first stage of visual processing, how different retinal output neuron types change their intrinsic properties and output features in response to specific light stimulation remains unclear. Here, by adopting a mouse model of depression induced by chronic unpredictable stress (CUS), we found that depression is associated with reduced blood perfusion in the retinal inner plexiform layer (IPL). The hypoperfusion in the IPL is paralleled by a remarkable reduction of retinal ganglion cell (RGC) density, with more cell loss in ipRGCs than in the general RGCs. The surviving RGCs-particularly, ipRGCs-changed their intrinsic electrical properties, exhibiting decreased membrane input resistance, more depolarized resting membrane potential, and altered spiking properties. Additionally, these cells showed stimulus-size-dependent increases in light-evoked responses. Together, our findings demonstrate that depression is associated with the retinal IPL hypoperfusion and RGC impairments (particularly ipRGCs) and suggest retinal layer- and RGC-type-specific susceptibilities, furthering our understanding of retinal pathophysiology in depression.","level":"ABSTRACT","snapshot":"sha256:3e4444e719efcfb49cc6b40ddfe9bb7c25361d7404239f65acb37cb0804ef1b5","retrievedSeq":59,"root":"root-slot-1","notes":[{"text":"mouse chronic unpredictable stress study reporting inner plexiform layer hypoperfusion, RGC density reduction with greater ipRGC loss than general RGCs, and altered intrinsic electrophysiology of survivors; direct evidence of RGC-type-specific susceptibility to a non-IOP stressor, but depression model, not glaucoma or IOP.","seq":64},{"text":"Mouse chronic unpredictable stress; reduced IPL perfusion, RGC density loss with greater ipRGC loss, altered intrinsic excitability and light responses; demonstrates RGC-type-specific susceptibility but in a depression model, not IOP stress; indirect relevance.","seq":96}],"candidates":["proposal-rgc-subtype-axon-compartment-gate-v1","proposal-rgc-energy-complement-gate","proposal-rgc-subtype-mito-gate-v1","proposal-rgc-intracellular-cfh","proposal-rgc-axonal-atp-complement-gate-v1"],"reviewed":true},{"id":"pubmed:42699770","title":"Environmental particulate reference materials increase DCFDA fluorescence and reduce ATP-dependent viability in primary mouse retinal cells.","text":"Long-term exposure to ambient particulate matter ≤2.5 μm in aerodynamic diameter (PM2.5) has been associated with optic neuropathy and retinal neurodegeneration, but experimental evidence remains limited. We assessed two certified environmental particulate reference materials in primary mouse retinal cells and after repeated ocular-surface exposure in mice. For the in vitro analyses, technical replicate wells were first averaged within each independent cell isolation, and each experimental condition was then normalized to the corresponding control from the same biological replicate. Particulate exposure produced condition-dependent changes in 2',7'-dichlorofluorescin diacetate (DCFDA) fluorescence and ATP-dependent viability, with statistically significant effects concentrated in selected retinal glial-cell conditions. After within-experiment normalization and multiplicity adjustment, direct comparisons did not demonstrate a statistically significant protective effect of α-tocopherol or N-acetylcysteine on particulate-associated responses, and retinal glial-cell coculture did not significantly improve RGC survival relative to monoculture. In postnatal mice, topical particulate administration was associated with inner retinal thinning and lower RGC-marker-positive cell counts. In adult Thy1-CFP mice, neither sample-specific nor post hoc pooled within-mouse comparisons with contralateral saline-treated eyes were statistically significant. A separate post hoc exploratory between-animal comparison showed fewer CFP-positive cells in pooled particulate-treated eyes than in independent bilateral-saline controls (mean difference, -14.4 cells; 95% CI, -28.1 to -0.7; P = 0.040). These findings support cellular and retinal susceptibility under the conditions used, but they do not establish particle transport to the retina, a causal oxidative mechanism, or quantitative risk from ambient PM2.5 exposure in humans.","level":"ABSTRACT","snapshot":"sha256:c091cf6a14a5f204353310f34763ebabec7494c038bdd065cb68113552af5de7","retrievedSeq":59,"root":"root-slot-1","notes":[{"text":"mouse retinal cell and ocular-surface PM2.5 exposure study showing glial-condition-dependent DCFDA/ATP effects, inner retinal thinning and lower RGC-marker counts, with non-significant antioxidant rescue and coculture benefit; environmental stressor, low direct relevance to IOP-driven subtype vulnerability, and authors disclaim particle transport and causality.","seq":64}],"candidates":["proposal-rgc-subtype-axon-compartment-gate-v1","proposal-rgc-energy-complement-gate","proposal-rgc-subtype-mito-gate-v1","proposal-rgc-axonal-atp-complement-gate-v1"],"reviewed":true},{"id":"pubmed:42619738","title":"The SoxC transcription factors regulate multiple early retinal lineages and function in parallel with Atoh7 to promote retinal ganglion cell genesis.","text":"Retinal development is orchestrated by a network of transcription factors that guide multipotent retinal progenitor cells (RPCs) to fate-committed lineages, ultimately producing seven major retinal cell classes. Among these, retinal ganglion cells (RGCs) serve as the sole output neurons of the retina, relaying visual and non-visual information to the brain. RGC specification requires a cascade of transcriptional regulators, including the basic helix-loop-helix (bHLH) factor Atoh7, which confers competence to RPCs, and Pou4f2 and Isl1, which drive terminal differentiation and subtype diversification. Previous studies demonstrate that the SoxC group transcription factors (Sox4, Sox11, and Sox12) are also involved in RGC genesis, but their precise integration into the Atoh7-driven regulatory hierarchy remains undefined. To address this question, we used the retina-specific Vsx2-Cre line to generate Sox4/Sox11 double conditional knockout (dcKO) and Sox4/Sox11/Atoh7 triple knockout (tKO) mice. Immunohistochemistry revealed profound lineage disruption and reduced progenitor proliferation and survival in both dcKO and tKO retinas; not only RGC genesis but also that of horizontal and amacrine (H\u0026As) cells were severely compromised, whereas photoreceptor cells (PHCs) production increased. These results indicate that Sox4 and Sox11 are involved in the coordinated generation of the different early retinal lineages. Like the Atoh7-null retina, RGC precursors still formed in the SoxC dcKO retina, but their genesis was almost completely abolished in the tKO retina. Our findings indicate that the SoxC factors act in parallel with Atoh7 as a major upstream regulatory input to initiate RGC fate. Bulk RNA-seq revealed the SoxC-dependent transcriptional programs and signaling pathways and confirmed the lineage changes demonstrated by marker analysis. CUT\u0026Tag analysis identified the genome-wide binding sites and thereby the target genes of Sox11, further illuminating the mechanisms underlying functions of the SoxC factors in multiple retinal cell states/types during development.","level":"ABSTRACT","snapshot":"sha256:5f9e65633983f31eaca74ee34d2040aca8917e07ba0e6caa7156f58f954bbfa7","retrievedSeq":59,"root":"root-slot-1","notes":[{"text":"developmental study showing Sox4/Sox11 act in parallel with Atoh7 to initiate RGC fate, with dcKO/tKO lineage disruption and CUT\u0026Tag target mapping; informative about subtype-specifying transcriptional programs, but developmental and not injury vulnerability; indirect relevance only.","seq":64},{"text":"Mouse developmental study; Sox4/Sox11 act in parallel with Atoh7 to initiate RGC fate; dcKO and tKO disrupt early retinal lineages; developmental fate specification only, no bearing on adult vulnerability under IOP stress; low relevance.","seq":96}],"candidates":["proposal-rgc-subtype-axon-compartment-gate-v1","proposal-rgc-energy-complement-gate","proposal-rgc-subtype-mito-gate-v1","proposal-rgc-intracellular-cfh","proposal-rgc-axonal-atp-complement-gate-v1"],"reviewed":true},{"id":"pubmed:42603628","title":"Daily topical latanoprost free acid exacerbates retinal ganglion cell degeneration in the DBA/2J mouse model of pigment dispersion glaucoma.","text":"PURPOSE: To compare diazoxide (DZ), an ATP-sensitive potassium channel opener and latanoprost free acid (LFA), the active metabolite of the prostaglandin analogue latanoprost, a first-line agent for intraocular pressure (IOP) reduction in patients with glaucoma, on IOP, retinal ganglion cell (RGC) density, retinal morphology, and glial cell activation in the DBA/2J mouse model of pigment dispersion glaucoma.\nMETHODS: DBA/2J mice age 4 months received daily topical applications of DZ (5 mM) or LFA (0.1 mM) in one eye, while the fellow eye received vehicle. IOP was measured prior to treatment and twice weekly throughout the 23-week treatment period. Immunofluorescence staining was used to quantify RGC density with RNA binding protein with multiple splicing (RBPMS) and glial cell activation as a measure of neuroinflammation with glial fibrillary acidic protein (GFAP). Hematoxylin and eosin staining was used to evaluate retinal morphology.\nRESULTS: IOP was reduced by both DZ (30%) and LFA (24%) for a portion of the experimental period. DZ did not alter RGC survival, reactive gliosis, or RGC morphology. Conversely, LFA treatment was associated with a significant reduction in RGCs, an increase in reactive gliosis, and altered RGC morphology characteristic of cell death.\nCONCLUSIONS: DZ lowered IOP without notable retinal side effects. In contrast, LFA reduced IOP but was associated with enhanced RGC neurodegeneration and increased neuroinflammation. Further studies are needed to determine whether LFA-mediated changes are specific to the DBA/2J mouse or if other models with underlying pro-inflammatory microenvironments may be susceptible to RGC loss with prostaglandin analog therapy.","level":"ABSTRACT","snapshot":"sha256:ec0280d53674d7c708cba7241d237b4b52035a4d01c349c74f6e0510c1cec44b","retrievedSeq":59,"root":"root-slot-1","notes":[{"text":"DBA/2J study comparing diazoxide and latanoprost free acid: both lowered IOP, but LFA was associated with reduced RGC density, increased GFAP gliosis and altered morphology while DZ was not; raises the possibility that a common IOP-lowering drug worsens outcome in a pro-inflammatory background, but single model and no subtype resolution.","seq":64}],"candidates":["proposal-rgc-subtype-axon-compartment-gate-v1","proposal-rgc-energy-complement-gate","proposal-rgc-subtype-mito-gate-v1","proposal-rgc-axonal-atp-complement-gate-v1"],"reviewed":true},{"id":"pubmed:42556773","title":"C1q dependency of retinal ganglion cell death in blast-mediated traumatic brain injury.","text":"Traumatic brain injury is a widespread health concern that annually affects millions of people worldwide, with blast-mediated TBI (bTBI) being of particular relevance to military personnel and civilians in war zones. Current treatments primarily target symptoms, rather than the underlying neuropathology, and are ultimately limited by the need for an improved etiological understanding of TBI. Here, we utilized a pre-clinical mouse model of bTBI, previously shown to evoke a high susceptibility to retinal ganglion cell (RGC) death, to investigate whether neuroinflammatory pathways associated with the complement factor 1q (C1q) complex contribute to RGC death. To test this, C57BL/6J (B6) mice with genetic knock-out of C1qa (B6.C1qako) were exposed to bTBI, or sham control, with subsequent comparisons of RGC survival at durations of 5- and 16-weeks following exposure. Survival metrics consisted of quantifying RGC somas from immunostained retinal flat-mounts and axons from histochemically stained optic nerve cross sections. Relative to sham controls, no significant differences in the abundance of RGC somas in retina or axons in the optic nerve were detected in B6.C1qako mice at either 5- or 16-weeks after bTBI exposure. These results demonstrate that loss of C1qa confers robust and persistent neuroprotection of RGCs and identify a C1q-dependent neuroinflammatory mechanism that contributes to pathways of neuronal death that are similar to other forms of neurodegeneration, particularly glaucoma.","level":"ABSTRACT","snapshot":"sha256:40a6f9f66d8eac39ce1b32ea1d550473a44bcf04064f5901d6b8f910add776ac","retrievedSeq":59,"root":"root-slot-1","notes":[{"text":"blast TBI mouse study showing C1qa knockout prevents RGC soma and axon loss at 5 and 16 weeks; supports complement-dependent neuroinflammatory death shared with glaucoma, but TBI model, whole-RGC-population metric, no subtype analysis.","seq":64}],"candidates":["proposal-rgc-subtype-axon-compartment-gate-v1","proposal-rgc-energy-complement-gate","proposal-rgc-subtype-mito-gate-v1","proposal-rgc-axonal-atp-complement-gate-v1"],"reviewed":true},{"id":"pubmed:42442355","title":"Temporally segregated functions for Gfi1 in the development and maintenance of direction selectivity in the vertebrate retina.","text":"Retinal direction selectivity is a vital component of many visual functions, including motion processing and gaze stabilization. Direction selectivity emerges from specialized retinal ganglion cells (RGCs) that encode motion along a single preferred direction. In the mouse retina, direction-selective (DS) RGC (DSGC) subtypes are quite diverse, but little is known about the genetic programs required to generate this diversity. Moreover, it is unclear whether transcription factors that specify distinct DS subtypes play additional roles in their maintenance or maturation. Here, we show that the transcription factor Gfi1 is a conserved regulator of two DSGC subtypes tuned to vertical motion: down ON-type DSGCs (D-oDSGCs) and F-mini ONs. We show that Gfi1 promotes early differentiation of both subtypes but has distinct roles later in their development. In D-oDSGCs, Gfi1 is required postnatally for directing dendritic elaboration, and loss of Gfi1 disrupts D-oDSGC-mediated downward motion-tracking behavior, whereas in F-mini ONs, Gfi1 is required for continued cell survival . These findings reveal shared and divergent temporally segregated functions of Gfi1 in the assembly of retinal DS circuits.","level":"ABSTRACT","snapshot":"sha256:cadc7ae1fd19713b1a25e42624bef18007b745aa3114474343cf0e39ddc5baf1","retrievedSeq":59,"root":"root-slot-1","notes":[{"text":"mouse developmental study showing Gfi1 regulates two direction-selective RGC subtypes, with distinct postnatal roles including continued survival requirement for F-mini ON cells; demonstrates subtype-specific survival dependencies, but developmental/genetic, not pressure-related.","seq":64},{"text":"Mouse Gfi1 study; conserved regulator of two direction-selective RGC subtypes, with subtype-divergent roles (dendritic elaboration in D-oDSGCs vs survival in F-mini ONs); shows transcription-factor control of subtype-specific survival, but developmental, not stress-induced vulnerability.","seq":96}],"candidates":["proposal-rgc-subtype-axon-compartment-gate-v1","proposal-rgc-energy-complement-gate","proposal-rgc-subtype-mito-gate-v1","proposal-rgc-intracellular-cfh","proposal-rgc-axonal-atp-complement-gate-v1"],"reviewed":true},{"id":"pubmed:42406594","title":"M4-ipRGCs regulate contrast sensitivity in vision.","text":"Intrinsically photosensitive retinal ganglion cells (ipRGCs) in mice are comprised of at least 6 morphological subtypes, known as M1 to M6. While the M1-ipRGC subtype is well characterized, directly linking cellular manipulation of other subtypes to behavior remains challenging. However, recent transcriptomic studies revealed molecular heterogeneity within ipRGC subtypes that may help bridge this gap. Here, we use intersectional genetics for targeted in-vivo manipulation of a single ipRGC-type, the M4-ipRGC, also known as the ON-sustained alpha ganglion cell. Central projections of M4-ipRGC axons avoid the hypothalamus, including the suprachiasmatic nucleus, but abundantly innervate image-processing regions, particularly the nucleus of the optic tract. Chemogenetic activation of M4-ipRGCs enhances contrast sensitivity in behavioral and physiological tests, whereas chemogenetic inhibition reduces contrast sensitivity. This work presents a robust method for studying behaviors driven by a single ipRGC subtype in-vivo, and highlights the crucial role of M4-ipRGCs in visual tracking and contrast sensitivity.","level":"ABSTRACT","snapshot":"sha256:a184f0151befa8dff468d568038883228cd5d44a571fd1bed7e6f5ca2a5440a1","retrievedSeq":59,"root":"root-slot-1","notes":[{"text":"mouse intersectional genetics study showing M4-ipRGC chemogenetic activation or inhibition bidirectionally modulates contrast sensitivity; establishes subtype-specific functional manipulability, but no injury or vulnerability content; low direct relevance.\n\nSynthesis: Across these abstracts, convergent support exists for pressure-independent and pressure-amplified mechanisms acting on RGCs: mitochondrial genetic background and bioenergetics (42878208, 42883135, 42865964), neuroinflammation and immune tolerance including complement, C1q, Tregs, STING and microglial remodeling (42780315, 42556773, 42769369, 42878208, 42757470), circuit-level hyperactivity (42839614), and mechanical/glial mechanobiology at the optic nerve head (42908589, 42741401, 42838417). Direct subtype-differential vulnerability evidence is sparse and comes from non-IOP or non-glaucoma contexts: ONOFF versus ON RGCs after optic nerve crush (42827923), ipRGC-predominant…","seq":64}],"candidates":["proposal-rgc-subtype-axon-compartment-gate-v1","proposal-rgc-energy-complement-gate","proposal-rgc-subtype-mito-gate-v1"
