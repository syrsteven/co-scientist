d:42878208","pubmed:42865964","pubmed:42851775","pubmed:42848206","pubmed:42839614","pubmed:42838417","pubmed:42802966","pubmed:42801048","pubmed:42799797","pubmed:42780315","pubmed:42769470","pubmed:42769369","pubmed:42757470","pubmed:42751619","pubmed:42741401","pubmed:42731713","pubmed:42827923","pubmed:42737879","pubmed:42722144","pubmed:42699770","pubmed:42619738","pubmed:42603628","pubmed:42556773","pubmed:42556772","pubmed:42442355","pubmed:42406594"]},{"seq":96,"reviewedIds":["pubmed:42911707","pubmed:42908589","pubmed:42893477","pubmed:42883135","pubmed:42882003","pubmed:42878208","pubmed:42872912","pubmed:42865964","pubmed:42857614","pubmed:42851775","pubmed:42848206","pubmed:42839614","pubmed:42838417","pubmed:42817911","pubmed:42803824","pubmed:42802966","pubmed:42801048","pubmed:42799797","pubmed:42786501","pubmed:42780315","pubmed:42827923","pubmed:42751619","pubmed:42737879","pubmed:42722144","pubmed:42686909","pubmed:42619738","pubmed:42521027","pubmed:42442355","pubmed:42351640","pubmed:42265670"]},{"seq":128,"reviewedIds":["pubmed:42911707","pubmed:42908589","pubmed:42893477","pubmed:42883135","pubmed:42882003","pubmed:42872912","pubmed:42865964","pubmed:42857614","pubmed:42851775","pubmed:42848206","pubmed:42839614","pubmed:42838417","pubmed:42803824","pubmed:42802966","pubmed:42801048","pubmed:42799797","pubmed:42780315","pubmed:42774068","pubmed:42769470","pubmed:42769369","pubmed:42650212","pubmed:42510642","pubmed:42468646","pubmed:42401758","pubmed:42296909","pubmed:42255937","pubmed:42214787","pubmed:42007085","pubmed:41952895","pubmed:41929135"]}],"candidates":[{"id":"proposal-rgc-akap1-first","title":"Subtype-dependent AKAP1 retention as an initiator of glaucomatous axonal vulnerability","g":0,"summary":"Under comparable chronic intraocular pressure-related stress, RGC subtypes differ in their ability to retain mitochondrial AKAP1.","claim":"Under comparable chronic intraocular pressure-related stress, RGC subtypes differ in their ability to retain mitochondrial AKAP1. Greater early AKAP1 loss causes axonal ATP insufficiency and transport failure before cell death, making those subtypes preferentially vulnerable; complement-associated glial responses subsequently amplify, rather than initiate, this vulnerability. The specific new proposal is that subtype-dependent AKAP1 retention determines the initial vulnerability ranking, not simply that increasing retinal AKAP1 can be protective.","mechanism":["Direct evidence: pubmed:42893477 reports reduced retinal AKAP1 associated with mitochondrial and synaptic abnormalities, protection after AAV2-AKAP1 restoration in two experimental glaucoma models, and associated reductions in C1q and glial activation markers. It explicitly does not establish causality among these associated changes. These observations support testing AKAP1 but do not establish subtype selectivity or an axonal mechanism.","Proposed causal sequence in adult mouse RGCs: chronic IOP-related stress produces subtype-dependent loss of mitochondrial AKAP1; reduced mitochondrial bioenergetic capacity lowers axonal ATP availability; transport becomes impaired before overt axonal fragmentation; affected axons subsequently degenerate and their somata die. Retention of AKAP1 delays this sequence in resilient subtypes. Every subtype-specific link in this sequence remains hypothetical.","Proposed secondary amplification: metabolically compromised neuronal structures acquire complement-associated recognition and increased glial engulfment, accelerating later degeneration. Lower C1q after AKAP1 restoration is consistent with this ordering but does not demonstrate it. Complement/phagocytosis links discussed in pubmed:42769369 remain largely untested in glaucoma; applying them to AKAP1-dependent subtype vulnerability is an explicit extrapolation.","Strongest competing explanation: pressure-responsive glia initiate subtype-selective injury through local inflammatory or complement signaling, with AKAP1 loss and ATP failure occurring secondarily. Astrocyte mechanosensitive responses are directly reported in pubmed:42908589, but their causal effect on RGC subtypes is unknown. A separate non-cell-autonomous alternative is subtype-specific exposure to inhibitory-circuit dysfunction: pubmed:42839614 reports early circuit abnormalities and protection through inhibitory-circuit interventions without lowering IOP, but no subtype analysis.","Therapeutic implication, conditional on the proposed ordering: preserving RGC AKAP1 would target initiation, whereas complement inhibition would target amplification. Neither is established clinically or proposed as a substitute for IOP control; pubmed:42911707 frames neuroprotection as adjunctive."],"assumptions":["No supplied abstract directly establishes subtype-specific AKAP1 regulation, axonal ATP failure, or complement-dependent vulnerability under matched chronic IOP stress. These are proposed relationships, not reported findings; their absence from this bounded evidence set does not establish originality.","The model would be adult mice with sustained microbead-induced ocular hypertension, comparing several independently identifiable RGC subtypes within the same eyes. Subtype identities would be permanently labeled before stress, rather than inferred solely from injury-sensitive marker expression.","Comparable IOP exposure does not guarantee comparable local axonal stress. Retinal position, axon caliber, optic nerve head trajectory, perfusion, age, sex, and baseline activity must be measured or balanced before attributing subtype differences to AKAP1.","RGC-restricted interventions must have verified subtype coverage and negligible interneuron or glial expression. The supplied AKAP1 study reports retinal protection and presynaptic mitochondrial changes, not definitive RGC-autonomous or subtype-specific mediation.","ATP reporters, tissue preparation, and viral expression can alter physiology. ATP measurements require pH controls, and transport assays require normalization for tracer uptake and surviving axon number. Independent animals, not individual cells, are the primary experimental units.","Mouse results would require validation beyond this model: rodent lamina structure, RGC composition, and optic nerve head vasculature differ from humans, as emphasized in pubmed:42838417. Complement blockade may alter beneficial clearance as well as injurious signaling."],"predictions":["Temporal test: prospectively sample baseline, an early interval verified to precede detectable axon loss, an intermediate transport-deficit interval, and later degeneration over several weeks. In permanently labeled subtypes, quantify mitochondrial AKAP1 protein, axonal ATP, cargo movement, axonal integrity, and soma survival, alongside spatial C1q deposition and verified glial engulfment. Compared with sham-treated eyes, ultimately vulnerable subtypes should show AKAP1 reduction followed by ATP decline and transport impairment before increased engulfment and structural loss. A discovery cohort would define the subtype ranking and sampling windows; an independent cohort would test the locked predictions.","Causal gain-of-function test: restore AKAP1 selectively in adult RGCs to the physiological range found in resilient cells, before pressure elevation or after the first ATP deficit but before structural loss. Relative to matched control-vector eyes with equivalent IOP exposure and transduction coverage, treated vulnerable subtypes should retain higher axonal ATP, better transport, and subsequently more intact axons and surviving somata. The subtype survival gap should narrow even if initial glial activation persists. Early measurements after verified expression would test mediation before survival differences distort cell composition.","Loss-of-function and rescue test: reduce AKAP1 inducibly in adult RGCs, avoiding developmental effects and baseline degeneration. Under matched chronic ocular hypertension, previously resilient subtypes should develop earlier ATP and transport deficits and greater later degeneration than non-targeting controls. Re-expression of perturbation-resistant AKAP1 should reverse these changes. Sham-pressure groups and verification of mitochondrial localization would distinguish pressure-dependent susceptibility from nonspecific toxicity or failed targeting.","Discriminating factorial test: compare RGC AKAP1 restoration, validated local C1q inhibition, their combination, and matched vector/isotype controls, with interventions active before the early deficit window. The proposed mechanism predicts that AKAP1 restoration prevents early ATP and transport defects, whereas C1q inhibition reduces later engulfment and degeneration but does not prevent the initial subtype-specific metabolic deficit. A glia-first mechanism instead predicts that C1q inhibition prevents or substantially delays the initial AKAP1, ATP, and transport changes. Target engagement and the cellular source of C1q must be verified; reduced C1q staining alone would be insufficient.","Orthogonal and confound tests: confirm transport changes using both subtype-resolved live cargo tracking and anterograde tracing normalized to uptake and intact axon number; confirm degeneration with structural axon counts and permanent soma labels rather than marker-positive counts alone. Monitor perfusion, IOP history, and early inhibitory-circuit activity across intervention groups. If AKAP1 protection occurs only when circuit activity or perfusion changes, the proposed direct axonal mechanism would require revision."],"falsifiers":["If independently validated vulnerable subtypes retain axonal AKAP1 and ATP availability as well as resilient subtypes until after transport failure or structural degeneration, the proposed AKAP1-first ordering would be contradicted.","If physiological equalization of RGC AKAP1 demonstrably normalizes axonal ATP but leaves the subtype differences in early transport failure and subsequent degeneration unchanged, AKAP1-dependent energy failure would not explain selective vulnerability.","If adult RGC-restricted AKAP1 reduction, with verified protein depletion and metabolic impairment but without baseline toxicity, does not increase pressure-dependent transport failure or degeneration in otherwise resilient subtypes, the proposed causal determinant would be undermined.","If complement inhibition prevents the initial subtype-specific ATP and transport defects despite persistent AKAP1 loss, while RGC AKAP1 restoration fails when glial signaling remains active, a glia-first mechanism would better explain the findings.","If adequately powered, independently replicated cohorts show that local axon geometry or perfusion fully accounts for subtype vulnerability and AKAP1 manipulation does not change that relationship, the proposed molecular explanation would be rejected for this model."],"parents":[],"operator":"root","createdSeq":135,"ethicsSeq":140,"reflection":[{"seq":149,"critiques":["The central subtype-specific claim is an extrapolation: the supplied AKAP1 evidence concerns retinal AKAP1 changes and AAV2-AKAP1 protection in glaucoma models, not subtype-resolved mitochondrial AKAP1 retention, so the proposal's distinctive premise lacks direct support in the referenced material.","The proposal's causal ordering (AKAP1 loss -\u003e axonal ATP insufficiency -\u003e transport failure -\u003e degeneration) is plausible but largely inferential; the cited study explicitly does not establish causality, and no supplied source demonstrates that ATP decline precedes transport failure or that AKAP1 retention varies by RGC subtype.","The complement-amplification arm is the weakest-supported and riskiest dependency: it leans on a complement/phagocytosis source largely untested in glaucoma and on reduced C1q after AKAP1 restoration, which is correlative and compatible with many orderings, including glia-first initiation.","Adding a subtype-resolved AKAP1-retention mechanism on top of a glia-first alternative, an inhibitory-circuit alternative, and a perfusion/geometry alternative risks overfitting a multi-node mechanism that no single experiment can resolve cleanly; the proposal is broad enough that several semi-independent effects could be claimed post hoc.","The proposal does not justify why AKAP1, rather than other mitochondrial or transport regulators, should be the dominant subtype-discriminating node, and does not specify a quantitative threshold or effect-size expectation for 'greater early AKAP1 loss' that would distinguish initiator from marker.","Subtype identification across the same eyes with permanent pre-stress labeling is technically demanding and not fully resolved for all RGC subtypes; misclassification or incomplete labeling could masquerade as differential AKAP1 retention.","The therapeutic framing (AKAP1 preservation vs complement inhibition) is premature given that neither target has established subtype-level validity in glaucoma, and complement blockade carries plausible risk of impairing beneficial clearance, as the proposal acknowledges but does not quantify.","The proposal is complex relative to the evidence: a simpler two-node test (AKAP1 retention vs subtype vulnerability, without the complement arm) would be a more efficient first discriminator, and the complement arm could be deferred until the AKAP1-first ordering is supported.","The assumption that comparable IOP exposure equals comparable local axonal stress is a substantial confound; the proposal lists perfusion, geometry, and position as controls but does not guarantee they can be balanced or measured with sufficient precision to avoid residual confounding.","No supplied abstract directly supports axonal ATP failure as a subtype discriminator; ATP reporter methods, pH controls, and tissue viability issues make the key metabolic measurement vulnerable to artifact, and surviving-axon normalization does not fully address this."],"plausibility":"Moderately plausible in outline. Mitochondrial dysfunction and bioenergetic failure as contributors to compartmental axonal degeneration are well-supported general biology, and AKAP1's mitochondrial role and reported protective effect in glaucoma models make it a reasonable candidate node. However, the subtype-specific and ordering claims are speculative: the cited evidence is retinal, non-subtype-resolved, and explicitly non-causal. The complement-amplification arm is biologically plausible but substantially less supported in glaucoma. The proposal correctly identifies a strong glia-first competitor and an inhibitory-circuit competitor, which lowers confidence in AKAP1 as initiator.","prior_research":"The candidate cites AKAP1 restoration, astrocyte mechanosensitive responses, inhibitory-circuit dysfunction, complement/phagocytosis, and a neuroprotection framing, plus human/mouse structural differences. Prior research supports: AKAP1 decreases in glaucoma models with mitochondrial/synaptic abnormalities; astrocyte mechanosensitivity to pressure-related stress; early circuit dysfunction independent of IOP lowering; and general complement-mediated synaptic pruning/engulfment. Prior research does not appear to establish: subtype-resolved AKAP1 retention, an axonal ATP-first sequence, or complement as secondary amplifier in this specific subtype context. The gap positioning is therefore reasonable but the novelty rests on an untested synthesis.","testability":"Testable in principle, but with high technical burden. The proposal gives falsifiers, temporal sampling, gain/loss-of-function, factorial discriminator, and orthogonal transport/structural assays, which is strong design thinking. Weaknesses: the temporal ordering claim requires precise synchronization of ATP, transport, engulfment, and structural endpoints in the same animals with subtype-resolved labels; ATP reporters and viral expression are artifact-prone; 'physiological equalization' of AKAP1 to resilient-subtype levels is operationally difficult to define and verify; and the factorial design requires validated local C1q inhibition with verified cellular source. The falsifiers are reasonably discriminating, but several depend on absence-of-difference outcomes that are hard to interpret given limited power and confounds. Overall: testable but expensive, with substantial risk of inconclusive ordering results.","originality":"Moderate. The general idea that mitochondrial dysfunction and energy failure contribute to RGC degeneration is well established, and AKAP1 protection in glaucoma models is already reported. The specific twist—subtype-dependent AKAP1 retention as the initial vulnerability determinant, with complement as a secondary amplifier—is a genuine synthesis not directly reported in the supplied sources. However, novelty is partly by combination rather than by a sharply new mechanism, and the proposal would be stronger if it isolated one discriminating prediction rather than layering AKAP1, axonal ATP, complement, glial engulfment, circuit activity, and perfusion into one package.","unjustified_complexity":"The proposal carries more mechanistic layers than the evidence warrants. The complement/engulfment amplification arm, the inhibitory-circuit confound arm, and the perfusion/geometry arm are each substantial and are bundled with the core AKAP1-ATP-transport claim. A leaner design—first testing whether subtype AKAP1 retention correlates with and causally determines subtype-specific ATP and transport failure under matched IOP, with the complement arm deferred—would be more falsifiable and resource-efficient. The 'physiological range found in resilient cells' intervention is also underspecified relative to the complexity it introduces. The multi-cohort temporal plus factorial plus loss-of-function plus orthogonal-confound program is defensible but exceeds what is needed to first establish or refute the central ordering claim."}],"sourceIds":["pubmed:42911707","pubmed:42908589","pubmed:42893477","pubmed:42883135","pubmed:42882003","pubmed:42872912","pubmed:42865964","pubmed:42857614","pubmed:42851775","pubmed:42848206","pubmed:42839614","pubmed:42838417","pubmed:42803824","pubmed:42802966","pubmed:42801048","pubmed:42799797","pubmed:42780315","pubmed:42774068","pubmed:42769470","pubmed:42769369","pubmed:42650212","pubmed:42510642","pubmed:42468646","pubmed:42401758","pubmed:42296909","pubmed:42255937","pubmed:42214787","pubmed:42007085","pubmed:41952895","pubmed:41929135"],"score":{"mu":33.6360962371435,"sigma":5.865816704915745},"matches":3,"contentHash":"sha256:de747dbe3c7822fceaa4bd843586b8b46ea9400d156681b70ec90e6965f7e9e5","order":1},{"id":"offspring-g3-slot-1-hypothesis","title":"Competing cell-intrinsic AKAP1 retention versus glial FGF1 withdrawal as separable determinants of subtype-selective axonal energy failure in glaucoma","g":3,"summary":"Under matched chronic intraocular pressure-related stress, RGC subtypes diverge because each subtype's axon is pushed across a com…","claim":"Under matched chronic intraocular pressure-related stress, RGC subtypes diverge because each subtype's axon is pushed across a common energetic threshold by two separable inputs that must be measured and perturbed independently rather than combined into a single score: (i) cell-intrinsic retention of mitochondrial AKAP1, which sustains the axon's own ATP-generating capacity, and (ii) loss of Müller-cell FGF1, which withdraws a glia-to-neuron trophic input that the axon uses to sustain ATP. The claim is deliberately weaker and more testable than either parent's single-score or single-pathway version: the hypothesis states that the two inputs act through distinguishable routes on the axon's ATP supply, predicts that ATP decline precedes transport failure and structural loss, and predicts that the pattern of which subtypes fall first is explained by these two inputs but is not summarized by a pre-specified composite index, which is instead treated as an exploratory covariate to be evaluated with locked coefficients.","mechanism":["Direct supplied AKAP1 arm: retinal AKAP1 is reduced in glaucomatous retinas and correlates with disrupted mitochondrial dynamics and synaptic impairment; AAV2-AKAP1 restoration preserves RGCs and visual function in two experimental glaucoma models, and is accompanied by lower complement C1q and glial activation markers, which does not establish RGC-autonomous mediation (pubmed:42893477).","Direct supplied FGF1 arm: sustained ocular hypertension induced glial activation and RGC degeneration; microglial conditioned medium reduced Müller-cell FGF1; Müller-cell FGF1 deficiency worsened inflammation-induced RGC apoptosis in vitro; intravitreal recombinant FGF1 preserved RGCs and maintained retinal structure without lowering IOP; and FGF1 was reduced in Müller-cell-enriched regions of human glaucomatous retinas (pubmed:42425282). The glial-to-neuronal step is indirect and largely in vitro.","Proposed separable convergence on an axonal ATP checkpoint: sustained IOP-related stress reduces RGC mitochondrial AKAP1 retention, which lowers axonal ATP-generating capacity, while in parallel microglia-associated signals suppress Müller-cell FGF1, which withdraws a trophic input needed to sustain axonal ATP. The two routes are mechanistically distinct, so each should be independently perturbable and each should have its own signature: AKAP1 loss should be visible first in the neuronal compartment and be rescued by neuronal restoration alone, whereas FGF1 loss should be visible first in Müller cells and be rescued by glial restoration or neuronal FGF-receptor signaling. Only when both fall below required levels in the same subtype does axonal ATP fall under the level needed for fast cargo transport, which then fails, axons fragment, and somata die later.","Deliberately weakened, explicitly untested element: whether both routes operate on the same quantitatively limiting step (axonal ATP) in the same subtype is not shown by either source, and the two arms have never been measured together in subtype-resolved tissue. The design therefore tests convergence rather than assuming it, with a pre-registered rule for what counts as convergence.","Competing explanation the design must defeat: pressure-responsive optic nerve head glia and complement/tau-associated microglial remodeling initiate subtype-selective injury, with AKAP1 loss and FGF1 loss as downstream consequences (astrocyte mechanosensitive Caveolin-1 reported in pubmed:42908589; tau-microglial remodeling discussed but not causally tested in glaucoma in pubmed:42769369). This predicts that glial inhibition, not neuronal restoration, prevents the earliest AKAP1, FGF1, ATP, and transport changes.","Second competing explanation: subtype vulnerability primarily reflects intrinsic metabolic demand and electrical activity (subtype-specific biophysical and axon initial segment properties reported among PV-positive mouse RGCs in pubmed:42631048; an explicit axonal ATP demand-versus-supply hypothesis in pubmed:42737575), or early inhibitory-circuit dysfunction (pubmed:42839614), with AKAP1 and FGF1 acting as modifiers. This predicts little gain from dual restoration once demand is matched or suppressed.","Safety limit on the therapeutic reading: FGF1 is pleiotropic and receptor-promiscuous and has non-classical secretion, so any trophic restoration strategy must be bounded by physiological-range calibration, verified cell-type coverage, and monitoring for gliosis or angiogenic off-target effects. This remains a target hypothesis, not evidence of clinical efficacy, and rodent lamina, RGC composition, and optic nerve head vasculature differ from humans (pubmed:42838417)."],"assumptions":["No supplied abstract establishes subtype-resolved AKAP1 retention, subtype-resolved FGF1 dependence, or their convergence on measured axonal ATP under matched chronic IOP stress; these are proposed relationships, and absence from the bounded source set does not establish novelty.","Adult mouse RGC subtypes can be labeled permanently and independently enough to distinguish subtype death from injury-induced marker loss, and the comparison panel can be fixed before stress exposure.","Comparable cumulative IOP exposure does not guarantee comparable local axonal stress; retinal eccentricity, optic nerve head trajectory, perfusion, age, sex, mitochondrial background, and baseline activity must be measured or balanced.","Leak-free, pH-corrected axonal ATP reporters and live cargo tracking can be established in optic nerve and retinal axon segments in the relevant early interval; this requires staged assay validation and is not assumed to work first attempt.","Cell-type-restricted AAV and Cre tools for adult RGCs and adult Müller cells can achieve verified coverage and negligible off-target expression for both gain and loss of function.","The composite AKAP1-to-FGF1 index is exploratory only and its weights must be locked before confirmatory testing; no reported statistic in this proposal will treat the composite as pre-validated.","FGF1's receptor promiscuity, non-classical secretion, and possible gliosis or angiogenic effects require physiological-range calibration and safety monitoring before any therapeutic interpretation."],"predictions":["Staged assay validation before hypothesis testing: independently establish (a) permanent subtype labeling with verified soma survival readout, (b) subtype-resolved mitochondrial AKAP1 measurement, (c) Müller-cell FGF1 protein measurement and extracellular availability, (d) calibrated axonal ATP reporting with pH and viability controls, and (e) live cargo transport normalized to tracer uptake and surviving axon number. Report each assay's sensitivity in the target tissue before using it as a discriminator; if any primitives cannot reach the required sensitivity, the corresponding arm is not tested rather than replaced with a proxy of unstated validity.","Subtype-resolved time course with locked sampling windows: in a discovery cohort, define the vulnerable and resilient subtypes and fix the baseline, pre-loss, transport-deficit, and degeneration windows. In the locked test cohort, the hypothesis predicts that ATP decline precedes transport failure, which precedes structural loss, and that ATP decline is attributable to the two separable inputs. The composite AKAP1-retention/FGF1-loss index is evaluated as an exploratory covariate with pre-registered weights; the primary test is whether the two-input model explains a pre-specified incremental fraction of subtype variance above either input alone and above baseline energetic demand, not whether the composite outranks both inputs.","Separable-input factorial test: combine, in the same subtype panel, physiological-range adult RGC AKAP1 restoration, physiological-range adult Müller-cell FGF1 restoration, both, and matched vector and glial controls, all active before the early deficit window. The separable-convergence mechanism predicts partial preservation from either alone and greater preservation from both in the most vulnerable subtypes, with each arm showing its predicted signature (AKAP1 arm changes neuronal-compartment reads first; FGF1 arm changes glial and neuronal FGF-receptor reads first). If a single input fully accounts for the effect, the second restoration adds nothing and the convergence element is rejected while the surviving single-input element remains.","Cell-restricted causal loss-of-function: adult RGC-restricted AKAP1 reduction and, separately, adult Müller-cell-restricted Fgf1 deletion, each with verified protein depletion, no baseline toxicity, sham-pressure controls, and non-targeting vectors. Under matched ocular hypertension, AKAP1 reduction should worsen previously resilient subtypes and Müller-cell Fgf1 deletion should worsen subtypes with high measured FGF1 dependence; each should produce its predicted early ATP change before structural loss. Subtype dependence must be predicted from an independently measured property (subtype-resolved FGF1-receptor expression and signaling capacity, plus measured sensitivity to controlled FGF1 withdrawal in a discovery cohort) so that ranking is not defined circularly by the outcome it predicts.","Discriminating glia-first factorial test with mediator specificity: compare combined neuronal restoration against validated local complement or inflammatory inhibition, their combination, and matched controls, and where feasible identify the microglial mediator rather than treating 'microglia-associated' as a single entity. The proposed mechanism predicts neuronal restoration prevents the early ATP and transport deficits whereas glial inhibition with incomplete neuronal rescue mainly reduces later engulfment and structural degeneration; the glia-first mechanism predicts glial inhibition prevents the earliest AKAP1, FGF1, ATP, and transport changes. Because glial inhibition cannot cleanly separate initiation from amplification, both a pre-symptomatic intervention window and a delayed intervention window must be run, with target engagement verified.","Discriminating intrinsic-demand test: rank subtypes by measured baseline ATP demand markers and activity, and by sensitivity to reversible RGC-restricted activity suppression with matched inactive controls. The proposed mechanism predicts that AKAP1 plus FGF1 restoration reduces subtype vulnerability differences without requiring reduced firing, and persistent subtype ranking after verified dual restoration would favor intrinsic demand. Report decision statistics as pre-specified effect sizes with equivalence margins, not as narrative 'better predicted'.","Confound and independence controls throughout: match retinal eccentricity and optic nerve head location, monitor IOP history and perfusion, confirm degeneration with structural axon counts plus permanent soma labels, validate ATP with an orthogonal metabolic readout, and analyze animals rather than cells as independent replicates. Address the specific technical risks of longitudinal single-axon ATP imaging (phototoxicity, expression level drift) with dose-response and naïve-tissue calibration. If primitives prove underpowered or insensitive in pilot data, report a feasibility failure for that arm rather than substituting an unvalidated surrogate."],"falsifiers":["With locked composite weights and a pre-specified effect-size criterion, the two-input model explains no incremental variance in subtype vulnerability beyond either input alone or beyond baseline energetic demand. This would reject the separable-convergence element while leaving any surviving single-input element to be tested on its own.","Restoring AKAP1 and FGF1 together at calibrated physiological range produces no greater preservation of axonal ATP, transport, or survival than restoring either alone in the most vulnerable subtypes, or produces no earlier and larger ATP effect than either alone. This would contradict the claim that both operate on a common limiting axonal ATP checkpoint.","Adult RGC-restricted AKAP1 reduction or adult Müller-cell Fgf1 deletion, with verified protein depletion and no baseline toxicity, fails to produce the predicted early axonal ATP change or to shift subtype vulnerability. This would refute the corresponding causal arm.","Validated RGC-restricted FGF-receptor signaling blockade leaves FGF1-mediated ATP, transport, and survival rescue intact, or FGF1 rescue is fully prevented by blocking a non-neuronal FGF1-responsive cell population. This would overturn the proposed direct neuronal route and favor an indirect glial or circuit effect.","Subtype vulnerability that is not predicted by independently measured FGF1-receptor signaling capacity and measured sensitivity to controlled FGF1 withdrawal, or that is fully accounted for by baseline energetic demand, local axon geometry, perfusion, or intrinsic activity with no residual effect of either manipulation, would reject the proposed molecular explanation for this model.","In the pre-symptomatic window, validated local complement or inflammatory inhibition eliminates the earliest AKAP1 loss, FGF1 loss, ATP decline, and transport failure while neuronal restoration fails when glial signaling remains active. This would support a glia-first mechanism over the proposed separable-convergence ordering."],"parents":["offspring-g2-slot-0-hypothesis","proposal-rgc-fgf1-energy-dependence"],"operator":"crossover","createdSeq":364,"ethicsSeq":369,"reflection":[{"seq":374,"critiques":["The candidate is a synthesis/refinement of two parent hypotheses rather than a genuinely new mechanism; the novelty claim rests mainly on 'separable inputs measured together,' which is a design contribution, not a mechanistic one.","The core causal claim (both inputs converge on a quantitatively limiting axonal ATP checkpoint) is asserted as the discriminator, but the proposal simultaneously concedes neither source shows it; the falsifier set therefore mostly tests additivity of two already-published rescues, which is a low-yield question if each arm is only partially effective.","Subtype resolution is the linchpin, yet the candidate provides no operational definition of 'RGC subtype' for the species/panel it intends (e.g., which markers, how many subtypes, whether the vulnerable/resilient pairs are a priori or discovery-derived). Discriminating power depends entirely on this, and 'adult RGC subtype labeling' tools are assumed rather than justified.","Temporal ordering (ATP decline → transport failure → structural loss) is asserted as a prediction but the proposal does not specify the temporal resolution or effect sizes needed to establish precedence; ATP reporter kinetics and phototoxicity make 'precedes' hard to distinguish from 'co-occurs with different assay sensitivities.'","The 'locked composite index' with pre-registered weights is methodologically sound in spirit but risks being an exploratory construct dressed as a confirmatory test; locking weights without an independent derivation cohort is under-specified.","The glia-first and intrinsic-demand competitors are named, but the design does not clearly allocate power to defeat them as primary hypotheses rather than as supplementary controls; the factorial space (neuronal vs glial restoration × timing window × complement/inflammatory inhibition × activity suppression) is large relative to plausible cohort sizes.","FGF1 pleiotropy and receptor promiscuity are acknowledged, but the proposal does not specify how 'physiological-range' restoration will be calibrated or how angiogenic/gliotic off-target effects will be separated from the proposed trophic effect in vivo.","The proposal inherits the AKAP1 arm's correlative C1q/glial-marker association from the parent source while disclaiming RGC-autonomous mediation; it then uses neuronal AKAP1 restoration as a 'neuronal-compartment first' signature, which may be confounded if AKAP1 restoration indirectly reduces glial activation.","Use of 'microglia-associated signals suppress Müller-cell FGF1' as a mechanistic step is under-specified: the proposal does not name candidate mediators or how they will be identified, making the glia-first branch hard to falsify cleanly.","The candidate does not articulate a therapeutic target hierarchy or a realistic translational path; it lists safety constraints but not which node (AKAP1, FGF1, FGF-receptor, mitochondrial ATP supply) would be prioritized, leaving the 'potential therapeutic targets' output thin."],"plausibility":"Moderate. Each arm has independent published support (AKAP1 restoration preserving RGCs in experimental glaucoma; Müller-cell FGF1 loss worsening RGC apoptosis with recombinant FGF1 rescue), so a two-input model is biologically plausible. The convergence-on-axonal-ATP element is the least supported piece: it is plausible in principle given known mitochondrial trafficking and glia-neuron metabolic coupling, but the candidate itself concedes neither source demonstrates a shared limiting step, and the claim that both routes push the same subtype across one ATP threshold is a strong quantitative assertion. The weakened framing (separable, independently perturbable, ATP precedes transport) improves plausibility by making the claim modular, but the central convergence claim remains the most likely to fail.","prior_research":"The candidate is explicitly derived from two parent contents (AKAP1 glaucoma work; Müller-cell FGF1 work) and cites several adjacent literatures (optic nerve head glia/Caveolin-1, tau-microglial remodeling, PV-positive RGC biophysics, axonal ATP demand-versus-supply, inhibitory-circuit dysfunction, human/Rodent ONH differences). Prior research on RGC subtype-selective vulnerability in glaucoma is extensive (e.g., susceptibility of specific OFF/ON and alpha-RGC subtypes, dendritic/axonal energy demand differences, mitochondrial transport in glaucoma), and the proposal does not demonstrate that its two-input convergence framing is absent from that literature; it only notes absence from a bounded source set. The 'separability' and 'common ATP checkpoint' ideas overlap with existing mitochondrial-axonal energy failure and glia-neuron metabolic coupling literature and with prior combinatorial neuroprotection studies, so originality against the broader field is not established.","testability":"Testability is high in principle and the proposal is unusually explicit: staged assay validation, locked sampling windows, factorial rescue/loss-of-function designs, pre-registered effect sizes and equivalence margins, animal-level analysis, and named falsifiers. Weaknesses: (1) subtype definition and panel size are unspecified, so power for subtype-resolved comparisons is unknown; (2) establishing temporal precedence (ATP → transport → structure) with in vivo longitudinal imaging has substantial technical risk acknowledged but not quantitatively bounded; (3) distinguishing 'neuronal-compartment-first' from 'glial-first' signatures requires cell-type-resolved temporal sampling that may exceed feasible frequency; (4) the glia-first competitor is tested only partially because glial inhibition is acknowledged to conflate initiation and amplification, leaving that competitor only weakly falsifiable. Overall the predicates are measurable, but several are measurement-limited rather than conceptually untestable.","originality":"Moderate-low as a mechanism; moderate as a design. The two arms are individually prior art, and the proposal is explicit that it refines rather than originates them. The distinctive contributions are (a) treating the two inputs as separable and independently perturbable rather than as a composite score, (b) requiring ATP precedence over transport and structure, and (c) subtype-resolved convergence testing with locked weights. These are legitimate but are refinements/testing-strategy innovations rather than a new causal mechanism. The convergence-on-ATP claim, if true, would be a substantive finding, but the proposal does not establish that no prior work has tested combinatorial mitochondrial + glial trophic rescue in subtype-resolved glaucoma models.","unjustified_complexity":"High and partly unnecessary. The design combines: subtype-resolved longitudinal ATP imaging, live cargo tracking, permanent subtype labeling, cell-type-restricted AAV/Cre gain and loss of function for two genes, a composite index with locked weights, a factorial rescue design (AKAP1 × FGF1 × both × controls), a glia-first factorial with two timing windows and mediator identification, an intrinsic-demand discrimination arm with activity suppression, and extensive confound controls. Several of these could be staged or dropped: the composite index is explicitly exploratory yet consumes design and analysis effort; the glia-first competitor is partly conceded to be non-separable; and the activity-suppression arm plus dual-timing glial inhibition together likely exceed feasible cohort sizes. The core question (are AKAP1 and FGF1 separable inputs to axonal ATP in vulnerable subtypes?) could be tested with a narrower, better-powered design before committing to the full multi-arm program. Complexity here reflects breadth of competitors rather than necessity of any one experiment."}],"sourceIds":["pubmed:42911707","pubmed:42908589","pubmed:42883135","pubmed:42882003","pubmed:42878208","pubmed:42865964","pubmed:42851775","pubmed:42848206","pubmed:42839614","pubmed:42838417","pubmed:42802966","pubmed:42801048","pubmed:42799797","pubmed:42780315","pubmed:42769470","pubmed:42769369","pubmed:42757470","pubmed:42751619","pubmed:42741401","pubmed:42731713","pubmed:42737575","pubmed:42722228","pubmed:42722144","pubmed:42650212","pubmed:42632302","pubmed:42631048","pubmed:42556772","pubmed:42496936","pubmed:42427758","pubmed:42425282","pubmed:42893477","pubmed:42872912","pubmed:42857614","pubmed:42803824","pubmed:42774068","pubmed:42510642","pubmed:42468646","pubmed:42401758","pubmed:42296909","pubmed:42255937","pubmed:42214787","pubmed:42007085","pubmed:41952895","pubmed:41929135"],"score":{"mu":31.177537960592524,"sigma":6.442990495509001},"matches":2,"contentHash":"sha256:d748ccab3b72ee24b8a97a4e179fa3171a2e2a7874a4c8a7a420cb8c955db1cd","order":2},{"id":"proposal-rgc-fgf1-energy-dependence","title":"Subtype-specific dependence on Müller-cell FGF1 as an axonal energy checkpoint in glaucoma","g":0,"summary":"In adult mice exposed to comparable chronic intraocular pressure-related stress, microglia-associated suppression of Müller-cell F…","claim":"In adult mice exposed to comparable chronic intraocular pressure-related stress, microglia-associated suppression of Müller-cell FGF1 preferentially injures RGC subtypes whose axonal ATP homeostasis depends most strongly on ongoing FGF-receptor signaling. In these subtypes, trophic withdrawal causes an early axonal ATP deficit, followed by impaired cargo transport, axonal degeneration, and later somatic death. The proposed subtype-specific dependence and energetic mediation—not FGF1 neuroprotection itself—are the new, untested elements.","mechanism":["Direct supplied evidence: chronic ocular hypertension induced glial activation and RGC degeneration; microglial conditioned medium reduced Müller-cell FGF1; Müller-cell FGF1 deficiency worsened inflammatory RGC apoptosis in vitro; and intravitreal recombinant FGF1 preserved RGCs without lowering IOP (pubmed:42425282). These observations support a trophic-loss mechanism but do not demonstrate subtype selectivity, direct RGC receptor action, or axonal energetic mediation.","Proposed causal sequence: sustained IOP elevation induces microglia-associated Müller-cell FGF1 loss; reduced FGF-receptor signaling then lowers axonal ATP availability disproportionately in FGF1-dependent RGC subtypes; transport subsequently fails, followed by axonal fragmentation and neuronal death. Less dependent subtypes maintain ATP and transport despite the same trophic reduction. No specific downstream kinase pathway is assumed.","Competing cell-intrinsic hypothesis: subtype vulnerability instead reflects activity-dependent energy demand relative to mitochondrial capacity, with FGF1 loss acting only as a general modifier. Intrinsic electrical and axon initial segment differences are directly reported among mouse PV-positive RGC subtypes, but not under chronic IOP stress (pubmed:42631048). The axonal demand-supply framework is explicitly a hypothesis in pubmed:42737575, not established evidence for this proposal.","An additional alternative is that FGF1 acts chiefly by reducing glial inflammation rather than directly sustaining neuronal energy. Early retinal circuit abnormalities preceding RGC loss provide another possible upstream driver, but the supplied circuit study does not establish subtype-specific RGC hyperactivity (pubmed:42839614). Distinguishing these routes requires cell-restricted perturbations rather than recombinant FGF1 treatment alone.","Conditional therapeutic implication: preserving Müller-cell FGF1 availability or neuronal responsiveness could complement IOP lowering if the proposed mediation is confirmed. This is a target hypothesis, not evidence of clinical efficacy."],"assumptions":["Adult mouse RGC subtypes differ in their dependence on ongoing FGF1 support for axonal energy homeostasis; neither this dependence nor a vulnerable subtype ranking is established by the supplied sources.","FGF1 can act through RGC FGF receptors to sustain axonal ATP availability. This direct neuronal route is untested here; FGF1 could instead protect by suppressing inflammation or acting on other retinal cells.","Subtype identities can be established before injury using stable lineage labels plus physiological or morphological classification. Injury-induced marker loss must not be counted as neuronal death.","Comparable IOP exposure does not guarantee comparable local axonal stress. Retinal position, optic nerve head trajectory, perfusion, age, sex, mitochondrial background, and baseline activity require measurement or balancing.","Evidence is limited to supplied abstracts. Rodent-human differences in laminar anatomy, vasculature, and RGC composition limit translation (pubmed:42838417), and the absence of this mechanism from the supplied set does not establish originality."],"predictions":["Prospectively follow several independently identified adult mouse RGC subtypes during sustained ocular hypertension, including electrophysiologically distinguishable PV-positive populations without assigning their vulnerability in advance. At baseline and early pre-loss intervals over the first days to weeks, measure local Müller-cell FGF1 protein, neuronal FGF-receptor signaling, calibrated axonal ATP sensors, and live cargo transport; subsequently quantify labeled axon fragmentation and transport-independent somatic survival. The predicted order is FGF1/signaling loss, subtype-selective ATP decline, transport failure, then degeneration. Use sham-treated animals, matched cumulative IOP exposure, blinded analysis, and independent confirmation that early intervals precede cell loss.","Induce Müller-cell-restricted Fgf1 deletion in adulthood, both without pressure elevation and during matched ocular hypertension. Relative to inducible littermate and vector controls, deletion should lower axonal ATP first, then reduce cargo motility and preferentially worsen survival in the same subtypes vulnerable to pressure. Restore Müller-cell FGF1 with a deletion-resistant construct, verify extracellular availability, and test whether ATP and transport recover before structural degeneration. Include nonhypertensive rescue controls to detect toxicity or supraphysiological trophic effects.","In a factorial test, combine physiological-range FGF1 restoration with adult RGC-restricted FGF-receptor signaling blockade, after identifying the expressed receptor repertoire and verifying blockade in each subtype. Compare blocked and neighboring unblocked RGCs sharing the same glial environment. Direct neuronal mediation predicts loss of ATP, transport, and survival rescue specifically in blocked cells even if FGF1 still reduces surrounding inflammatory readouts. Include blockade-only and inactive-construct controls; quantify inflammatory state and neuronal firing to identify indirect effects.","To distinguish FGF1 dependence from the intrinsic-demand alternative, first rank subtypes by early ATP sensitivity to controlled FGF1 withdrawal in a discovery cohort, then test that ranking against pressure-induced degeneration in an independent cohort. In parallel, use reversible RGC-restricted activity suppression, with matched inactive controls and measured firing reduction, before ATP decline. The proposed mechanism predicts that FGF1 restoration reduces subtype vulnerability differences without requiring reduced firing; persistent subtype ranking after verified restoration, coupled with preferential rescue by activity suppression, would favor intrinsic energetic demand.","Validate ATP changes with an orthogonal metabolic readout and pH controls, and validate transport with live cargo tracking rather than retrograde labeling alone. Match retinal eccentricity and optic nerve head location, monitor perfusion and IOP, and analyze animals rather than individual cells as independent replicates. These controls address sensor artifacts, transport-dependent labeling failure, spatial injury gradients, and pseudoreplication that could otherwise imitate subtype-selective trophic dependence."],"falsifiers":["With verified extracellular FGF1 reduction and adequate assay sensitivity, adult Müller-cell Fgf1 deletion causes no early axonal ATP or transport deficit in the subtypes subsequently lost under chronic ocular hypertension. This would overturn FGF1 withdrawal as the proposed initiating energetic lesion.","Restoring FGF1 to a physiological range before degeneration preserves neuronal survival but does not prevent the preceding subtype-selective axonal ATP decline or transport failure. This would reject the proposed energetic mediation, even if FGF1 remains neuroprotective through another route.","Validated RGC-restricted blockade of FGF-receptor signaling leaves FGF1-mediated ATP, transport, and survival rescue intact. This would overturn the proposed direct RGC receptor mechanism and favor an indirect glial or circuit effect.","Across an independently tested subtype panel, controlled FGF1-withdrawal sensitivity fails to predict pressure vulnerability, while baseline energetic demand or local mechanical exposure does. This would reject FGF1 dependence as the principal explanation of subtype ranking."],"parents":[],"operator":"root","createdSeq":35,"ethicsSeq":40,"reflection":[{"seq":49,"critiques":["The claim's initiating lesion—microglia-associated suppression of Müller-cell FGF1 under chronic IOP stress—rests on a single supplied abstract (pubmed:42425282) in which key links (microglial conditioned medium reducing Müller FGF1; FGF1 deficiency worsening inflammatory RGC apoptosis) appear to be in vitro or indirect, so the in vivo causal chain from IOP to FGF1 loss to subtype-selective axonal ATP deficit is extrapolated rather than demonstrated.","Subtype selectivity is the central novelty but the candidate does not specify which molecular feature makes an RGC subtype 'FGF1-dependent' beyond a circular operational definition (sensitivity to FGF1 withdrawal). Without a pre-specified, independently measurable subtype property, the ranking-then-validation design risks tautology.","Direct neuronal FGF-receptor mediation is assumed but untested; FGF1 could act on Müller cells, microglia, or vasculature, and the proposal's own competing hypothesis acknowledges this. The RGC-restricted receptor blockade experiment is technically demanding (receptor repertoire, subtype-specific targeting, verification) and the candidate does not address how to achieve RGC-restricted, subtype-resolved blockade in adult mice.","The axonal ATP sensor and live transport measurements in subtype-identified RGCs in vivo over days to weeks are major technical asks; the candidate asserts 'calibrated' and 'validated orthogonally' but does not confront sensitivity limits, phototoxicity, or the difficulty of longitudinal single-axon ATP imaging in the optic nerve head.","The temporal ordering claim (FGF1 loss precedes ATP decline precedes transport failure precedes degeneration) is vulnerable to the trivial explanation that all reflect a common upstream stress; without perturbation timing that dissociates the steps, the ordering is correlational.","The claim conflates 'microglia-associated suppression of Müller FGF1' with a defined mechanism; the proposal does not specify the microglial mediator, making the 'microglia-associated' element unfalsifiable as stated and leaving a large explanatory gap between IOP and FGF1 reduction.","The 'unjustified complexity' is substantial: the hypothesis bundles subtype selectivity, a specific glial-to-neuronal trophic axis, an axonal energetic checkpoint, and a defined temporal cascade, any one of which could fail independently. The candidate partially hedges but still presents the full chain as the claim, increasing the chance of partial confirmation being overinterpreted.","Translation caveats are acknowledged, but the candidate does not address whether mouse FGF1 biology (including FGF1's non-classical secretion and receptor promiscuity) maps onto human RGC vulnerability, limiting the therapeutic implication.","Therapeutic implication ('preserving Müller-cell FGF1') is offered without considering that chronic FGF1 elevation may promote gliosis, angiogenesis, or off-target effects, and the candidate's own rescue-control caveat is not extended to this risk."],"plausibility":"Moderate and conditional. Trophic support from Müller cells to RGCs and glial involvement in glaucoma are well established, and FGF1 neuroprotection with IOP-independent rescue in the supplied abstract is consistent with a trophic mechanism. However, the specific claim that subtype-selective vulnerability is mediated by differential dependence on FGF-receptor-driven axonal ATP homeostasis is a multi-step extrapolation from in vitro and indirect evidence. Each link is individually plausible; the conjunction is speculative, and alternative explanations (intrinsic energetic demand, mechanical/structural susceptibility at the optic nerve head, inflammatory signaling) are at least as plausible for the observed subtype ranking.","prior_research":"The candidate cites a limited supplied set: glial activation and RGC degeneration with microglial suppression of Müller FGF1 and IOP-independent FGF1 rescue (pubmed:42425282); intrinsic electrical and axon-initial-segment differences among PV-positive RGC subtypes (pubmed:42631048); an explicitly hypothetical axonal demand-supply framework (pubmed:42737575); early circuit abnormalities before RGC loss (pubmed:42839614); and rodent-human anatomical caveats (pubmed:42838417). The proposal correctly notes that its mechanism is absent from the supplied set but does not survey the broader literature on FGF1 in retina, Müller-cell neurotrophic support, RGC subtype transcriptomic vulnerability, or axonal energy metabolism in glaucoma, so the originality claim is asserted against a narrow source base and cannot be fully assessed here.","testability":"Generally strong in structure: the candidate provides falsifiers, orthogonal readouts, sham and littermate controls, factorial designs, discovery/validation cohorts, and explicit attention to pseudoreplication and spatial gradients—these are good experimental-design features. Testability is weakened by unresolved technical feasibility (subtype-resolved in vivo axonal ATP imaging, RGC-restricted subtype-specific receptor blockade, longitudinal live transport in the optic nerve), by the circular operational definition of FGF1 dependence, and by the absence of a specified microglial mediator, which makes the upstream step hard to manipulate specifically. The temporal-ordering prediction requires perturbation timing that dissociates steps, which the candidate gestures at but does not fully design.","originality":"Moderate. FGF1 neuroprotection of RGCs is not new, and the candidate explicitly disclaims that element. The genuinely novel composite—subtype-selective dependence on ongoing FGF-receptor signaling for axonal ATP homeostasis as the determinant of differential vulnerability—is a reasonable incremental hypothesis, but it sits close to existing demand-supply and neurotrophic-withdrawal frameworks and is not clearly distinguished from them beyond combining them. The proposal's own hedge that absence from the supplied sources does not establish originality is appropriate; against the narrow source set, novelty is plausible but unproven.","unjustified_complexity":"The hypothesis stacks four largely independent claims: (1) a specific microglia→Müller FGF1 suppression axis under IOP stress, (2) direct neuronal FGF-receptor action, (3) an axonal ATP checkpoint as the mediating lesion, and (4) subtype-selective dependence explaining vulnerability ranking. Any subset could be true or false independently, and the candidate does not justify why the full chain is needed rather than a simpler formulation (e.g., FGF1 loss as one contributor among several to a subtype-intrinsic energetic vulnerability). The 'microglia-associated' qualifier adds a mediator-free causal link without specification. Bundling these increases interpretive ambiguity: partial confirmation (e.g., FGF1 rescue without ATP mediation) is already anticipated as a falsifier, but the claim as written would still appear partly supported, inviting overinterpretation. A leaner, stepwise hypothesis set would be more falsifiable and less prone to confounded rescue effects."}],"sourceIds":["pubmed:42911707","pubmed:42908589","pubmed:42883135","pubmed:42882003","pubmed:42878208","pubmed:42865964","pubmed:42851775","pubmed:42848206","pubmed:42839614","pubmed:42838417","pubmed:42802966","pubmed:42801048","pubmed:42799797","pubmed:42780315","pubmed:42769470","pubmed:42769369","pubmed:42757470","pubmed:42751619","pubmed:42741401","pubmed:42731713","pubmed:42737575","pubmed:42722228","pubmed:42722144","pubmed:42650212","pubmed:42632302","pubmed:42631048","pubmed:42556772","pubmed:42496936","pubmed:42427758","pubmed:42425282"],"score":{"mu":30.98843656246751,"sigma":6.555772290574629},"matches":2,"contentHash":"sha256:419df8f49704f55e0478fe6cb31f3fd35e706b5cf59cc8fd80159fb555b0bc7e","order":3},{"id":"proposal-rgc-fgf1-subtype-energy-gate-v2","title":"FGFR1-competence defines which RGC subtypes suffer an axonal ATP deficit when microglial TNFA suppresses Müller-cell FGF1 under chronic ocular hypertension","g":1,"summary":"Under comparable chronic intraocular pressure-related stress in adult mice, microglia-derived TNFα suppresses Müller-cell FGF1 pro…","claim":"Under comparable chronic intraocular pressure-related stress in adult mice, microglia-derived TNFα suppresses Müller-cell FGF1 production; RGC subtypes whose axons express high FGFR1 levels and lack compensatory FGFR2/FGFR3 or constitutive glycolytic reserve then suffer an early axonal ATP deficit, followed by impaired cargo transport, axonal degeneration, and later somatic death. Subtypes with low axonal FGFR1 or high compensatory receptor/bioenergetic reserve remain transport-competent and survive. The prespecified subtype property that determines the ranking is axonal FGFR1 abundance measured before injury; FGF1 dependence is therefore defined independently of the outcome rather than circularly.","mechanism":["Direct supplied evidence: sustained ocular hypertension in mice induced glial activation and progressive RGC degeneration; microglial conditioned medium reduced Müller-cell FGF1; Müller-cell FGF1 deficiency worsened inflammatory RGC apoptosis in vitro; intravitreal recombinant FGF1 preserved RGCs without lowering IOP (pubmed:42425282). These are the only direct anchors and are largely in vitro, so the in vivo chain is proposed, not demonstrated.","Proposed causal sequence: chronic IOP elevation activates microglia, which release TNFα onto Müller cells; Müller-cell FGF1 production falls; axonal FGFR1 signaling in high-FGFR1 RGC subtypes declines; mitochondrial ATP output near the optic nerve head falls below the transport and maintenance demand of the axon; cargo transport fails; axon fragments; soma dies later.","Microglial mediator specification: TNFα is proposed as the soluble mediator linking microglial activation to Müller-cell FGF1 suppression, providing a testable intermediate that the parent left unfalsifiable. Alternative mediators (IL-1β, complement C3, reactive oxygen species, or contact-dependent signals) are explicit competitors to be separated by neutralization and receptor-blockade experiments rather than assumed away.","Prespecified subtype property: axonal FGFR1 protein level, measured before any injury, is the independent predictor of vulnerability, replacing the parent's circular operational definition of 'FGF1 dependence' as sensitivity to FGF1 withdrawal. Compensatory candidates that could break the prediction are FGFR2/FGFR3 expression, baseline axonal mitochondrial membrane potential, and glycolytic capacity.","Competing cell-intrinsic account: subtype vulnerability is set instead by activity-dependent energy demand relative to mitochondrial capacity, with FGFR1/FGF1 loss only a general modifier. Intrinsic electrical and axon initial segment differences are reported among mouse PV-positive RGC subtypes (pubmed:42631048), and the axonal ATP demand-supply balance is an explicit hypothesis, not established, in pubmed:42737575.","Temporal-order caveat: FGF1 loss, ATP decline, transport failure, and degeneration could all reflect one upstream stress. The design must perturb each step independently and test whether intervening at one step shifts the downstream step, not merely observe their sequence.","Therapeutic implication is treated as a target hypothesis with a stated risk: chronic FGF1 elevation could promote gliosis, angiogenesis, or off-target FGFR activation, so rescue experiments must include a physiological-range ceiling and toxicity readouts. Clinical efficacy is not claimed."],"assumptions":["Adult mouse RGC subtypes differ in axonal FGFR1 abundance and in dependence on ongoing FGF1 support; this is untested in the supplied sources.","TNFα is a candidate, not established, microglial mediator of Müller-cell FGF1 suppression; the neutralization experiment may refute it.","FGF1 acts directly on RGC axons through FGFR1; FGF1's non-classical secretion and receptor promiscuity mean this direct route requires cell-restricted verification.","The prespecified axonal FGFR1 ranking can be measured reliably before injury in subtype-identified RGCs.","Comparable cumulative IOP exposure does not equal comparable local axonal stress; retinal eccentricity, optic-nerve-head trajectory, perfusion, age, sex, and mitochondrial background require measurement or balancing.","Evidence is limited to supplied abstracts; rodent-human differences in laminar anatomy, vasculature, and RGC composition limit translation (pubmed:42838417), and absence of this mechanism from the supplied set does not establish novelty."],"predictions":["Prospectively rank independently identified adult mouse RGC subtypes, including electrophysiologically distinguishable PV-positive populations, by pre-injury axonal FGFR1 protein; then expose them to sustained ocular hypertension with matched cumulative IOP. High-axonal-FGFR1 subtypes should show earlier Müller-cell-adjacent FGF1 decline, earlier calibrated axonal ATP reduction, earlier cargo-transport failure, and greater degeneration than low-FGFR1 subtypes. The prespecified ranking avoids tautology because FGFR1 is measured before injury, not inferred from withdrawal sensitivity.","Measure retinal TNFα and microglial activation state before Müller-cell FGF1 loss. Microglial TNFα neutralization, or microglia-restricted TNFα deletion, should attenuate Müller-cell FGF1 decline and the downstream ATP and transport deficits relative to isotype and littermate controls; neutralization of IL-1β, complement C3, or reactive oxygen species should fail if TNFα is the mediator. Partial or absent protection would refute TNFα as the specified link.","In a factorial design, restore Müller-cell FGF1 to a verified physiological range and separately apply RGC-restricted FGFR1 blockade (or subtype-restricted Fgfr1 deletion) after confirming the expressed receptor repertoire in each subtype. Direct axonal mediation predicts that FGF1 restoration rescues ATP, transport, and survival only in FGFR1-competent unblocked cells, while blocked neighbors sharing the same glial environment remain impaired. Blockade-only and inactive-construct controls are required.","Perturb each step to test temporal ordering rather than correlation: (i) microglial TNFα neutralization before FGF1 loss; (ii) timed FGF1 restoration after ATP decline but before transport failure; (iii) transport rescue independent of ATP. If the proposed chain is causal, each intervention should shift only the downstream steps and not the upstream step; uniform movement of all steps would favor a common upstream stress.","To distinguish the FGFR1-competence hypothesis from the intrinsic-demand alternative, use reversible RGC-restricted activity suppression before ATP decline, with matched inactive controls and measured firing reduction. The proposed mechanism predicts that physiological FGF1 restoration removes subtype vulnerability differences without requiring reduced firing; persistent subtype ranking after verified restoration, coupled with preferential rescue by activity suppression, would favor intrinsic energetic demand.","Validate ATP changes with an orthogonal metabolic readout and pH controls, and validate transport with live cargo tracking rather than retrograde labeling alone. Match retinal eccentricity and optic-nerve-head location, monitor perfusion and IOP, analyze animals rather than cells as replicates, and include a chronic FGF1-elevation arm with gliosis, angiogenesis, and off-target FGFR readouts to assess the stated therapeutic risk."],"falsifiers":["With verified prespecified axonal FGFR1 measurements before injury, an independently tested subtype panel shows that axonal FGFR1 abundance fails to predict the rank order of FGF1-withdrawal ATP sensitivity or pressure-induced degeneration, while baseline activity demand or local mechanical exposure predicts it. This overturns FGFR1 competence as the discriminator.","Microglial TNFα neutralization or microglia-restricted TNFα deletion does not prevent Müller-cell FGF1 decline under chronic ocular hypertension, while neutralization of another candidate mediator does. This rejects TNFα as the specified microglia-to-Müller-cell link, even if the broader FGF1 axis survives.","Restoring FGF1 to a verified physiological range before degeneration preserves neuronal survival but does not prevent the preceding subtype-selective axonal ATP decline or transport failure. This rejects the proposed energetic mediation, even if FGF1 remains neuroprotective through another route.","Validated RGC-restricted FGFR1 blockade leaves FGF1-mediated ATP, transport, and survival rescue intact in the subtype predicted to depend on FGFR1, favoring an indirect glial, microglial, or vascular mechanism over direct axonal receptor action.","Timed intervention at the ATP step that does not shift later transport or degeneration, while an upstream intervention shifts all steps uniformly, is consistent with a single common upstream stress rather than the proposed ordered chain; if perturbation never dissociates steps, the ordering claim is unsupported even if correlations hold.","With verified extracellular FGF1 reduction and adequate assay sensitivity, adult Müller-cell Fgf1 deletion causes no early axonal ATP or transport deficit in the subtypes subsequently lost under chronic ocular hypertension. This overturns FGF1 withdrawal as the proposed initiating energetic lesion."],"parents":["proposal-rgc-fgf1-energy-dependence"],"operator":"mutation","createdSeq":208,"ethicsSeq":213,"reflection":[{"seq":218,"critiques":["The candidate's core in vivo chain (microglial TNFα → Müller-cell FGF1 suppression → axonal FGFR1-dependent ATP deficit → transport failure → degeneration) is assembled from mostly in vitro anchors (microglial conditioned medium, Müller-cell FGF1 deficiency in vitro, intravitreal FGF1 neuroprotection). The supplied direct evidence does not establish any in vivo step of this sequence, so plausibility rests on analogy rather than demonstrated causality.","Two unvalidated mediators are stacked multiplicatively (TNFα as the microglia-to-Müller signal, and axonal FGFR1 as the subtype discriminator). Each is independently plausible but unproven; the conjunction is much less likely than either alone, and the design does not first establish the simpler link before adding the second.","FGF1 is a non-classical secreted, heparin-binding, promiscuous FGFR ligand. Attributing a subtype-selective effect to 'axonal FGFR1 abundance' assumes (a) FGF1 reaches axons in sufficient local concentration, (b) FGFR1 is the dominant functional receptor on those axons despite FGFR2/FGFR3 co-expression and heparin/heparan dependence, and (c) receptor abundance rather than signaling state or downstream coupling determines sensitivity. None of these is established in the supplied sources.","The claim that subtypes 'lack compensatory FGFR2/FGFR3 or constitutive glycolytic reserve' is asserted, not measured; the candidate itself lists these as 'compensatory candidates that could break the prediction,' which concedes the discriminator may be compound rather than FGFR1 alone. This weakens the crisp single-property prediction and blurs the boundary with the intrinsic-demand alternative.","The temporal-ordering falsifier is well-posed in principle but hard to satisfy: FGF1 loss, ATP decline, transport failure, and death are all plausibly coordinated by a single upstream stress. The candidate acknowledges this but does not specify how 'uniform shift of all steps' would be operationally distinguished from a genuinely ordered chain in a chronic, slowly progressing disease.","Therapeutic framing (chronic FGF1 elevation) carries undefined risk of gliosis, angiogenesis, and off-target FGFR activation; the candidate flags this but the rescue arm does not specify a quantitative physiological ceiling or potency-matched controls, leaving the 'restore to physiological range' claim underspecified.","Translation to human glaucoma is explicitly limited by rodent-human differences in laminar anatomy, vasculature, and RGC composition; the candidate notes this but the therapeutic-target framing still implies generality that the supplied evidence cannot support."],"plausibility":"Moderate but conditional. Each link has independent support: ocular hypertension activates glia and drives RGC loss; microglial factors can suppress Müller-cell FGF1; Müller-cell FGF1 supports RGC survival; FGF1 is neuroprotective in vivo without lowering IOP; and axonal energy failure is a recognized contributor to glaucoma-like degeneration. However, the specific conjunction—TNFα as the obligate microglia-to-Müller mediator, and pre-injury axonal FGFR1 abundance as the subtype discriminator—is not established by the supplied evidence and is largely inferred. The chain is internally coherent and biologically respectable, but plausibility is materially lower than for a single-link hypothesis because two unproven mediators are chained, and because FGF1's receptor promiscuity and non-classical secretion make 'direct axonal FGFR1' a demanding and easily violated assumption. The candidate appropriately downgrades the in vivo chain to 'proposed, not demonstrated.'","prior_research":"The supplied anchors are narrow and largely in vitro: (1) sustained ocular hypertension induces glial activation and progressive RGC degeneration in mice; (2) microglial conditioned medium reduces Müller-cell FGF1; (3) Müller-cell FGF1 deficiency worsens inflammatory RGC apoptosis in vitro; (4) intravitreal recombinant FGF1 preserves RGCs without lowering IOP; (5) intrinsic electrical/axon-initial-segment differences among mouse PV-positive RGC subtypes; (6) an axonal ATP demand-supply hypothesis in glaucoma. The candidate explicitly states that the specific mechanism is absent from the supplied set and that absence does not establish novelty. Prior literature on FGF1/FGFR signaling in retinal neurons, Müller-cell neurotrophic support, microglial TNFα in glaucoma, and RGC subtype-selective vulnerability is acknowledged only at the level of the supplied abstracts; the reflection does not claim a comprehensive literature check, and no external search was performed.","testability":"Good in principle and unusually explicit. The candidate provides prospectively measurable predictors (pre-injury axonal FGFR1 ranking, before injury, independent of outcome), a mediator-separation experiment (TNFα neutralization vs IL-1β/C3/ROS), a receptor-restricted rescue/blockade factorial design, a stepwise temporal-perturbation scheme, an activity-suppression arm to separate FGFR1 competence from intrinsic energetic demand, and orthogonal ATP/transport readouts with pH and live-tracking controls. It also specifies animal-level replication, IOP/eccentricity/perfusion matching, and toxicity readouts. Weaknesses: some falsifiers (e.g., the 'uniform shift of all steps' criterion, and verifying a true 'physiological range' of FGF1) lack operational thresholds; subtype-restricted Fgfr1 deletion and microglia-restricted TNFα deletion in adult mice are technically demanding; and distinguishing a single common upstream stress from an ordered chain under chronic, slow disease remains the hardest testability challenge. Overall the falsifiers are well-constructed and would genuinely discriminate the hypothesis from stated alternatives.","originality":"Moderate. The individual components—microglial TNFα in glaucoma, Müller-cell FGF1 neurotrophic support, axonal energy failure, RGC subtype vulnerability—are each familiar. The candidate's original contribution is the specific coupling: making pre-injury axonal FGFR1 abundance a prespecified, non-circular subtype discriminator, and explicitly juxtaposing a glia-FGF1-FGFR1 route against an intrinsic activity-demand account. Replacing the parent's outcome-defined 'FGF1 dependence' with a before-injury receptor measurement is a real methodological improvement and a defensible novelty claim at the level of experimental design rather than of biological mechanism. The candidate honestly states that absence of the mechanism from supplied sources does not establish novelty.","unjustified_complexity":"The hypothesis is complex in a way that is only partially justified. The two-mediator chain (TNFα and axonal FGFR1) plus three compensatory axes (FGFR2/FGFR3, mitochondrial membrane potential, glycolytic reserve) plus a temporal-ordering scheme plus an intrinsic-demand alternative is a lot to test in one proposal; a simpler first test (does FGF1 withdrawal alone cause subtype-selective axonal ATP decline?) is subsumed rather than staged. The candidate does justify complexity as a response to the parent's unfalsifiable 'FGF1 dependence' and as a deliberate competitor to the intrinsic-demand account, and it flags the risk of common-upstream confounding. Still, the factorial perturbation design, subtype-restricted receptor deletion, live cargo tracking, and chronic FGF1 elevation arm impose substantial experimental burden without a clearly staged simplification; the proposal would benefit from an explicit first-go/no-go experiment before the full chain is attempted."}],"sourceIds":["pubmed:42911707","pubmed:42908589","pubmed:42883135","pubmed:42882003","pubmed:42878208","pubmed:42865964","pubmed:42851775","pubmed:42848206","pubmed:42839614","pubmed:42838417","pubmed:42802966","pubmed:42801048","pubmed:42799797","pubmed:42780315","pubmed:42769470","pubmed:42769369","pubmed:42757470","pubmed:42751619","pubmed:42741401","pubmed:42731713","pubmed:42737575","pubmed:42722228","pubmed:42722144","pubmed:42650212","pubmed:42632302","pubmed:42631048","pubmed:42556772","pubmed:42496936","pubmed:42427758","pubmed:42425282"],"score":{"mu":27.864735378420843,"sigma":5.736189496598392},"matches":3,"contentHash":"sha256:52a05b7d0c4fada02d458e3e97c52fbbde0470f87fa1b775f22bfe9568a29822","order":4},{"id":"proposal-rgc-subtype-axon-compartment-gate-v1","title":"Subtype-resolved axonal compartment recovery couples mitochondrial fission state to complement-dependent removal in chronic ocular hypertension","g":3,"summary":"Under comparable chronic intraocular pressure-related stress, adult mouse RGC subtypes diverge in a single measurable axonal-compa…","claim":"Under comparable chronic intraocular pressure-related stress, adult mouse RGC subtypes diverge in a single measurable axonal-compartment variable: the time required for axon-terminal mitochondria to recover from a stress-induced fission state. Subtypes with delayed recovery show sustained, sublethal axonal ATP depression that precedes transport failure, then sustained externalized axonal phosphatidylserine, then C1q-dependent microglial removal of connected axonal segments, and only later soma loss. Rapid-recovery subtypes escape this conversion because ATP is restored before phosphatidylserine exposure becomes sustained. The proposed new claim is that the fission-recovery time constant and the ATP-depression duration are the same subtype-ranking variable, so that an intrinsically set mitochondrial recovery rate indexes a phosphatidylserine-dependent complement-recognition threshold; PKA-anchored sites, and retinal inhibitory-circuit hyperactivity may modulate that variable but are not required for the ranking to exist.","mechanism":["Grounding, not derivation: chronic IOP-related stress is associated with mitochondrial insufficiency, impaired bioenergetics, axonal transport failure, and neuroimmune activation in RGCs and optic nerve (pubmed:42401758, pubmed:42883135, pubmed:42865964). Subtype-selective axonal vulnerability is observed after optic nerve crush, with ONOFF-RGCs more affected than ON-RGCs (pubmed:42827923), but that model is acute mechanical injury and does not establish a mitochondrial or complement mechanism under chronic ocular hypertension; RGC subtype-specific pathology in human tissue is explicitly listed as a knowledge gap (pubmed:42214787).","Proposed subtype-intrinsic node: in the pre-degenerative window, axonal mitochondria in vulnerable subtypes remain in a DRP1-dependent fission state longer than in resilient subtypes after comparable pressure exposure. A candidate molecular correlate is subtype-dependent retention of PKA-anchored mitochondrial scaffolding; retinal AKAP1 restoration preserves mitochondrial fusion, cristae, bioenergetic capacity, RGC survival, and visual function and is associated with lower C1q and glial activation markers, but these AKAP1 data are retinal-level and associative rather than RGC-subtype-resolved (pubmed:42893477). The fission-fusion arm is therefore a hypothesis, not a cited mechanism.","Proposed energetic consequence: the duration, not the depth, of axonal ATP depression is the relevant variable, referenced to each subtype's own baseline fragmentation state and to an intra-animal sham control rather than a single absolute threshold. Live ATP readouts must be pH-controlled and checked against viability because metabolic reporters can alter physiology.","Proposed recognition step, and the central gap: sustained sublethal ATP depression impairs maintenance of axonal membrane phospholipid asymmetry, producing prolonged externalized phosphatidylserine on stressed but still connected axon segments. No supplied source demonstrates ATP-dependent phosphatidylserine exposure in RGC axons; this is an explicit untested bridge and the principal target of the experiments below.","Proposed amplification and conversion: exposed axonal phosphatidylserine permits C1q recognition and microglial removal of connected segments, making otherwise recoverable axonopathy irreversible before soma loss. Glaucoma-associated microglial remodeling includes complement and phagocytosis-related changes, but causal neuronal-to-glial links are unresolved (pubmed:42769369); C1qa deletion preserves RGC somas and axons after blast injury (pubmed:42556773), which is a cross-model and cross-timescale extrapolation when applied to chronic IOP.","Proposed modulators that are deliberately not in the core chain: (a) PKA/AKAP1-anchored signaling may se
