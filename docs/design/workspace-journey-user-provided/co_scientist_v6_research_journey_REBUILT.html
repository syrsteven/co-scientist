function renderLive(){const dirs=hasDirections()?DIRECTIONS:[];return `${stagePanel()}${metricRow()}<div class="liveGrid"><div class="column">${currentActivity()}<section class="panel pad"><div class="sectionHeader"><div><h3 class="panelTitle">Research directions</h3><p>Independent questions emerging from the broad review.</p></div><button class="textButton" data-action="tab" data-id="directions">View all ${icon('arrow')}</button></div>${dirs.length?dirs.map(directionCard).join(''):`<div class="empty"><h3>Preparing research directions</h3><p>Direction questions will appear after the background synthesis.</p></div>`}</section>${hypCount()?`<section class="panel pad"><div class="sectionHeader"><div><h3 class="panelTitle">Emerging hypotheses</h3><p>New candidates become readable as they are saved.</p></div><button class="textButton" data-action="tab" data-id="hypotheses">View all ${icon('arrow')}</button></div>${activeHyps().map(hypothesisShort).join('')}</section>`:''}</div><div class="column">${latestFindings()}${researcherInput()}<section class="panel pad"><div class="sectionHeader"><h3 class="panelTitle">Search transparency</h3><button class="textButton" data-action="tab" data-id="literature">All queries ${icon('arrow')}</button></div>${visibleQueries().slice(-3).reverse().map(q=>`<div class="lineItem"><span class="querySummary">${esc(q.query)}</span><div class="row" style="margin-top:7px">${qStatusPill(q)}<span class="smallMuted">${esc(q.purpose)}</span></div></div>`).join('')||'<p class="smallMuted">Search queries will appear here.</p>'}</section></div></div>`}
function briefBlock(p){const fields=[['Research Question',p.question],['Background & Rationale',p.background],['Research Objectives',p.objectives],['Hard Constraints',p.constraints],['Research Preferences',p.preferences],['Research Focus',p.focus],['Intended Use',p.intendedUse],['Reference Materials',p.references]];return `<div class="briefRows">${fields.filter(([,v])=>v).map(([name,val])=>`<div><label>${name}</label><div class="fieldValue">${esc(val)}</div></div>`).join('')}</div>`}
function overview(){return `<div class="twoCol"><div class="column"><section class="panel pad"><div class="sectionHeader"><div><h3 class="panelTitle">Research overview</h3><p>Original question and research scope.</p></div>${button('View complete brief','briefModal','small')}</div><h2 class="detailTitle">${esc(current().question)}</h2><div class="detailSection"><h3>Background synthesis</h3>${sample()&&S.step>=1?`<p>The illustrative broad reading identifies several possible explanations for RGC subtype vulnerability: intrinsic metabolic resilience, axonal transport, glial support, and injury-associated tissue remodeling. No causal ordering is established by this preview.</p><p>Different model contexts and endpoints need to remain separate when candidates are developed.</p>`:'<p>Broad source reading and neutral synthesis will appear here once completed.</p>'}</div><div class="detailSection"><h3>Unresolved relationships</h3><ul>${listRows(sample()&&S.step>=1?["Whether mitochondrial organization precedes or follows axonal impairment","The contribution of glial support relative to intrinsic neuronal susceptibility","Whether inflammatory remodeling is causal or reactive"]:["Awaiting source review and synthesis."])}</ul></div></section><section class="panel pad"><div class="sectionHeader"><h3 class="panelTitle">Research directions</h3><button class="textButton" data-action="tab" data-id="directions">View directions ${icon('arrow')}</button></div>${hasDirections()?DIRECTIONS.map(d=>`<div class="lineItem"><div class="row">${statusTag(d.id+' · '+d.kind,'muted')}${statusTag(directionStatus(d))}</div><b style="margin-top:7px">${esc(d.title)}</b><button class="textButton" data-action="seed" data-id="${d.id}">Explore ${icon('arrow')}</button></div>`).join(''):'<div class="empty"><p>Directions are prepared after broad background synthesis.</p></div>'}</section></div><div class="column"><section class="panel pad"><h3 class="panelTitle">Study at a glance</h3><div class="factGrid" style="grid-template-columns:repeat(2,1fr)"><div class="fact"><strong>${searchesTotal()}</strong><small>Search matches</small></div><div class="fact"><strong>${reviewedCount()}</strong><small>Sources reviewed</small></div><div class="fact"><strong>${hasDirections()?DIRECTIONS.length:0}</strong><small>Directions</small></div><div class="fact"><strong>${hypCount()}</strong><small>Hypotheses</small></div></div><p class="smallMuted">Counts reflect the current illustrative scene; search matches are not unique studies.</p></section><section class="panel pad"><h3 class="panelTitle">Current focus</h3><p class="detailLead">${esc(S.step===6?'Review the saved hypotheses and initial findings.':S.step<2?'Establish the overall evidence background.':S.step<4?'Develop focused evidence for each research direction.':'Review candidate claims and their key uncertainties.')}</p>${button('Open Live Research '+icon('arrow'),'tab','small','data-id="live"')}</section><section class="panel pad"><h3 class="panelTitle">Saved hypotheses</h3>${hypCount()?activeHyps().map(h=>`<div class="lineItem"><b>${esc(h.title)}</b><button class="textButton" data-action="hyp" data-id="${h.id}">Open ${icon('arrow')}</button></div>`).join(''):'<p class="smallMuted">Hypotheses have not been generated yet.</p>'}</section></div></div>`}
function renderDirections(){if(!hasDirections())return `<section class="panel pad"><div class="empty"><h3>Research directions are being prepared</h3><p>Once the broad synthesis is available, the system will propose independent research questions here.</p></div></section>`;const d=DIRECTIONS.find(d=>d.id===S.seed)||DIRECTIONS[0],qs=d.queries.map(id=>QUERIES.find(q=>q.id===id)).filter(q=>S.step>=q.at);const h=activeHyps().filter(h=>h.seed===d.id);return `<div class="split"><section class="panel pad"><div class="sectionHeader"><div><h3 class="panelTitle">Research directions</h3><p>${DIRECTIONS.length} exploration questions</p></div></div><div class="listIndex">${DIRECTIONS.map(x=>`<button data-action="seed" data-id="${x.id}" class="${x.id===d.id?'active':''}"><span class="tag muted">${x.id} · ${x.kind}</span><strong>${esc(x.title)}</strong><small>${esc(directionStatus(x))}</small></button>`).join('')}</div></section><article class="panel pad"><div class="row">${statusTag(d.id+' · '+d.kind,'muted')}${statusTag(directionStatus(d))}</div><h2 class="detailTitle">${esc(d.question)}</h2><p class="detailLead">${esc(d.why)}</p><div class="factGrid"><div class="fact"><strong>${qs.length}</strong><small>Planned queries</small></div><div class="fact"><strong>${qs.filter(q=>queryState(q)==='Completed').length}</strong><small>Executed searches</small></div><div class="fact"><strong>${h.length}</strong><small>Hypotheses</small></div></div><div class="detailSection"><div class="sectionHeader"><h3>Focused literature search</h3><button class="textButton" data-action="tab" data-id="literature">All searches ${icon('arrow')}</button></div>${qs.length?qs.map(q=>queryCard(q,true)).join(''):'<p>Focused searches will begin after direction preparation.</p>'}</div><div class="detailSection"><h3>Findings from this direction</h3><p>${esc(S.step>=4?d.finding:'Reading and synthesis are underway; no complete direction summary is available yet.')}</p></div><div class="detailSection"><h3>Open scientific questions</h3><ul>${listRows(d.open)}</ul></div><div class="detailSection"><h3>Related hypotheses</h3>${h.length?h.map(h=>`<div class="lineItem"><b>${esc(h.title)}</b><p>${esc(h.claim)}</p><button class="textButton" data-action="hyp" data-id="${h.id}">Read hypothesis ${icon('arrow')}</button></div>`).join(''):'<p>No hypothesis from this direction has been saved in the selected scene.</p>'}</div></article></div>`}
function hypDetail(h){const pids=h.basis.map(id=>PAPERS.find(p=>p.id===id));return `<div class="row">${statusTag(h.id+' · '+h.method,'muted')}${statusTag(S.step>=6?'Initial review complete':S.step>=5&&h.id==='H01'?'Review in progress':'Generated')}</div><h2 class="detailTitle">${esc(h.title)}</h2><p class="detailLead">${esc(h.claim)}</p><div class="tabBar">${[['science','Scientific Content'],['evidence','Evidence & Sources'],['review','Initial Review'],['notes','My Notes']].map(([id,name])=>`<button class="${S.hypTab===id?'active':''}" data-action="hypTab" data-id="${id}">${name}</button>`).join('')}</div>${S.hypTab==='science'?`<section class="detailSection" style="border-top:0"><h3>Proposed mechanism</h3><ol style="padding-left:20px">${listRows(h.mechanism)}</ol></section><section class="detailSection"><h3>Necessary assumptions</h3><ul>${listRows(h.assumptions)}</ul></section><section class="detailSection"><h3>Differentiating prediction</h3><p>${esc(h.prediction)}</p></section><section class="detailSection"><h3>Competing explanation</h3><p>${esc(h.alternative)}</p></section><section class="detailSection"><h3>Falsification condition</h3><p>${esc(h.falsifier)}</p></section>`:S.hypTab==='evidence'?`<section class="detailSection" style="border-top:0"><h3>Source context</h3><p>This illustrative hypothesis cites example reading records, not verified published papers.</p>${pids.map(p=>`<div class="lineItem"><b>${esc(p.title)}</b><p>${esc(p.finding)}</p><button class="textButton" data-action="paper" data-id="${p.id}">View source note ${icon('arrow')}</button></div>`).join('')}</section><section class="detailSection"><h3>Critical evidence gap</h3><p>${esc(h.gap)}</p></section>`:S.hypTab==='review'?`<div class="detailSection" style="border-top:0"><div class="reviewFlag">${esc(S.step<5?'Initial review has not started.':S.step===5&&h.id==='H02'?'Initial review is pending.':h.review)}</div>${S.step>=5&&!(S.step===5&&h.id==='H02')?`<h3 style="margin-top:17px">Scientific unknowns</h3><ul>${listRows(h.unknowns)}</ul><h3 style="margin-top:19px">Further checks</h3><ul>${listRows(h.checks)}</ul><p class="smallMuted">The initial check does not constitute validation, approval or formal Ranking.</p>`:''}</div>`:`<section class="detailSection" style="border-top:0"><h3>Researcher notes</h3>${notesFor('hyp',h.id)}${button(icon('plus')+' Add a note','note','small',`data-target="${h.id}"`)}</section>`}`}
function notesFor(kind,id){let notes=S.notes.filter(n=>n.projectId===S.current&&n.kind===kind&&n.target===id);return notes.length?notes.map(n=>`<div class="lineItem"><b>${esc(n.text)}</b><p>Saved in this preview session</p></div>`).join(''):'<p class="smallMuted">No notes for this item yet.</p>'}
function renderHypotheses(){if(!hypCount())return `<section class="panel pad"><div class="empty"><h3>Hypotheses will appear here</h3><p>Each candidate will be linked to a prepared research direction and saved reading context.</p></div></section>`;let h=HYPS.find(h=>h.id===S.hyp)||HYPS[0];return `<div class="sectionHeader"><div><h2 class="panelTitle">Candidate hypotheses</h2><p>Scientific claims, source context, uncertainties and initial review.</p></div>${button(icon('layers')+(S.compare?' Exit comparison':' Compare hypotheses'),'compare','small')}</div>${S.compare?`<div class="compareGrid">${activeHyps().map(h=>`<article class="panel compareCard"><div class="row">${statusTag(h.id+' · '+h.seed,'muted')}${statusTag(h.method)}</div><h3>${esc(h.title)}</h3>${[['Scientific claim',h.claim],['Proposed mechanism',h.mechanism.join(' → ')],['Main evidence gap',h.gap],['Differentiating prediction',h.prediction],['Competing explanation',h.alternative]].map(([name,value])=>`<div class="compareRow"><strong>${name}</strong><p>${esc(value)}</p></div>`).join('')}</article>`).join('')}</div>`:`<div class="split"><section class="panel pad"><h3 class="panelTitle" style="margin-bottom:13px">Available hypotheses</h3><div class="listIndex">${activeHyps().map(x=>`<button class="${x.id===h.id?'active':''}" data-action="hyp" data-id="${x.id}"><span class="tag muted">${x.id} · from ${x.seed}</span><strong>${esc(x.title)}</strong><small>${esc(x.method)} generation</small></button>`).join('')}</div></section><article class="panel pad"><button class="textButton" data-action="seed" data-id="${h.seed}">${icon('back')} Originating direction ${h.seed}</button>${hypDetail(h)}</article></div>`}`}
function renderLiterature(){const queries=visibleQueries().filter(q=>S.searchScope==='all'||q.scope===S.searchScope),reviewed=reviewedPapers(),foundIds=new Set(completedQueries().flatMap(q=>q.papers)),papers=PAPERS.filter(p=>foundIds.has(p.id));return `<div class="twoCol"><section class="panel pad"><div class="sectionHeader"><div><h2 class="panelTitle">Literature searches</h2><p>Exact search strings, purposes and execution status.</p></div><span class="tag muted">${completedQueries().length} executed</span></div><div class="filterRow">${[['all','All searches'],['broad','Broad Research'],...DIRECTIONS.map(d=>[d.id,d.id])].map(([k,v])=>`<button data-action="scope" data-id="${k}" class="${S.searchScope===k?'active':''}">${v}</button>`).join('')}</div>${queries.length?queries.map(q=>queryCard(q)).join(''):`<div class="empty"><h3>No searches in this view yet</h3><p>Planned and executed queries will appear here.</p></div>`}</section><div class="column"><section class="panel pad"><div class="sectionHeader"><h3 class="panelTitle">Retrieved & reviewed sources</h3><span class="tag muted">${reviewed.length} reviewed</span></div>${papers.length?papers.map(p=>`<div class="sourceCard"><div class="row">${statusTag(p.id,'muted')}${statusTag(reviewed.some(x=>x.id===p.id)?'Reviewed':'Retrieved')}</div><h3>${esc(p.title)}</h3><p>${esc(p.finding)}</p><div class="row"><span class="smallMuted">${esc(p.access)} · ${esc(p.domain)} · example record</span><button class="textButton" data-action="paper" data-id="${p.id}">Open ${icon('arrow')}</button></div></div>`).join(''):'<div class="empty"><h3>No retrieved sources yet</h3><p>Queries appear before results; results appear before reading notes.</p></div>'}</section><section class="panel pad"><h3 class="panelTitle">Reading summary</h3><p class="detailLead">${esc(sample()&&S.step>=1?'The illustrative reading tracks reported observations, possible explanations, competing mechanisms, and source access limitations.':'Reading summaries will appear as the investigation progresses.')}</p><p class="smallMuted">Search matches are provider-reported query counts; they are not deduplicated studies or verified evidence.</p></section></div></div>`}
function timeline(){const events=[
 [0,'Broad literature search started','Initial queries target subtype vulnerability, glaucomatous stress and axonal injury.'],
 [1,'Background reading and synthesis','Evidence and limitations are organized before any mechanism is assumed.'],
 [2,'Three research directions proposed','Independent questions emerge, including directed and open exploration.'],
 [3,'Focused investigations underway','Direction-specific query plans and source reading begin.'],
 [4,'Candidate hypotheses saved','Conditional candidates are linked to the originating direction and reading context.'],
 [5,'Initial review started','Candidate-level review identifies factual issues, unresolved premises and follow-up checks.'],
 [6,'Initial review checkpoint reached','The current research segment is ready for scientist interpretation.']
];return `<div class="twoCol"><section class="panel pad"><div class="sectionHeader"><h2 class="panelTitle">Research timeline</h2><span class="tag muted">Scientific milestones</span></div><div class="timeline">${events.filter(x=>x[0]<=S.step).reverse().map(([n,title,description])=>`<div class="timelineEntry"><small>Stage ${n+1} · ${esc(SCENES[n])}</small><h3>${esc(title)}</h3><p>${esc(description)}</p></div>`).join('')}</div></section><div class="column"><section class="panel pad"><div class="sectionHeader"><h3 class="panelTitle">My research notes</h3>${button(icon('plus')+' Add note','note','small')}</div>${S.notes.filter(n=>n.projectId===S.current).length?S.notes.filter(n=>n.projectId===S.current).map(n=>`<div class="lineItem"><b>${esc(n.text)}</b><p>${esc(n.kind==='hyp'?n.target:'Research-wide note')}</p></div>`).join(''):'<p class="smallMuted">No notes saved in this preview session.</p>'}</section><section class="panel pad"><h3 class="panelTitle">Research lineage</h3><p class="detailLead">Broad evidence → independent directions → focused literature → candidate hypotheses → initial review.</p>${button('Explore directions '+icon('arrow'),'tab','small','data-id="directions"')}</section></div></div>`}
function renderWorkspace(){return `${researchHeader()}<div class="notice">Interactive design prototype. Research records, searches and publications shown here are illustrative; no live models or literature services are connected.</div>${S.tab==='live'?renderLive():S.tab==='overview'?overview():S.tab==='directions'?renderDirections():S.tab==='hypotheses'?renderHypotheses():S.tab==='literature'?renderLiterature():timeline()}`}
function renderNew(){const p=S.draft||{};const val=(k)=>esc(p[k]??'');return `<div class="pageIntro"><div><div class="kicker">NEW RESEARCH</div><h1 class="title">Start a scientific investigation</h1><p class="subtitle">Define the scientific question, context, and boundaries before beginning an autonomous research journey.</p></div>${button(icon('file')+' Load example brief','example')}</div><div class="briefGrid"><section class="panel briefForm"><form id="newResearchForm"><h2>Research brief</h2><p class="intro">The original brief remains associated with its research run.</p><div class="field"><label for="newTitle">Research Title <small>Optional</small></label><input id="newTitle" value="${val('title')}" placeholder="e.g. RGC subtype vulnerability in glaucoma"></div><div class="field"><label for="newQuestion">Research Question <span style="color:#b95d56">*</span></label><textarea id="newQuestion" rows="4" required placeholder="Describe the scientific question you want to investigate.">${val('question')}</textarea><small class="hint">Describe the unresolved scientific relationship or phenomenon.</small></div><div class="field"><label for="newBackground">Background & Rationale <small>Optional</small></label><textarea id="newBackground" rows="4" placeholder="What is currently known, and why does the question matter?">${val('background')}</textarea></div><div class="field"><label for="newObjectives">Research Objectives <small>Optional</small></label><textarea id="newObjectives" rows="3" placeholder="What would you like the investigation to clarify?">${val('objectives')}</textarea></div><div class="fields2"><div class="field"><label for="newConstraints">Hard Constraints <small>Optional</small></label><textarea id="newConstraints" rows="4" placeholder="Non-negotiable research boundaries">${val('constraints')}</textarea><small class="hint">Requirements that the research must respect.</small></div><div class="field"><label for="newPreferences">Research Preferences <small>Optional</small></label><textarea id="newPreferences" rows="4" placeholder="Mechanisms, methods or areas you prefer">${val('preferences')}</textarea><small class="hint">Preferences do not exclude alternative ideas.</small></div></div><div class="fields2"><div class="field"><label for="newFocus">Research Focus <small>Optional</small></label><input id="newFocus" value="${val('focus')}" placeholder="Disease, cell type or experimental context"></div><div class="field"><label for="newIntendedUse">Intended Use <small>Optional</small></label><input id="newIntendedUse" value="${val('intendedUse')}" placeholder="e.g. Basic mechanistic research"></div></div><div class="field"><label for="newReferences">Reference Materials <small>Optional</small></label><textarea id="newReferences" rows="3" placeholder="DOIs, PMIDs, paper titles or material notes (one per line)">${val('references')}</textarea><input id="newFiles" type="file" multiple accept=".pdf,.txt,.docx,.md" aria-label="Select reference files"><small class="hint" id="fileNames">Optional files are displayed by filename only in this prototype.</small></div><details class="config"><summary>Research Configuration (Optional)</summary><div class="configBody"><div class="fields2"><div class="field"><label for="newDirections">Maximum Research Directions</label><select id="newDirections">${[2,3,4,5].map(n=>`<option value="${n}" ${String(p.directions??3)===String(n)?'selected':''}>Up to ${n}</option>`).join('')}</select></div><div class="field"><label for="newPerSeed">Hypotheses per Direction</label><select id="newPerSeed">${[1,2,3].map(n=>`<option value="${n}" ${String(p.perSeed??2)===String(n)?'selected':''}>Up to ${n}</option>`).join('')}</select></div><div class="field"><label for="newMethod">Hypothesis Generation</label><select id="newMethod">${['Both','Direct','Assumption-Structured'].map(v=>`<option ${p.method===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label for="newBudget">Research Budget (USD)</label><input type="number" id="newBudget" min="0" step="1" value="${esc(p.budget??20)}"></div></div><p>Illustrative product settings; no actual execution or budget enforcement occurs in this demo.</p></div></details><div class="formFooter"><span>Start once. The live workspace displays the literature searches, research directions, hypotheses and initial review as they develop.</span><button class="btn primary" type="submit">${icon('play')} Start Research</button></div></form></section><aside class="column"><section class="panel pad"><h3 class="panelTitle">Your research journey</h3>${STAGES.map((stage,i)=>`<div class="briefPreviewStep"><span class="num">${i+1}</span><div><strong>${stage}</strong><small>${['Search, retrieve and synthesize the broad literature.','Develop independent exploration questions.','Search and read for each direction.','Generate conditional, testable candidates.','Perform candidate screening and R0 initial review.'][i]}</small></div></div>`).join('')}</section><section class="panel pad"><h3 class="panelTitle">Explore the sample workspace</h3><p class="detailLead">Use a worked glaucoma example to inspect how a running research project would look.</p>${button('Open sample research '+icon('arrow'),'openSample','small')}</section></aside></div>`}
function renderHome(){let projects=S.projects.filter(p=>S.manager==='trash'?p.trashed:S.manager==='archived'?p.archived&&!p.trashed:!p.archived&&!p.trashed);projects=projects.filter(p=>(p.title+' '+p.question).toLowerCase().includes(S.filter.toLowerCase()));if(S.sort==='title')projects.sort((a,b)=>a.title.localeCompare(b.title));else projects.sort((a,b)=>(b.lastUsed||0)-(a.lastUsed||0));return `<div class="pageIntro"><div><div class="kicker">MY RESEARCH</div><h1 class="title">Your research workspace</h1><p class="subtitle">Manage investigations, revisit findings, or start with a new research question.</p></div>${button(icon('plus')+' New Research','new','primary')}</div><div class="homeHero"><div><div class="kicker">AUTONOMOUS SCIENTIFIC EXPLORATION</div><h2>From evidence to testable hypotheses.</h2><p>Follow literature searches, independent directions and initial reviews in one place.</p></div>${button('Open sample run '+icon('arrow'),'openSample','primary')}</div><div class="managerBar"><div class="managerTabs">${[['active','My Research'],['archived','Archived'],['trash','Trash']].map(([id,name])=>`<button class="${S.manager===id?'active':''}" data-action="manager" data-id="${id}">${name}</button>`).join('')}</div><div class="row"><input id="managerSearch" placeholder="Search studies" aria-label="Search studies" value="${esc(S.filter)}"><select id="managerSort"><option value="recent" ${S.sort==='recent'?'selected':''}>Recently updated</option><option value="title" ${S.sort==='title'?'selected':''}>Title A–Z</option></select></div></div><div class="studyGrid">${projects.map(p=>`<article class="panel studyCard"><div class="row" style="justify-content:space-between">${statusTag(p.trashed?'In Trash':p.archived?'Archived':p.id===S.current?statusText():'Saved',p.archived?'warm':'')}<button class="btn small icon" data-action="manageProject" data-id="${p.id}" aria-label="Manage ${esc(p.title)}">${icon('more')}</button></div><h3>${esc(p.title)}</h3><p>${esc(p.question)}</p><div class="studyActions">${p.trashed?button('Restore','restore','small',`data-id="${p.id}"`):button('Open research '+icon('arrow'),'open','small',`data-id="${p.id}"`)}${p.trashed?button('Delete permanently','permanent','danger small',`data-id="${p.id}"`):''}</div></article>`).join('')||'<div class="panel empty"><h3>No research projects in this view</h3><p>Use New Research to create one, or select a different folder.</p></div>'}</div>`}
function renderSettings(){return `<div class="pageIntro"><div><div class="kicker">SETTINGS</div><h1 class="title">Workspace preferences</h1><p class="subtitle">This design preview does not connect to a model, literature service, or private account.</p></div></div><div class="twoCol"><section class="panel pad"><h3 class="panelTitle">Research defaults</h3><div class="detailSection"><h3>Research configuration</h3><p>Normal researchers define a question and start the run. Scientific module execution, remote requests and evidence provenance are handled behind the product interface.</p></div><div class="detailSection"><h3>Research notes</h3><p>Preview notes are kept in memory. Reloading the file resets the demonstration session.</p></div></section><section class="panel pad"><h3 class="panelTitle">Preview status</h3><p class="detailLead">Standalone HTML · offline only</p><div class="reviewFlag">No real model calls, literature retrieval, or backend changes.</div></section></div>`}
function renderReplay(){return `<div class="pageIntro"><div><div class="kicker">HISTORICAL INTERACTIVE DESIGN</div><h1 class="title">V5 Research Replay</h1><p class="subtitle">The complete original V5 workspace is preserved here with its G0–G3 progression, ten candidate hypotheses and comparison interactions.</p></div>${button('Back to Live Research','workspace')}</div><p class="historyNote">This is a separate historical UI demonstration and does not represent results from the current research run.</p><iframe id="v5frame" class="replayFrame" title="Original V5 interactive research demo" sandbox="allow-scripts allow-downloads"></iframe>`}
function renderModal(){if(!S.modal)return '';const m=S.modal;let body='',title='',footer='';if(m.type==='brief'){title='Research brief';body=briefBlock(current());footer=button('Close','closeModal');}else if(m.type==='paper'){const p=PAPERS.find(x=>x.id===m.id);title=p.title;body=`<div class="row">${statusTag(p.id,'muted')}${statusTag(p.access,'muted')}<span class="smallMuted">Illustrative source record</span></div><div class="detailSection"><h3>Example reading summary</h3><p>${esc(p.finding)}</p></div><div class="detailSection"><h3>Access & provenance</h3><p>${esc(p.notes)}</p><p class="smallMuted">A connected product would show the actual retrieved text and source range here. No verified external paper was retrieved for this design preview.</p></div>`;footer=button('Close','closeModal')+button('Add source note','note','small',`data-target="${p.id}"`);}else if(m.type==='note'){title='Add research note';body=`<form id="noteForm"><div class="field"><label for="noteText">Your note</label><textarea id="noteText" required rows="5" placeholder="Record an observation, concern, or idea for follow-up."></textarea></div><p class="smallMuted">Notes are local to this interactive preview and do not alter hypothesis or review records.</p><div class="actions" style="justify-content:flex-end">${button('Cancel','closeModal')}<button type="submit" class="btn primary">Save note</button></div></form>`;}else if(m.type==='manage'){const p=S.projects.find(x=>x.id===m.id);title='Manage research';body=`<h3 class="smallTitle" style="margin:11px 0">${esc(p.title)}</h3><p>Choose how this study should appear in My Research.</p><div class="column" style="gap:8px;margin-top:17px">${button('Rename research','rename','',`data-id="${p.id}"`)}${!p.trashed?button(p.archived?'Move back to My Research':'Archive research','archive','',`data-id="${p.id}"`):button('Restore from Trash','restore','',`data-id="${p.id}"`)}${!p.trashed?button('Move to Trash','trash','danger',`data-id="${p.id}"`):button('Delete permanently','permanent','danger',`data-id="${p.id}"`)}</div>`;footer=button('Close','closeModal');}else if(m.type==='rename'){const p=S.projects.find(x=>x.id===m.id);title='Rename research';body=`<form id="renameForm" data-id="${p.id}"><div class="field"><label for="renameText">Research title</label><input id="renameText" required value="${esc(p.title)}"></div><div class="actions" style="justify-content:flex-end">${button('Cancel','closeModal')}<button class="btn primary" type="submit">Save name</button></div></form>`;}else if(m.type==='confirm'){const p=S.projects.find(x=>x.id===m.id);title=m.action==='permanent'?'Delete research permanently?':'Stop current research?';body=`<p>${m.action==='permanent'?'This removes the project from the demonstration.':'The preview sequence will stop. This does not send any request to a service.'}</p><p><strong>${esc(p?.title||current().title)}</strong></p>`;footer=button('Cancel','closeModal')+button('Confirm','confirm','danger',`data-id="${m.id}"`);}return `<div class="modalOverlay" id="modalOverlay"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sectionHeader"><h2>${esc(title)}</h2><button class="btn icon small" data-action="closeModal" aria-label="Close dialog">×</button></div>${body}${footer?`<footer>${footer}</footer>`:''}</div></div>`}

function render(){const app=$('app');const body=S.page==='workspace'?renderWorkspace():S.page==='home'?renderHome():S.page==='new'?renderNew():S.page==='replay'?renderReplay():renderSettings();app.innerHTML=`${renderSidebar()}<div class="mainShell">${renderTop()}<main class="main">${body}</main></div>`;$('modalRoot').innerHTML=renderModal();if(S.page==='replay'&&!S.v5Loaded){const f=$('v5frame');if(f){try{const binary=atob(V5_EMBEDDED_B64);const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));f.srcdoc=new TextDecoder().decode(bytes);S.v5Loaded=true;}catch(e){f.replaceWith(document.createTextNode('The historical replay could not be displayed.'));}}}else if(S.page!=='replay')S.v5Loaded=false;}
function openProject(id){let p=S.projects.find(p=>p.id===id);if(!p)return;S.current=id;S.step=p.step??0;S.status=p.status||(S.step===6?'completed':'running');p.lastUsed=Date.now();S.seed='D01';S.hyp='H01';S.hypTab='science';S.compare=false;updatePage('workspace','live')}
function openSample(){let p=S.projects.find(p=>p.id===SAMPLE.id);if(!p){p={...SAMPLE};S.projects.push(p);}p.trashed=false;p.archived=false;openProject(SAMPLE.id)}
function permanentDelete(id){S.projects=S.projects.filter(p=>p.id!==id);if(S.current===id){stopTimer();const p=S.projects.find(p=>!p.trashed)||S.projects[0];S.current=p?.id||'';S.step=p?.step??0;S.status=p?.status||'running'}S.modal=null;S.page='home';render()}
function manageAction(id,action){const p=S.projects.find(x=>x.id===id);if(!p)return;if(action==='archive'){p.archived=!p.archived;p.trashed=false}else if(action==='trash'){p.trashed=true;p.archived=false}else if(action==='restore'){p.trashed=false;p.archived=false}S.modal=null;S.page='home';render()}
document.addEventListener('click',(event)=>{const button=event.target.closest('[data-action]');if(!button)return;event.preventDefault();const a=button.dataset.action,id=button.dataset.id||button.dataset.target||'';
 if(a==='home'){updatePage('home');return}
 if(a==='new'){S.draft={};S.exampleLoaded=false;updatePage('new');return}
 if(a==='workspace'){updatePage('workspace','live');return}
 if(a==='replay'){updatePage('replay');return}
 if(a==='settings'){updatePage('settings');return}
 if(a==='tab'){goTab(id);return}
 if(a==='openSample'){openSample();return}
 if(a==='open'){openProject(id);return}
 if(a==='briefModal'){S.modal={type:'brief'};render();return}
 if(a==='example'){S.draft={...SAMPLE,title:SAMPLE.title};S.exampleLoaded=true;render();return}
 if(a==='seed'){S.seed=id;goTab('directions');return}
 if(a==='hyp'){S.hyp=id;S.hypTab='science';goTab('hypotheses');return}
 if(a==='hypTab'){S.hypTab=id;render();return}
 if(a==='compare'){S.compare=!S.compare;render();return}
 if(a==='scope'){S.searchScope=id;S.tab='literature';render();return}
 if(a==='query'){S.queryOpen.has(id)?S.queryOpen.delete(id):S.queryOpen.add(id);render();return}
 if(a==='paper'){S.modal={type:'paper',id};render();return}
 if(a==='note'){const target=button.dataset.target||null;S.modal={type:'note',target,kind:target?.startsWith('H')?'hyp':target?.startsWith('EX')?'paper':'run'};render();return}
 if(a==='pause'){stopTimer();S.status='paused';saveStep();render();return}
 if(a==='resume'){S.status='running';saveStep();startTimer();render();return}
 if(a==='stop'){S.modal={type:'confirm',id:S.current,action:'stop'};render();return}
 if(a==='closeModal'){S.modal=null;render();return}
 if(a==='playPreview'){if(S.autoTimer)stopTimer();else {S.status='running';startTimer();}render();return}
 if(a==='resetPreview'){stopTimer();setStage(0);return}
 if(a==='manager'){S.manager=id;render();return}
 if(a==='manageProject'){S.modal={type:'manage',id};render();return}
 if(a==='archive'||a==='trash'||a==='restore'){manageAction(id,a);return}
 if(a==='rename'){S.modal={type:'rename',id};render();return}
 if(a==='permanent'){S.modal={type:'confirm',id,action:'permanent'};render();return}
 if(a==='confirm'){const m=S.modal;if(m?.action==='permanent')permanentDelete(m.id);else if(m?.action==='stop'){stopTimer();S.status='stopped';saveStep();S.modal=null;render();}return}
 });
document.addEventListener('change',(event)=>{if(event.target.id==='previewScene'){stopTimer();setStage(event.target.value)}else if(event.target.id==='managerSort'){S.sort=event.target.value;render()}else if(event.target.id==='newFiles'){const names=[...event.target.files].map(f=>f.name);const label=$('fileNames');if(label)label.textContent=names.length?names.join(' · '):'No files selected.'}});
document.addEventListener('input',(event)=>{if(event.target.id==='managerSearch'){const pos=event.target.selectionStart??event.target.value.length;S.filter=event.target.value;render();const input=$('managerSearch');if(input){input.focus();input.setSelectionRange(pos,pos)}}});
document.addEventListener('submit',(event)=>{if(event.target.id==='newResearchForm'){
 event.preventDefault();const read=id=>$(id)?.value?.trim()||'';const question=read('newQuestion');if(!question)return;const draft={title:read('newTitle')||question.slice(0,68),question,background:read('newBackground'),objectives:read('newObjectives'),constraints:read('newConstraints'),preferences:read('newPreferences'),focus:read('newFocus'),intendedUse:read('newIntendedUse'),references:read('newReferences'),directions:read('newDirections'),perSeed:read('newPerSeed'),method:read('newMethod'),budget:read('newBudget'),created:'Preview session',id:'research-'+Date.now(),archived:false,trashed:false,demo:S.exampleLoaded&&question===SAMPLE.question,step:0,status:'running',lastUsed:Date.now()};S.projects.unshift(draft);S.current=draft.id;S.step=0;S.status='running';S.modal=null;updatePage('workspace','live');startTimer();return;
 }if(event.target.id==='noteForm'){event.preventDefault();const text=$('noteText')?.value.trim();if(!text)return;const m=S.modal;S.notes.push({projectId:S.current,kind:m?.kind||'run',target:m?.target||S.current,text});S.modal=null;render();return;}if(event.target.id==='renameForm'){event.preventDefault();const id=event.target.dataset.id;const p=S.projects.find(x=>x.id===id);if(p)p.title=$('renameText')?.value.trim()||p.title;S.modal=null;render();return;}});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&S.modal){S.modal=null;render()}});
document.addEventListener('click',event=>{if(event.target.id==='modalOverlay'){S.modal=null;render()}});
render();
})();
</script>
